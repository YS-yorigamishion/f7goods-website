# f7goods Nginx 反向代理配置
server {
    listen 80;
    server_name 114.55.88.234 f7goods.com www.f7goods.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self';" always;

    client_max_body_size 10M;

    # 图片：可较长缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # CSS / JS：短缓存 + 必须校验，避免“页面不是最新”
    # （HTML 内已带 ?v= 时，浏览器会重新拉取新 URL）
    location ~* \.css$ {
        proxy_pass http://127.0.0.1:3000;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
    location ~* \.js$ {
        proxy_pass http://127.0.0.1:3000;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系列周边 — f7goods</title>
<meta name="description" content="按作品系列浏览同人周边合集。">
<link rel="stylesheet" href="/css/style.css?v=20261020au">
<script src="/js/api.js?v=20261020au"></script>
<script src="/js/pull-to-refresh.js"></script>
<script src="/js/i18n.js?v=20261020au"></script>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<section class="page-hero">
  <div class="page-hero-inner">
    <div class="section-label">SERIES · MERCH</div>
    <h1>系列周边</h1>
    <p>按作品系列整理的周边合集。系列由作者创建，审核通过的作品会自动加入。</p>
  </div>
</section>
<main class="main-content">
  <div class="cl-toolbar-card">
    <div class="cl-toolbar-row">
      <div id="seriesStatusFilters" style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;"></div>
    </div>
    <div class="cl-toolbar-row">
      <select class="form-input" id="seriesSortSelect">
        <option value="new">最新创建</option>
        <option value="name-asc">名称 A→Z</option>
        <option value="works-desc">作品数 ↓</option>
      </select>
      <input type="text" class="search-input" id="seriesSearchInput" placeholder="搜索系列、作者或作品...">
      <span class="cl-show-count">显示 <b id="seriesShowCount">0</b></span>
    </div>
  </div>
  <div class="cards-grid cl-proj-grid" id="seriesGrid">
    <div class="skeleton-grid"><div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
  </div>
</main>
<footer class="footer" id="footer"></footer>
<script src="/js/main.js?v=20261020au"></script>
<script>
(async function () {
  initPage('projects');
  let allSeries = [];
  let circles = [];
  let status = 'all';
  try {
    await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
    [allSeries, circles] = await Promise.all([
      fetch('/api/series').then(r => r.json()),
      F7API.getCircles()
    ]);
    renderStatusFilters();
    renderSeries();
    document.getElementById('seriesSearchInput').addEventListener('input', debounce(renderSeries));
    document.getElementById('seriesSortSelect').addEventListener('change', renderSeries);
  } catch (e) {
    document.getElementById('seriesGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>加载失败，请刷新重试</p></div>';
  }

  function renderStatusFilters() {
    const box = document.getElementById('seriesStatusFilters');
    box.innerHTML = '<button type="button" class="filter-btn active" data-series-status="all">全部状态</button>' +
      (typeof PROJECT_STATUS_ORDERED !== 'undefined' ? PROJECT_STATUS_ORDERED : []).map(s =>
        `<button type="button" class="filter-btn" data-series-status="${s.id}">${escapeHtml(s.name)}</button>`
      ).join('');
    box.querySelectorAll('[data-series-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        box.querySelectorAll('[data-series-status]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        status = btn.dataset.seriesStatus;
        renderSeries();
      });
    });
  }

  function seriesStatusLabel(s) {
    return (typeof PROJECT_STATUS_LABELS !== 'undefined' && PROJECT_STATUS_LABELS[s.status]) || '招募中';
  }

  function renderSeries() {
    const grid = document.getElementById('seriesGrid');
    const q = (document.getElementById('seriesSearchInput')?.value || '').trim().toLowerCase();
    const sort = document.getElementById('seriesSortSelect')?.value || 'new';
    let list = allSeries.filter(s => {
      if (status !== 'all' && (s.status || 'zhaomuzhong') !== status) return false;
      if (!q) return true;
      const owner = circles.find(c => c.id === s.circleId);
      const hay = [s.name, owner?.name, ...(s.works || []).map(w => workTitle(w)), ...(s.works || []).flatMap(w => w.tags || [])].join(' ').toLowerCase();
      return hay.includes(q);
    });
    list.sort((a, b) => {
      if (sort === 'name-asc') return String(a.name || '').localeCompare(String(b.name || ''), 'zh');
      if (sort === 'works-desc') return (b.works?.length || 0) - (a.works?.length || 0);
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
    document.getElementById('seriesShowCount').textContent = list.length;
    if (!list.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>暂无系列周边</p></div>';
      return;
    }
    grid.innerHTML = list.map(s => {
      const owner = circles.find(c => c.id === s.circleId);
      const cover = s.cover || s.works?.[0]?.images?.[0] || '';
      const tags = [...new Set((s.works || []).flatMap(w => w.tags || []))].slice(0, 3);
      return `<a class="cl-proj-card" href="/series-detail.html?id=${encodeURIComponent(s.id)}">
        <div class="cl-proj-cover">
          <span class="cl-proj-status ${s.status === 'yiwancheng' ? 'done' : 'open'}">${escapeHtml(seriesStatusLabel(s))}</span>
          ${cover ? `<img src="${escapeHtml(imgUrl(cover, 640))}" alt="${escapeHtml(s.name)}" loading="lazy">` : `<span style="position:relative;z-index:1;">${escapeHtml((s.name || '?').charAt(0))}</span>`}
        </div>
        <div class="cl-proj-body">
          <div class="cl-proj-title">${escapeHtml(s.name)}</div>
          <div class="cl-proj-sub">${owner ? escapeHtml(owner.name) : '未知作者'} · ${s.works?.length || 0} 件作品</div>
          <div class="cl-proj-desc">${(s.works || []).slice(0, 3).map(w => escapeHtml(workTitle(w))).join(' · ')}</div>
          ${tags.length ? `<div class="cl-proj-tags">${tags.map(tg => `<span class="cl-proj-tag">#${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="cl-proj-foot"><span>${s.works?.length || 0} 件作品</span><span class="go">查看 →</span></div>
      </a>`;
    }).join('');
  }
})();
</script>
</body>
</html>

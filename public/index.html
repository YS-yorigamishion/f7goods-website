  <link rel="stylesheet" href="/css/style.css?v=20260912g">
  <style>
    /* ===== 心愿单：卡片价格旁的加减控件 ===== */
    .cl-w-foot-l { display:inline-flex; align-items:center; gap:0.5rem; min-width:0; flex:1; }
    .cl-w-wish {
      /* position/opacity 等显式复位：避免浏览器缓存的旧 style.css（封面角标版）重新生效 */
      position:static; right:auto; bottom:auto; z-index:auto; opacity:1; transform:none;
      height:26px; padding:0 9px; border-radius:999px; flex-shrink:0;
      background:transparent; border:1px dashed rgba(217,79,92,0.55);
      font-size:0.7rem; font-weight:600; color:var(--accent);
      display:inline-flex; align-items:center; gap:0.15rem;
      font-family:inherit; cursor:pointer;
      transition:background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .cl-w-wish:hover { background:rgba(217,79,92,0.1); border-color:var(--accent); }
    .cl-w-wish.on {
      opacity:1; transform:none; cursor:default;
      height:28px; padding:0 5px; gap:0.25rem;
      background:rgba(217,79,92,0.08);
      border:1px solid rgba(217,79,92,0.4); color:var(--accent);
    }
    .cl-w-wish .wq-btn {
      width:21px; height:21px; padding:0; border:none; border-radius:50%;
      background:var(--accent); color:#fff; font-family:inherit;
      font-size:0.85rem; font-weight:700; line-height:1; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center;
      transition:transform 0.12s ease, background 0.15s ease;
    }
    .cl-w-wish .wq-btn:hover { background:var(--accent-dark); }
    .cl-w-wish .wq-btn:active { transform:scale(0.85); }
    .cl-w-wish .wq-num { min-width:15px; text-align:center; font-size:0.76rem; font-weight:700; }

    /* ===== 心愿单：底部汇总条 ===== */
    #wishlistBar {
      position:fixed; bottom:0; left:0; right:0; z-index:1105;
      background:var(--card-bg); border-top:2px solid var(--accent);
      padding:0.7rem 1.2rem; box-shadow:0 -2px 12px rgba(0,0,0,0.15);
      display:flex; align-items:center; gap:0.75rem;
    }
    #wishlistBar .wl-info { flex:1; min-width:0; font-size:0.88rem; }
    #wishlistBar .wl-info b { color:var(--accent); }
    #wishlistBar .wl-info small { display:block; font-size:0.7rem; color:var(--haze); margin-top:2px; }
    #wishlistBar .wl-open {
      flex-shrink:0; border:none; border-radius:999px; padding:0.5rem 1.15rem;
      background:var(--accent); color:#fff; font-family:inherit;
      font-size:0.85rem; font-weight:600; cursor:pointer;
    }
    #wishlistBar .wl-open:hover { background:var(--accent-dark); }
    /* 预留高度按实际条高计算（--wl-bar-h 由 JS 写入），避免窄屏文字换行后遮挡内容 */
    body.has-wishlist-bar { padding-bottom: calc(var(--wl-bar-h, 72px) + 10px); }
    @media (max-width: 768px) {
      /* Sit above mobile tab bar (58px + safe area) */
      #wishlistBar { bottom: calc(58px + env(safe-area-inset-bottom, 0px)); }
      body.app-mode.has-wishlist-bar { padding-bottom: calc(var(--wl-bar-h, 72px) + 10px + 62px + env(safe-area-inset-bottom, 0px)); }
      body.has-wishlist-bar { padding-bottom: calc(var(--wl-bar-h, 72px) + 10px + env(safe-area-inset-bottom, 0px)); }
    }

    /* ===== 心愿单：清单抽屉（与 ONLY 专场购物清单同款小票样式） ===== */
    .wl-overlay {
      position:fixed; inset:0; z-index:1200; padding:16px;
      background:rgba(34,32,30,0.45);
      display:none; align-items:center; justify-content:center;
    }
    .wl-overlay.open { display:flex; }
    .wl-drawer {
      position:relative; background:#FFFCF7; border:1px solid var(--line);
      width:min(440px, 100%); max-height:84vh; overflow-y:auto;
      border-radius:4px 4px 10px 10px; padding:22px 18px 20px;

    .wl-item {

    .wl-item .n { flex:1; min-width:0; }
    .wl-item .t { font-size:13px; font-weight:600; line-height:1.45; }
    .wl-item .t a { color:inherit; text-decoration:none; }
    .wl-item .t a:hover { color:var(--accent); }
    .wl-item small {
      display:block; color:var(--muted); font-size:11px;

    .wl-item .p { flex-shrink:0; text-align:right; font-size:13px; font-weight:600; color:var(--accent); }
    .wl-item .p.free { color:var(--muted); font-weight:500; }
    .wl-qty { display:flex; align-items:center; gap:6px; margin-top:6px; }
    .wl-qty button {
      min-width:24px; height:24px; border-radius:8px; cursor:pointer;
      border:1px solid var(--line); background:var(--card); color:var(--ink);

    .wl-qty .num { min-width:16px; text-align:center; font-size:13px; font-weight:700; color:var(--accent); }
    .wl-qty .del { border-color:transparent; background:transparent; color:var(--muted); font-size:11px; padding:0 4px; }
    .wl-qty .del:hover { color:var(--accent); }
    .wl-empty { color:var(--muted); font-size:12.5px; padding:24px 0; text-align:center; }
    .wl-sum { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; }
    .wl-sum.total {

    .wl-sum.total .v { color:var(--accent); }
    .wl-note { font-size:11px; color:var(--muted); text-align:right; }
    .wl-actions { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
    .wl-actions button {
      width:100%; border:none; background:var(--accent); color:#fff;

    .wl-actions button.alt { background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:500; }
    .wl-actions button.alt:hover { border-color:var(--accent); color:var(--accent); }
    .wl-actions button.danger { color:var(--accent); border-color:rgba(217,79,92,0.4); }

    @media (max-width: 480px) {

      .cl-w-wish .wq-num { min-width:16px; font-size:0.8rem; }
      .wl-drawer { padding:18px 14px 16px; }
    }

  <script>
    // 全局骨架屏安全网：8秒后无论如何移除骨架屏和隐藏类
    setTimeout(() => {
      const sk = document.getElementById('worksSkeleton');
      if (sk) { console.warn('[safety] skeleton timeout, removing'); sk.remove(); }
      document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
    }, 8000);

    // fetchWithTimeout is provided by /js/api.js

    initPage('works');
    if (typeof mountAuthorCreateFab === 'function') mountAuthorCreateFab({ label: '发布周边', tab: 'works' });

    let allWorks = [];
    let allEvents = [];
    let allUpdates = [];
    let allProjects = [];
    let allCirclesList = [];
    let circlesMap = {};
    let circlesLogoMap = {};
    let currentCategory = 'all';
    let currentStatus = 'all';
    let currentUserFilter = 'none'; // 'none', 'liked', 'wanted'
    let currentFollowFilter = false;
    let currentDeadlineFilter = false;
    let wishlistMode = false;
    let wishlistItems = {}; // { workId: quantity }
    let homeView = 'board';
    let featuredProjectId = null;

    function setHomeView(view) {
      homeView = view;
      const board = document.getElementById('homeBoard');
      const catalog = document.getElementById('homeCatalog');
      if (board) board.classList.toggle('hidden', view !== 'board');
      if (catalog) catalog.classList.toggle('hidden', view !== 'catalog');
      document.querySelectorAll('#homeViewToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.view === view);
      });
      if (view === 'catalog' && allWorks.length) renderWorks();
    }

    function boardThumb(work) {
      const img = (work.images && work.images[0]) || '';
      return img
        ? `<div class="board-thumb"><img src="${img}" alt="" loading="lazy"></div>`
        : `<div class="board-thumb">🎨</div>`;
    }

    function projectStatusLabel(status) {
      return (typeof PROJECT_STATUS_LABELS !== 'undefined' && PROJECT_STATUS_LABELS[status]) || status || '';
    }

    function projectStatusClass(status) {
      // Map common project statuses to tag class
      const s = String(status || '');
      if (s === 'recruiting' || s === 'zhaomuzhong' || s === '招募中') return 'recruiting';
      if (s === 'in_progress' || s === 'jinxingzhong' || s === '进行中') return 'in_progress';
      if (s === 'completed' || s === 'yiwancheng' || s === '已完成') return 'completed';
      if (s === 'cancelled' || s === 'yiquxiao' || s === '已取消') return 'cancelled';
      return '';
    }

    function isProjectRecruiting(p) {
      const s = String(p.status || '');
      return s === 'zhaomuzhong' || s === 'recruiting' || s === '招募中';
    }

    function isEventOngoing(e) {
      const s = String(e.status || '');
      return s === 'jinxingzhong' || s === 'jijiangkaiqi'
        || s === 'in_progress' || s === 'upcoming'
        || s === '进行中' || s === '即将开启';
    }

    // 近 7 日上架
    function isWorkNew(w) {
      const ts = new Date(w && w.createdAt || 0).getTime();
      if (!ts || Number.isNaN(ts)) return false;
      return (Date.now() - ts) <= 7 * 24 * 60 * 60 * 1000;
    }

    function setFeaturedProject(id) {
      featuredProjectId = id;
      const i = boardFeatureSlides.findIndex(s => s.key === 'p:' + id);
      if (i >= 0) goBoardFeature(i);
    }

    let boardFeatureSlides = [];
    let boardFeatIndex = 0;
    let boardFeatTimer = null;
    let boardFeatPaused = false;

    function isOnlyEvent(e) {
      return !!(e && e.type === 'only');
    }
    function onlyEventHref(e) {
      return '/only.html?id=' + encodeURIComponent(e.id);
    }
    function pickCurrentOnlyEvent() {
      return (allEvents || [])
        .filter(e => e && e.type === 'only' && isEventOngoing(e))
        .sort((a, z) => String(a.date || a.startDate || 'z').localeCompare(String(z.date || z.startDate || 'z')))[0] || null;
    }

    function buildBoardFeatureSlides() {
      const slides = [];
      const currentOnly = pickCurrentOnlyEvent();
      // 本场 ONLY 固定第一张，直达专场（不与轮播外的横幅重复）
      if (currentOnly) {
        const loc = currentOnly.location || '';
        slides.push({
          key: 'only:' + currentOnly.id,
          href: onlyEventHref(currentOnly),
          tag: 'ONLY 专场',
          tagClass: 'only',
          title: currentOnly.title || '',
          cover: currentOnly.coverImage || (currentOnly.images && currentOnly.images[0]) || '',
          pills: [
            { cls: 'price', text: 'ONLY' },
            currentOnly.date || currentOnly.startDate ? { cls: '', text: formatDate(currentOnly.date || currentOnly.startDate) } : null,
            loc ? { cls: '', text: loc } : null
          ].filter(Boolean)
        });
      }
      const recruiting = allProjects.filter(isProjectRecruiting);
      recruiting.slice(0, 5).forEach(p => {
        const catLabel = (typeof PROJECT_CATEGORIES !== 'undefined' && PROJECT_CATEGORIES[p.category]) || '';
        const start = p.startDate ? formatDate(p.startDate) : '';
        const end = p.endDate ? formatDate(p.endDate) : '';
        const period = start && end ? `${start} → ${end}` : (start || end || '');
        slides.push({
          key: 'p:' + p.id,
          href: '/project-detail.html?id=' + encodeURIComponent(p.id),
          tag: projectStatusLabel(p.status),
          tagClass: projectStatusClass(p.status) || 'recruiting',
          title: p.title || '',
          cover: p.coverImage || (p.images && p.images[0]) || '',
          pills: [catLabel ? { cls: 'price', text: catLabel } : null, period ? { cls: '', text: period } : null].filter(Boolean)
        });
      });
      const activeEvents = allEvents
        .filter(isEventOngoing)
        .filter(e => !currentOnly || e.id !== currentOnly.id)
        .sort((a, b) => String(a.date || a.startDate || 'z').localeCompare(String(b.date || b.startDate || 'z')));
      activeEvents.slice(0, 5).forEach(e => {
        const stLabel = (typeof EVENT_STATUS_LABELS !== 'undefined' && EVENT_STATUS_LABELS[e.status]) || '';
        const loc = e.location || '';
        slides.push({
          key: 'e:' + e.id,
          href: '/event-detail.html?id=' + encodeURIComponent(e.id),
          tag: stLabel,
          tagClass: String(e.status) === 'jijiangkaiqi' || String(e.status) === 'upcoming' ? 'in_progress' : 'recruiting',
          title: e.title || '',
          cover: e.coverImage || (e.images && e.images[0]) || '',
          pills: [{ cls: 'price', text: '活动' }, e.date || e.startDate ? { cls: '', text: formatDate(e.date || e.startDate) } : null, loc ? { cls: '', text: loc } : null].filter(Boolean)
        });
      });
      return slides;
    }

    function goBoardFeature(n) {
      if (!boardFeatureSlides.length) return;
      boardFeatIndex = ((n % boardFeatureSlides.length) + boardFeatureSlides.length) % boardFeatureSlides.length;
      document.querySelectorAll('#boardFeatureTrack .board-feature-slide').forEach((el, i) => {
        el.classList.toggle('on', i === boardFeatIndex);
      });
      document.querySelectorAll('#boardFeatDots i').forEach((el, i) => {
        el.classList.toggle('on', i === boardFeatIndex);
      });
    }

    function stopBoardFeatureTimer() {
      if (boardFeatTimer) { clearInterval(boardFeatTimer); boardFeatTimer = null; }
    }

    function startBoardFeatureTimer() {
      stopBoardFeatureTimer();
      if (boardFeatureSlides.length < 2) return;
      // Respect prefers-reduced-motion: no auto-advance carousel
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) return;
      boardFeatTimer = setInterval(() => {
        if (!boardFeatPaused) goBoardFeature(boardFeatIndex + 1);
      }, 4000);
    }

    // ===== Board announcement ticker =====
    // Default: play the announcement with the newest publishDate (not pinned-first).
    async function loadBoardAnnounce() {
      const bar = document.getElementById('boardAnnounce');
      const track = document.getElementById('boardAnnounceTrack');
      if (!bar || !track) return;
      try {
        const res = await fetch('/api/announcements');
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) {
          bar.classList.add('hidden');
          return;
        }
        const latest = [...list].sort((a, b) => {
          const da = a.publishDate || a.createdAt || '';
          const db = b.publishDate || b.createdAt || '';
          if (da === db) return 0;
          return da < db ? 1 : -1;
        })[0];
        const title = (latest.title || '').trim();
        const content = (latest.content || '').replace(/\s+/g, ' ').trim();
        const text = title && content ? `${title} · ${content}` : (title || content || '');
        if (!text) {
          bar.classList.add('hidden');
          return;
        }
        const href = `/announcements.html`;
        // Duplicate content for seamless marquee when overflowing
        track.innerHTML =
          `<a class="board-announce-item" href="${href}"><span class="board-announce-text">${escapeHtml(text)}</span></a>` +
          `<a class="board-announce-item" href="${href}" aria-hidden="true" tabindex="-1"><span class="board-announce-dot"></span><span class="board-announce-text">${escapeHtml(text)}</span></a>`;
        bar.classList.remove('hidden');

        // After layout, start marquee only if overflow
        requestAnimationFrame(() => {
          const viewport = document.getElementById('boardAnnounceViewport');
          if (!viewport) return;
          const overflow = track.scrollWidth > viewport.clientWidth + 2;
          if (!overflow) {
            const dup = track.querySelector('[aria-hidden="true"]');
            if (dup) dup.remove();
            track.classList.remove('is-scrolling');
            track.style.animationDuration = '';
            return;
          }
          const half = track.scrollWidth / 2;
          const duration = Math.max(12, half / 40);
          track.style.animationDuration = duration + 's';
          track.classList.add('is-scrolling');
        });
      } catch (e) {
        console.warn('announce ticker failed', e);
        bar.classList.add('hidden');
      }
    }

    function renderBoardFeature() {
      const featEl = document.getElementById('boardFeature');
      if (!featEl) return;
      boardFeatureSlides = buildBoardFeatureSlides();
      stopBoardFeatureTimer();
      if (!boardFeatureSlides.length) {
        featEl.style.display = 'none';
        return;
      }
      featEl.style.display = '';
      const track = document.getElementById('boardFeatureTrack');
      const dots = document.getElementById('boardFeatDots');
      track.innerHTML = boardFeatureSlides.map((s, i) => `
        <div class="board-feature-slide ${i === 0 ? 'on' : ''} ${s.cover ? 'has-cover' : ''}"
             style="${s.cover ? `background-image:url('${escapeHtml(s.cover)}')` : ''}"
             onclick="location.href='${s.href}'">
          <div class="board-feature-shade"></div>
          <span class="board-feature-tag ${s.tagClass}">${escapeHtml(s.tag)}</span>
          <h2>${escapeHtml(s.title)}</h2>

      dots.innerHTML = boardFeatureSlides.map((_, i) =>
        `<i class="${i === 0 ? 'on' : ''}" data-i="${i}" onclick="goBoardFeature(${i});startBoardFeatureTimer()"></i>`

      const next = document.getElementById('boardFeatNext');
      if (prev) prev.onclick = (e) => { e.stopPropagation(); goBoardFeature(boardFeatIndex - 1); startBoardFeatureTimer(); };
      if (next) next.onclick = (e) => { e.stopPropagation(); goBoardFeature(boardFeatIndex + 1); startBoardFeatureTimer(); };
      featEl.onmouseenter = () => { boardFeatPaused = true; };

    function parsePrice(priceStr) {
      if (!priceStr) return 0;
      const s = String(priceStr).trim();
      if (s === '无料' || s === '免费' || s === '0' || s === '¥0') return 0;
      const m = s.replace(/[,，]/g, '').match(/(\d+(?:\.\d+)?)/);
      return m ? parseFloat(m[1]) : 0;
    }

    // ===== 心愿单（购物模拟，非交易）=====
    // 汇总：件数 / 预估总价 / 明细（无料商品不计入总价）
    function wishlistStats() {
      let count = 0, total = 0, freeCount = 0;
      const entries = [];
      Object.entries(wishlistItems).forEach(([wid, qty]) => {
        if (!qty) return;
        const work = allWorks.find(w => w.id === wid);
        if (!work) return;
        const price = parsePrice(work.price);
        count += qty;
        total += price * qty;
        if (!price) freeCount += qty;
        entries.push({ work, qty, price, subtotal: price * qty });
      });
      return { count, total, freeCount, entries };
    }

    // 作品联系方式（与详情页同优先级）
    function wishlistContact(work) {
      const sl = (work && work.socialLinks) || {};
      const pairs = [['qq', 'QQ'], ['qqGroup', 'QQ群'], ['wechat', '微信'], ['weibo', '微博'], ['bilibili', 'B站'], ['custom', '自定义'], ['website', '网站']];
      for (const [key, fallback] of pairs) {
        if (!sl[key]) continue;
        const label = key === 'website' ? (sl.websiteLabel || fallback) : (sl.contactLabel || fallback);
        return { label, value: sl[key] };
      }
      return null;
    }

    function wishlistAuthorNames(work) {
      return (work.circles || []).map(cid => circlesMap[cid]).filter(Boolean).join('、');
    }

    async function activateWishlist() {
      if (wishlistMode) {
        wishlistMode = false;
        wishlistItems = {};
        document.getElementById('wishlistToggleBtn')?.classList.remove('active');
        closeWishlistDrawer();
        updateWishlistBar();
        renderWorks();
        return;
      }
      let confirmed;
      try {
        confirmed = await showConfirm('f7goods 不会提供任何直接交易的功能。\n本功能仅做购物模拟，以方便快速得知价格以及作者设定的购买方式。\n\n确认开启心愿单？');
      } catch (e) {
        console.error('[activateWishlist] showConfirm failed:', e);
        confirmed = confirm('确认开启心愿单？');
      }
      if (!confirmed) return;
      wishlistMode = true;
      wishlistItems = {};
      document.getElementById('wishlistToggleBtn')?.classList.add('active');
      updateWishlistBar();
    }

    // 卡片上的控件：未加入＝「＋ 心愿」，已加入＝「− 数量 ＋」步进器
    function wishlistControlHtml(workId) {
      const qty = wishlistItems[workId] || 0;
      if (qty > 0) {
        return `<span class="cl-w-wish on" data-wid="${workId}">` +
          `<button type="button" class="wq-btn" aria-label="减少" title="减少" onclick="decWishlistItem('${workId}',event)">−</button>` +
          `<b class="wq-num">${qty}</b>` +
          `<button type="button" class="wq-btn" aria-label="增加" title="增加" onclick="incWishlistItem('${workId}',event)">＋</button>` +
          `</span>`;
      }
      return `<button type="button" class="cl-w-wish" data-wid="${workId}" aria-label="加入心愿单" onclick="addToWishlist('${workId}',event)">＋ 心愿</button>`;
    }

    function replaceWishlistControl(el, workId) {
      const holder = document.createElement('div');
      holder.innerHTML = wishlistControlHtml(workId);
      el.replaceWith(holder.firstElementChild);
    }

    function updateWishlistControl(workId) {
      document.querySelectorAll('.cl-w-wish').forEach(el => {
        if (el.dataset.wid === workId) replaceWishlistControl(el, workId);
      });
    }

    function refreshAllWishlistControls() {
      document.querySelectorAll('.cl-w-wish').forEach(el => replaceWishlistControl(el, el.dataset.wid));
    }

    // 卡片控件 / 底部汇总条 / 抽屉 三者同步刷新
    function refreshWishlistUI(workId) {
      if (workId) updateWishlistControl(workId);
      updateWishlistBar();
      if (document.getElementById('wishlistOverlay')?.classList.contains('open')) renderWishlistDrawer();
    }

    // 卡片快捷入口：未开启心愿单时先走开启确认（含免责说明）
    async function addToWishlist(workId, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!wishlistMode) {
        await activateWishlist();
        if (!wishlistMode) return;
      }
      wishlistItems[workId] = (wishlistItems[workId] || 0) + 1;
      refreshWishlistUI(workId);
    }

    function incWishlistItem(workId, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!wishlistMode) return;
      wishlistItems[workId] = (wishlistItems[workId] || 0) + 1;
      refreshWishlistUI(workId);
    }

    function decWishlistItem(workId, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!wishlistItems[workId]) return;
      wishlistItems[workId]--;
      if (wishlistItems[workId] <= 0) delete wishlistItems[workId];
      refreshWishlistUI(workId);
    }

    // 抽屉里的加减：delta 为 0 表示直接移除
    function wlQty(workId, delta, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!delta) delete wishlistItems[workId];
      else {
        const next = (wishlistItems[workId] || 0) + delta;
        if (next <= 0) delete wishlistItems[workId];
        else wishlistItems[workId] = next;
      }
      refreshWishlistUI(workId);
    }

    // 底部条实际高度写回 CSS 变量，供 body 预留高度使用
    let wishlistBarRO = null;
    function syncWishlistBarHeight() {
      const bar = document.getElementById('wishlistBar');
      if (!bar) { document.body.style.removeProperty('--wl-bar-h'); return; }
      document.body.style.setProperty('--wl-bar-h', Math.ceil(bar.getBoundingClientRect().height) + 'px');

    // 剪贴板：安全上下文用 Clipboard API，否则回退 execCommand / 手动复制
    function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return new Promise((resolve, reject) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          ta.remove();
          ok ? resolve() : reject(new Error('execCommand copy failed'));
        } catch (err) { reject(err); }
      });
    }

    // ===== 图片清单（小票样式，2x 导出）=====
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const rr = Math.min(typeof r === 'number' ? r : (Array.isArray(r) ? r[0] : 0) || 0, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + rr, y);
        this.arcTo(x + w, y, x + w, y + h, rr);
        this.arcTo(x + w, y + h, x, y + h, rr);
        this.arcTo(x, y + h, x, y, rr);
        this.arcTo(x, y, x + w, y, rr);
        this.closePath();
        return this;
      };
    }

    function loadListImg(src) {
      return new Promise(resolve => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function wlDashLine(ctx, x1, x2, y, color = '#C9C2B6') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.restore();
    }

    function wlZigzag(ctx, x, y, w, tooth = 8, flip = false) {
      ctx.save();
      ctx.fillStyle = '#FFFCF7';
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let i = 0; i < w / tooth; i++) {
        const px = x + i * tooth;
        const py = flip ? y - tooth * 0.55 : y + tooth * 0.55;
        ctx.lineTo(px + tooth / 2, py);
        ctx.lineTo(px + tooth, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function wlFitText(ctx, txt, maxW) {
      if (ctx.measureText(txt).width <= maxW) return txt;
      let s = txt;
      while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
      return s + '…';
    }

    async function drawWishlistPng() {
      const { count, total, entries } = wishlistStats();
      const rows = entries.map(({ work, qty, price, subtotal }) => ({
        title: work.title || '',
        meta: [wishlistAuthorNames(work), STATUS_LABELS[work.status] || ''].filter(Boolean).join(' · '),
        qty,
        amount: price ? '¥' + subtotal.toFixed(2) : '无料',
        paid: !!price,
        img: (work.images && work.images[0]) || ''
      }));
      const imgs = await Promise.all(rows.map(r => loadListImg(r.img)));

      // 逻辑尺寸，2x 渲染保证清晰度
      const LOGICAL_W = 480;
      const SCALE = 2;
      const padX = 28, thumb = 44, rowH = 58, headerH = 118, totalH = 64, footerH = 78;
      const bodyH = rows.length * rowH;
      const LOGICAL_H = Math.max(360, headerH + bodyH + totalH + footerH + 24);
      const W = LOGICAL_W, H = LOGICAL_H;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(W * SCALE);
      canvas.height = Math.round(H * SCALE);
      const ctx = canvas.getContext('2d');
      ctx.scale(SCALE, SCALE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 背景 + 小票纸张
      ctx.fillStyle = '#E8E2D6';
      ctx.fillRect(0, 0, W, H);
      const paperX = 18, paperW = W - 36, paperY = 14, paperH = H - 28;
      ctx.fillStyle = '#FFFCF7';
      ctx.fillRect(paperX, paperY, paperW, paperH);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.strokeRect(paperX + 0.5, paperY + 0.5, paperW - 1, paperH - 1);
      wlZigzag(ctx, paperX, paperY, paperW, 7, false);
      wlZigzag(ctx, paperX, paperY + paperH, paperW, 7, true);

      const cx = paperX + paperW / 2;
      ctx.fillStyle = '#D94F5C';
      ctx.fillRect(paperX + 24, paperY + 18, paperW - 48, 2);

      // 抬头
      ctx.textAlign = 'center';
      ctx.fillStyle = '#22201E';
      ctx.font = '700 18px "Noto Serif SC", Georgia, serif';
      ctx.fillText('心愿单清单', cx, paperY + 48);
      ctx.font = '600 11px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#D94F5C';
      ctx.fillText('f7goods · WISHLIST', cx, paperY + 68);
      ctx.font = '11px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#8A8078';
      ctx.fillText(`全部周边 · ${count} 件 · ${formatDate(new Date())}`, cx, paperY + 86);
      ctx.fillText('————————  SHOPPING LIST  ————————', cx, paperY + 104);

      // 明细
      ctx.textAlign = 'left';
      let y = paperY + headerH;
      rows.forEach((r, i) => {
        const img = imgs[i];
        const rowTop = y;
        const thumbY = rowTop + 6;
        const textX = padX + thumb + 12;
        const rightX = paperX + paperW - padX;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(paperX + padX, thumbY, thumb, thumb, 6);
        ctx.clip();
        if (img) {
          const s = Math.max(thumb / img.width, thumb / img.height);
          const dw = img.width * s, dh = img.height * s;
          ctx.drawImage(img, paperX + padX + (thumb - dw) / 2, thumbY + (thumb - dh) / 2, dw, dh);
        } else {
          ctx.fillStyle = '#EDE6DA';
          ctx.fillRect(paperX + padX, thumbY, thumb, thumb);
          ctx.fillStyle = '#B0A89C';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('—', paperX + padX + thumb / 2, thumbY + thumb / 2 + 4);
          ctx.textAlign = 'left';
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(paperX + padX + 0.5, thumbY + 0.5, thumb - 1, thumb - 1, 6);
        ctx.stroke();

        const amountW = 62;
        const availW = rightX - (paperX + textX) - amountW;
        ctx.fillStyle = '#22201E';
        ctx.font = '600 13px "Noto Sans SC", sans-serif';
        ctx.fillText(wlFitText(ctx, r.title, availW), paperX + textX, rowTop + 22);
        ctx.font = '11px "Noto Sans SC", sans-serif';
        ctx.fillStyle = '#8A8078';
        const metaTxt = (r.meta ? r.meta + ' · ' : '') + '×' + r.qty;
        ctx.fillText(wlFitText(ctx, metaTxt, availW + 20), paperX + textX, rowTop + 40);

        ctx.textAlign = 'right';
        ctx.font = r.paid ? '600 13px "Noto Sans SC", sans-serif' : '12px "Noto Sans SC", sans-serif';
        ctx.fillStyle = r.paid ? '#D94F5C' : '#8A8078';
        ctx.fillText(r.amount, rightX, rowTop + 28);
        ctx.textAlign = 'left';

        wlDashLine(ctx, paperX + padX, rightX, rowTop + rowH - 2);
        y += rowH;
      });

      // 合计
      y += 10;
      ctx.font = '12px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#8A8078';
      ctx.fillText(`件数  ${count}`, paperX + padX, y);
      ctx.textAlign = 'right';
      ctx.fillText('无料不计入', paperX + paperW - padX, y);
      ctx.textAlign = 'left';
      y += 22;
      ctx.font = '700 16px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#22201E';
      ctx.fillText('预估合计', paperX + padX, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#D94F5C';
      ctx.fillText('¥' + total.toFixed(2), paperX + paperW - padX, y);
      ctx.textAlign = 'left';

      // 页脚
      const footY = paperY + paperH - 36;
      wlDashLine(ctx, paperX + padX, paperX + paperW - padX, footY - 14);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8A8078';
      ctx.font = '11px "Noto Sans SC", sans-serif';
      ctx.fillText('仅供购物模拟 · 非交易凭证', cx, footY);
      ctx.font = '10px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#B0A89C';
      ctx.fillText('f7goods · 心愿单', cx, footY + 16);
      return canvas;
    }

    async function exportWishlistPng() {
      const { count } = wishlistStats();
      if (!count) { showToast('心愿单是空的', 'error'); return; }
      try {
        const canvas = await drawWishlistPng();
        canvas.toBlob(blob => {
          if (!blob) { showToast('导出失败', 'error'); return; }
          const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `wishlist-${stamp}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
          showToast('已导出图片清单');
        }, 'image/png');
      } catch (e) {
        console.error('[exportWishlistPng] failed:', e);
        showToast('导出失败，已改为复制文本', 'error');
        copyWishlistText();
      }
    }

    // 洗牌并写入 _randomRank，同一会话内筛选/分页保持该顺序
    function shuffleWorksForSession(list) {
      if (!Array.isArray(list)) return;
      const n = list.length;
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      list.forEach((w, idx) => { w._randomRank = idx; });
    }

    function renderWorks() {
      const grid = document.getElementById('worksGrid');
      let filtered = [...allWorks];
      if (currentCategory !== 'all') {
        filtered = filtered.filter(w => w.category === currentCategory);
      }
      if (currentStatus !== 'all') {
        filtered = filtered.filter(w => w.status === currentStatus);
      }

      // User filter (liked/wanted)
      if (currentUserFilter === 'liked') {
        const likedIds = JSON.parse(localStorage.getItem('f7liked') || '[]');
        filtered = filtered.filter(w => likedIds.includes(w.id));
      } else if (currentUserFilter === 'wanted') {
        const wantedIds = JSON.parse(localStorage.getItem('f7wanted') || '[]');
        filtered = filtered.filter(w => wantedIds.includes(w.id));
      }

      // Follow filter
      if (currentFollowFilter) {
        const followedList = getFollowedCircles();
        filtered = filtered.filter(w => (w.circles || []).some(cid => followedList.includes(cid)));
      }

      // Deadline filter
      if (currentDeadlineFilter) {
        filtered = filtered.filter(w => isDeadlineSoon(w.endDate));
      }

      const search = document.getElementById('searchInput').value.toLowerCase();

      // Check for exact tag match from URL
      const urlParams = new URLSearchParams(location.search);
      const tagFilter = urlParams.get('tag');
      if (tagFilter) {
        filtered = filtered.filter(w => (w.tags || []).some(t => t === tagFilter));
        document.getElementById('searchInput').value = tagFilter;
      } else if (search) {
        // Circle IDs whose names match search
        const matchCircleIds = Object.entries(circlesMap)
          .filter(([, name]) => name.toLowerCase().includes(search))
          .map(([id]) => id);
        // Work IDs from events whose titles match search
        const matchEventWorkIds = allEvents
          .filter(e => e.title.toLowerCase().includes(search))
          .flatMap(e => e.relatedWorks || []);

        filtered = filtered.filter(w =>
          w.title.toLowerCase().includes(search) ||
          w.tags.some(t => t.toLowerCase().includes(search)) ||
          matchCircleIds.some(cid => (w.circles || []).includes(cid)) ||
          matchEventWorkIds.includes(w.id)
        );
      }

      // Apply sorting
      const sortVal = document.getElementById('sortSelect')?.value || 'random';
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => (a.releaseDate || 'z').localeCompare(b.releaseDate || 'z'));
      } else if (sortVal === 'date-desc') {
        filtered.sort((a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || ''));
      } else if (sortVal === 'likes-desc') {
        filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (sortVal === 'likes-asc') {
        filtered.sort((a, b) => (a.likes || 0) - (b.likes || 0));
      } else if (sortVal === 'wants-desc') {
        filtered.sort((a, b) => (b.wants || 0) - (a.wants || 0));
      } else if (sortVal === 'wants-asc') {
        filtered.sort((a, b) => (a.wants || 0) - (b.wants || 0));
      } else if (sortVal === 'default') {
        // 原默认：按创建时间降序（最新上传在前）
        filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      } else {
        // random（默认）：使用本次进入时洗牌的顺序
        filtered.sort((a, b) => (a._randomRank ?? 0) - (b._randomRank ?? 0));
      }

      // Remove skeleton
      document.getElementById('worksSkeleton')?.remove();

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>${t('common.noResults')}</p><button class="btn" style="margin-top:1rem;" onclick="clearFilters()">${t('common.clearFilter')}</button></div>`;
        return;
      }

      // Counts
      const totalEl = document.getElementById('worksTotalCount');
      if (totalEl) totalEl.textContent = allWorks.length;
      const showEl = document.getElementById('worksShowCount');
      if (showEl) showEl.textContent = filtered.length;

      // Pagination
      const pageSize = 20;
      const currentPage = window._worksPage || 1;
      const totalPages = Math.ceil(filtered.length / pageSize);
      const pageWorks = filtered.slice(0, currentPage * pageSize);

      grid.innerHTML = pageWorks.map(work => {
        const statusLabel = STATUS_LABELS[work.status] || '';
        const authors = (work.circles || []).map(cid => circlesMap[cid]).filter(Boolean).join('、');
        const catLabel = CATEGORIES[work.category] || '';
        // 心愿控件紧贴价格：未加入＝「＋ 心愿」，已加入＝「− 数量 ＋」
        const wishHtml = wishlistControlHtml(work.id);
        return `
        <a class="cl-w-card" href="/work-detail.html?id=${work.id}">
          <div class="cl-w-cover">
            ${statusLabel ? `<span class="cl-w-status ${workStatusClass(work.status, statusLabel)}">${escapeHtml(statusLabel)}</span>` : ''}
            ${isDeadlineSoon(work.endDate) ? `<span class="cl-w-deadline">${t('common.deadlineSoon')}</span>` : ''}
            ${work.images && work.images.length > 0
              ? `<img src="${work.images[0]}" alt="${escapeHtml(work.title)}" loading="lazy">`
              : `<span>${escapeHtml((work.title || '?').charAt(0))}</span>`}
          </div>
          <div class="cl-w-body">
            <div class="cl-w-title">${escapeHtml(work.title)}</div>
            <div class="cl-w-meta">${escapeHtml(authors)}${authors ? ' · ' : ''}${escapeHtml(catLabel)}</div>
          </div>
          <div class="cl-w-foot">
            <span class="cl-w-foot-l">
              <span class="cl-w-price">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || ''))}</span>
              ${wishHtml}
            </span>
            <span class="cl-w-stats">
              ${renderLikeButton(work.id, work.likes)}
              <button type="button" class="cl-w-want${isWanted(work.id) ? ' on' : ''}" data-wid="${work.id}" title="${isWanted(work.id) ? t('common.cancel') : t('common.want')}" onclick="onWantStarClick('${work.id}',event)">
                <span class="cl-w-want-icon">★</span><span class="cl-w-want-count">${(work.wants || 0) > 0 ? work.wants : ''}</span>
              </button>
            </span>
          </div>
        </a>`;
      }).join('') + (currentPage < totalPages
        ? `<div class="cl-w-more">
             <button type="button" onclick="loadMoreWorks()">${t('common.loadMore') || '加载更多'}</button>
             <span class="prog">已显示 ${pageWorks.length} / 共 ${filtered.length} 件</span>
           </div>`
        : '');
    }

    function loadMoreWorks() {
      window._worksPage = (window._worksPage || 1) + 1;
      renderWorks();
    }

    loadWorks();
    loadBoardAnnounce();

    PullToRefresh.init({
      onRefresh: async () => {
        window._worksPage = 1;
        const [works, circles, events] = await Promise.all([
          F7API.getWorks(),
          F7API.getCircles(),
          F7API.getEvents()
        ]);
        allWorks = works;
        allEvents = events;
        allCirclesList = circles || [];
        circles.forEach(c => { circlesMap[c.id] = c.name; circlesLogoMap[c.id] = c.logo || ''; });
        renderWorks();
      }
    });
  </script>
</body>
</html>

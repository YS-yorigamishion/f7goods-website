  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.jpg">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260810b">
  <style>
    .wishlist-qty-group { display:inline-flex; align-items:center; gap:0.1rem; }
    .wishlist-add-btn { position:relative; background:none; border:none; font-size:1.1rem; cursor:pointer; padding:0.1rem 0.3rem; color:var(--accent); transition:transform 0.15s; line-height:1; }
    .wishlist-add-btn:active { transform:scale(1.3); }
    .wishlist-badge { font-size:0.75rem; font-weight:700; min-width:16px; text-align:center; color:var(--accent); }
    #wishlistBar { position:fixed; bottom:0; left:0; right:0; background:var(--card-bg); border-top:2px solid var(--accent); padding:0.8rem 1.2rem; z-index:999; box-shadow:0 -2px 12px rgba(0,0,0,0.15); }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle" class="settings-pending" data-i18n="works.heroTitle">🎨 同人周边概览</h1>
    <p id="heroSubtitle" class="settings-pending" data-i18n="works.heroSubtitle">浏览并发现优质同人创作者的手办、周边、同人志、音乐CD等商品</p>
  </section>

  <main class="main-content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;">
      <div>
        <h2 id="pageTitle" class="settings-pending" data-i18n="works.listTitle">周边列表</h2>
        <p id="pageSubtitle" class="settings-pending" data-i18n="works.listSubtitle">按默认排序显示</p>
      </div>
      <div id="announcementBtn"></div>
    </div>

    <div class="filter-bar" id="statusFilters">
      <button class="filter-btn active" data-status="all" data-i18n="common.allStatus">全部状态</button>
    </div>
    <div class="filter-bar" id="categoryFilters">
      <button class="filter-btn active" data-cat="all" data-i18n="common.all">全部</button>
      <div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;">
        <select id="sortSelect" class="form-input" style="padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;">
          <option value="default" data-i18n="common.sortDefault">默认排序</option>
          <option value="date-asc" data-i18n="common.sortDateAsc">发售时间 ↑ 早→晚</option>
          <option value="date-desc" data-i18n="common.sortDateDesc">发售时间 ↓ 晚→早</option>
          <option value="likes-desc" data-i18n="common.sortLikesDesc">喜爱数 ↓ 高→低</option>
          <option value="likes-asc" data-i18n="common.sortLikesAsc">喜爱数 ↑ 低→高</option>
          <option value="wants-desc" data-i18n="common.sortWantsDesc">想要数 ↓ 高→低</option>
          <option value="wants-asc" data-i18n="common.sortWantsAsc">想要数 ↑ 低→高</option>
        </select>
        <input type="text" class="search-input" data-i18n-placeholder="common.searchPlaceholder" placeholder="搜索作品..." id="searchInput">
      </div>
    </div>
    <div class="filter-bar" id="userFilters">
      <button class="filter-btn" onclick="toggleFollowFilter()" id="followFilterBtn">⭐ <span data-i18n="common.follow">关注</span></button>
      <button class="filter-btn" data-user-filter="liked" onclick="toggleUserFilter('liked')">❤️ <span data-i18n="common.like">喜爱</span></button>
      <button class="filter-btn" data-user-filter="wanted" onclick="toggleUserFilter('wanted')">🔖 <span data-i18n="common.want">想要</span></button>
      <button class="filter-btn" onclick="toggleDeadlineFilter()" id="deadlineFilterBtn">⏰ <span>即将截止</span></button>
      <button class="filter-btn" id="wishlistToggleBtn" onclick="activateWishlist()" style="margin-left:auto;">🛒 心愿单</button>
    </div>

    <div class="cards-grid" id="worksGrid">
      <div class="skeleton-grid" id="worksSkeleton">
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      </div>
    </div>

    <!-- Random Works Modal -->
    <div class="random-modal-overlay" id="randomModalOverlay" onclick="if(event.target===this)closeRandomModal()">
      <div class="random-modal">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <h3 style="margin:0;">🎲 <span data-i18n="common.randomWorks">随机周边</span></h3>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            <button class="btn btn-primary" onclick="renderRandomWorks()">🎲 <span data-i18n="common.refreshRandom">换一批</span></button>
            <button onclick="closeRandomModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--haze);">&times;</button>
          </div>
        </div>
        <div class="random-grid" id="randomGrid"></div>
      </div>
    </div>
  </main>

  <button id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</button>
  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/pull-to-refresh.js"></script>
  <script src="/js/main.js?v=20260812"></script>
  <script>
    // 全局骨架屏安全网：8秒后无论如何移除骨架屏和隐藏类
    setTimeout(() => {
      const sk = document.getElementById('worksSkeleton');
      if (sk) { console.warn('[safety] skeleton timeout, removing'); sk.remove(); }
      document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
    }, 8000);

    // fetch 超时封装（默认10秒）
    function fetchWithTimeout(url, timeout) {
      timeout = timeout || 10000;
      const controller = new AbortController();
      const timer = setTimeout(function() { controller.abort(); }, timeout);
      return fetch(url, { signal: controller.signal }).finally(function() { clearTimeout(timer); });
    }

    initPage('works');

    let allWorks = [];
    let allEvents = [];
    let circlesMap = {};
    let currentCategory = 'all';
    let currentStatus = 'all';
    let currentUserFilter = 'none'; // 'none', 'liked', 'wanted'
    let currentFollowFilter = false;
    let currentDeadlineFilter = false;
    let wishlistMode = false;
    let wishlistItems = {}; // { workId: quantity }

    function parsePrice(priceStr) {
      if (!priceStr) return 0;
      const s = String(priceStr).trim();
      if (s === '无料' || s === '免费' || s === '0' || s === '¥0') return 0;
      const m = s.replace(/[,，]/g, '').match(/(\d+(?:\.\d+)?)/);
      return m ? parseFloat(m[1]) : 0;
    }

    async function activateWishlist() {
      if (wishlistMode) {
        wishlistMode = false;
        wishlistItems = {};
        document.getElementById('wishlistToggleBtn').classList.remove('active');
        document.getElementById('wishlistBar')?.remove();
        renderWorks();
        return;
      }
      let confirmed;
      try {
        confirmed = await showConfirm('f7goods 不会提供任何直接交易的功能。\n本功能仅做购物模拟，以方便快速得知价格以及作者设定的购买方式。\n\n确认开启心愿单？');
      } catch (e) {
        console.error('[activateWishlist] showConfirm failed:', e);
        confirmed = confirm('确认开启心愿单？');
      }
      if (!confirmed) return;
      wishlistMode = true;
      wishlistItems = {};
      document.getElementById('wishlistToggleBtn').classList.add('active');
      renderWorks();
      updateWishlistBar();
    }

    function toggleWishlistItem(workId, e) {
      e.preventDefault();
      e.stopPropagation();
      if (!wishlistItems[workId]) wishlistItems[workId] = 0;
      wishlistItems[workId]++;
      updateWishlistBadge(workId);
      updateWishlistBar();
    }

    function decreaseWishlistItem(workId, e) {
      e.preventDefault();
      e.stopPropagation();
      if (!wishlistItems[workId] || wishlistItems[workId] <= 0) return;
      wishlistItems[workId]--;
      if (wishlistItems[workId] <= 0) delete wishlistItems[workId];
      updateWishlistBadge(workId);
      updateWishlistBar();
    }

    function updateWishlistBadge(workId) {
      const qty = wishlistItems[workId] || 0;
      document.querySelectorAll('.wishlist-badge[data-wid="' + workId + '"]').forEach(el => {
        el.textContent = qty > 0 ? '×' + qty : '';
        el.style.display = qty > 0 ? 'inline-flex' : 'none';
      });
    }

    function updateWishlistBar() {
      const entries = Object.entries(wishlistItems).filter(([, q]) => q > 0);
      if (entries.length === 0) {
        document.getElementById('wishlistBar')?.remove();
        return;
      }
      let totalCount = 0;
      let totalPrice = 0;
      entries.forEach(([wid, qty]) => {
        totalCount += qty;
        const work = allWorks.find(w => w.id === wid);
        if (work) totalPrice += parsePrice(work.price) * qty;
      });
      let bar = document.getElementById('wishlistBar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'wishlistBar';
        document.body.appendChild(bar);
      }
      bar.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;">' +
        '<span style="font-size:0.9rem;">已选 <strong>' + totalCount + '</strong> 件 · 总价 <strong>¥' + totalPrice.toFixed(2) + '</strong></span>' +
        '<button class="btn btn-primary" style="padding:0.4rem 1.2rem;font-size:0.85rem;" onclick="showWishlistSummary()">确认</button>' +
        '</div>';
    }

    function showWishlistSummary() {
      const entries = Object.entries(wishlistItems).filter(([, q]) => q > 0);
      if (entries.length === 0) { showToast('请先添加作品到心愿单', 'error'); return; }
      let totalPrice = 0;
      let rows = '';
      entries.forEach(([wid, qty]) => {
        const work = allWorks.find(w => w.id === wid);
        if (!work) return;
        const price = parsePrice(work.price);
        const subtotal = price * qty;
        totalPrice += subtotal;
        const authorNames = (work.circles || []).map(cid => circlesMap[cid]).filter(Boolean).join(', ') || '';
        const sl = work.socialLinks || {};
        let contactType = '', contactValue = '';
        if (sl.qq) { contactType = 'QQ'; contactValue = sl.qq; }
        else if (sl.qqGroup) { contactType = 'QQ群'; contactValue = sl.qqGroup; }
        else if (sl.wechat) { contactType = '微信'; contactValue = sl.wechat; }
        else if (sl.weibo) { contactType = '微博'; contactValue = sl.weibo; }
        else if (sl.bilibili) { contactType = 'B站'; contactValue = sl.bilibili; }
        else if (sl.custom) { contactType = '自定义'; contactValue = sl.custom; }
        else if (sl.website) { contactType = '网站'; contactValue = sl.website; }
        const img = (work.images && work.images[0]) || '';
        rows += '<div style="display:flex;gap:0.8rem;padding:0.8rem 0;border-bottom:1px solid var(--border);">' +
          (img ? '<img src="' + img + '" style="width:48px;height:48px;border-radius:6px;object-fit:cover;flex-shrink:0;">' : '') +
          '<div style="flex:1;min-width:0;">' +
          '<div style="font-weight:600;margin-bottom:0.3rem;">' + escapeHtml(work.title) + ' <span style="color:var(--haze);font-weight:400;font-size:0.85rem;">×' + qty + '</span></div>' +
          '<div style="font-size:0.8rem;color:var(--haze);line-height:1.6;">' +
          '作者: ' + escapeHtml(authorNames) + '<br>' +
          '状态: ' + (STATUS_LABELS[work.status] || work.status) + '<br>' +
          (contactType ? (contactType + ': ' + escapeHtml(contactValue) + '<br>') : '') +
          '</div>' +
          '<div style="text-align:right;font-weight:600;color:var(--accent);margin-top:0.3rem;">¥' + subtotal.toFixed(2) + '</div>' +
          '</div></div>';
      });
      const overlay = document.createElement('div');
      overlay.id = 'wishlistSummaryOverlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1001;display:flex;align-items:center;justify-content:center;padding:1rem;';
      overlay.innerHTML = '<div style="background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;max-width:420px;width:100%;max-height:80vh;display:flex;flex-direction:column;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">' +
        '<h3 style="margin:0;">心愿单明细</h3>' +
        '<button onclick="document.getElementById(\'wishlistSummaryOverlay\').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--haze);">×</button>' +
        '</div>' +
        '<div style="overflow-y:auto;flex:1;">' + rows + '</div>' +
        '<div style="text-align:right;font-size:1.1rem;font-weight:700;margin-top:1rem;padding-top:0.8rem;border-top:2px solid var(--border);">合计: ¥' + totalPrice.toFixed(2) + '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    function toggleUserFilter(type) {
      currentUserFilter = currentUserFilter === type ? 'none' : type;
      document.querySelectorAll('[data-user-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.userFilter === currentUserFilter);
      });
      renderWorks();
    }

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      document.getElementById('followFilterBtn').classList.toggle('active', currentFollowFilter);
      renderWorks();
    }

    function toggleDeadlineFilter() {
      currentDeadlineFilter = !currentDeadlineFilter;
      document.getElementById('deadlineFilterBtn').classList.toggle('active', currentDeadlineFilter);
      renderWorks();
    }

    function checkUserFilters() {
      const liked = JSON.parse(localStorage.getItem('f7liked') || '[]');
      const wanted = JSON.parse(localStorage.getItem('f7wanted') || '[]');
      const followed = getFollowedCircles();
      const hasDeadlines = allWorks.some(w => isDeadlineSoon(w.endDate));
      const container = document.getElementById('userFilters');
      if (container && (liked.length > 0 || wanted.length > 0 || followed.length > 0 || hasDeadlines)) {
        container.style.display = 'flex';
      }
    }

    async function loadWorks() {
      try {
        console.log('[loadWorks] start, _i18n loaded:', Object.keys(_i18n).length > 0);
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        console.log('[loadWorks] categories/settings loaded, CATEGORIES_ORDERED:', CATEGORIES_ORDERED.length, 'STATUS_ORDERED:', STATUS_ORDERED.length);
        console.log('[loadWorks] fetching works/circles/events...');
        const [works, circles, events] = await Promise.all([
          F7API.getWorks(),
          F7API.getCircles(),
          F7API.getEvents()
        ]);
        console.log('[loadWorks] data received: works=' + (works?.length || 0) + ', circles=' + (circles?.length || 0) + ', events=' + (events?.length || 0));
        allWorks = works;
        allEvents = events;
        circles.forEach(c => circlesMap[c.id] = c.name);

        // Apply settings
        const ps = getPageSettings('works');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('works');

        // Reveal elements after settings are loaded
        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        // Restore visibility if hidden during language switch
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');
        // Generate filter buttons dynamically
        try { buildFilterButtons(); } catch (e) { console.error('[loadWorks] buildFilterButtons failed:', e); }
        renderWorks();
        checkUserFilters();

        // Render announcement button
        const annBtn = document.getElementById('announcementBtn');
        if (annBtn) annBtn.innerHTML = renderAnnouncementButton();
      } catch (e) {
        console.error('[loadWorks] failed:', e);
        try {
          document.getElementById('worksGrid').innerHTML =
            `<div class="empty-state"><div class="icon">!</div><p>${t('common.loadFailed')}</p><button class="btn" style="margin-top:1rem;" onclick="loadWorks()">${t('common.retry')}</button></div>`;
        } catch (e2) {
          console.error('[loadWorks] catch block also failed:', e2);
          document.getElementById('worksGrid').innerHTML =
            '<div class="empty-state"><div class="icon">!</div><p>加载失败，请刷新页面重试</p><button class="btn" style="margin-top:1rem;" onclick="location.reload()">刷新</button></div>';
        }
      }
    }

    function clearFilters() {
      currentCategory = 'all';
      currentStatus = 'all';
      document.getElementById('searchInput').value = '';
      document.getElementById('sortSelect').value = 'default';
      document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
      document.querySelector('.filter-btn[data-cat="all"]')?.classList.add('active');
      document.querySelectorAll('.filter-btn[data-status]').forEach(b => b.classList.remove('active'));
      document.querySelector('.filter-btn[data-status="all"]')?.classList.add('active');
      renderWorks();
    }

    function buildFilterButtons() {
      if (!Array.isArray(STATUS_ORDERED) || STATUS_ORDERED.length === 0 || !Array.isArray(CATEGORIES_ORDERED) || CATEGORIES_ORDERED.length === 0) {
        console.warn('[buildFilterButtons] skipped: STATUS_ORDERED or CATEGORIES_ORDERED not ready');
        return;
      }
      // Status filters
      const statusContainer = document.getElementById('statusFilters');
      statusContainer.innerHTML = `<button class="filter-btn active" data-status="all">${t('common.allStatus')}</button>` +
        STATUS_ORDERED.map(s => `<button class="filter-btn" data-status="${s.id}">${tCat(s)}</button>`).join('');

      // Category filters
      const catContainer = document.getElementById('categoryFilters');
      const searchInput = document.getElementById('searchInput');
      const sortSelect = document.getElementById('sortSelect');
      const searchHtml = searchInput ? searchInput.outerHTML : `<input type="text" class="search-input" placeholder="${t('common.searchPlaceholder')}" id="searchInput">`;
      const sortHtml = sortSelect ? sortSelect.outerHTML : `<select id="sortSelect" class="form-input" style="padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;"><option value="default">${t('common.sortDefault')}</option><option value="date-asc">${t('common.sortDateAsc')}</option><option value="date-desc">${t('common.sortDateDesc')}</option><option value="likes-desc">${t('common.sortLikesDesc')}</option><option value="likes-asc">${t('common.sortLikesAsc')}</option><option value="wants-desc">${t('common.sortWantsDesc')}</option><option value="wants-asc">${t('common.sortWantsAsc')}</option></select>`;
      catContainer.innerHTML = `<button class="filter-btn active" data-cat="all">${t('common.all')}</button>` +
        CATEGORIES_ORDERED.map(c => `<button class="filter-btn" data-cat="${c.id}">${tCat(c)}</button>`).join('') +
        `<div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;"><button class="filter-btn" onclick="showRandomWorks()" style="white-space:nowrap;">🎲 ${t('common.randomAuthor')}</button>${sortHtml}${searchHtml}</div>`;

      // Re-bind events
      document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          renderWorks();
        });
      });
      document.querySelectorAll('.filter-btn[data-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn[data-status]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentStatus = btn.dataset.status;
          renderWorks();
        });
      });
      document.getElementById('searchInput').addEventListener('input', debounce(() => {
        renderWorks();
      }));
      document.getElementById('sortSelect').addEventListener('change', () => {
        renderWorks();
      });
    }

    function renderWorks() {
      const grid = document.getElementById('worksGrid');
      let filtered = [...allWorks];
      if (currentCategory !== 'all') {
        filtered = filtered.filter(w => w.category === currentCategory);
      }
      if (currentStatus !== 'all') {
        filtered = filtered.filter(w => w.status === currentStatus);
      }

      // User filter (liked/wanted)
      if (currentUserFilter === 'liked') {
        const likedIds = JSON.parse(localStorage.getItem('f7liked') || '[]');
        filtered = filtered.filter(w => likedIds.includes(w.id));
      } else if (currentUserFilter === 'wanted') {
        const wantedIds = JSON.parse(localStorage.getItem('f7wanted') || '[]');
        filtered = filtered.filter(w => wantedIds.includes(w.id));
      }

      // Follow filter
      if (currentFollowFilter) {
        const followedList = getFollowedCircles();
        filtered = filtered.filter(w => (w.circles || []).some(cid => followedList.includes(cid)));
      }

      // Deadline filter
      if (currentDeadlineFilter) {
        filtered = filtered.filter(w => isDeadlineSoon(w.endDate));
      }

      const search = document.getElementById('searchInput').value.toLowerCase();

      // Check for exact tag match from URL
      const urlParams = new URLSearchParams(location.search);
      const tagFilter = urlParams.get('tag');
      if (tagFilter) {
        filtered = filtered.filter(w => (w.tags || []).some(t => t === tagFilter));
        document.getElementById('searchInput').value = tagFilter;
      } else if (search) {
        // Circle IDs whose names match search
        const matchCircleIds = Object.entries(circlesMap)
          .filter(([, name]) => name.toLowerCase().includes(search))
          .map(([id]) => id);
        // Work IDs from events whose titles match search
        const matchEventWorkIds = allEvents
          .filter(e => e.title.toLowerCase().includes(search))
          .flatMap(e => e.relatedWorks || []);

        filtered = filtered.filter(w =>
          w.title.toLowerCase().includes(search) ||
          w.tags.some(t => t.toLowerCase().includes(search)) ||
          matchCircleIds.some(cid => (w.circles || []).includes(cid)) ||
          matchEventWorkIds.includes(w.id)
        );
      }

      // Apply sorting
      const sortVal = document.getElementById('sortSelect')?.value || 'default';
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => (a.releaseDate || 'z').localeCompare(b.releaseDate || 'z'));
      } else if (sortVal === 'date-desc') {
        filtered.sort((a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || ''));
      } else if (sortVal === 'likes-desc') {
        filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (sortVal === 'likes-asc') {
        filtered.sort((a, b) => (a.likes || 0) - (b.likes || 0));
      } else if (sortVal === 'wants-desc') {
        filtered.sort((a, b) => (b.wants || 0) - (a.wants || 0));
      } else if (sortVal === 'wants-asc') {
        filtered.sort((a, b) => (a.wants || 0) - (b.wants || 0));
      } else {
        // 默认按创建时间降序（最新上传在前）
        filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      }

      // Remove skeleton
      document.getElementById('worksSkeleton')?.remove();

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>${t('common.noResults')}</p><button class="btn" style="margin-top:1rem;" onclick="clearFilters()">${t('common.clearFilter')}</button></div>`;
        return;
      }

      // Pagination
      const pageSize = 20;
      const currentPage = window._worksPage || 1;
      const totalPages = Math.ceil(filtered.length / pageSize);
      const pageWorks = filtered.slice(0, currentPage * pageSize);

      grid.innerHTML = pageWorks.map(work => `
        <div class="card" onclick="location.href='/work-detail.html?id=${work.id}'">
          <div class="card-image">
            ${work.images && work.images.length > 0
              ? `<img src="${work.images[0]}" alt="${escapeHtml(work.title)}" loading="lazy">`
              : '<span class="placeholder-icon">🎨</span>'}
            ${isDeadlineSoon(work.endDate) ? '<span class="deadline-badge">即将截止</span>' : ''}
          </div>
          <div class="card-body">
            <span class="card-tag ${work.status}">${STATUS_LABELS[work.status] || work.status}</span>
            <h3 class="card-title">${escapeHtml(work.title)}</h3>
            <p class="card-subtitle">${(work.circles || []).map(cid => escapeHtml(circlesMap[cid])).filter(Boolean).join(', ') || ''}${(work.circles || []).length > 0 ? ' · ' : ''}${CATEGORIES[work.category] || work.category}</p>
          </div>
          <div class="card-footer">
            <span class="card-price">${escapeHtml(work.price)}</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              ${(work.wants || 0) > 0 ? `<span style="font-size:0.75rem;color:#3498db;">${t('common.wants')} ${work.wants}</span>` : ''}
              <span class="card-date">${formatDate(work.releaseDate)}</span>
              ${renderLikeButton(work.id, work.likes)}
              ${wishlistMode ? '<span class="wishlist-qty-group"><button class="wishlist-add-btn" onclick="decreaseWishlistItem(\'' + work.id + '\',event)">−</button><span class="wishlist-badge" data-wid="' + work.id + '" style="' + ((wishlistItems[work.id] || 0) > 0 ? '' : 'display:none;') + '">' + ((wishlistItems[work.id] || 0) > 0 ? wishlistItems[work.id] : '') + '</span><button class="wishlist-add-btn" onclick="toggleWishlistItem(\'' + work.id + '\',event)">＋</button></span>' : ''}
            </div>
          </div>
        </div>
      `).join('') + (currentPage < totalPages ? `<div id="loadMoreTrigger" style="grid-column:1/-1;text-align:center;padding:1rem;"><button class="btn" onclick="loadMoreWorks()">${t('common.loadMore')}</button></div>` : '');
    }

    function loadMoreWorks() {
      window._worksPage = (window._worksPage || 1) + 1;
      renderWorks();
    }

    // ===== Random Works =====
    function showRandomWorks() {
      if (!allWorks || allWorks.length === 0) return;
      renderRandomWorks();
      document.getElementById('randomModalOverlay').classList.add('open');
    }

    function closeRandomModal() {
      document.getElementById('randomModalOverlay').classList.remove('open');
    }

    function renderRandomWorks() {
      const shuffled = [...allWorks].sort(() => Math.random() - 0.5);
      const isMobile = window.innerWidth <= 600;
      const selected = shuffled.slice(0, isMobile ? 4 : 6);
      document.getElementById('randomGrid').innerHTML = selected.map(work => `
        <a href="/work-detail.html?id=${work.id}" style="text-decoration:none;color:inherit;">
          <div class="card" style="margin:0;">
            <div class="card-image">
              ${work.images && work.images.length > 0
                ? `<img src="${work.images[0]}" alt="${escapeHtml(work.title)}" loading="lazy">`
                : '<span class="placeholder-icon">🎨</span>'}
              ${isDeadlineSoon(work.endDate) ? '<span class="deadline-badge">即将截止</span>' : ''}
            </div>
            <div class="card-body">
              <span class="card-tag ${work.status}">${STATUS_LABELS[work.status] || work.status}</span>
              <h3 class="card-title">${escapeHtml(work.title)}</h3>
              <p class="card-subtitle">${(work.circles || []).map(cid => escapeHtml(circlesMap[cid])).filter(Boolean).join(', ') || ''}${(work.circles || []).length > 0 ? ' · ' : ''}${CATEGORIES[work.category] || work.category}</p>
            </div>
            <div class="card-footer">
              <span class="card-price">${escapeHtml(work.price)}</span>
              <div style="display:flex;align-items:center;gap:0.5rem;">
                ${(work.wants || 0) > 0 ? `<span style="font-size:0.75rem;color:#3498db;">${t('common.wants')} ${work.wants}</span>` : ''}
                <span class="card-date">${formatDate(work.releaseDate)}</span>
                ${renderLikeButton(work.id, work.likes)}
              </div>
            </div>
          </div>
        </a>
      `).join('');
    }

    // ESC key to close modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeRandomModal();
    });

    loadWorks();

    PullToRefresh.init({
      onRefresh: async () => {
        window._worksPage = 1;
        const [works, circles, events] = await Promise.all([
          F7API.getWorks(),
          F7API.getCircles(),
          F7API.getEvents()
        ]);
        allWorks = works;
        allEvents = events;
        circles.forEach(c => circlesMap[c.id] = c.name);
        renderWorks();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 作品详情</title>
  <meta name="description" content="查看同人作品详情，包括图片、价格、作者信息等。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="/uploads/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260810">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="workDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;">
          <div class="skeleton skeleton-text" style="width:50%;height:28px;margin-bottom:0.8rem;"></div>
          <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;"><div class="skeleton skeleton-pill"></div><div class="skeleton skeleton-pill" style="width:80px;"></div></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:90%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:70%;margin-bottom:1.5rem;"></div>
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;"><div class="skeleton skeleton-img" style="height:120px;"></div><div class="skeleton skeleton-img" style="height:120px;"></div><div class="skeleton skeleton-img" style="height:120px;"></div></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:80%;"></div><div class="skeleton skeleton-text short"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260809"></script>
  <script>
    async function loadWork() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/'; return; }
      initPage('works', id);

      try {
        await loadCategoriesFromAPI();
        const [work, circles, allEvents, allProjects] = await Promise.all([
          F7API.getWork(id),
          F7API.getCircles(),
          F7API.getEvents(),
          F7API.getProjects()
        ]);
        const workCircles = (work.circles || []).map(cid => circles.find(c => c.id === cid)).filter(Boolean);
        const relatedEvents = allEvents.filter(e => (e.relatedWorks || []).includes(work.id));
        const relatedProjects = allProjects.filter(p => (p.works || []).includes(work.id));
        document.title = `${work.title} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = work.title;
        document.querySelector('meta[property="og:description"]').content = (work.description || '').substring(0, 160);
        if (work.images && work.images[0]) document.querySelector('meta[property="og:image"]').content = work.images[0];

        // JSON-LD structured data
        const authorNames = workCircles.map(c => c.name).join(', ');
        const jsonLd = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          'name': work.title,
          'description': work.description || work.title,
          'image': work.images || [],
          'url': window.location.href,
          'brand': { '@type': 'Organization', 'name': authorNames },
          'offers': work.price ? { '@type': 'Offer', 'price': work.price, 'priceCurrency': 'CNY' } : undefined
        };
        let ldScript = document.getElementById('jsonLd');
        if (!ldScript) { ldScript = document.createElement('script'); ldScript.id = 'jsonLd'; ldScript.type = 'application/ld+json'; document.head.appendChild(ldScript); }
        ldScript.textContent = JSON.stringify(jsonLd);

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('workDetail');
        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/">${t('nav.works')}</a>
            <span>›</span>
            <span>${escapeHtml(work.title)}</span>
          </div>
          <div class="detail-header">
            <div style="display:flex;align-items:flex-start;gap:1rem;">
              <h1 style="flex:1;">${escapeHtml(work.title)}${isDeadlineSoon(work.endDate) ? ' <span class="deadline-badge" style="position:static;font-size:0.75rem;vertical-align:middle;">即将截止</span>' : ''}</h1>
              <div class="detail-header-actions" style="flex-shrink:0;padding-top:0.3rem;text-align:right;">
                <div>${renderLikeButton(work.id, work.likes)}</div>
                <div>${renderWantButton(work.id, work.wants)}</div>
                <div style="margin-top:0.3rem;">${renderShareButton(work.title, location.href)}</div>
              </div>
            </div>
            <div class="detail-meta">
              <span class="card-tag ${work.status}">${STATUS_LABELS[work.status] || work.status}</span>
              <span>${CATEGORIES[work.category] || work.category}</span>
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              <h3 style="margin-bottom:1rem;font-size:1.1rem;">${t('works.description')}</h3>
              <p style="line-height:1.8;color:var(--ink);">${nl2br(work.description)}</p>
              ${work.images && work.images.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">${t('works.gallery')}</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${work.images.map((img, i) => `<img src="${img}" alt="${escapeHtml(work.title)}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(work.images).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}
              ${work.moreImages && work.moreImages.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">${t('works.moreImages')}</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${work.moreImages.map((img, i) => `<img src="${img}" alt="${escapeHtml(work.title)}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(work.moreImages).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>${t('works.productInfo')}</h3>
                <div class="info-row">
                  <span class="info-label">${t('works.price')}</span>
                  <span class="info-value" style="color:var(--accent);font-weight:700;">${escapeHtml(work.price)}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('works.releaseDate')}</span>
                  <span class="info-value">${formatDate(work.releaseDate)}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('works.status')}</span>
                  <span class="info-value">${STATUS_LABELS[work.status] || work.status}</span>
                </div>
                ${work.isCommissioned && work.commissionedBy ? `
                <div class="info-row">
                  <span class="info-label">${t('works.commissionedBy')}</span>
                  <span class="info-value">${escapeHtml(work.commissionedBy)}</span>
                </div>
                ` : ''}
              </div>
              ${workCircles.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('works.author')}</h3>
                ${workCircles.map(c => `
                  <a href="/circle-detail.html?id=${c.id}" class="detail-link" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);">
                    ${c.logo
                      ? `<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${c.logo}" alt="${escapeHtml(c.name)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-alt));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">${escapeHtml(c.name.charAt(0))}</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(c.name)}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${work.socialLinks && Object.keys(work.socialLinks).filter(k => work.socialLinks[k] && !['contactLabel','websiteLabel'].includes(k)).length > 0 ? `
                <div class="sidebar-card">
                  <h3>${t('works.contactInfo')}</h3>
                  ${Object.entries(work.socialLinks).filter(([k, url]) => url && !['contactLabel','websiteLabel'].includes(k)).map(([key, url]) => {
                    const isUrl = url.startsWith('http');
                    const defaultLabel = key === 'qq' ? t('common.qqContact') : key === 'qqGroup' ? t('common.qqGroup') : key === 'website' ? t('common.visitWebsite') : key;
                    const label = key === 'website' ? (work.socialLinks.websiteLabel || defaultLabel) : (work.socialLinks.contactLabel || defaultLabel);
                    return isUrl
                      ? `<a href="${url}" target="_blank" class="detail-social-link" style="display:inline-block;padding:0.3rem 0.8rem;color:var(--accent);border-radius:100px;font-size:0.85rem;text-decoration:none;margin:0.2rem 0;">${escapeHtml(label)}</a>`
                      : `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem;">
                           <span style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(15,52,96,0.06);color:var(--accent-alt);border-radius:100px;font-weight:500;">${escapeHtml(label)}</span>
                           <span style="color:var(--accent);font-weight:500;">${escapeHtml(url)}</span>
                         </div>`;
                  }).join('')}
                </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('works.relatedEvents')}</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" class="detail-link" style="display:block;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);">
                    <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(e.title)}</div>
                    <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedProjects.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('works.relatedProjects')}</h3>
                ${relatedProjects.map(p => `
                  <a href="/project-detail.html?id=${p.id}" class="detail-link" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);">
                    ${p.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${p.coverImage}" alt="${escapeHtml(p.title)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-alt),var(--ink));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📋</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(p.title)}</div>
                      <span class="card-tag ${p.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${PROJECT_STATUS_LABELS[p.status] || p.status}</span>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              <div class="sidebar-card">
                <h3>${t('works.tags')}</h3>
                <div class="tag-list">
                  ${work.tags.map(tag => `<a href="/?tag=${encodeURIComponent(tag)}" class="tag" style="text-decoration:none;">${escapeHtml(tag)}</a>`).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('workDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    loadWork();
  </script>
</body>
</html>

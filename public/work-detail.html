<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="查看同人作品详情，包括图片、价格、作者信息等。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="/uploads/og-image.svg">

  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="workDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;">

          <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;"><div class="skeleton skeleton-pill"></div><div class="skeleton skeleton-pill" style="width:80px;"></div></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:90%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:70%;margin-bottom:1.5rem;"></div>
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;"><div class="skeleton skeleton-img" style="height:120px;"></div><div class="skeleton skeleton-img" style="height:120px;"></div><div class="skeleton skeleton-img" style="height:120px;"></div></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:80%;"></div><div class="skeleton skeleton-text short"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>
          </div>

      </div>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260911f"></script>
  <script>
    async function loadWork() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/'; return; }
      initPage('works', id);

      try {
        await loadCategoriesFromAPI();
        const [work, circles, allEvents, allProjects] = await Promise.all([
          F7API.getWork(id),
          F7API.getCircles(),
          F7API.getEvents(),
          F7API.getProjects()
        ]);
        const workCircles = (work.circles || []).map(cid => circles.find(c => c.id === cid)).filter(Boolean);
        const relatedEvents = allEvents.filter(e => (e.relatedWorks || []).includes(work.id));
        const relatedProjects = allProjects.filter(p => (p.works || []).includes(work.id));
        document.title = `${work.title} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = work.title;
        document.querySelector('meta[property="og:description"]').content = (work.description || '').substring(0, 160);
        if (work.images && work.images[0]) document.querySelector('meta[property="og:image"]').content = work.images[0];

        // JSON-LD structured data
        const authorNames = workCircles.map(c => c.name).join(', ');
        const jsonLd = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          'name': work.title,
          'description': work.description || work.title,
          'image': work.images || [],
          'url': window.location.href,
          'brand': { '@type': 'Organization', 'name': authorNames },
          'offers': work.price ? { '@type': 'Offer', 'price': work.price, 'priceCurrency': 'CNY' } : undefined
        };
        let ldScript = document.getElementById('jsonLd');
        if (!ldScript) { ldScript = document.createElement('script'); ldScript.id = 'jsonLd'; ldScript.type = 'application/ld+json'; document.head.appendChild(ldScript); }
        ldScript.textContent = JSON.stringify(jsonLd);

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('workDetail');
        const mainImg = (work.images && work.images[0]) || '';
        const galleryImages = (work.images || []).concat(work.moreImages || []);
        const authorLine = workCircles.map(c => escapeHtml(c.name)).filter(Boolean).join(' · ');
        const catLabel = CATEGORIES[work.category] || '';
        container.innerHTML = `
          <div class="exhibit-stage">
            <div class="exhibit-crumb">
              <a href="/">← ${t('nav.works')}</a>
              <span> › </span>
              <span>${escapeHtml(work.title)}</span>
            </div>
            <div class="exhibit-grid">
              <div class="exhibit-frame">
                <div class="exhibit-art" id="detailMainImg" onclick="${galleryImages.length ? `openLightbox(${JSON.stringify(galleryImages).replace(/"/g, '&quot;')}, 0)` : ''}">
                  ${mainImg
                    ? `<img src="${mainImg}" alt="${escapeHtml(work.title)}" id="detailMainImgEl">`
                    : '<span class="placeholder-icon">🎨</span>'}
                </div>
                ${galleryImages.length > 1 ? `
                  <div class="exhibit-thumbs" id="detailThumbs">
                    ${galleryImages.map((img, i) => `<img src="${img}" class="${i === 0 ? 'on' : ''}" alt="" data-idx="${i}" onclick="switchDetailImage(${i})">`).join('')}
                  </div>
                ` : ''}
              </div>
              <div class="exhibit-plaque">
                <div class="exhibit-status">${STATUS_LABELS[work.status] || ''}</div>
                <h1 class="exhibit-title">${escapeHtml(work.title)}${isDeadlineSoon(work.endDate) ? ' <span class="deadline-badge" style="position:static;font-size:0.7rem;vertical-align:middle;">即将截止</span>' : ''}</h1>
                <div class="exhibit-subtitle">${authorLine}${catLabel ? (authorLine ? ' · ' : '') + escapeHtml(catLabel) : ''}</div>
                <div class="exhibit-rule"></div>
                <div class="exhibit-meta">
                  <div class="info-row">
                    <span class="info-label">${t('works.price')}</span>
                    <span class="info-value" style="color:var(--accent);font-weight:700;">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || '无料'))}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">${t('works.releaseDate')}</span>
                    <span class="info-value">${formatDate(work.releaseDate)}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">${t('common.category')}</span>
                    <span class="info-value">${catLabel}</span>
                  </div>
                  ${workCircles.length > 0 ? `
                  <div class="info-row">
                    <span class="info-label">${t('works.author')}</span>
                    <span class="info-value">${workCircles.map(c => `<a href="/circle-detail.html?id=${c.id}" class="detail-link" style="color:var(--ink);text-decoration:none;">${escapeHtml(c.name)}</a>`).join('、')}</span>
                  </div>
                  ` : ''}
                  ${work.isCommissioned && work.commissionedBy ? `
                  <div class="info-row">
                    <span class="info-label">${t('works.commissionedBy')}</span>
                    <span class="info-value">${escapeHtml(work.commissionedBy)}</span>
                  </div>
                  ` : ''}
                </div>
                ${work.description ? `<div class="exhibit-desc">${nl2br(work.description)}</div>` : ''}
                <div class="exhibit-actions">
                  ${renderWantButton(work.id, work.wants)}
                  <span class="act-sep" aria-hidden="true"></span>
                  ${renderLikeButton(work.id, work.likes)}
                  ${renderShareButton(work.title, location.href)}
                </div>
              </div>
            </div>
            <div class="exhibit-caption">f7goods · ${escapeHtml(work.title)}</div>
          </div>
          <div class="exhibit-side">
            ${work.socialLinks && Object.keys(work.socialLinks).filter(k => work.socialLinks[k] && !['contactLabel','websiteLabel'].includes(k)).length > 0 ? `
              <div class="detail-info-card">
                <h3 style="font-size:0.95rem;font-weight:700;margin:0 0 0.75rem;">${t('works.contactInfo')}</h3>
                ${Object.entries(work.socialLinks).filter(([k, url]) => url && !['contactLabel','websiteLabel'].includes(k)).map(([key, url]) => {
                  const isUrl = url.startsWith('http');
                  const defaultLabel = key === 'qq' ? t('common.qqContact') : key === 'qqGroup' ? t('common.qqGroup') : key === 'website' ? t('common.visitWebsite') : key;
                  const label = key === 'website' ? (work.socialLinks.websiteLabel || defaultLabel) : (work.socialLinks.contactLabel || defaultLabel);
                  return isUrl
                    ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="detail-social-link" style="display:inline-block;padding:0.3rem 0.8rem;color:var(--accent);border-radius:100px;font-size:0.85rem;text-decoration:none;margin:0.2rem 0;">${escapeHtml(label)}</a>`
                    : `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem;flex-wrap:wrap;">
                         <span style="display:inline-block;padding:0.3rem 0.8rem;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:100px;font-weight:500;">${escapeHtml(label)}</span>
                         <span style="color:var(--accent);font-weight:500;">${escapeHtml(url)}</span>
                       </div>`;
                }).join('')}
              </div>
            ` : ''}
            ${relatedEvents.length > 0 ? `
            <div class="detail-info-card">
              <h3 style="font-size:0.95rem;font-weight:700;margin:0 0 0.5rem;">${t('works.relatedEvents')}</h3>
              ${relatedEvents.map(e => `
                <a href="/event-detail.html?id=${e.id}" class="detail-link" style="display:block;padding:0.55rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);">
                  <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(e.title)}</div>
                  <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</div>
                </a>
              `).join('')}
            </div>
            ` : ''}
            ${relatedProjects.length > 0 ? `
            <div class="detail-info-card">
              <h3 style="font-size:0.95rem;font-weight:700;margin:0 0 0.5rem;">${t('works.relatedProjects')}</h3>
              ${relatedProjects.map(p => `
                <a href="/project-detail.html?id=${p.id}" class="detail-link" style="display:flex;align-items:center;gap:0.75rem;padding:0.55rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);">
                  <div>
                    <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(p.title)}</div>
                    <span class="card-tag ${p.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${PROJECT_STATUS_LABELS[p.status] || ''}</span>
                  </div>
                </a>
              `).join('')}
            </div>
            ` : ''}
            ${work.tags && work.tags.length ? `
            <div class="detail-info-card">
              <h3 style="font-size:0.95rem;font-weight:700;margin:0 0 0.5rem;">${t('works.tags')}</h3>
              <div class="tag-list">
                ${work.tags.map(tag => `<a href="/?q=${encodeURIComponent(tag)}" class="tag" style="text-decoration:none;">${escapeHtml(tag)}</a>`).join('')}
              </div>
            </div>
            ` : ''}
          </div>
          <div class="exhibit-sharebar">
            <button type="button" class="exhibit-share-btn" id="shareImageBtn" onclick="shareWorkImage()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17.5l5-4.5 3.5 3 3-2.5 4.5 4"/></svg>
              ${t('works.shareImage')}
            </button>
          </div>
        `;
        window._detailGallery = galleryImages;
        window._workDetail = { work, workCircles, catLabel, authorLine };
        window.switchDetailImage = function(i) {
          const imgs = window._detailGallery || [];
          if (!imgs[i]) return;
          const el = document.getElementById('detailMainImgEl');
          const wrap = document.getElementById('detailMainImg');
          if (el) { el.src = imgs[i]; }
          else if (wrap) {
            wrap.innerHTML = '<img src="' + imgs[i] + '" alt="" id="detailMainImgEl">';
          }
          document.querySelectorAll('#detailThumbs img').forEach((t, idx) => t.classList.toggle('on', idx === i));
          if (wrap) wrap.onclick = function() { openLightbox(imgs, i); };
        };
      } catch (e) {
        document.getElementById('workDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    // ===== 分享图片：把大卡片导出为 PNG（不含路径与 想要/喜爱/分享 按钮） =====
    const SHARE_W = 1000;
    const SHARE_SCALE = 2;
    const SHARE_SANS = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
    const SHARE_SERIF = '"Noto Serif SC", Georgia, serif';
    const TITLE_TRACK = '-0.6px';   // 对应页面 .exhibit-title 的 -0.02em（30px）
    let shareBusy = false;

    function shareRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 按宽度折行：CJK 逐字断行，拉丁词整体不拆开
    function shareWrapText(ctx, text, maxW) {
      const lines = [];
      String(text == null ? '' : text).split('\n').forEach(raw => {
        const para = raw.replace(/\s+$/, '');
        if (!para) { lines.push(''); return; }
        const tokens = para.match(/[A-Za-z0-9@._%+\-/:]+|\s+|[^\s]/g) || [];
        let line = '';
        tokens.forEach(tok => {
          const next = line + tok;
          if (line && ctx.measureText(next).width > maxW) {
            lines.push(line.replace(/\s+$/, ''));
            line = /^\s+$/.test(tok) ? '' : tok;
          } else {
            line = next;
          }
        });
        lines.push(line.replace(/\s+$/, ''));
      });
      return lines;
    }

    function shareLoadImg(src) {
      return new Promise(resolve => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function drawWorkSharePng() {
      const data = window._workDetail;
      if (!data) return null;
      const { work, workCircles, catLabel, authorLine } = data;
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) {}
      }

      const PAD = 28, GAP = 28, FRAME_PAD_X = 14, FRAME_PAD_TOP = 14, FRAME_PAD_BOTTOM = 16;
      const innerW = SHARE_W - PAD * 2;
      const frameW = Math.round((innerW - GAP) * 1.15 / 2);
      const plaqueW = innerW - GAP - frameW;
      const artW = frameW - FRAME_PAD_X * 2;
      const artH = Math.min(artW, 420);
      const frameH = artH + FRAME_PAD_TOP + FRAME_PAD_BOTTOM + 2;

      const TITLE_LH = 38, SUB_LH = 20, META_LH = 24, DESC_LH = 26;

      const m = document.createElement('canvas').getContext('2d');
      const statusText = (typeof STATUS_LABELS !== 'undefined' && STATUS_LABELS[work.status]) || '';
      // 标题按页面 .exhibit-title 的 letter-spacing 收紧，量宽时一并计入
      m.letterSpacing = TITLE_TRACK;
      m.font = `600 30px ${SHARE_SERIF}`;
      const titleLines = shareWrapText(m, work.title || '', plaqueW);
      m.letterSpacing = '0px';
      const subText = `${authorLine}${catLabel ? (authorLine ? ' · ' : '') + catLabel : ''}`;
      m.font = `13px ${SHARE_SANS}`;
      const subLines = shareWrapText(m, subText, plaqueW);
      const metaRows = [
        [t('works.price'), typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || '无料')],
        [t('works.releaseDate'), formatDate(work.releaseDate)],
        [t('common.category'), catLabel],
        workCircles.length ? [t('works.author'), workCircles.map(c => c.name).join('、')] : null,
        (work.isCommissioned && work.commissionedBy) ? [t('works.commissionedBy'), work.commissionedBy] : null
      ].filter(r => r && String(r[1] || '').trim());
      m.font = `14px ${SHARE_SANS}`;
      const descLines = work.description ? shareWrapText(m, work.description, plaqueW - 14) : [];

      // 版面：先算坐标，绘制时复用同一套数值
      const L = {};
      let cy = 0;
      if (statusText) { L.statusY = cy; cy += 22; }
      L.titleY = cy; cy += titleLines.length * TITLE_LH + 6;
      L.subY = cy; cy += subLines.length * SUB_LH + 4;
      cy += 16; L.ruleY = cy; cy += 17;
      L.metaY = cy; cy += metaRows.length * META_LH + 16;
      if (descLines.length) { L.descY = cy; cy += descLines.length * DESC_LH; }
      const plaqueH = cy;

      const bodyH = Math.max(frameH, plaqueH);
      const cardY = 22;
      const cardH = PAD + bodyH + 22 + 14 + 16 + 24;
      const H = cardY + cardH + 22;

      const canvas = document.createElement('canvas');
      canvas.width = SHARE_W * SHARE_SCALE;
      canvas.height = H * SHARE_SCALE;
      const ctx = canvas.getContext('2d');
      ctx.scale(SHARE_SCALE, SHARE_SCALE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 背景
      ctx.fillStyle = '#E8E2D6';
      ctx.fillRect(0, 0, SHARE_W, H);

      // 大卡片
      shareRoundRect(ctx, 0, cardY, SHARE_W, cardH, 18);
      ctx.fillStyle = '#F6F2EB';
      ctx.fill();
      ctx.save();
      shareRoundRect(ctx, 0, cardY, SHARE_W, cardH, 18);
      ctx.clip();
      const glow = ctx.createLinearGradient(0, cardY, 0, cardY + 220);
      glow.addColorStop(0, 'rgba(217,79,92,0.06)');
      glow.addColorStop(1, 'rgba(217,79,92,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, cardY, SHARE_W, 220);
      ctx.restore();
      shareRoundRect(ctx, 0.5, cardY + 0.5, SHARE_W - 1, cardH - 1, 18);
      ctx.strokeStyle = '#E5DDD1';
      ctx.lineWidth = 1;
      ctx.stroke();

      const left = PAD, top = cardY + PAD;

      // 作品图
      shareRoundRect(ctx, left, top, frameW, frameH, 4);
      ctx.fillStyle = '#FFFCF7';
      ctx.fill();
      ctx.strokeStyle = '#E5DDD1';
      ctx.stroke();
      const artX = left + FRAME_PAD_X, artY = top + FRAME_PAD_TOP;
      ctx.save();
      ctx.beginPath();
      ctx.rect(artX, artY, artW, artH);
      ctx.clip();
      // 与页面 .exhibit-art img 的底色一致，避免透明图留白处颜色不同
      ctx.fillStyle = '#1a1816';
      ctx.fillRect(artX, artY, artW, artH);
      const img = await shareLoadImg((work.images || [])[0] || '');
      if (img && img.width) {
        const ratio = Math.min(artW / img.width, artH / img.height);
        const dw = img.width * ratio, dh = img.height * ratio;
        ctx.drawImage(img, artX + (artW - dw) / 2, artY + (artH - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = '#8A8078';
        ctx.font = `14px ${SHARE_SANS}`;
        ctx.textAlign = 'center';
        ctx.fillText('暂无图片', artX + artW / 2, artY + artH / 2);
      }
      ctx.restore();

      // 铭牌
      const px = left + frameW + GAP;
      ctx.textAlign = 'left';
      if (statusText) {
        const base = top + L.statusY + 12;
        ctx.font = `11px ${SHARE_SANS}`;
        ctx.fillStyle = '#D94F5C';
        ctx.fillRect(px, base - 4, 18, 1);
        ctx.save();
        ctx.letterSpacing = '1.5px';
        ctx.fillText(statusText, px + 26, base);
        ctx.restore();
      }
      ctx.fillStyle = '#22201E';
      ctx.font = `600 30px ${SHARE_SERIF}`;
      ctx.save();
      ctx.letterSpacing = TITLE_TRACK;
      titleLines.forEach((line, i) => ctx.fillText(line, px, top + L.titleY + i * TITLE_LH + 26));
      ctx.restore();
      ctx.fillStyle = '#8A8078';
      ctx.font = `13px ${SHARE_SANS}`;
      subLines.forEach((line, i) => ctx.fillText(line, px, top + L.subY + i * SUB_LH + 15));
      ctx.fillStyle = '#E5DDD1';
      ctx.fillRect(px, top + L.ruleY, plaqueW, 1);
      metaRows.forEach(([label, value], i) => {
        const base = top + L.metaY + i * META_LH + 16;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#8A8078';
        ctx.font = `14px ${SHARE_SANS}`;
        ctx.fillText(label, px, base);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#22201E';
        ctx.font = `500 14px ${SHARE_SANS}`;
        let v = String(value);
        while (v.length > 1 && ctx.measureText(v).width > plaqueW - 96) v = v.slice(0, -1);
        ctx.fillText(v, px + plaqueW, base);
        ctx.textAlign = 'left';
      });
      if (descLines.length) {
        const dy = top + L.descY;
        ctx.fillStyle = '#E5DDD1';
        ctx.fillRect(px, dy + 2, 2, descLines.length * DESC_LH - 8);
        ctx.fillStyle = '#4A453F';
        ctx.font = `14px ${SHARE_SANS}`;
        descLines.forEach((line, i) => ctx.fillText(line, px + 14, dy + i * DESC_LH + 19));
      }

      // 底部水印
      const capTop = cardY + PAD + bodyH + 22;
      ctx.fillStyle = '#E5DDD1';
      ctx.fillRect(left, capTop, innerW, 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8A8078';
      ctx.font = `11px ${SHARE_SANS}`;
      ctx.save();
      ctx.letterSpacing = '0.66px';
      ctx.fillText(`f7goods.com · ${work.title || ''}`, SHARE_W / 2, capTop + 25);
      ctx.restore();

      return canvas;
    }

    async function shareWorkImage() {
      if (shareBusy || !window._workDetail) return;
      shareBusy = true;
      const btn = document.getElementById('shareImageBtn');
      if (btn) btn.disabled = true;
      try {
        const canvas = await drawWorkSharePng();
        if (!canvas) throw new Error('draw failed');
        canvas.toBlob(blob => {
          if (!blob) { showToast(t('works.shareImageFailed'), 'error'); return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${String(window._workDetail.work.title || 'work').replace(/[\\/:*?"<>|]/g, '_')}-分享.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
          showToast(t('works.shareImageDone'));
        }, 'image/png');
      } catch (e) {
        console.error(e);
        showToast(t('works.shareImageFailed'), 'error');
      } finally {
        shareBusy = false;
        if (btn) btn.disabled = false;
      }
    }

    loadWork();
  </script>
</body>
</html>

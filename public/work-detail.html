            <div class="skeleton skeleton-text" style="width:90%;margin-bottom:0.6rem;"></div>

            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;"><div class="skeleton skeleton-img" style="height:120px;"></div><div class="skeleton skeleton-img" style="height:120px;"></div><div class="skeleton skeleton-img" style="height:120px;"></div></div>
          </div>

            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>

  <script src="/js/api.js?v=20261020bu"></script>

  <script src="/js/main.js?v=20261020bu"></script>
  <script>
    async function loadWork() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/'; return; }
      initPage('works', id);
      // Detail pages are rendered once; reload keeps labels and meta in the selected language.
      if (typeof onLangChange === 'function') onLangChange(() => location.reload());

      try {
        await loadCategoriesFromAPI();
        const [work, circles, allEvents, allProjects] = await Promise.all([
          F7API.getWork(id),
          F7API.getCircles(),
          F7API.getEvents(),
          F7API.getProjects()
        ]);
        const workCircles = (work.circles || []).map(cid => circles.find(c => c.id === cid)).filter(Boolean);
        const relatedEvents = allEvents.filter(e => (e.relatedWorks || []).includes(work.id));
        const relatedProjects = allProjects.filter(p => (p.works || []).includes(work.id));
        let authorWorks = [];
        if (workCircles[0]) {
          try { authorWorks = await F7API.getWorks({ circleId: workCircles[0].id }); } catch (e) { authorWorks = []; }
        }
        const otherWorks = authorWorks.filter(w => w.id !== work.id).slice(0, 4);
        const primaryEvent = relatedEvents[0] || null;
        const socialEntries = Object.entries(work.socialLinks || {}).filter(([k, v]) => v && !['contactLabel', 'websiteLabel'].includes(k));
        const firstSocial = socialEntries[0] || null;
        const contactEntry = firstSocial ? {
          value: firstSocial[1],
          isUrl: String(firstSocial[1]).startsWith('http'),
          label: firstSocial[0] === 'website' ? (work.socialLinks.websiteLabel || '官网') : (work.socialLinks.contactLabel || (firstSocial[0] === 'qq' ? 'QQ' : firstSocial[0]))
        } : null;
        document.title = `${workTitle(work)} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = workTitle(work);
        document.querySelector('meta[property="og:description"]').content = (work.description || '').substring(0, 160);
        if (work.images && work.images[0]) document.querySelector('meta[property="og:image"]').content = new URL(work.images[0], location.origin).href;

        // JSON-LD structured data (reuse the server-rendered block when present)
        const authorNames = workCircles.map(c => c.name).join(', ');
        const priceNum = parseFloat(String(work.price || '').replace(/[^\d.]/g, ''));
        const jsonLd = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          'name': workTitle(work),
          'description': work.description || workTitle(work),
          'image': (work.images || []).map(u => new URL(u, location.origin).href),
          'url': window.location.href,
          'brand': { '@type': 'Organization', 'name': 'f7goods' },
          ...(Number.isFinite(priceNum) && priceNum > 0 ? { 'offers': { '@type': 'Offer', 'price': priceNum, 'priceCurrency': 'CNY' } } : {})
        };
        let ldScript = document.querySelector('script[type="application/ld+json"]');
        if (!ldScript) { ldScript = document.createElement('script'); ldScript.type = 'application/ld+json'; document.head.appendChild(ldScript); }
        ldScript.textContent = JSON.stringify(jsonLd);

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('workDetail');
        const mainImg = (work.images && work.images[0]) || '';
        const galleryImages = (work.images || []).concat(work.moreImages || []);
        const authorLine = workCircles.map(c => escapeHtml(c.name)).filter(Boolean).join(' · ');
        const catLabel = CATEGORIES[work.category] || '';
        container.innerHTML = `
          <div class="wd-page">
            <div class="wd-crumb">
              <a href="/">${t('nav.works')}</a><span>›</span><span>${escapeHtml(workTitle(work))}</span>
            </div>

            <div class="wd-product">
              <div class="wd-gallery">
                <div class="wd-stage" id="detailMainImg" ${galleryImages.length ? `tabindex="0" role="button" aria-label="${escapeHtml(t('common.openImage'))}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"` : ''} onclick="${galleryImages.length ? `openLightbox(${JSON.stringify(galleryImages).replace(/"/g, '&quot;')}, window._detailIndex || 0)` : ''}">
                  ${mainImg
                    ? `<img src="${escapeHtml(imgUrl(mainImg, 1200))}" alt="${escapeHtml(workTitle(work))}" id="detailMainImgEl">`
                    : '<span class="placeholder-icon">🎨</span>'}
                  ${galleryImages.length ? `<span class="wd-count" id="detailImageCount">1 / ${galleryImages.length}</span>` : ''}
                  ${galleryImages.length ? `<button type="button" class="wd-zoom" aria-label="${escapeHtml(t('common.openImage'))}" onclick="event.stopPropagation();openLightbox(${JSON.stringify(galleryImages).replace(/"/g, '&quot;')}, window._detailIndex || 0)">⤢</button>` : ''}
                </div>
                ${galleryImages.length > 1 ? `
                  <div class="wd-thumbs" id="detailThumbs">
                    ${galleryImages.map((img, i) => `<button type="button" class="wd-thumb${i === 0 ? ' on' : ''}" data-idx="${i}" onclick="switchDetailImage(${i})"><img src="${escapeHtml(imgUrl(img, 240))}" alt="" loading="lazy"></button>`).join('')}
                  </div>
                ` : ''}
                <button type="button" class="wd-shareimg" id="shareImageBtn" onclick="shareWorkImage()">生成作品分享图</button>
              </div>

              <aside class="wd-info">
                <div class="wd-statusline"><span class="wd-dash"></span><span>${escapeHtml(STATUS_LABELS[work.status] || '')}</span></div>
                <div class="wd-title-row">
                  <h1>${escapeHtml(workTitle(work))}</h1>
                  ${isDeadlineSoon(work.endDate) ? `<span class="deadline-badge" style="position:static;font-size:0.7rem;vertical-align:middle;">${t('common.deadlineSoon')}</span>` : ''}
                </div>
                <div class="wd-author">
                  ${workCircles[0]?.logo ? `<img src="${escapeHtml(imgUrl(workCircles[0].logo, 80))}" alt="">` : ''}
                  <span>${workCircles.length ? `作者 ${workCircles.map(c => `<a href="/circle-detail.html?id=${c.id}">${escapeHtml(c.name)}</a>`).join('、')}` : ''}${catLabel ? `${workCircles.length ? ' · ' : ''}${escapeHtml(catLabel)}` : ''}</span>
                </div>

                <div class="wd-price-row">
                  <div class="wd-price">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || '无料'))}<small>PRICE</small></div>
                </div>

                <div class="wd-actions">
                  ${renderWantButton(work.id, work.wants)}
                  ${renderLikeButton(work.id, work.likes)}
                  ${renderShareButton(workTitle(work), location.href)}
                </div>

                <div class="wd-meta">
                  <div class="wd-meta-row"><span>${t('works.releaseDate')}</span><b>${formatDate(work.releaseDate)}</b></div>
                  <div class="wd-meta-row"><span>${t('common.category')}</span><b>${escapeHtml(catLabel)}</b></div>
                  ${primaryEvent ? `<div class="wd-meta-row"><span>参与活动</span><b><a href="/event-detail.html?id=${encodeURIComponent(primaryEvent.id)}">${escapeHtml(primaryEvent.title)}</a></b></div>` : ''}
                  ${contactEntry ? `<div class="wd-meta-row"><span>联系方式</span><b>${contactEntry.isUrl ? `<a href="${escapeHtml(contactEntry.value)}" target="_blank" rel="noopener noreferrer">${escapeHtml(contactEntry.label)}</a>` : escapeHtml(contactEntry.value)}</b></div>` : ''}
                  ${work.createdAt ? `<div class="wd-meta-row"><span>更新时间</span><b>${formatDate(work.createdAt)}</b></div>` : ''}
                </div>

                ${work.isCommissioned ? `<div class="wd-commission">约稿作品</div>` : ''}
              </aside>
            </div>

            <div class="wd-content-grid">
              <div class="wd-main">
                ${otherWorks.length ? `
                <section class="wd-section">
                  <div class="wd-section-head">
                    <div><h2>同作者作品</h2></div>
                    ${workCircles[0] ? `<a href="/circle-detail.html?id=${encodeURIComponent(workCircles[0].id)}">查看全部 →</a>` : ''}
                  </div>
                  <div class="wd-related">
                    ${otherWorks.map(w => `<a class="wd-rel" href="/work-detail.html?id=${encodeURIComponent(w.id)}">
                      <div class="wd-rel-img">${w.images?.[0] ? `<img src="${escapeHtml(imgUrl(w.images[0], 360))}" alt="${escapeHtml(workTitle(w))}" loading="lazy">` : '<span>作品</span>'}</div>
                      <b>${escapeHtml(workTitle(w))}</b>
                      <span>${escapeHtml(STATUS_LABELS[w.status] || '')}</span>
                    </a>`).join('')}
                  </div>
                </section>` : ''}
              </div>

              <aside class="wd-side">
                ${relatedEvents.length ? `<div class="wd-aside-card">
                  <h3>${t('works.relatedEvents')}</h3>
                  ${relatedEvents.slice(0, 3).map(e => `<a class="wd-event" href="/event-detail.html?id=${encodeURIComponent(e.id)}">
                    ${e.coverImage ? `<img src="${escapeHtml(imgUrl(e.coverImage, 160))}" alt="" loading="lazy">` : ''}
                    <div><b>${escapeHtml(e.title)}</b><span>${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</span></div>
                  </a>`).join('')}
                </div>` : ''}
                ${relatedProjects.length ? `<div class="wd-aside-card">
                  <h3>${t('works.relatedProjects')}</h3>
                  ${relatedProjects.slice(0, 3).map(p => `<a class="wd-event" href="/project-detail.html?id=${encodeURIComponent(p.id)}">
                    ${p.coverImage ? `<img src="${escapeHtml(imgUrl(p.coverImage, 160))}" alt="" loading="lazy">` : ''}
                    <div><b>${escapeHtml(p.title)}</b><span>${escapeHtml(PROJECT_STATUS_LABELS[p.status] || '')}</span></div>
                  </a>`).join('')}
                </div>` : ''}
              </aside>
            </div>

            <div class="wd-mobile-bar">
              <div class="wd-mobile-price">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || '无料'))}</div>
              ${renderLikeButton(work.id, work.likes)}
              ${renderWantButton(work.id, work.wants)}
            </div>
          </div>
        `;
        window._detailGallery = galleryImages;
        window._workDetail = { work, workCircles, catLabel, authorLine };
        window.switchDetailImage = function(i) {
          const imgs = window._detailGallery || [];
          if (!imgs[i]) return;
          const el = document.getElementById('detailMainImgEl');
          const wrap = document.getElementById('detailMainImg');
          if (el) { el.src = imgs[i]; }
          else if (wrap) {
            wrap.innerHTML = '<img src="' + imgs[i] + '" alt="" id="detailMainImgEl">';
          }
          document.querySelectorAll('#detailThumbs img').forEach((t, idx) => t.classList.toggle('on', idx === i));
          if (wrap) wrap.onclick = function() { openLightbox(imgs, i); };
        };
      } catch (e) {
        document.getElementById('workDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    // ===== 分享图片：把大卡片导出为 PNG（不含路径与 想要/喜爱/分享 按钮） =====
    const SHARE_W = 1000;
    const SHARE_SCALE = 2;
    const SHARE_SANS = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
    const SHARE_SERIF = '"Noto Serif SC", Georgia, serif';
    const TITLE_TRACK = '-0.6px';   // 对应页面 .exhibit-title 的 -0.02em（30px）
    let shareBusy = false;

    function shareRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 按宽度折行：CJK 逐字断行，拉丁词整体不拆开
    function shareWrapText(ctx, text, maxW) {
      const lines = [];
      String(text == null ? '' : text).split('\n').forEach(raw => {
        const para = raw.replace(/\s+$/, '');
        if (!para) { lines.push(''); return; }
        const tokens = para.match(/[A-Za-z0-9@._%+\-/:]+|\s+|[^\s]/g) || [];
        let line = '';
        tokens.forEach(tok => {
          const next = line + tok;
          if (line && ctx.measureText(next).width > maxW) {
            lines.push(line.replace(/\s+$/, ''));
            line = /^\s+$/.test(tok) ? '' : tok;
          } else {
            line = next;
          }
        });
        lines.push(line.replace(/\s+$/, ''));
      });
      return lines;
    }

    function shareLoadImg(src) {
      return new Promise(resolve => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function drawWorkSharePng() {
      const data = window._workDetail;
      if (!data) return null;
      const { work, workCircles, catLabel, authorLine } = data;
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) {}
      }

      const PAD = 28, GAP = 28, FRAME_PAD_X = 14, FRAME_PAD_TOP = 14, FRAME_PAD_BOTTOM = 16;
      const innerW = SHARE_W - PAD * 2;
      const frameW = Math.round((innerW - GAP) * 1.15 / 2);
      const plaqueW = innerW - GAP - frameW;
      const artW = frameW - FRAME_PAD_X * 2;
      const artH = Math.min(artW, 420);
      const frameH = artH + FRAME_PAD_TOP + FRAME_PAD_BOTTOM + 2;

      const TITLE_LH = 38, SUB_LH = 20, META_LH = 24, DESC_LH = 26;

      const m = document.createElement('canvas').getContext('2d');
      const statusText = (typeof STATUS_LABELS !== 'undefined' && STATUS_LABELS[work.status]) || '';
      // 标题按页面 .exhibit-title 的 letter-spacing 收紧，量宽时一并计入
      m.letterSpacing = TITLE_TRACK;
      m.font = `600 30px ${SHARE_SERIF}`;
      const titleLines = shareWrapText(m, work.title || '', plaqueW);
      m.letterSpacing = '0px';
      const subText = `${authorLine}${catLabel ? (authorLine ? ' · ' : '') + catLabel : ''}`;
      m.font = `13px ${SHARE_SANS}`;
      const subLines = shareWrapText(m, subText, plaqueW);
      const metaRows = [
        [t('works.price'), typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || '无料')],
        [t('works.releaseDate'), formatDate(work.releaseDate)],
        [t('common.category'), catLabel],
        workCircles.length ? [t('works.author'), workCircles.map(c => c.name).join('、')] : null,
        (work.isCommissioned && work.commissionedBy) ? [t('works.commissionedBy'), work.commissionedBy] : null
      ].filter(r => r && String(r[1] || '').trim());
      m.font = `14px ${SHARE_SANS}`;
      const descLines = work.description ? shareWrapText(m, work.description, plaqueW - 14) : [];

      // 版面：先算坐标，绘制时复用同一套数值
      const L = {};
      let cy = 0;
      if (statusText) { L.statusY = cy; cy += 22; }
      L.titleY = cy; cy += titleLines.length * TITLE_LH + 6;
      L.subY = cy; cy += subLines.length * SUB_LH + 4;
      cy += 16; L.ruleY = cy; cy += 17;
      L.metaY = cy; cy += metaRows.length * META_LH + 16;
      if (descLines.length) { L.descY = cy; cy += descLines.length * DESC_LH; }
      const plaqueH = cy;

      const bodyH = Math.max(frameH, plaqueH);
      const cardY = 22;
      const cardH = PAD + bodyH + 22 + 14 + 16 + 24;
      const H = cardY + cardH + 22;

      const canvas = document.createElement('canvas');
      canvas.width = SHARE_W * SHARE_SCALE;
      canvas.height = H * SHARE_SCALE;
      const ctx = canvas.getContext('2d');
      ctx.scale(SHARE_SCALE, SHARE_SCALE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 背景
      ctx.fillStyle = '#E8E2D6';
      ctx.fillRect(0, 0, SHARE_W, H);

      // 大卡片
      shareRoundRect(ctx, 0, cardY, SHARE_W, cardH, 18);
      ctx.fillStyle = '#F6F2EB';
      ctx.fill();
      ctx.save();
      shareRoundRect(ctx, 0, cardY, SHARE_W, cardH, 18);
      ctx.clip();
      const glow = ctx.createLinearGradient(0, cardY, 0, cardY + 220);
      glow.addColorStop(0, 'rgba(217,79,92,0.06)');
      glow.addColorStop(1, 'rgba(217,79,92,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, cardY, SHARE_W, 220);
      ctx.restore();
      shareRoundRect(ctx, 0.5, cardY + 0.5, SHARE_W - 1, cardH - 1, 18);
      ctx.strokeStyle = '#E5DDD1';
      ctx.lineWidth = 1;
      ctx.stroke();

      const left = PAD, top = cardY + PAD;

      // 作品图
      shareRoundRect(ctx, left, top, frameW, frameH, 4);
      ctx.fillStyle = '#FFFCF7';
      ctx.fill();
      ctx.strokeStyle = '#E5DDD1';
      ctx.stroke();
      const artX = left + FRAME_PAD_X, artY = top + FRAME_PAD_TOP;
      ctx.save();
      ctx.beginPath();
      ctx.rect(artX, artY, artW, artH);
      ctx.clip();
      // 与页面 .exhibit-art img 的底色一致，避免透明图留白处颜色不同
      ctx.fillStyle = '#1a1816';
      ctx.fillRect(artX, artY, artW, artH);
      const img = await shareLoadImg((work.images || [])[0] || '');
      if (img && img.width) {
        const ratio = Math.min(artW / img.width, artH / img.height);
        const dw = img.width * ratio, dh = img.height * ratio;
        ctx.drawImage(img, artX + (artW - dw) / 2, artY + (artH - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = '#8A8078';
        ctx.font = `14px ${SHARE_SANS}`;
        ctx.textAlign = 'center';
        ctx.fillText('暂无图片', artX + artW / 2, artY + artH / 2);
      }
      ctx.restore();

      // 铭牌
      const px = left + frameW + GAP;
      ctx.textAlign = 'left';
      if (statusText) {
        const base = top + L.statusY + 12;
        ctx.font = `11px ${SHARE_SANS}`;
        ctx.fillStyle = '#D94F5C';
        ctx.fillRect(px, base - 4, 18, 1);
        ctx.save();
        ctx.letterSpacing = '1.5px';
        ctx.fillText(statusText, px + 26, base);
        ctx.restore();
      }
      ctx.fillStyle = '#22201E';
      ctx.font = `600 30px ${SHARE_SERIF}`;
      ctx.save();
      ctx.letterSpacing = TITLE_TRACK;
      titleLines.forEach((line, i) => ctx.fillText(line, px, top + L.titleY + i * TITLE_LH + 26));
      ctx.restore();
      ctx.fillStyle = '#8A8078';
      ctx.font = `13px ${SHARE_SANS}`;
      subLines.forEach((line, i) => ctx.fillText(line, px, top + L.subY + i * SUB_LH + 15));
      ctx.fillStyle = '#E5DDD1';
      ctx.fillRect(px, top + L.ruleY, plaqueW, 1);
      metaRows.forEach(([label, value], i) => {
        const base = top + L.metaY + i * META_LH + 16;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#8A8078';
        ctx.font = `14px ${SHARE_SANS}`;
        ctx.fillText(label, px, base);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#22201E';
        ctx.font = `500 14px ${SHARE_SANS}`;
        let v = String(value);
        while (v.length > 1 && ctx.measureText(v).width > plaqueW - 96) v = v.slice(0, -1);
        ctx.fillText(v, px + plaqueW, base);
        ctx.textAlign = 'left';
      });
      if (descLines.length) {
        const dy = top + L.descY;
        ctx.fillStyle = '#E5DDD1';
        ctx.fillRect(px, dy + 2, 2, descLines.length * DESC_LH - 8);
        ctx.fillStyle = '#4A453F';
        ctx.font = `14px ${SHARE_SANS}`;
        descLines.forEach((line, i) => ctx.fillText(line, px + 14, dy + i * DESC_LH + 19));
      }

      // 底部水印
      const capTop = cardY + PAD + bodyH + 22;
      ctx.fillStyle = '#E5DDD1';
      ctx.fillRect(left, capTop, innerW, 1);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8A8078';
      ctx.font = `11px ${SHARE_SANS}`;
      ctx.save();
      ctx.letterSpacing = '0.66px';
      ctx.fillText(`f7goods.com · ${work.title || ''}`, SHARE_W / 2, capTop + 25);
      ctx.restore();

      return canvas;
    }

    async function shareWorkImage() {
      if (shareBusy || !window._workDetail) return;
      shareBusy = true;
      const btn = document.getElementById('shareImageBtn');
      if (btn) btn.disabled = true;
      try {
        const canvas = await drawWorkSharePng();
        if (!canvas) throw new Error('draw failed');
        canvas.toBlob(blob => {
          if (!blob) { showToast(t('works.shareImageFailed'), 'error'); return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `${String(window._workDetail.work.title || 'work').replace(/[\\/:*?"<>|]/g, '_')}-分享.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
          showToast(t('works.shareImageDone'));
        }, 'image/png');
      } catch (e) {
        console.error(e);
        showToast(t('works.shareImageFailed'), 'error');
      } finally {
        shareBusy = false;
        if (btn) btn.disabled = false;
      }
    }

    loadWork();
  </script>
</body>
</html>

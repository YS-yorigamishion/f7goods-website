<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 企划详情</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="projectDetail">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('projects');

    async function loadProject() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/projects.html'; return; }

      try {
        await loadCategoriesFromAPI();
        const [project, allCircles, allEvents, allWorks] = await Promise.all([
          F7API.getProject(id),
          F7API.getCircles(),
          F7API.getEvents(),
          F7API.getWorks()
        ]);

        const relatedCircles = allCircles.filter(c => (project.circles || []).includes(c.id));
        const relatedEvents = allEvents.filter(e => (project.events || []).includes(e.id));
        const relatedWorks = allWorks.filter(w => (project.works || []).includes(w.id));

        document.title = `${project.title} — f7goods`;

        const container = document.getElementById('projectDetail');
        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/projects.html">同人企划</a>
            <span>›</span>
            <span>${project.title}</span>
          </div>
          <div class="detail-header">
            ${project.coverImage ? `<img src="${project.coverImage}" alt="${project.title}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:1rem;">` : ''}
            <h1>${project.title}</h1>
            <div class="detail-meta">
              <span class="card-tag ${project.status}">${PROJECT_STATUS_LABELS[project.status] || project.status}</span>
              <span>${PROJECT_CATEGORIES[project.category] || project.category}</span>
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              <h3 style="margin-bottom:1rem;font-size:1.1rem;">企划简介</h3>
              <p style="line-height:1.8;color:#444;">${nl2br(project.description)}</p>

              ${project.images && project.images.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">企划图片</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${project.images.map((img, i) => `<img src="${img}" alt="${project.title}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(project.images).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}

              ${project.contactInfo ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">参与方式</h3>
                <p style="line-height:1.8;color:#444;">${nl2br(project.contactInfo)}</p>
              ` : ''}

              ${relatedWorks.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">关联作品 (${relatedWorks.length})</h3>
                <div class="cards-grid">
                  ${relatedWorks.map(work => `
                    <div class="card" onclick="location.href='/work-detail.html?id=${work.id}'">
                      <div class="card-image">
                        ${work.images && work.images.length > 0
                          ? `<img src="${work.images[0]}" alt="${work.title}">`
                          : '<span class="placeholder-icon">🎨</span>'}
                      </div>
                      <div class="card-body">
                        <span class="card-tag ${work.status}">${STATUS_LABELS[work.status] || work.status}</span>
                        <h3 class="card-title" style="font-size:0.95rem;">${work.title}</h3>
                        <p class="card-price" style="color:var(--accent);font-weight:700;margin-top:0.5rem;">${work.price}</p>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>企划信息</h3>
                <div class="info-row">
                  <span class="info-label">状态</span>
                  <span class="info-value">${PROJECT_STATUS_LABELS[project.status] || project.status}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">分类</span>
                  <span class="info-value">${PROJECT_CATEGORIES[project.category] || project.category}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">开始日期</span>
                  <span class="info-value">${formatDate(project.startDate)}</span>
                </div>
                ${project.endDate ? `
                  <div class="info-row">
                    <span class="info-label">结束日期</span>
                    <span class="info-value">${formatDate(project.endDate)}</span>
                  </div>
                ` : ''}
              </div>
              ${project.socialLinks && Object.keys(project.socialLinks).filter(k => project.socialLinks[k] && !['contactLabel','websiteLabel'].includes(k)).length > 0 ? `
              <div class="sidebar-card">
                <h3>联系方式</h3>
                ${Object.entries(project.socialLinks).filter(([k, url]) => url && !['contactLabel','websiteLabel'].includes(k)).map(([key, url]) => {
                  const isUrl = url.startsWith('http');
                  const defaultLabel = key === 'qq' ? 'QQ联系' : key === 'qqGroup' ? 'QQ群' : key === 'website' ? '访问网站' : key;
                  const label = key === 'website' ? (project.socialLinks.websiteLabel || defaultLabel) : (project.socialLinks.contactLabel || defaultLabel);
                  return isUrl
                    ? `<a href="${url}" target="_blank" style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(233,69,96,0.06);color:var(--accent);border-radius:100px;font-size:0.85rem;text-decoration:none;margin:0.2rem 0;transition:var(--transition);"
                         onmouseover="this.style.background='rgba(233,69,96,0.12)'" onmouseout="this.style.background='rgba(233,69,96,0.06)'">${label}</a>`
                    : `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem;">
                         <span style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(15,52,96,0.06);color:var(--accent-alt);border-radius:100px;font-weight:500;">${label}</span>
                         <span style="color:var(--accent);font-weight:500;">${url}</span>
                       </div>`;
                }).join('')}
              </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>关联活动</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${e.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${e.coverImage}" alt="${e.title}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-alt));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📅</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${e.title}</div>
                      <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + e.location : ''}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedCircles.length > 0 ? `
              <div class="sidebar-card">
                <h3>关联作者</h3>
                ${relatedCircles.map(c => `
                  <a href="/circle-detail.html?id=${c.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${c.logo
                      ? `<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${c.logo}" alt="${c.name}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-alt));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">${c.name.charAt(0)}</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${c.name}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${project.tags && project.tags.length > 0 ? `
              <div class="sidebar-card">
                <h3>标签</h3>
                <div class="tag-list">
                  ${project.tags.map(t => `<a href="/?tag=${encodeURIComponent(t)}" class="tag" style="text-decoration:none;">${t}</a>`).join('')}
                </div>
              </div>
              ` : ''}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('projectDetail').innerHTML =
          '<div class="empty-state"><div class="icon">!</div><p>企划未找到或加载失败</p></div>';
      }
    }

    loadProject();
  </script>
</body>
</html>

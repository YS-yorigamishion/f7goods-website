<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 企划详情</title>
  <meta name="description" content="查看同人企划详情，包括状态、参与者、相关作品等。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20261020da">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="projectDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;">
          <div class="skeleton skeleton-cover" style="margin-bottom:1rem;"></div>
          <div class="skeleton skeleton-text" style="width:50%;height:28px;margin-bottom:0.8rem;"></div>
          <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;"><div class="skeleton skeleton-pill"></div><div class="skeleton skeleton-pill" style="width:80px;"></div></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:90%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:65%;margin-bottom:1.5rem;"></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:80%;"></div><div class="skeleton skeleton-text short"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js?v=20261020da"></script>
  <script src="/js/i18n.js?v=20261020da"></script>
  <script src="/js/main.js?v=20261020da"></script>
  <script>
    async function loadProject() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/projects.html'; return; }
      initPage('projects', id);
      // Detail pages are rendered once; reload keeps labels and meta in the selected language.
      if (typeof onLangChange === 'function') onLangChange(() => location.reload());

      try {
        await loadCategoriesFromAPI();
        const [project, allCircles, allEvents, allWorks, allUpdates, projectSeries] = await Promise.all([
          F7API.getProject(id),
          F7API.getCircles(),
          F7API.getEvents(),
          F7API.getWorks(),
          fetch('/api/updates').then(r => r.json()),
          fetch('/api/series?projectId=' + encodeURIComponent(id)).then(r => r.json()).catch(() => [])
        ]);

        const relatedCircles = allCircles.filter(c => (project.circles || []).includes(c.id));
        const relatedEvents = allEvents.filter(e => (project.events || []).includes(e.id));
        const relatedWorks = allWorks.filter(w => (project.works || []).includes(w.id));
        const allRelatedUpdates = (allUpdates || [])
          .filter(u => (u.relatedProjects || []).includes(project.id))
          .sort((a, b) => String(b.publishDate || '').localeCompare(String(a.publishDate || '')));
        const relatedUpdates = allRelatedUpdates.slice(0, 3);

        document.title = `${project.title} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = project.title;
        document.querySelector('meta[property="og:description"]').content = (project.description || '').substring(0, 160);
        if (project.coverImage) document.querySelector('meta[property="og:image"]').content = new URL(project.coverImage, location.origin).href;

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('projectDetail');
        const cover = project.coverImage || '';
        const statusLabel = project.status ? (PROJECT_STATUS_LABELS[project.status] || '') : '';
        const catLabel = PROJECT_CATEGORIES[project.category] || '';
        const dateText = project.startDate
          ? formatDate(project.startDate) + (project.endDate && project.endDate !== project.startDate ? ' ~ ' + formatDate(project.endDate) : '')
          : '';
        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/projects.html">${t('nav.projects')}</a>
            <span>›</span>
            <span>${escapeHtml(project.title)}</span>
          </div>
          <div class="ev-hero ${cover ? 'has-cover' : ''}" ${cover ? `style="background-image:url('${escapeHtml(imgUrl(cover, 1600))}');background-size:cover;background-position:center;"` : ''}>
            <div class="ev-hero-shade"></div>
            <div class="ev-hero-body">
              <div class="ev-hero-row">
                ${statusLabel ? `<span class="ev-chip">${escapeHtml(statusLabel)}</span>` : ''}
                ${catLabel ? `<span class="ev-chip">${escapeHtml(catLabel)}</span>` : ''}
                <span class="ev-hero-share">${renderShareButton(project.title, location.href)}</span>
              </div>
              <h1>${escapeHtml(project.title)}</h1>
              ${dateText ? `<div class="ev-hero-meta"><span>📅 ${dateText}</span></div>` : ''}
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              ${project.recruiting ? (() => {
                const jobs = (project.recruitJobs || []).filter(j => j && j.title);
                const chips = jobs.map(j =>
                  `<span style="display:inline-block;font-size:0.72rem;border:1px solid rgba(217,79,92,.35);background:rgba(217,79,92,.06);border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;white-space:nowrap;"><b style="color:var(--accent);font-weight:700;">${escapeHtml(j.title)}</b>${(j.count || 1) > 1 ? ' ×' + j.count : ''}</span>`
                ).join('');
                return `
                <div style="margin-bottom:1.25rem;border:1px solid rgba(217,79,92,.25);background:rgba(217,79,92,.04);border-radius:12px;padding:0.85rem 1rem;">
                  <div style="font-size:0.95rem;font-weight:700;color:var(--accent);margin-bottom:0.5rem;">招人中</div>
                  ${chips ? `<div>${chips}</div>` : '<div style="font-size:0.8rem;color:var(--haze);margin-bottom:0.25rem;">欢迎报名</div>'}
                  ${project.recruitNote ? `<p style="margin:0.55rem 0 0;font-size:0.85rem;line-height:1.6;color:var(--ink);">${nl2br(project.recruitNote)}</p>` : ''}
                </div>`;
              })() : ''}

              ${(projectSeries || []).length > 0 ? `
                <h3 style="margin:0 0 1rem;font-size:1.1rem;">系列周边 (${projectSeries.length})</h3>
                <div class="project-series-grid">
                  ${projectSeries.map(s => {
                    const owner = allCircles.find(c => c.id === s.circleId);
                    const cover = s.cover || (s.works?.[0]?.images && s.works[0].images[0]) || '';
                    return `<div class="project-series-card" role="link" tabindex="0" onclick="location.href='/series-detail.html?id=${encodeURIComponent(s.id)}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.href='/series-detail.html?id=${encodeURIComponent(s.id)}'}">
                      <div class="project-series-cover">${cover ? `<img src="${escapeHtml(imgUrl(cover, 320))}" alt="${escapeHtml(s.name)}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='系列'">` : '<span>系列</span>'}</div>
                      <div class="project-series-body">
                        <div class="project-series-title"><a href="/series-detail.html?id=${encodeURIComponent(s.id)}" onclick="event.stopPropagation()"><b>${escapeHtml(s.name)}</b></a><small>${escapeHtml(PROJECT_STATUS_LABELS[project.status] || '进行中')} · ${s.works.length} 件</small></div>
                        ${owner ? `<a class="project-series-author" href="/circle-detail.html?id=${encodeURIComponent(owner.id)}" onclick="event.stopPropagation()">${escapeHtml(owner.name)}</a>` : ''}
                        ${s.startDate || s.endDate ? `<div class="project-series-dates">${s.startDate ? formatDate(s.startDate) : '待定'} → ${s.endDate ? formatDate(s.endDate) : '待定'}</div>` : ''}
                        <div class="project-series-thumbs">${s.works.slice(0, 4).map(w => `<a href="/work-detail.html?id=${encodeURIComponent(w.id)}" title="${escapeHtml(workTitle(w))}" onclick="event.stopPropagation()">${w.images?.[0] ? `<img src="${escapeHtml(imgUrl(w.images[0], 96))}" alt="" loading="lazy">` : ''}</a>`).join('')}</div>
                      </div>
                    </div>`;
                  }).join('')}
                </div>
              ` : ''}

              <h3 style="margin-bottom:1rem;font-size:1.1rem;">${t('projects.description')}</h3>
              <p style="line-height:1.8;color:var(--ink);">${nl2br(project.description)}</p>

              ${project.images && project.images.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">${t('projects.projectImages')}</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${project.images.map((img, i) => `<img src="${escapeHtml(imgUrl(img, 800))}" alt="${escapeHtml(project.title)}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(project.images).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}

              ${project.contactInfo ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">${t('projects.contactMethod')}</h3>
                <p style="line-height:1.8;color:var(--ink);">${nl2br(project.contactInfo)}</p>
              ` : ''}

              ${relatedUpdates.length ? `
              <section class="rel-upd-section">
                <div class="rel-upd-head">
                  <div class="rel-upd-title"><h3>企划动态 <span>UPDATES</span><b>${allRelatedUpdates.length} 条</b></h3><p>企划组与参与作者的最新消息</p></div>
                  ${allRelatedUpdates.length > 3 ? `<a class="rel-upd-more" href="/updates.html?project=${encodeURIComponent(project.id)}&name=${encodeURIComponent(project.title)}">查看全部 →</a>` : ''}
                </div>
                <div class="rel-upd-grid">
                  ${relatedUpdates.map(u => {
                    const cover = u.coverImage || (u.images && u.images[0]) || '';
                    const names = (u.relatedCircles || []).map(cid => allCircles.find(c => c.id === cid)?.name).filter(Boolean);
                    const catLabel = (typeof UPDATE_CATEGORIES !== 'undefined' && UPDATE_CATEGORIES[u.category]) || '动态';
                    const excerpt = String(u.content || '').replace(/\s+/g, ' ').trim();
                    return `<a class="rel-upd-card" href="/update-detail.html?id=${encodeURIComponent(u.id)}">
                      <div class="rel-upd-cover">${cover ? `<img src="${escapeHtml(imgUrl(cover, 360))}" alt="${escapeHtml(u.title)}" loading="lazy">` : `<span>${escapeHtml((u.title || '?').charAt(0))}</span>`}<span class="rel-upd-tag">${escapeHtml(catLabel)}</span></div>
                      <div class="rel-upd-body">
                        <div class="rel-upd-meta">${formatDate(u.publishDate)}${names.length ? ' · ' + escapeHtml(names[0]) : ''}</div>
                        <h4>${escapeHtml(u.title)}</h4>
                        <p>${escapeHtml(excerpt)}</p>
                        <div class="rel-upd-foot"><span>${names.length ? '参与作者动态' : '动态'}</span><span class="go">阅读 →</span></div>
                      </div>
                    </a>`;
                  }).join('')}
                </div>
                <p class="rel-upd-note">仅展示关联到本企划的同人动态 · 按发布时间倒序</p>
              </section>
              ` : ''}

              ${relatedWorks.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">${t('projects.relatedWorks')} (${relatedWorks.length})</h3>
                <div class="cards-grid">
                  ${relatedWorks.map(work => `
                    <a class="card" href="/work-detail.html?id=${work.id}" style="text-decoration:none;color:inherit;">
                      <div class="card-image">
                        ${work.images && work.images.length > 0
                          ? `<img src="${escapeHtml(imgUrl(work.images[0], 320))}" alt="${escapeHtml(workTitle(work))}">`
                          : '<span class="placeholder-icon">🎨</span>'}
                      </div>
                      <div class="card-body">
                        <span class="card-tag ${work.status}">${STATUS_LABELS[work.status] || ''}</span>
                        <h3 class="card-title" style="font-size:0.95rem;">${escapeHtml(workTitle(work))}</h3>
                        <p class="card-price" style="color:var(--accent);font-weight:700;margin-top:0.5rem;">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || ''))}</p>
                      </div>
                    </a>
                  `).join('')}
                </div>
              ` : ''}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>${t('projects.projectInfo')}</h3>
                <div class="info-row">
                  <span class="info-label">${t('works.status')}</span>
                  <span class="info-value">${PROJECT_STATUS_LABELS[project.status] || '-'}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('common.category')}</span>
                  <span class="info-value">${PROJECT_CATEGORIES[project.category] || '-'}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('projects.startDate')}</span>
                  <span class="info-value">${formatDate(project.startDate)}</span>
                </div>
                ${project.endDate ? `
                  <div class="info-row">
                    <span class="info-label">${t('projects.endDate')}</span>
                    <span class="info-value">${formatDate(project.endDate)}</span>
                  </div>
                ` : ''}
              </div>
              ${project.socialLinks && Object.keys(project.socialLinks).filter(k => project.socialLinks[k] && !['contactLabel','websiteLabel'].includes(k)).length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('works.contactInfo')}</h3>
                ${Object.entries(project.socialLinks).filter(([k, url]) => url && !['contactLabel','websiteLabel'].includes(k)).map(([key, url]) => {
                  const isUrl = url.startsWith('http');
                  const defaultLabel = key === 'qq' ? t('common.qqContact') : key === 'qqGroup' ? t('common.qqGroup') : key === 'website' ? t('common.visitWebsite') : key;
                  const label = key === 'website' ? (project.socialLinks.websiteLabel || defaultLabel) : (project.socialLinks.contactLabel || defaultLabel);
                  return isUrl
                    ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(233,69,96,0.06);color:var(--accent);border-radius:100px;font-size:0.85rem;text-decoration:none;margin:0.2rem 0;transition:var(--transition);"
                         onmouseover="this.style.background='rgba(233,69,96,0.12)'" onmouseout="this.style.background='rgba(233,69,96,0.06)'">${escapeHtml(label)}</a>`
                    : `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem;">
                         <span style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(15,52,96,0.06);color:var(--accent-alt);border-radius:100px;font-weight:500;">${escapeHtml(label)}</span>
                         <span style="color:var(--accent);font-weight:500;">${escapeHtml(url)}</span>
                       </div>`;
                }).join('')}
              </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('projects.relatedEvents')}</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${e.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${escapeHtml(imgUrl(e.coverImage, 96))}" alt="${escapeHtml(e.title)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📅</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(e.title)}</div>
                      <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedCircles.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('projects.relatedAuthors')}</h3>
                ${relatedCircles.map(c => `
                  <a href="/circle-detail.html?id=${c.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${c.logo
                      ? `<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${escapeHtml(imgUrl(c.logo, 96))}" alt="${escapeHtml(c.name)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">${escapeHtml(c.name.charAt(0))}</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(c.name)}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${(() => {
                const allTags = [...new Set([
                  ...(project.tags || []),
                  ...relatedWorks.flatMap(w => w.tags || [])
                ])];
                return allTags.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('works.tags')}</h3>
                <div class="tag-list">
                  ${allTags.map(t => `<a href="/?tag=${encodeURIComponent(t)}" class="tag" style="text-decoration:none;">${escapeHtml(t)}</a>`).join('')}
                </div>
              </div>` : '';
              })()}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('projectDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    loadProject();
  </script>
</body>
</html>

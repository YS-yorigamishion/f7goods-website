<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 作者详情</title>
  <meta name="description" content="查看同人作者详情，包括作品列表、活动、联系方式等。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20261027h">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="circleDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;display:flex;align-items:center;gap:1rem;">
          <div class="skeleton skeleton-avatar"></div>
          <div><div class="skeleton skeleton-text" style="width:200px;height:28px;margin-bottom:0.5rem;"></div><div class="skeleton skeleton-pill"></div></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:80%;margin-bottom:1.5rem;"></div>
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton-grid"><div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div><div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div><div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:70%;"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div><div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:50%;margin:0;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js?v=20261027h"></script>
  <script src="/js/i18n.js?v=20261027h"></script>
  <script src="/js/main.js?v=20261027h"></script>
  <script>
    let circleWorksData = [];
    let cwCategory = 'all';
    let cwSearchText = '';

    function renderCircleWorks() {
      let filtered = circleWorksData.slice();
      if (cwCategory !== 'all') {
        filtered = filtered.filter(w => w.category === cwCategory);
      }
      if (cwSearchText) {
        const q = cwSearchText.toLowerCase();
        filtered = filtered.filter(w =>
          w.title.toLowerCase().includes(q) ||
          (w.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }

      const sortVal = document.getElementById('circleSortSelect')?.value || 'default';
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => (a.releaseDate || 'z').localeCompare(b.releaseDate || 'z'));
      } else if (sortVal === 'date-desc') {
        filtered.sort((a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || ''));
      } else if (sortVal === 'likes-desc') {
        filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (sortVal === 'likes-asc') {
        filtered.sort((a, b) => (a.likes || 0) - (b.likes || 0));
      } else if (sortVal === 'wants-desc') {
        filtered.sort((a, b) => (b.wants || 0) - (a.wants || 0));
      } else if (sortVal === 'wants-asc') {
        filtered.sort((a, b) => (a.wants || 0) - (b.wants || 0));
      } else {
        // 最新上传（默认）
        filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      }

      const grid = document.getElementById('circleWorksGrid');
      const count = document.getElementById('circleWorksCount');
      if (count) count.textContent = `(${filtered.length})`;
      if (!grid) return;
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="padding:2rem 0;"><p>${t('common.noResults')}</p></div>`;
        return;
      }
      grid.innerHTML = filtered.map(work => `
        <a class="card" href="/work-detail.html?id=${work.id}" style="text-decoration:none;color:inherit;">
          <div class="card-image" style="height:160px;">
            ${work.images && work.images.length > 0
              ? `<img src="${escapeHtml(imgUrl(work.images[0], 320))}" alt="${escapeHtml(workTitle(work))}">`
              : '<span class="placeholder-icon">🎨</span>'}
          </div>
          <div class="card-body" style="padding:0.8rem;">
            <span class="card-tag ${work.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;">${STATUS_LABELS[work.status] || ''}</span>
            <h3 class="card-title" style="font-size:0.9rem;margin-top:0.3rem;">${escapeHtml(workTitle(work))}</h3>
          </div>
          <div class="card-footer" style="padding:0.5rem 0.8rem;">
            <span class="card-price" style="color:var(--accent);font-weight:700;font-size:0.9rem;">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || ''))}</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              ${(work.wants || 0) > 0 ? `<span style="font-size:0.72rem;color:var(--info);">${t('common.wants')} ${work.wants}</span>` : ''}
              ${renderLikeButton(work.id, work.likes)}
            </div>
          </div>
        </a>
      `).join('');
    }

    async function loadCircle() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/circles.html'; return; }
      initPage('circles', id);
      // Detail pages are rendered once; reload keeps labels and meta in the selected language.
      if (typeof onLangChange === 'function') onLangChange(() => location.reload());
      if (typeof mountAuthorCreateFab === 'function') mountAuthorCreateFab({ label: '我的资料', tab: 'profile' });

      try {
        await loadCategoriesFromAPI();
        const [circle, circleWorks, relatedEvents, allProjects, allUpdates, authorSeries] = await Promise.all([
          F7API.getCircle(id),
          F7API.getWorks({ circleId: id }),
          F7API.getEvents({ circleId: id }),
          F7API.getProjects(),
          fetch('/api/updates').then(r => r.json()),
          fetch('/api/series?circleId=' + encodeURIComponent(id)).then(r => r.json()).catch(() => [])
        ]);
        circleWorksData = circleWorks || [];
        const circleWorkIds = circleWorksData.map(w => w.id);
        const relatedProjects = (allProjects || []).filter(p => (p.circles || []).includes(circle.id));
        const relatedUpdates = (allUpdates || []).filter(u => (u.relatedCircles || []).includes(circle.id));

        document.title = `${circle.name} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = circle.name;
        document.querySelector('meta[property="og:description"]').content = (circle.description || '').substring(0, 160);
        if (circle.cardCover || circle.logo) document.querySelector('meta[property="og:image"]').content = new URL(circle.cardCover || circle.logo, location.origin).href;

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('circleDetail');
        const gallery = Array.isArray(circle.images) ? circle.images.filter(Boolean) : [];
        // Hero cover: author-chosen card cover, then a work image, then avatar.
        const coverWork = circleWorks.find(w => w.images && w.images[0]);
        const cover = circle.cardCover || (circle.images && circle.images[0]) || (coverWork && coverWork.images[0]) || circle.logo || '';
        const coverIsAvatar = !circle.cardCover && !(circle.images && circle.images.length) && !coverWork && !!circle.logo;
        const totalLikes = circleWorks.reduce((s, w) => s + (w.likes || 0), 0);
        const totalWants = circleWorks.reduce((s, w) => s + (w.wants || 0), 0);
        const follows = circle.follows || 0;
        const catLabel = circle.category ? (CIRCLE_CATEGORIES[circle.category] || '') : '';
        const platforms = (Array.isArray(circle.platforms) ? circle.platforms : []).filter(Boolean).slice(0, 6);
        const commissionOpen = circle.commissionStatus === 'open';
        container.innerHTML = `
          <div class="cp-page">
          <div class="detail-breadcrumb cp-breadcrumb">
            <a href="/circles.html">${t('nav.circles')}</a>
            <span>›</span>
            <span>${escapeHtml(circle.name)}</span>
          </div>
          <section class="cp-profile">
            <div class="cp-cover ${coverIsAvatar ? 'is-avatar' : ''}">
              ${cover ? `<img src="${escapeHtml(imgUrl(cover, 1200))}" alt="${escapeHtml(circle.name)}" loading="eager">` : ''}
            </div>
            <div class="cp-body">
              <div class="cp-identity">
                <div class="cp-avatar">
                  ${circle.logo
                    ? `<img src="${escapeHtml(imgUrl(circle.logo, 200))}" alt="${escapeHtml(circle.name)}">`
                    : escapeHtml(circle.name.charAt(0))}
                </div>
                <div class="cp-who">
                  <h1>${escapeHtml(circle.name)}</h1>
                  <div class="cp-badges">
                    ${catLabel ? `<span class="cp-badge cat">${escapeHtml(catLabel)}</span>` : ''}
                  </div>
                  ${circle.description ? `<p class="cp-bio">${nl2br(circle.description)}</p>` : ''}
                  <div class="cp-quick">
                    ${platforms.map(p => `<span class="cp-quick-item">${escapeHtml(p)}</span>`).join('')}
                    <span class="cp-commission ${commissionOpen ? 'is-open' : 'is-closed'}">${commissionOpen ? '接稿中' : '暂不接稿'}</span>
                  </div>
                </div>
                <div class="cp-actions">
                  ${typeof renderFollowButton === 'function' ? renderFollowButton(circle.id, follows) : ''}
                  ${typeof renderShareButton === 'function' ? renderShareButton(circle.name, location.href) : ''}
                </div>
              </div>
              <div class="cp-stats">
                <div class="cp-stat"><b>${circleWorks.length}</b><span>作品</span></div>
                <div class="cp-stat"><b>${totalLikes}</b><span>喜爱</span></div>
                <div class="cp-stat"><b>${authorSeries.length}</b><span>作品系列</span></div>
                <div class="cp-stat"><b>${relatedProjects.length}</b><span>参与企划</span></div>
              </div>
              <div id="circleTabsMount" class="cp-tabs-mount"></div>
            </div>
          </section>
          <div id="circlePanelsMount"></div>
          </div>
          <div class="detail-content" style="display:none;">
            <div class="detail-main">
              ${gallery.length > 1 ? `
                <h3 style="margin:0 0 0.75rem;font-size:1.05rem;">作者图</h3>
                <div class="cl-gallery">
                  ${gallery.map((img, i) => `<button type="button" onclick="openLightbox(${JSON.stringify(gallery).replace(/"/g, '&quot;')}, ${i})" aria-label="${escapeHtml(circle.name)} ${i + 1}"><img src="${escapeHtml(img)}" alt="" loading="lazy"></button>`).join('')}
                </div>
              ` : ''}

              ${circleWorks.length > 0 ? (() => {
                const usedCats = [...new Set(circleWorks.map(w => w.category).filter(Boolean))];
                const catBtns = CATEGORIES_ORDERED.filter(c => usedCats.includes(c.id));
                return `
                <h3 style="margin:0 0 0.85rem;font-size:1.05rem;">${t('circles.worksList')} <span id="circleWorksCount" style="font-size:0.78rem;color:var(--muted);font-weight:500;">(${circleWorks.length})</span></h3>
                <div style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;margin-bottom:1rem;">
                  <button class="filter-btn active" onclick="cwCategory='all';this.parentElement.querySelectorAll('.filter-btn[data-cat]').forEach(b=>b.classList.remove('active'));this.classList.add('active');renderCircleWorks();">${t('common.all')}</button>
                  ${catBtns.map(c => `<button class="filter-btn" data-cat="${c.id}" onclick="cwCategory='${c.id}';this.parentElement.querySelectorAll('.filter-btn[data-cat]').forEach(b=>b.classList.remove('active'));this.classList.add('active');renderCircleWorks();">${tCat(c)}</button>`).join('')}
                  <select id="circleSortSelect" class="form-input" style="margin-left:auto;padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;" onchange="renderCircleWorks();">
                    <option value="default" selected>最新上传</option>
                    <option value="date-asc" data-i18n="common.sortDateAsc">${t('common.sortDateAsc')}</option>
                    <option value="date-desc" data-i18n="common.sortDateDesc">${t('common.sortDateDesc')}</option>
                    <option value="likes-desc" data-i18n="common.sortLikesDesc">${t('common.sortLikesDesc')}</option>
                    <option value="likes-asc" data-i18n="common.sortLikesAsc">${t('common.sortLikesAsc')}</option>
                    <option value="wants-desc" data-i18n="common.sortWantsDesc">${t('common.sortWantsDesc')}</option>
                    <option value="wants-asc" data-i18n="common.sortWantsAsc">${t('common.sortWantsAsc')}</option>
                  </select>
                  <input type="text" class="search-input" placeholder="${t('common.searchWorks')}" style="max-width:200px;" oninput="cwSearchText=this.value;renderCircleWorks();">
                </div>
                <div class="cards-grid related-works-grid" id="circleWorksGrid"></div>
                `;
              })() : `<p style="color:var(--haze);">${t('common.noWorks')}</p>`}
            </div>
            <div class="detail-sidebar">
              ${relatedUpdates.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('circles.relatedUpdates')}</h3>
                ${relatedUpdates.map(u => `
                  <a href="/update-detail.html?id=${u.id}" style="display:block;padding:0.5rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(u.title)}</div>
                    <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(u.publishDate)}</div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${circle.socialLinks && Object.keys(circle.socialLinks).filter(k => circle.socialLinks[k] && !['contactLabel','websiteLabel'].includes(k)).length > 0 ? `
                <div class="sidebar-card">
                  <h3>${t('circles.contactInfo')}</h3>
                  ${Object.entries(circle.socialLinks).filter(([k, url]) => url && !['contactLabel','websiteLabel'].includes(k)).map(([key, url]) => {
                    const isUrl = url.startsWith('http');
                    const socialNameMap = {
                      qq: 'QQ',
                      qqGroup: 'QQ 群',
                      wechat: '微信',
                      weibo: '微博',
                      bilibili: 'B站',
                      website: '官网',
                      custom: '链接'
                    };
                    const defaultLabel = socialNameMap[key] || key;
                    const label = key === 'website' ? (circle.socialLinks.websiteLabel || defaultLabel) : (circle.socialLinks.contactLabel || defaultLabel);
                    return isUrl
                      ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(233,69,96,0.06);color:var(--accent);border-radius:100px;font-size:0.85rem;text-decoration:none;margin:0.2rem 0;transition:var(--transition);"
                           onmouseover="this.style.background='rgba(233,69,96,0.12)'" onmouseout="this.style.background='rgba(233,69,96,0.06)'">${escapeHtml(label)}</a>`
                      : `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem;">
                           <span style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(15,52,96,0.06);color:var(--accent-alt);border-radius:100px;font-weight:500;">${escapeHtml(label)}</span>
                           <span style="color:var(--accent);font-weight:500;">${escapeHtml(url)}</span>
                         </div>`;
                  }).join('')}
                </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('circles.relatedEvents')}</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${e.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${escapeHtml(imgUrl(e.coverImage, 96))}" alt="${escapeHtml(e.title)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📅</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(e.title)}</div>
                      ${EVENT_STATUS_LABELS[e.status] ? `<span class="card-tag ${e.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${EVENT_STATUS_LABELS[e.status]}</span>` : ''}
                      <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedProjects.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('circles.relatedProjects')}</h3>
                ${relatedProjects.map(p => `
                  <a href="/project-detail.html?id=${p.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${p.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${escapeHtml(imgUrl(p.coverImage, 96))}" alt="${escapeHtml(p.title)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-alt),var(--ink));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📋</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(p.title)}</div>
                      <span class="card-tag ${p.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${PROJECT_STATUS_LABELS[p.status] || ''}</span>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
            </div>
          </div>
          </div>
        `;
        renderCircleWorks();
        setupCircleTabs(container, circle, circleWorks, relatedEvents, relatedProjects, relatedUpdates, authorSeries);
        if (typeof applyTranslations === 'function') applyTranslations();
      } catch (e) {
        document.getElementById('circleDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    function setupCircleTabs(container, circle, works, events, projects, updates = [], series = []) {
      const detail = container.querySelector('.detail-content');
      if (!detail) return;
      const main = detail.querySelector('.detail-main');
      const side = detail.querySelector('.detail-sidebar');
      detail.remove();

      // Keep contact/updates in the home tab; events/projects get their own tab.
      if (side) {
        [...side.querySelectorAll('.sidebar-card')].forEach(card => {
          const h = card.querySelector('h3')?.textContent || '';
          if (h.includes('活动') || h.includes('企划') || h.includes('动态')) card.remove();
        });
      }

      const bar = document.createElement('div');
      bar.className = 'cp-tabs';
      bar.setAttribute('role', 'tablist');
      const tabs = [
        ['home', '主页', null],
        ['works', '作品', works.length],
        ['events', '活动', events.length],
        ['projects', '企划', projects.length],
        ['updates', '动态', updates.length]
      ];
      bar.innerHTML = tabs.map(([key, label, count], i) =>
        `<button type="button" role="tab" data-cl-tab="${key}" aria-selected="${i === 0}" aria-controls="cl-panel-${key}" class="${i === 0 ? 'on' : ''}">${label}${count ? ` <b>${count}</b>` : ''}</button>`
      ).join('');
      const tabsMount = container.querySelector('#circleTabsMount');
      if (tabsMount) tabsMount.appendChild(bar);

      const panels = {};
      const home = document.createElement('div');
      home.id = 'cl-panel-home';
      home.className = 'cl-tab-panel on';
      home.setAttribute('role', 'tabpanel');
      const preferred = Array.isArray(circle.featuredWorkIds)
        ? circle.featuredWorkIds.map(id => works.find(w => String(w.id) === String(id))).filter(Boolean)
        : [];
      const preferredSet = new Set(preferred.map(w => w.id));
      const defaultLiked = works.slice().sort((a, b) => (b.likes || 0) - (a.likes || 0));
      const featuredWorks = preferred.length
        ? [...preferred, ...defaultLiked.filter(w => !preferredSet.has(w.id))].slice(0, 3)
        : defaultLiked.slice(0, 3);
      const featuredHtml = featuredWorks.map((w, i) => `
        <a class="cp-work${i === 0 ? ' big' : ''}" href="/work-detail.html?id=${encodeURIComponent(w.id)}">
          ${w.images && w.images.length ? `<img src="${escapeHtml(imgUrl(w.images[0], 640))}" alt="${escapeHtml(workTitle(w))}" loading="lazy">` : '<span class="cp-work-placeholder">作品</span>'}
          ${i === 0 ? '<span class="cp-work-tag">作者推荐</span>' : ''}
          <div class="cp-work-info"><b>${escapeHtml(workTitle(w))}</b><span>${escapeHtml(STATUS_LABELS[w.status] || '')}</span></div>
        </a>`).join('');
      const seriesList = (Array.isArray(series) ? series : []).filter(s => s.works && s.works.length);
      const featuredSeriesIds = Array.isArray(circle.featuredSeriesIds) ? circle.featuredSeriesIds.map(String) : [];
      const displayedSeries = featuredSeriesIds.length
        ? featuredSeriesIds.map(id => seriesList.find(s => String(s.id) === id)).filter(Boolean)
        : seriesList;
      const seriesHtml = displayedSeries.map(s => {
        const cover = s.cover || (s.works[0]?.images && s.works[0].images[0]) || '';
        return `<a class="cp-series-card" href="/series-detail.html?id=${encodeURIComponent(s.id)}">
          ${cover ? `<img src="${escapeHtml(imgUrl(cover, 200))}" alt="${escapeHtml(s.name)}" loading="lazy">` : '<span class="cp-series-placeholder">系列</span>'}
          <div><b>${escapeHtml(s.name)}</b><span>${escapeHtml(PROJECT_STATUS_LABELS[s.status] || '进行中')} · ${s.works.length} 件作品</span></div>
        </a>`;
      }).join('');
      const updateRows = updates.slice(0, 3).map(u => `
        <a class="cp-update-row" href="/update-detail.html?id=${encodeURIComponent(u.id)}">
          <span class="cp-update-mark"></span>
          <div><b>${escapeHtml(u.title)}</b><small>${formatDate(u.publishDate)}</small></div>
          <span class="cp-update-more">→</span>
        </a>`).join('');
      const featuredSection = featuredHtml && circle.showFeaturedWorks !== false
        ? `<section class="cp-section"><div class="cp-section-head"><div><h3>精选作品</h3><p>作者选择在主页优先展示的作品</p></div><a href="#works">全部 ${works.length} 件 →</a></div><div class="cp-feature-grid ${featuredWorks.length === 1 ? 'single' : ''}">${featuredHtml}</div></section>`
        : '';
      const seriesSection = seriesHtml
        ? `<section class="cp-section"><div class="cp-section-head"><div><h3>作品系列</h3><p>同世界观或同主题的作品合集</p></div><span>${displayedSeries.length} 个系列</span></div><div class="cp-series-grid">${seriesHtml}</div></section>`
        : '';
      const updateSection = updateRows
        ? `<section class="cp-section"><div class="cp-section-head"><div><h3>最近动态</h3><p>作者发布与参与的内容</p></div><a href="#updates">更多 →</a></div><div class="cp-recent-list">${updateRows}</div></section>`
        : '';
      home.className = 'cl-tab-panel on cp-panel cp-home';
      const homeLayout = document.createElement('div');
      homeLayout.className = 'cp-layout';
      const homeMain = document.createElement('div');
      homeMain.className = 'cp-main';
      homeMain.innerHTML = featuredSection + seriesSection + updateSection;
      const homeSide = document.createElement('aside');
      homeSide.className = 'cp-side';
      const platformList = (Array.isArray(circle.platforms) ? circle.platforms : []).filter(Boolean).slice(0, 8);
      const commissionOpen = circle.commissionStatus === 'open';
      const contactEntries = circle.socialLinks
        ? Object.entries(circle.socialLinks).filter(([k, v]) => v && !['contactLabel', 'websiteLabel'].includes(k))
        : [];
      const socialNameMap = { qq: 'QQ', qqGroup: 'QQ 群', wechat: '微信', weibo: '微博', bilibili: 'B站', website: '网站', custom: '链接' };
      const contactHtml = contactEntries.length
        ? contactEntries.map(([key, value]) => {
            const label = key === 'website'
              ? (circle.socialLinks.websiteLabel || socialNameMap[key] || key)
              : (circle.socialLinks.contactLabel || socialNameMap[key] || key);
            return `<div class="cp-author-contact-row"><span>${escapeHtml(label)}</span>${String(value).startsWith('http')
              ? `<a href="${escapeHtml(value)}" target="_blank" rel="noopener noreferrer">访问 →</a>`
              : `<b>${escapeHtml(value)}</b>`}</div>`;
          }).join('')
        : '<div class="cp-author-empty">暂未公开联系方式</div>';
      const authorCard = document.createElement('div');
      authorCard.className = 'cp-aside-card cp-author-card';
      authorCard.innerHTML = `
        <div class="cp-author-head">
          <h3>作者名片 <span>AUTHOR CARD</span></h3>
          <span class="cp-commission ${commissionOpen ? 'is-open' : 'is-closed'}">${commissionOpen ? '接稿中' : '暂不接稿'}</span>
        </div>
        <p class="cp-author-bio">${circle.description ? nl2br(circle.description) : '这位作者还没有填写简介。'}</p>
        <div class="cp-author-meta">
          <div class="cp-author-row"><span>活跃平台</span><div class="cp-author-platforms">${platformList.length ? platformList.map(p => `<span>${escapeHtml(p)}</span>`).join('') : '<small>暂未填写</small>'}</div></div>
          <div class="cp-author-row"><span>联系方式</span><div class="cp-author-contact">${contactHtml}</div></div>
        </div>
        ${commissionOpen ? `<div class="cp-commission-box is-open">
          <div class="cp-commission-status"><i></i>接稿中</div>
          <p>${escapeHtml(circle.commissionNote || '作者目前接受约稿，请联系作者沟通细节。')}</p>
        </div>` : ''}`;
      homeSide.appendChild(authorCard);
      const info = document.createElement('div');
      info.className = 'cp-aside-card';
      info.innerHTML = `<h3>主页信息</h3>
        <div class="cp-meta-row"><span>作品</span><b>${works.length} 件</b></div>
        <div class="cp-meta-row"><span>作品系列</span><b>${seriesList.length} 个</b></div>
        <div class="cp-meta-row"><span>参与活动</span><b>${events.length} 个</b></div>
        <div class="cp-meta-row"><span>参与企划</span><b>${projects.length} 个</b></div>
        <div class="cp-meta-row"><span>发布动态</span><b>${updates.length} 条</b></div>`;
      homeSide.appendChild(info);
      homeLayout.appendChild(homeMain);
      homeLayout.appendChild(homeSide);
      home.appendChild(homeLayout);
      panels.home = home;

      const worksPanel = document.createElement('div');
      worksPanel.id = 'cl-panel-works';
      worksPanel.className = 'cl-tab-panel cp-panel';
      worksPanel.setAttribute('role', 'tabpanel');
      if (main) worksPanel.appendChild(main);
      panels.works = worksPanel;

      const eventsPanel = document.createElement('div');
      eventsPanel.id = 'cl-panel-events';
      eventsPanel.className = 'cl-tab-panel cp-panel';
      eventsPanel.setAttribute('role', 'tabpanel');
      eventsPanel.innerHTML = events.length ? events.map(e => `
        <a class="cl-event-row" href="/event-detail.html?id=${encodeURIComponent(e.id)}">
          ${e.coverImage
            ? `<img class="cl-event-thumb" src="${escapeHtml(imgUrl(e.coverImage, 160))}" alt="${escapeHtml(e.title)}" loading="lazy">`
            : `<span class="cl-event-thumb cl-event-placeholder" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>`}
          <div class="cl-event-main"><b>${escapeHtml(e.title)}</b><small>${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</small></div>
          <span class="status-badge is-info">${escapeHtml(EVENT_STATUS_LABELS[e.status] || '活动')}</span>
        </a>`).join('') : '<div class="empty-state"><div class="icon">·</div><p>暂无公开活动</p></div>';
      panels.events = eventsPanel;

      const projectsPanel = document.createElement('div');
      projectsPanel.id = 'cl-panel-projects';
      projectsPanel.className = 'cl-tab-panel cp-panel';
      projectsPanel.setAttribute('role', 'tabpanel');
      projectsPanel.innerHTML = projects.length ? projects.map(p => `
        <a class="cl-project-row" href="/project-detail.html?id=${encodeURIComponent(p.id)}">
          ${p.coverImage
            ? `<img class="cl-project-thumb" src="${escapeHtml(imgUrl(p.coverImage, 160))}" alt="${escapeHtml(p.title)}" loading="lazy">`
            : `<span class="cl-project-thumb cl-project-placeholder" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>`}
          <div class="cl-project-main"><b>${escapeHtml(p.title)}</b><small>${(p.startDate || p.endDate) ? `${p.startDate ? formatDate(p.startDate) : '待定'} → ${p.endDate ? formatDate(p.endDate) : '待定'}` : '时间待定'}</small></div>
          <span class="status-badge is-warning">${escapeHtml(PROJECT_STATUS_LABELS[p.status] || '企划')}</span>
        </a>`).join('') : '<div class="empty-state"><div class="icon">·</div><p>暂无公开企划</p></div>';
      panels.projects = projectsPanel;

      const updatesPanel = document.createElement('div');
      updatesPanel.id = 'cl-panel-updates';
      updatesPanel.className = 'cl-tab-panel cp-panel';
      updatesPanel.setAttribute('role', 'tabpanel');
      updatesPanel.innerHTML = updates.length ? updates.map(u => `
        <a class="cl-update-row" href="/update-detail.html?id=${encodeURIComponent(u.id)}">
          <b>${escapeHtml(u.title)}</b>
          <small>${formatDate(u.publishDate)}</small>
        </a>`).join('') : '<div class="empty-state"><div class="icon">·</div><p>暂无公开动态</p></div>';
      panels.updates = updatesPanel;

      const panelsMount = container.querySelector('#circlePanelsMount') || container;
      panelsMount.append(home, worksPanel, eventsPanel, projectsPanel, updatesPanel);

      function activate(key, updateHash = true) {
        if (!panels[key]) key = 'home';
        bar.querySelectorAll('[data-cl-tab]').forEach(btn => {
          const on = btn.dataset.clTab === key;
          btn.classList.toggle('on', on);
          btn.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        Object.entries(panels).forEach(([k, panel]) => {
          panel.classList.toggle('on', k === key);
          panel.hidden = k !== key;
        });
        if (updateHash && location.hash !== '#' + key) history.replaceState(null, '', '#' + key);
      }

      bar.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-cl-tab]');
        if (!btn) return;
        activate(btn.dataset.clTab);
      });
      window.addEventListener('hashchange', () => activate((location.hash || '#home').slice(1), false));
      activate((location.hash || '#home').slice(1), false);
    }

    loadCircle();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 作者详情</title>
  <meta name="description" content="查看同人作者详情，包括作品列表、活动、联系方式等。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="circleDetail">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('circles');

    let circleWorksData = [];
    let cwCategory = 'all';
    let cwSearchText = '';
    let cwSortBy = 'default';

    function renderCircleWorks() {
      let filtered = circleWorksData;
      if (cwCategory !== 'all') {
        filtered = filtered.filter(w => w.category === cwCategory);
      }
      if (cwSearchText) {
        const q = cwSearchText.toLowerCase();
        filtered = filtered.filter(w =>
          w.title.toLowerCase().includes(q) ||
          (w.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }
      // Sorting
      if (cwSortBy === 'date-asc') {
        filtered.sort((a, b) => (a.releaseDate || 'z').localeCompare(b.releaseDate || 'z'));
      } else if (cwSortBy === 'date-desc') {
        filtered.sort((a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || ''));
      } else if (cwSortBy === 'likes-desc') {
        filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      } else if (cwSortBy === 'likes-asc') {
        filtered.sort((a, b) => (a.likes || 0) - (b.likes || 0));
      } else if (cwSortBy === 'wants-desc') {
        filtered.sort((a, b) => (b.wants || 0) - (a.wants || 0));
      } else if (cwSortBy === 'wants-asc') {
        filtered.sort((a, b) => (a.wants || 0) - (b.wants || 0));
      }
      const grid = document.getElementById('circleWorksGrid');
      const count = document.getElementById('circleWorksCount');
      if (count) count.textContent = `(${filtered.length})`;
      if (!grid) return;
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="padding:2rem 0;"><p>暂无匹配的作品</p></div>';
        return;
      }
      grid.innerHTML = filtered.map(work => `
        <div class="card" onclick="location.href='/work-detail.html?id=${work.id}'">
          <div class="card-image" style="height:160px;">
            ${work.images && work.images.length > 0
              ? `<img src="${work.images[0]}" alt="${work.title}">`
              : '<span class="placeholder-icon">🎨</span>'}
          </div>
          <div class="card-body" style="padding:0.8rem;">
            <span class="card-tag ${work.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;">${STATUS_LABELS[work.status] || work.status}</span>
            <h3 class="card-title" style="font-size:0.9rem;margin-top:0.3rem;">${work.title}</h3>
          </div>
          <div class="card-footer" style="padding:0.5rem 0.8rem;">
            <span class="card-price" style="color:var(--accent);font-weight:700;font-size:0.9rem;">${work.price}</span>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              ${(work.wants || 0) > 0 ? `<span style="font-size:0.75rem;color:#3498db;">想要 ${work.wants}</span>` : ''}
              ${renderLikeButton(work.id, work.likes)}
            </div>
          </div>
        </div>
      `).join('');
    }

    async function loadCircle() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/circles.html'; return; }

      try {
        await loadCategoriesFromAPI();
        const [circle, allWorks, allEvents, allProjects, allUpdates] = await Promise.all([
          F7API.getCircle(id),
          F7API.getWorks(),
          F7API.getEvents(),
          F7API.getProjects(),
          fetch('/api/updates').then(r => r.json())
        ]);
        const circleWorks = allWorks.filter(w => (w.circles || []).includes(circle.id));
        circleWorksData = circleWorks;
        const circleWorkIds = circleWorks.map(w => w.id);
        const relatedEvents = allEvents.filter(e =>
          (e.relatedCircles || []).includes(circle.id) ||
          (e.relatedWorks || []).some(wid => circleWorkIds.includes(wid))
        );
        const relatedProjects = (allProjects || []).filter(p => (p.circles || []).includes(circle.id));
        const relatedUpdates = (allUpdates || []).filter(u => (u.relatedCircles || []).includes(circle.id));

        document.title = `${circle.name} — f7goods`;

        const container = document.getElementById('circleDetail');
        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/circles.html">同人作者</a>
            <span>›</span>
            <span>${circle.name}</span>
          </div>
          <div class="detail-header">
            <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1rem;">
              ${circle.logo
                ? `<div style="width:70px;height:70px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${circle.logo}" alt="${circle.name}" style="width:100%;height:100%;object-fit:cover;"></div>`
                : `<div class="circle-avatar" style="width:70px;height:70px;font-size:1.5rem;flex-shrink:0;">${circle.name.charAt(0)}</div>`}
              <div style="flex:1;">
                <h1 style="margin-bottom:0.25rem;">${circle.name}</h1>
                ${circle.category ? `<span class="card-tag" style="font-size:0.8rem;padding:0.2rem 0.6rem;">${CIRCLE_CATEGORIES[circle.category] || circle.category}</span>` : ''}
              </div>
              <div>${renderShareButton(circle.name, location.href)}</div>
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              <h3 style="margin-bottom:1rem;font-size:1.1rem;">作者简介</h3>
              <p style="line-height:1.8;color:var(--ink);">${nl2br(circle.description)}</p>

              ${circle.images && circle.images.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">作者图片</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${circle.images.map((img, i) => `<img src="${img}" alt="${circle.name}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(circle.images).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}

              ${circleWorks.length > 0 ? (() => {
                const usedCats = [...new Set(circleWorks.map(w => w.category).filter(Boolean))];
                const catBtns = CATEGORIES_ORDERED.filter(c => usedCats.includes(c.id));
                return `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">作品列表 <span id="circleWorksCount">(${circleWorks.length})</span></h3>
                <div style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;margin-bottom:1rem;">
                  <button class="filter-btn active" onclick="cwCategory='all';this.parentElement.querySelectorAll('.filter-btn[data-cat]').forEach(b=>b.classList.remove('active'));this.classList.add('active');renderCircleWorks();">全部</button>
                  ${catBtns.map(c => `<button class="filter-btn" data-cat="${c.id}" onclick="cwCategory='${c.id}';this.parentElement.querySelectorAll('.filter-btn[data-cat]').forEach(b=>b.classList.remove('active'));this.classList.add('active');renderCircleWorks();">${c.name}</button>`).join('')}
                  <select class="form-input" style="margin-left:auto;padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;" onchange="cwSortBy=this.value;renderCircleWorks();">
                    <option value="default">默认排序</option>
                    <option value="date-asc">发售时间 ↑ 早→晚</option>
                    <option value="date-desc">发售时间 ↓ 晚→早</option>
                    <option value="likes-desc">喜爱数 ↓ 高→低</option>
                    <option value="likes-asc">喜爱数 ↑ 低→高</option>
                    <option value="wants-desc">想要数 ↓ 高→低</option>
                    <option value="wants-asc">想要数 ↑ 低→高</option>
                  </select>
                  <input type="text" class="search-input" placeholder="搜索作品、标签..." style="max-width:200px;" oninput="cwSearchText=this.value;renderCircleWorks();">
                </div>
                <div class="cards-grid related-works-grid" id="circleWorksGrid"></div>
                `;
              })() : '<p style="color:var(--haze);">暂无作品</p>'}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>作者信息</h3>
                <div class="info-row">
                  <span class="info-label">作品数</span>
                  <span class="info-value">${circleWorks.length}</span>
                </div>
              </div>
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>参与活动</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${e.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${e.coverImage}" alt="${e.title}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-alt));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📅</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${e.title}</div>
                      ${e.status ? `<span class="card-tag ${e.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${EVENT_STATUS_LABELS[e.status] || e.status}</span>` : ''}
                      <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + e.location : ''}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedProjects.length > 0 ? `
              <div class="sidebar-card">
                <h3>参与企划</h3>
                ${relatedProjects.map(p => `
                  <a href="/project-detail.html?id=${p.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${p.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${p.coverImage}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-alt),var(--ink));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📋</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${p.title}</div>
                      <span class="card-tag ${p.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${PROJECT_STATUS_LABELS[p.status] || p.status}</span>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedUpdates.length > 0 ? `
              <div class="sidebar-card">
                <h3>相关动态</h3>
                ${relatedUpdates.map(u => `
                  <a href="/update-detail.html?id=${u.id}" style="display:block;padding:0.5rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    <div style="font-weight:600;font-size:0.9rem;">📰 ${escapeHtml(u.title)}</div>
                    <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(u.publishDate)}</div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${circle.socialLinks && Object.keys(circle.socialLinks).filter(k => circle.socialLinks[k] && !['contactLabel','websiteLabel'].includes(k)).length > 0 ? `
                <div class="sidebar-card">
                  <h3>联系方式</h3>
                  ${Object.entries(circle.socialLinks).filter(([k, url]) => url && !['contactLabel','websiteLabel'].includes(k)).map(([key, url]) => {
                    const isUrl = url.startsWith('http');
                    const defaultLabel = key === 'qq' ? 'QQ联系' : key === 'qqGroup' ? 'QQ群' : key === 'website' ? '访问网站' : key;
                    const label = key === 'website' ? (circle.socialLinks.websiteLabel || defaultLabel) : (circle.socialLinks.contactLabel || defaultLabel);
                    return isUrl
                      ? `<a href="${url}" target="_blank" style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(233,69,96,0.06);color:var(--accent);border-radius:100px;font-size:0.85rem;text-decoration:none;margin:0.2rem 0;transition:var(--transition);"
                           onmouseover="this.style.background='rgba(233,69,96,0.12)'" onmouseout="this.style.background='rgba(233,69,96,0.06)'">${label}</a>`
                      : `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;font-size:0.85rem;">
                           <span style="display:inline-block;padding:0.3rem 0.8rem;background:rgba(15,52,96,0.06);color:var(--accent-alt);border-radius:100px;font-weight:500;">${label}</span>
                           <span style="color:var(--accent);font-weight:500;">${url}</span>
                         </div>`;
                  }).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
        renderCircleWorks();
      } catch (e) {
        document.getElementById('circleDetail').innerHTML =
          '<div class="empty-state"><div class="icon">!</div><p>作者未找到或加载失败</p></div>';
      }
    }

    loadCircle();
  </script>
</body>
</html>

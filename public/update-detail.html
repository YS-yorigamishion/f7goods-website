<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 动态详情</title>
  <meta name="description" content="查看同人动态详情，了解最新资讯。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.jpg">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260812">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="updateDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;">
          <div class="skeleton skeleton-cover" style="margin-bottom:1rem;"></div>
          <div class="skeleton skeleton-text" style="width:60%;height:28px;margin-bottom:0.5rem;"></div>
          <div class="skeleton skeleton-text" style="width:30%;height:14px;"></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:95%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:80%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:50%;margin-bottom:1.5rem;"></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:80%;"></div><div class="skeleton skeleton-text short"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260810c"></script>
  <script>
    async function loadUpdate() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/updates.html'; return; }
      initPage('updates', id);

      try {
        await loadCategoriesFromAPI();
        const [update, allEvents, allProjects, allCircles] = await Promise.all([
          fetch('/api/updates/' + id).then(r => r.json()),
          F7API.getEvents(),
          F7API.getProjects(),
          F7API.getCircles()
        ]);

        const relatedEvents = allEvents.filter(e => (update.relatedEvents || []).includes(e.id));
        const relatedProjects = allProjects.filter(p => (update.relatedProjects || []).includes(p.id));
        const relatedCircles = allCircles.filter(c => (update.relatedCircles || []).includes(c.id));

        document.title = `${update.title} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = update.title;
        document.querySelector('meta[property="og:description"]').content = (update.content || '').substring(0, 160);
        if (update.coverImage) document.querySelector('meta[property="og:image"]').content = update.coverImage;

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('updateDetail');
        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/updates.html">${t('nav.updates')}</a>
            <span>›</span>
            <span>${escapeHtml(update.title)}</span>
          </div>
          <div class="detail-header">
            ${update.coverImage ? `<img src="${update.coverImage}" alt="${escapeHtml(update.title)}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:1rem;cursor:pointer;" class="clickable-img" onclick="openLightbox(['${escapeHtml(update.coverImage).replace(/'/g, '&#39;')}'], 0)">` : ''}
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
              <h1 style="flex:1;">${update.pinned ? '📌 ' : ''}${escapeHtml(update.title)}</h1>
              ${renderShareButton(update.title, location.href)}
            </div>
            <div class="detail-meta">
              <span>${formatDate(update.publishDate)}</span>
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              <h3 style="margin-bottom:1rem;font-size:1.1rem;">${t('updates.content')}</h3>
              <p style="line-height:1.8;color:var(--ink);">${nl2br(update.content)}</p>

              ${update.images && update.images.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">${t('updates.images')}</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${update.images.map((img, i) => `<img src="${img}" alt="${escapeHtml(update.title)}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(update.images).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>${t('updates.updateInfo')}</h3>
                <div class="info-row">
                  <span class="info-label">${t('updates.publishDate')}</span>
                  <span class="info-value">${formatDate(update.publishDate)}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('works.author')}</span>
                  <span class="info-value">${relatedCircles.length > 0 ? escapeHtml(relatedCircles.map(c => c.name).join('、')) : '-'}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('common.imageCount')}</span>
                  <span class="info-value">${(update.images || []).length} ${t('common.images')}</span>
                </div>
              </div>
              ${relatedCircles.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('updates.relatedAuthors')}</h3>
                ${relatedCircles.map(c => `
                  <a href="/circle-detail.html?id=${c.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${c.logo
                      ? `<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${c.logo}" alt="${escapeHtml(c.name)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-alt));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">${escapeHtml(c.name.charAt(0))}</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(c.name)}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('updates.relatedEvents')}</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" style="display:block;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(e.title)}</div>
                    <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedProjects.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('updates.relatedProjects')}</h3>
                ${relatedProjects.map(p => `
                  <a href="/project-detail.html?id=${p.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${p.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${p.coverImage}" alt="${escapeHtml(p.title)}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-alt),var(--ink));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📋</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(p.title)}</div>
                      <span class="card-tag ${p.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${PROJECT_STATUS_LABELS[p.status] || p.status}</span>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('updateDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    loadUpdate();
  </script>
</body>
</html>

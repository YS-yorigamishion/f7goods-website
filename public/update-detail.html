<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 动态详情</title>
  <meta name="description" content="查看同人动态详情，了解最新资讯。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="updateDetail">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    async function loadUpdate() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/updates.html'; return; }
      initPage('updates', id);

      try {
        await loadCategoriesFromAPI();
        const [update, allEvents, allProjects, allCircles] = await Promise.all([
          fetch('/api/updates/' + id).then(r => r.json()),
          F7API.getEvents(),
          F7API.getProjects(),
          F7API.getCircles()
        ]);

        const relatedEvents = allEvents.filter(e => (update.relatedEvents || []).includes(e.id));
        const relatedProjects = allProjects.filter(p => (update.relatedProjects || []).includes(p.id));
        const relatedCircles = allCircles.filter(c => (update.relatedCircles || []).includes(c.id));

        document.title = `${update.title} — f7goods`;

        const container = document.getElementById('updateDetail');
        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/updates.html">同人动态</a>
            <span>›</span>
            <span>${update.title}</span>
          </div>
          <div class="detail-header">
            ${update.coverImage ? `<img src="${update.coverImage}" alt="${update.title}" style="width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:1rem;cursor:pointer;" class="clickable-img" onclick="openLightbox(['${update.coverImage}'], 0)">` : ''}
            <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
              <h1 style="flex:1;">${update.pinned ? '📌 ' : ''}${escapeHtml(update.title)}</h1>
              ${renderShareButton(update.title, location.href)}
            </div>
            <div class="detail-meta">
              <span>${formatDate(update.publishDate)}</span>
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              <h3 style="margin-bottom:1rem;font-size:1.1rem;">动态内容</h3>
              <p style="line-height:1.8;color:var(--ink);">${nl2br(update.content)}</p>

              ${update.images && update.images.length > 0 ? `
                <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">图片</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                  ${update.images.map((img, i) => `<img src="${img}" alt="${update.title}" class="clickable-img" style="width:100%;border-radius:8px;" onclick="openLightbox(${JSON.stringify(update.images).replace(/"/g, '&quot;')}, ${i})">`).join('')}
                </div>
              ` : ''}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>动态信息</h3>
                <div class="info-row">
                  <span class="info-label">发布日期</span>
                  <span class="info-value">${formatDate(update.publishDate)}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">作者</span>
                  <span class="info-value">${relatedCircles.length > 0 ? relatedCircles.map(c => c.name).join('、') : '-'}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">图片数</span>
                  <span class="info-value">${(update.images || []).length} 张</span>
                </div>
              </div>
              ${relatedCircles.length > 0 ? `
              <div class="sidebar-card">
                <h3>相关作者</h3>
                ${relatedCircles.map(c => `
                  <a href="/circle-detail.html?id=${c.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${c.logo
                      ? `<div style="width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${c.logo}" alt="${c.name}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-alt));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">${c.name.charAt(0)}</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${c.name}</div>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>相关活动</h3>
                ${relatedEvents.map(e => `
                  <a href="/event-detail.html?id=${e.id}" style="display:block;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    <div style="font-weight:600;font-size:0.9rem;">${e.title}</div>
                    <div style="font-size:0.75rem;color:var(--haze);margin-top:0.15rem;">${formatDate(e.date)}${e.location ? ' · ' + e.location : ''}</div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedProjects.length > 0 ? `
              <div class="sidebar-card">
                <h3>相关企划</h3>
                ${relatedProjects.map(p => `
                  <a href="/project-detail.html?id=${p.id}" style="display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--border);transition:var(--transition);"
                     onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--ink)'">
                    ${p.coverImage
                      ? `<div style="width:36px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;"><img src="${p.coverImage}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;"></div>`
                      : `<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--accent-alt),var(--ink));display:flex;align-items:center;justify-content:center;color:white;font-size:0.9rem;font-weight:700;flex-shrink:0;">📋</div>`}
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">${p.title}</div>
                      <span class="card-tag ${p.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;margin-top:0.2rem;display:inline-block;">${PROJECT_STATUS_LABELS[p.status] || p.status}</span>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('updateDetail').innerHTML =
          '<div class="empty-state"><div class="icon">!</div><p>动态未找到或加载失败</p></div>';
      }
    }

    loadUpdate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 动态详情</title>
  <meta name="description" content="查看同人动态详情，了解最新资讯。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260912g">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="updateDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;">
          <div class="skeleton skeleton-cover" style="margin-bottom:1rem;"></div>
          <div class="skeleton skeleton-text" style="width:60%;height:28px;margin-bottom:0.5rem;"></div>
          <div class="skeleton skeleton-text" style="width:30%;height:14px;"></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:95%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:80%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:50%;margin-bottom:1.5rem;"></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:80%;"></div><div class="skeleton skeleton-text short"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260912f"></script>
  <script>
    async function loadUpdate() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/updates.html'; return; }
      initPage('updates', id);

      try {
        await loadCategoriesFromAPI();
        const [update, allEvents, allProjects, allCircles] = await Promise.all([
          fetch('/api/updates/' + id).then(r => r.json()),
          F7API.getEvents(),
          F7API.getProjects(),
          F7API.getCircles()
        ]);

        const relatedEvents = allEvents.filter(e => (update.relatedEvents || []).includes(e.id));
        const relatedProjects = allProjects.filter(p => (update.relatedProjects || []).includes(p.id));
        const relatedCircles = allCircles.filter(c => (update.relatedCircles || []).includes(c.id));

        document.title = `${update.title} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = update.title;
        document.querySelector('meta[property="og:description"]').content = (update.content || '').substring(0, 160);
        if (update.coverImage) document.querySelector('meta[property="og:image"]').content = update.coverImage;

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('updateDetail');

        const d = String(update.publishDate || '');
        // 仅当配置里能查到中文名时才显示；查不到不显示原始 id（避免出现拼音）
        const catLabel = (typeof UPDATE_CATEGORIES !== 'undefined' && UPDATE_CATEGORIES[update.category]) || '';
        const stLabel = (typeof UPDATE_STATUS_LABELS !== 'undefined' && UPDATE_STATUS_LABELS[update.status]) || '';
        let stCls = 'cl-u-chip';
        if (stLabel) {
          if (/结束|完成|下架/.test(stLabel)) stCls += ' done';
          else stCls += ' now';
        }
        const images = Array.isArray(update.images) ? update.images.filter(Boolean) : [];
        const authors = relatedCircles.map(c => c.name).join('、');
        // 作者名可点击进入作者页（多个作者以 、 分隔）
        const authorLinks = relatedCircles
          .map(c => `<a class="au" href="/circle-detail.html?id=${encodeURIComponent(c.id)}">${escapeHtml(c.name)}</a>`)
          .join('、');

        container.innerHTML = `
          <div class="detail-breadcrumb">
            <a href="/updates.html">${t('nav.updates')}</a>
            <span>›</span>
            <span>${escapeHtml(update.title)}</span>
          </div>
          ${update.coverImage ? `
          <div class="cl-u-cover" onclick="openLightbox(['${escapeHtml(update.coverImage).replace(/'/g, '&#39;')}'], 0)" role="button" tabindex="0">
            <img src="${escapeHtml(update.coverImage)}" alt="${escapeHtml(update.title)}">
          </div>` : ''}
          <div class="cl-u-head">
            <div class="cl-u-date">
              <span class="m">${d.slice(5, 7) ? Number(d.slice(5, 7)) + ' 月' : ''}</span>
              <span class="d">${d.slice(8, 10) || '—'}</span>
            </div>
            <div class="cl-u-main">
              <div class="cl-u-chips">
                ${update.pinned ? `<span class="cl-u-chip pin">${t('updates.pinned')}</span>` : ''}
                ${catLabel ? `<span class="cl-u-chip cat">${escapeHtml(catLabel)}</span>` : ''}
                ${stLabel ? `<span class="${stCls}">${escapeHtml(stLabel)}</span>` : ''}
              </div>
              <h1 class="cl-u-title">${escapeHtml(update.title)}</h1>
              <div class="cl-u-meta">
                <span>${formatDate(update.publishDate)}</span>
                ${authors ? `<span class="sep">/</span><span>${t('works.author')} ${authorLinks}</span>` : ''}
                ${images.length ? `<span class="sep">/</span><span>${images.length} ${t('common.images')}</span>` : ''}
                <button type="button" class="share"
                  data-share-title="${encodeURIComponent(update.title)}"
                  data-share-url="${encodeURIComponent(location.href)}"
                  onclick="sharePage(decodeURIComponent(this.dataset.shareTitle),decodeURIComponent(this.dataset.shareUrl))">${t('common.share')}</button>
              </div>
            </div>
          </div>
          <div class="detail-content">
            <div class="detail-main">
              <div class="cl-u-body">
                <p>${nl2br(update.content)}</p>
              </div>
              ${images.length ? `
                <div class="cl-u-gallery">
                  ${images.map((img, i) => `<button type="button" onclick="openLightbox(${JSON.stringify(images).replace(/"/g, '&quot;')}, ${i})"><img src="${escapeHtml(img)}" alt="" loading="lazy"></button>`).join('')}
                </div>
              ` : ''}
            </div>
            <div class="detail-sidebar">
              <div class="sidebar-card">
                <h3>${t('updates.updateInfo')}</h3>
                <div class="info-row">
                  <span class="info-label">${t('updates.publishDate')}</span>
                  <span class="info-value">${formatDate(update.publishDate)}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">${t('works.author')}</span>
                  <span class="info-value">${relatedCircles.length ? relatedCircles.map(c => `<a class="au" href="/circle-detail.html?id=${encodeURIComponent(c.id)}">${escapeHtml(c.name)}</a>`).join('、') : '-'}</span>
                </div>
                ${catLabel ? `
                <div class="info-row">
                  <span class="info-label">分类</span>
                  <span class="info-value">${escapeHtml(catLabel)}</span>
                </div>` : ''}
                ${stLabel ? `
                <div class="info-row">
                  <span class="info-label">状态</span>
                  <span class="info-value">${escapeHtml(stLabel)}</span>
                </div>` : ''}
                <div class="info-row">
                  <span class="info-label">${t('common.imageCount')}</span>
                  <span class="info-value">${images.length} ${t('common.images')}</span>
                </div>
              </div>
              ${relatedCircles.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('updates.relatedAuthors')}</h3>
                ${relatedCircles.map(c => `
                  <a class="cl-u-row" href="/circle-detail.html?id=${encodeURIComponent(c.id)}">
                    <div class="th round">${c.logo ? `<img src="${escapeHtml(c.logo)}" alt="">` : escapeHtml((c.name || '?').charAt(0))}</div>
                    <div class="t"><b>${escapeHtml(c.name)}</b></div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedEvents.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('updates.relatedEvents')}</h3>
                ${relatedEvents.map(e => `
                  <a class="cl-u-row" href="/event-detail.html?id=${encodeURIComponent(e.id)}">
                    <div class="th">${e.coverImage ? `<img src="${escapeHtml(e.coverImage)}" alt="">` : 'A'}</div>
                    <div class="t">
                      <b>${escapeHtml(e.title)}</b>
                      <small>${formatDate(e.date)}${e.location ? ' · ' + escapeHtml(e.location) : ''}</small>
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
              ${relatedProjects.length > 0 ? `
              <div class="sidebar-card">
                <h3>${t('updates.relatedProjects')}</h3>
                ${relatedProjects.map(p => `
                  <a class="cl-u-row" href="/project-detail.html?id=${encodeURIComponent(p.id)}">
                    <div class="th">${p.coverImage ? `<img src="${escapeHtml(p.coverImage)}" alt="">` : 'P'}</div>
                    <div class="t">
                      <b>${escapeHtml(p.title)}</b>
                      ${PROJECT_STATUS_LABELS[p.status] ? `<small>${escapeHtml(PROJECT_STATUS_LABELS[p.status])}</small>` : ''}
                    </div>
                  </a>
                `).join('')}
              </div>
              ` : ''}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('updateDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    loadUpdate();
  </script>
</body>
</html>

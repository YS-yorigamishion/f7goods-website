<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品系列 — f7goods</title>
<meta name="description" content="查看作者的作品系列：同系列周边与作品合集。">
<link rel="stylesheet" href="/css/style.css?v=20261020ax">
<script src="/js/api.js?v=20261020ax"></script>
<script src="/js/i18n.js?v=20261020ax"></script>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="main-content detail-page">
  <div id="seriesDetail"><div class="empty-state"><p>加载中…</p></div></div>
</main>
<footer class="footer" id="footer"></footer>
<script src="/js/main.js?v=20261020ax"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('seriesDetail');
  if (!id) { root.innerHTML = '<div class="empty-state"><p>系列不存在</p></div>'; return; }
  try {
    if (typeof initPage === 'function') await initPage('works', id);
    if (typeof onLangChange === 'function') onLangChange(() => location.reload());
    const res = await fetch('/api/series/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('not found');
    const s = await res.json();
    document.title = `${s.name} — 作品系列 | f7goods`;
    document.querySelector('meta[name="description"]')?.setAttribute('content', `${s.name}，作者 ${s.owner?.name || ''} 的作品系列。`);
    root.innerHTML = `
      <div class="detail-breadcrumb"><a href="/">周边概览</a><span>›</span><span>${escapeHtml(s.name)}</span></div>
      <div class="series-hero">
        <div class="series-hero-cover">${s.cover ? `<img src="${escapeHtml(imgUrl(s.cover, 800))}" alt="${escapeHtml(s.name)}" onerror="this.style.display='none';this.parentElement.textContent='作品系列'">` : '<span>作品系列</span>'}</div>
        <div class="series-hero-info">
          <div class="series-status">${escapeHtml(PROJECT_STATUS_LABELS[s.status] || '进行中')}</div>
          <h1>${escapeHtml(s.name)}</h1>
          <p>${s.owner ? `<a href="/circle-detail.html?id=${encodeURIComponent(s.owner.id)}">${escapeHtml(s.owner.name)}</a>` : ''} · ${s.works.length} 件作品</p>
        </div>
      </div>
      ${(s.description || (s.tags || []).length || s.contactInfo || s.startDate || s.endDate) ? `<div class="series-extra">
        <div class="series-extra-meta">${s.category ? `<span>${escapeHtml(PROJECT_CATEGORIES[s.category] || s.category)}</span>` : ''}${s.startDate || s.endDate ? `<span>${s.startDate ? formatDate(s.startDate) : '待定'} → ${s.endDate ? formatDate(s.endDate) : '待定'}</span>` : ''}</div>
        ${s.description ? `<p class="series-desc">${escapeHtml(s.description)}</p>` : ''}
        ${(s.tags || []).length ? `<div class="series-tags">${s.tags.map(tg => `<span>#${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
        ${s.contactInfo ? `<div class="series-contact"><b>参与方式 / 联系方式</b><p>${escapeHtml(s.contactInfo)}</p></div>` : ''}
      </div>` : ''}
      <h2 class="series-works-title">系列作品 (${s.works.length})</h2>
      ${s.works.length ? `<div class="cards-grid">${s.works.map(w => `
        <a class="card" href="/work-detail.html?id=${encodeURIComponent(w.id)}" style="text-decoration:none;color:inherit;">
          <div class="card-image">${w.images?.[0] ? `<img src="${escapeHtml(imgUrl(w.images[0], 320))}" alt="${escapeHtml(workTitle(w))}" loading="lazy">` : '<span class="placeholder-icon">🎨</span>'}</div>
          <div class="card-body"><span class="card-tag ${w.status}">${escapeHtml(STATUS_LABELS[w.status] || '')}</span><h3 class="card-title" style="font-size:.92rem;">${escapeHtml(workTitle(w))}</h3></div>
        </a>`).join('')}</div>` : '<div class="empty-state"><p>这个系列还没有公开作品</p></div>'}
    `;
  } catch (e) {
    root.innerHTML = '<div class="empty-state"><div class="icon">!</div><p>系列不存在或暂未公开</p><p style="margin-top:.8rem;"><a class="detail-link" href="/">返回首页</a></p></div>';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系列周边 — f7goods</title>
<meta name="description" content="查看作品系列详情、参与作者与系列作品。">
<link rel="stylesheet" href="/css/style.css?v=20261020cn">
<script src="/js/api.js?v=20261020cn"></script>
<script src="/js/i18n.js?v=20261020cn"></script>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="main-content detail-page">
  <div id="seriesDetail"><div class="empty-state"><p>加载中…</p></div></div>
</main>
<footer class="footer" id="footer"></footer>
<script src="/js/main.js?v=20261020cn"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('seriesDetail');
  if (!id) { root.innerHTML = '<div class="empty-state"><p>系列不存在</p></div>'; return; }
  try {
    if (typeof initPage === 'function') await initPage('projects', id);
    if (typeof onLangChange === 'function') onLangChange(() => location.reload());
    const res = await fetch('/api/series/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('not found');
    const s = await res.json();
    const statusLabel = (typeof PROJECT_STATUS_LABELS !== 'undefined' && PROJECT_STATUS_LABELS[s.status]) || '招募中';
    const catLabel = s.category ? (PROJECT_CATEGORIES[s.category] || s.category) : '';
    const cover = s.cover || s.works?.[0]?.images?.[0] || '';
    const dateText = (s.startDate || s.endDate)
      ? `${s.startDate ? formatDate(s.startDate) : '待定'} → ${s.endDate ? formatDate(s.endDate) : '待定'}`
      : '';
    document.title = `${s.name} — 系列周边 | f7goods`;
    document.querySelector('meta[name="description"]')?.setAttribute('content', `${s.name}，${s.owner?.name || ''} 的作品系列。`);
    root.innerHTML = `
      <div class="detail-breadcrumb">
        <a href="/projects.html">同人企划</a><span>›</span><span>系列周边</span><span>›</span><span>${escapeHtml(s.name)}</span>
      </div>
      <div class="ev-hero ${cover ? 'has-cover' : ''}" ${cover ? `style="background-image:url('${escapeHtml(imgUrl(cover, 1600))}');background-size:cover;background-position:center;"` : ''}>
        <div class="ev-hero-shade"></div>
        <div class="ev-hero-body">
          <div class="ev-hero-row">
            <span class="ev-chip">${escapeHtml(statusLabel)}</span>
            ${catLabel ? `<span class="ev-chip">${escapeHtml(catLabel)}</span>` : ''}
            <span class="ev-hero-share">${typeof renderShareButton === 'function' ? renderShareButton(s.name, location.href) : ''}</span>
          </div>
          <h1>${escapeHtml(s.name)}</h1>
          <div class="ev-hero-meta">${dateText ? `<span>📅 ${dateText}</span>` : ''}${s.owner ? `<span style="margin-left:1rem;">作者：${escapeHtml(s.owner.name)}</span>` : ''}</div>
        </div>
      </div>
      <div class="detail-content">
        <div class="detail-main">
          <h3 style="margin-bottom:1rem;font-size:1.1rem;">系列简介</h3>
          <p style="line-height:1.8;color:var(--ink);white-space:pre-wrap;">${escapeHtml(s.description || '暂无简介')}</p>
          ${(s.tags || []).length ? `<div class="cl-chips" style="margin-top:1rem;">${s.tags.map(tg => `<span class="cl-chip">#${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
          <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">系列作品 (${s.works.length})</h3>
          ${s.works.length ? `<div class="cards-grid">${s.works.map(w => `
            <a class="card" href="/work-detail.html?id=${encodeURIComponent(w.id)}" style="text-decoration:none;color:inherit;">
              <div class="card-image">${w.images?.[0] ? `<img src="${escapeHtml(imgUrl(w.images[0], 320))}" alt="${escapeHtml(workTitle(w))}" loading="lazy">` : '<span class="placeholder-icon">🎨</span>'}</div>
              <div class="card-body">
                <span class="card-tag ${w.status}">${escapeHtml(STATUS_LABELS[w.status] || '')}</span>
                <h3 class="card-title" style="font-size:0.95rem;">${escapeHtml(workTitle(w))}</h3>
                <p class="card-price" style="color:var(--accent);font-weight:700;margin-top:0.5rem;">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(w.price) : (w.price || ''))}</p>
              </div>
            </a>`).join('')}</div>` : '<div class="empty-state"><p>这个系列还没有公开作品</p></div>'}
          ${s.contactInfo ? `<h3 style="margin:2rem 0 1rem;font-size:1.1rem;">参与方式 / 联系方式</h3><p style="line-height:1.8;color:var(--ink);white-space:pre-wrap;">${escapeHtml(s.contactInfo)}</p>` : ''}
        </div>
        <div class="detail-sidebar">
          <div class="sidebar-card">
            <h3>系列信息</h3>
            <div class="info-row"><span class="info-label">状态</span><span class="info-value">${escapeHtml(statusLabel)}</span></div>
            ${catLabel ? `<div class="info-row"><span class="info-label">分类</span><span class="info-value">${escapeHtml(catLabel)}</span></div>` : ''}
            ${s.startDate ? `<div class="info-row"><span class="info-label">开始日期</span><span class="info-value">${formatDate(s.startDate)}</span></div>` : ''}
            ${s.endDate ? `<div class="info-row"><span class="info-label">结束日期</span><span class="info-value">${formatDate(s.endDate)}</span></div>` : ''}
            <div class="info-row"><span class="info-label">作品数</span><span class="info-value">${s.works.length}</span></div>
          </div>
          ${s.owner ? `<div class="sidebar-card"><h3>作者</h3><a href="/circle-detail.html?id=${encodeURIComponent(s.owner.id)}" style="display:flex;align-items:center;gap:.6rem;color:inherit;text-decoration:none;">
            ${s.owner.logo ? `<img src="${escapeHtml(imgUrl(s.owner.logo, 80))}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : ''}
            <b>${escapeHtml(s.owner.name)}</b>
          </a></div>` : ''}
          ${(s.tags || []).length ? `<div class="sidebar-card"><h3>标签</h3><div class="cl-chips">${s.tags.map(tg => `<span class="cl-chip">#${escapeHtml(tg)}</span>`).join('')}</div></div>` : ''}
        </div>
      </div>`;
  } catch (e) {
    root.innerHTML = '<div class="empty-state"><div class="icon">!</div><p>系列不存在或暂未公开</p><p style="margin-top:.8rem;"><a class="detail-link" href="/projects.html">返回企划</a></p></div>';
  }
})();
</script>
</body>
</html>

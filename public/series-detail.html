<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系列周边 — f7goods</title>
<meta name="description" content="查看作品系列详情、参与作者与系列作品。">
<link rel="stylesheet" href="/css/style.css?v=20261027h">
<script src="/js/api.js?v=20261027h"></script>
<script src="/js/i18n.js?v=20261027h"></script>
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="main-content detail-page">
  <div id="seriesDetail"><div class="empty-state"><p>加载中…</p></div></div>
</main>
<div id="wishlistBar" style="display:none;"></div>
<div class="wl-overlay" id="wishlistOverlay" onclick="if(event.target===this)closeSeriesWishlistSheet()">
  <div class="wl-drawer" role="dialog" aria-modal="true" aria-labelledby="wlTitle" onclick="event.stopPropagation()">
    <button type="button" class="wl-close" onclick="closeSeriesWishlistSheet()" aria-label="关闭">×</button>
    <h3 id="wlTitle">系列心愿单</h3>
    <div id="wlList"></div>
    <div id="wlSum"></div>
    <div class="wl-actions">
      <button type="button" class="alt" onclick="copySeriesWishlistText()">复制文本清单</button>
      <button type="button" class="alt danger" onclick="clearSeriesWishlist()">一键清空</button>
    </div>
  </div>
</div>
<footer class="footer" id="footer"></footer>
<script src="/js/main.js?v=20261027h"></script>
<script>
// ===== 系列周边心愿单：与首页心愿单分开存储 =====
const SERIES_WISHLIST_KEY = 'f7seriesWishlist';
const SERIES_WISHLIST_MODE_KEY = 'f7seriesWishlistMode';
let wishlistMode = localStorage.getItem(SERIES_WISHLIST_MODE_KEY) === '1';
let wishlistItems = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(SERIES_WISHLIST_KEY) || '{}');
    return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
  } catch { return {}; }
})();
function saveWishlist() {
  try {
    localStorage.setItem(SERIES_WISHLIST_KEY, JSON.stringify(wishlistItems));
    localStorage.setItem(SERIES_WISHLIST_MODE_KEY, wishlistMode ? '1' : '0');
  } catch {}
}
function wishlistControlHtml(workId) {
  const qty = wishlistItems[workId] || 0;
  if (qty > 0) {
    return `<span class="cl-w-wish on" data-wid="${workId}">` +
      `<button type="button" class="wq-btn" aria-label="减少" title="减少" onclick="decWishlistItem('${workId}',event)">−</button>` +
      `<b class="wq-num">${qty}</b>` +
      `<button type="button" class="wq-btn" aria-label="增加" title="增加" onclick="incWishlistItem('${workId}',event)">＋</button>` +
      `</span>`;
  }
  return `<button type="button" class="cl-w-wish" data-wid="${workId}" aria-label="加入心愿单" onclick="addToWishlist('${workId}',event)">＋ 心愿</button>`;
}
function refreshWishlistControl(workId) {
  document.querySelectorAll('.cl-w-wish[data-wid="' + workId + '"]').forEach(el => {
    const holder = document.createElement('div');
    holder.innerHTML = wishlistControlHtml(workId);
    el.replaceWith(holder.firstElementChild);
  });
}
async function activateWishlist() {
  if (wishlistMode) return true;
  let confirmed;
  try {
    confirmed = typeof showConfirm === 'function'
      ? await showConfirm('f7goods 不会提供任何直接交易的功能。\n本功能仅做购物模拟，以方便快速得知价格以及作者设定的购买方式。\n\n确认开启系列周边心愿单？')
      : confirm('确认开启系列周边心愿单？');
  } catch { confirmed = confirm('确认开启系列周边心愿单？'); }
  if (!confirmed) return false;
  wishlistMode = true;
  wishlistItems = {};
  saveWishlist();
  return true;
}
async function addToWishlist(workId, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!wishlistMode && !(await activateWishlist())) return;
  wishlistItems[workId] = (wishlistItems[workId] || 0) + 1;
  saveWishlist();
  refreshWishlistControl(workId);
  updateSeriesWishlistBar();
}
function incWishlistItem(workId, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!wishlistMode) return;
  wishlistItems[workId] = (wishlistItems[workId] || 0) + 1;
  saveWishlist();
  refreshWishlistControl(workId);
  updateSeriesWishlistBar();
}
function decWishlistItem(workId, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!wishlistItems[workId]) return;
  wishlistItems[workId]--;
  if (wishlistItems[workId] <= 0) delete wishlistItems[workId];
  saveWishlist();
  refreshWishlistControl(workId);
  updateSeriesWishlistBar();
}

let seriesWorks = [];
function seriesWishlistStats() {
  let count = 0, total = 0, freeCount = 0;
  const entries = [];
  Object.entries(wishlistItems).forEach(([wid, qty]) => {
    if (!qty) return;
    const work = seriesWorks.find(w => String(w.id) === String(wid));
    if (!work) return;
    const price = parseFloat(String(work.price || '').replace(/[^\d.]/g, '')) || 0;
    count += qty;
    total += price * qty;
    if (!price) freeCount += qty;
    entries.push({ work, qty, price, subtotal: price * qty });
  });
  return { count, total, freeCount, entries };
}
function updateSeriesWishlistBar() {
  const bar = document.getElementById('wishlistBar');
  if (!bar) return;
  const { count, total, freeCount, entries } = seriesWishlistStats();
  if (!wishlistMode || !entries.length) {
    bar.style.display = 'none';
    bar.innerHTML = '';
    document.body.classList.remove('has-wishlist-bar');
    document.body.style.removeProperty('--wl-bar-h');
    closeSeriesWishlistSheet();
    return;
  }
  bar.style.display = 'flex';
  document.body.classList.add('has-wishlist-bar');
  bar.innerHTML = `<div class="wl-info">已选 <b>${count}</b> 件 · 预估总价 <b>¥${total.toFixed(2)}</b><small>${freeCount ? `含 ${freeCount} 件无料周边（未计入总价）· ` : ''}仅供购物模拟，非交易订单</small></div>` +
    `<button type="button" class="wl-open" onclick="openSeriesWishlistSheet()">清单</button>`;
  requestAnimationFrame(() => {
    if (bar.style.display !== 'none') document.body.style.setProperty('--wl-bar-h', Math.ceil(bar.getBoundingClientRect().height) + 'px');
  });
}
function openSeriesWishlistSheet() {
  const overlay = document.getElementById('wishlistOverlay');
  if (!overlay) return;
  renderSeriesWishlistSheet();
  overlay.classList.add('open');
}
function closeSeriesWishlistSheet() {
  document.getElementById('wishlistOverlay')?.classList.remove('open');
}
function renderSeriesWishlistSheet() {
  const list = document.getElementById('wlList');
  const sum = document.getElementById('wlSum');
  if (!list || !sum) return;
  const { count, total, entries } = seriesWishlistStats();
  if (!entries.length) {
    list.innerHTML = '<div class="wl-empty">心愿单是空的<br>点击卡片价格旁的「＋ 心愿」开始添加</div>';
    sum.innerHTML = '';
    return;
  }
  list.innerHTML = entries.map(({ work, qty, subtotal }) => {
    const img = (work.images && work.images[0]) || '';
    const statusLabel = (typeof STATUS_LABELS !== 'undefined' && STATUS_LABELS[work.status]) || '';
    return `<div class="wl-item">
      ${img ? `<img class="thumb" src="${escapeHtml(imgUrl(img, 96))}" alt="" loading="lazy">` : `<span class="thumb">${escapeHtml((workTitle(work) || '?').charAt(0))}</span>`}
      <div class="n">
        <div class="t"><a href="/work-detail.html?id=${encodeURIComponent(work.id)}">${escapeHtml(workTitle(work))}</a></div>
        ${statusLabel ? `<small>${escapeHtml(statusLabel)}</small>` : ''}
        <div class="wl-qty">
          <button type="button" aria-label="减少" title="减少" onclick="seriesWlQty('${work.id}',-1,event)">−</button>
          <span class="num">${qty}</span>
          <button type="button" aria-label="增加" title="增加" onclick="seriesWlQty('${work.id}',1,event)">＋</button>
          <button type="button" class="del" aria-label="移除" title="移除" onclick="seriesWlQty('${work.id}',0,event)">移除</button>
        </div>
      </div>
      <div class="p${subtotal ? '' : ' free'}">${subtotal ? '¥' + subtotal.toFixed(2) : '无料'}</div>
    </div>`;
  }).join('');
  sum.innerHTML =
    '<div class="wl-sum"><span>件数</span><span>' + count + ' 件</span></div>' +
    '<div class="wl-sum total"><span>预估合计</span><span class="v">¥' + total.toFixed(2) + '</span></div>' +
    '<div class="wl-note">无料周边不计入合计</div>';
}
function seriesWlQty(workId, delta, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const next = (wishlistItems[workId] || 0) + delta;
  if (next <= 0) delete wishlistItems[workId];
  else wishlistItems[workId] = next;
  saveWishlist();
  refreshWishlistControl(workId);
  updateSeriesWishlistBar();
  if (document.getElementById('wishlistOverlay')?.classList.contains('open')) renderSeriesWishlistSheet();
}
function copySeriesWishlistText() {
  const { count, total, entries } = seriesWishlistStats();
  if (!entries.length) return;
  const lines = ['【f7goods · 系列心愿单】'];
  entries.forEach(({ work, qty, price, subtotal }) => {
    lines.push(`${workTitle(work)} × ${qty}  ${price ? '¥' + subtotal.toFixed(2) : '无料'}`);
  });
  lines.push('', `件数：${count} 件`, `预估合计：¥${total.toFixed(2)}`, '无料周边不计入合计');
  const text = lines.join('\n');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => {
    if (typeof showToast === 'function') showToast('清单已复制', 'success');
  }).catch(() => {});
  else if (typeof showToast === 'function') showToast('复制失败，请手动选择文本', 'error');
}
async function clearSeriesWishlist() {
  if (!Object.keys(wishlistItems).length) return;
  let ok = true;
  try {
    ok = typeof showConfirm === 'function'
      ? await showConfirm('确定清空本系列的心愿单？', { danger: true, confirmText: '清空' })
      : confirm('确定清空本系列的心愿单？');
  } catch { ok = confirm('确定清空本系列的心愿单？'); }
  if (!ok) return;
  wishlistItems = {};
  saveWishlist();
  document.querySelectorAll('.cl-w-wish').forEach(el => refreshWishlistControl(el.dataset.wid));
  updateSeriesWishlistBar();
}

(async function () {
  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('seriesDetail');
  if (!id) { root.innerHTML = '<div class="empty-state"><p>系列不存在</p></div>'; return; }
  try {
    if (typeof initPage === 'function') await initPage('projects', id);
    if (typeof onLangChange === 'function') onLangChange(() => location.reload());
    const res = await fetch('/api/series/' + encodeURIComponent(id));
    if (!res.ok) throw new Error('not found');
    const s = await res.json();
    seriesWorks = Array.isArray(s.works) ? s.works : [];
    seriesWorks = seriesWorks.filter((w, i, arr) => arr.findIndex(x => String(x.id) === String(w.id)) === i);
    const statusLabel = (typeof PROJECT_STATUS_LABELS !== 'undefined' && PROJECT_STATUS_LABELS[s.status]) || '招募中';
    const catLabel = s.category ? (PROJECT_CATEGORIES[s.category] || s.category) : '';
    const cover = s.cover || '';
    const dateText = (s.startDate || s.endDate)
      ? `${s.startDate ? formatDate(s.startDate) : '待定'} → ${s.endDate ? formatDate(s.endDate) : '待定'}`
      : '';
    document.title = `${s.name} — 系列周边 | f7goods`;
    document.querySelector('meta[name="description"]')?.setAttribute('content', `${s.name}，${s.owner?.name || ''} 的作品系列。`);
    root.innerHTML = `
      <div class="detail-breadcrumb">
        <a href="/projects.html">同人企划</a><span>›</span><span>系列周边</span><span>›</span><span>${escapeHtml(s.name)}</span>
      </div>
      <div class="ev-hero ${cover ? 'has-cover' : ''}" ${cover ? `style="background-image:url('${escapeHtml(imgUrl(cover, 1600))}');background-size:cover;background-position:center;"` : ''}>
        <div class="ev-hero-shade"></div>
        <div class="ev-hero-body">
          <div class="ev-hero-row">
            <span class="ev-chip">${escapeHtml(statusLabel)}</span>
            ${catLabel ? `<span class="ev-chip">${escapeHtml(catLabel)}</span>` : ''}
            <span class="ev-hero-share">${typeof renderShareButton === 'function' ? renderShareButton(s.name, location.href) : ''}</span>
          </div>
          <h1>${escapeHtml(s.name)}</h1>
          <div class="ev-hero-meta">${dateText ? `<span>📅 ${dateText}</span>` : ''}${s.owner ? `<span style="margin-left:1rem;">作者：${escapeHtml(s.owner.name)}</span>` : ''}</div>
        </div>
      </div>
      <div class="detail-content">
        <div class="detail-main">
          <h3 style="margin-bottom:1rem;font-size:1.1rem;">系列简介</h3>
          <p style="line-height:1.8;color:var(--ink);white-space:pre-wrap;">${escapeHtml(s.description || '暂无简介')}</p>
          <h3 style="margin:2rem 0 1rem;font-size:1.1rem;">系列作品 (${seriesWorks.length})</h3>
          ${seriesWorks.length ? `<div class="cards-grid series-works-grid">${seriesWorks.map(w => `
            <a class="card" href="/work-detail.html?id=${encodeURIComponent(w.id)}" style="text-decoration:none;color:inherit;">
              <div class="card-image">${w.images?.[0] ? `<img src="${escapeHtml(imgUrl(w.images[0], 320))}" alt="${escapeHtml(workTitle(w))}" loading="lazy">` : '<span class="placeholder-icon">🎨</span>'}</div>
              <div class="card-body">
                <span class="card-tag ${w.status}">${escapeHtml(STATUS_LABELS[w.status] || '')}</span>
                <h3 class="card-title" style="font-size:0.95rem;">${escapeHtml(workTitle(w))}</h3>
                <div class="series-card-foot">
                  <p class="card-price" style="color:var(--accent);font-weight:700;">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(w.price) : (w.price || ''))}</p>
                  ${wishlistControlHtml(w.id)}
                </div>
              </div>
            </a>`).join('')}</div>` : '<div class="empty-state"><p>这个系列还没有公开作品</p></div>'}
          ${s.contactInfo ? `<h3 style="margin:2rem 0 1rem;font-size:1.1rem;">参与方式 / 联系方式</h3><p style="line-height:1.8;color:var(--ink);white-space:pre-wrap;">${escapeHtml(s.contactInfo)}</p>` : ''}
        </div>
        <div class="detail-sidebar">
          <div class="sidebar-card">
            <h3>系列信息</h3>
            <div class="info-row"><span class="info-label">状态</span><span class="info-value">${escapeHtml(statusLabel)}</span></div>
            ${catLabel ? `<div class="info-row"><span class="info-label">分类</span><span class="info-value">${escapeHtml(catLabel)}</span></div>` : ''}
            ${s.startDate ? `<div class="info-row"><span class="info-label">开始日期</span><span class="info-value">${formatDate(s.startDate)}</span></div>` : ''}
            ${s.endDate ? `<div class="info-row"><span class="info-label">结束日期</span><span class="info-value">${formatDate(s.endDate)}</span></div>` : ''}
            <div class="info-row"><span class="info-label">作品数</span><span class="info-value">${seriesWorks.length}</span></div>
          </div>
          ${s.owner ? `<div class="sidebar-card"><h3>作者</h3><a href="/circle-detail.html?id=${encodeURIComponent(s.owner.id)}" style="display:flex;align-items:center;gap:.6rem;color:inherit;text-decoration:none;">
            ${s.owner.logo ? `<img src="${escapeHtml(imgUrl(s.owner.logo, 80))}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : ''}
            <b>${escapeHtml(s.owner.name)}</b>
          </a></div>` : ''}
          ${(s.tags || []).length ? `<div class="sidebar-card"><h3>标签</h3><div class="cl-chips">${s.tags.map(tg => `<a class="tag" href="/?tag=${encodeURIComponent(tg)}">${escapeHtml(tg)}</a>`).join('')}</div></div>` : ''}
        </div>
      </div>`;
    updateSeriesWishlistBar();
  } catch (e) {
    root.innerHTML = '<div class="empty-state"><div class="icon">!</div><p>系列不存在或暂未公开</p><p style="margin-top:.8rem;"><a class="detail-link" href="/projects.html">返回企划</a></p></div>';
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人动态</title>
  <meta name="description" content="了解同人圈的最新动态和重要更新。查看作者发布的新作品、活动信息和企划进展。">
  <meta property="og:title" content="f7goods — 同人动态">
  <meta property="og:description" content="了解同人圈的最新动态和重要更新。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.jpg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle" class="settings-pending" data-i18n="updates.heroTitle">📰 同人动态</h1>
    <p id="heroSubtitle" class="settings-pending" data-i18n="updates.heroSubtitle">了解同人圈的最新动态和重要更新</p>
  </section>

  <main class="main-content">
    <div class="page-header">
      <h2 id="pageTitle" class="settings-pending" data-i18n="updates.listTitle">动态列表</h2>
      <p id="pageSubtitle" class="settings-pending" data-i18n="updates.listSubtitle">按发布时间倒序排列</p>
    </div>

    <div class="filter-bar" id="statusFilters">
      <button class="filter-btn active" data-status="all" data-i18n="common.all">全部状态</button>
    </div>
    <div class="filter-bar" id="categoryFilters">
      <button class="filter-btn active" data-cat="all" data-i18n="common.all">全部分类</button>
      <div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;">
        <select class="form-input" id="sortSelect" style="padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;">
          <option value="date-desc" data-i18n="common.dateDesc">发布日期 ↓ 新→旧</option>
          <option value="date-asc" data-i18n="common.dateAsc">发布日期 ↑ 旧→新</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索动态..." id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
      </div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn" onclick="toggleFollowFilter()" id="followFilterBtn" data-i18n="common.follow">⭐ 关注</button>
    </div>

    <div class="cards-grid" id="updatesGrid">
      <div id="updatesSkeleton" class="skeleton-grid">
        <div class="skeleton-card" style="grid-column:1/-1;"><div class="skeleton" style="height:180px;border-radius:8px 8px 0 0;"></div><div style="padding:1rem;"><div class="skeleton skeleton-text" style="width:60%;"></div><div class="skeleton skeleton-text" style="width:40%;margin-top:0.5rem;"></div><div class="skeleton skeleton-text short" style="width:80%;margin-top:0.5rem;"></div></div></div>
        <div class="skeleton-card" style="grid-column:1/-1;"><div class="skeleton" style="height:180px;border-radius:8px 8px 0 0;"></div><div style="padding:1rem;"><div class="skeleton skeleton-text" style="width:70%;"></div><div class="skeleton skeleton-text" style="width:30%;margin-top:0.5rem;"></div><div class="skeleton skeleton-text short" style="width:75%;margin-top:0.5rem;"></div></div></div>
        <div class="skeleton-card" style="grid-column:1/-1;"><div class="skeleton" style="height:180px;border-radius:8px 8px 0 0;"></div><div style="padding:1rem;"><div class="skeleton skeleton-text" style="width:50%;"></div><div class="skeleton skeleton-text" style="width:45%;margin-top:0.5rem;"></div><div class="skeleton skeleton-text short" style="width:85%;margin-top:0.5rem;"></div></div></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('updates');

    let allUpdates = [];
    let circlesMap = {};
    let circlesData = [];
    let currentUpdateCategory = 'all';
    let currentUpdateStatus = 'all';
    let currentFollowFilter = false;

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      document.getElementById('followFilterBtn').classList.toggle('active', currentFollowFilter);
      renderUpdates();
    }

    function buildUpdateFilterButtons() {
      const cats = window._updateCategories || [];
      const status = window._updateStatus || [];
      // Category buttons
      const catContainer = document.getElementById('categoryFilters');
      const catHtml = `<button class="filter-btn active" data-cat="all">${t('common.allCategories')}</button>` +
        cats.map(c => `<button class="filter-btn" data-cat="${c.id}">${escapeHtml(tCat(c))}</button>`).join('');
      // Keep the sort/search area
      const rightSide = catContainer.querySelector('div[style*="margin-left:auto"]');
      catContainer.innerHTML = catHtml;
      if (rightSide) catContainer.appendChild(rightSide);
      catContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          catContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentUpdateCategory = btn.dataset.cat;
          renderUpdates();
        });
      });
      // Status buttons
      const statusContainer = document.getElementById('statusFilters');
      statusContainer.innerHTML = `<button class="filter-btn active" data-status="all">${t('common.allStatus')}</button>` +
        status.map(c => `<button class="filter-btn" data-status="${c.id}">${escapeHtml(tCat(c))}</button>`).join('');
      statusContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          statusContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentUpdateStatus = btn.dataset.status;
          renderUpdates();
        });
      });
    }

    async function loadUpdates() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        const ps = getPageSettings('updates');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('updates');
        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');

        const [updates, circles, catsResp] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getCircles(),
          fetch('/api/categories').then(r => r.json())
        ]);
        allUpdates = updates;
        circlesData = circles;
        circles.forEach(c => circlesMap[c.id] = c.name);
        window._updateCategories = catsResp.updateCategories || [];
        window._updateStatus = catsResp.updateStatus || [];
        buildUpdateFilterButtons();

        renderUpdates();
        document.getElementById('searchInput').addEventListener('input', debounce(renderUpdates));
        document.getElementById('sortSelect').addEventListener('change', renderUpdates);
      } catch (e) {
        document.getElementById('updatesGrid').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请稍后重试</p></div>';
      }
    }

    function renderUpdates() {
      const grid = document.getElementById('updatesGrid');
      // Remove skeleton
      document.getElementById('updatesSkeleton')?.remove();
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sortVal = document.getElementById('sortSelect')?.value || 'date-desc';
      let filtered = [...allUpdates];

      // Category filter
      if (currentUpdateCategory !== 'all') {
        filtered = filtered.filter(u => u.category === currentUpdateCategory);
      }
      // Status filter
      if (currentUpdateStatus !== 'all') {
        filtered = filtered.filter(u => u.status === currentUpdateStatus);
      }

      // Follow filter
      if (currentFollowFilter) {
        const followedList = getFollowedCircles();
        filtered = filtered.filter(u => (u.relatedCircles || []).some(cid => followedList.includes(cid)));
      }

      if (search) {
        filtered = filtered.filter(u =>
          u.title.toLowerCase().includes(search) ||
          (u.content || '').toLowerCase().includes(search)
        );
      }
      // Apply sorting
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => new Date(a.publishDate) - new Date(b.publishDate));
      } else {
        filtered.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📰</div><p>暂无动态</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(u => {
        const preview = u.content.length > 60 ? u.content.substring(0, 60) + '...' : u.content;
        const authorNames = (u.relatedCircles || []).map(cid => circlesMap[cid]).filter(Boolean).join('、');
        return `
        <div class="card" onclick="location.href='/update-detail.html?id=${u.id}'">
          <div class="card-image" style="${(u.coverImage || (u.images && u.images.length > 0)) ? '' : 'background:linear-gradient(135deg,#9b59b6,#8e44ad);'}">
            ${u.coverImage
              ? `<img src="${u.coverImage}" alt="${escapeHtml(u.title)}" loading="lazy">`
              : (u.images && u.images.length > 0
                ? `<img src="${u.images[0]}" alt="${escapeHtml(u.title)}" loading="lazy">`
                : '<span class="placeholder-icon" style="color:white;">📰</span>')}
          </div>
          <div class="card-body">
            ${u.pinned ? '<span class="card-tag" style="background:var(--accent);color:white;">置顶</span>' : ''}
            <h3 class="card-title">${escapeHtml(u.title)}</h3>
            ${authorNames ? `<p style="font-size:0.75rem;color:var(--accent);margin-top:0.2rem;">${escapeHtml(authorNames)}</p>` : ''}
            <p class="card-subtitle" style="color:var(--haze);font-size:0.8rem;">${escapeHtml(preview)}</p>
          </div>
          <div class="card-footer">
            <span class="card-date">${formatDate(u.publishDate)}</span>
          </div>
        </div>`;
      }).join('');
    }

    loadUpdates();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人动态</title>
  <meta name="description" content="了解同人圈的最新动态和重要更新。查看作者发布的新作品、活动信息和企划进展。">
  <meta property="og:title" content="f7goods — 同人动态">
  <meta property="og:description" content="了解同人圈的最新动态和重要更新。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="https://f7goods.com/uploads/og-image.png">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20261027c">
<link rel="canonical" href="https://f7goods.com/updates.html">
<meta property="og:url" content="https://f7goods.com/updates.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="zh-CN" href="https://f7goods.com/updates.html">
<link rel="alternate" hreflang="x-default" href="https://f7goods.com/updates.html">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

<main class="main-content updates-page">
    <header class="upd-head">
      <div>
        <div class="upd-kicker">COMMUNITY JOURNAL</div>
        <h1 id="heroTitle" class="settings-pending" data-i18n="updates.heroTitle">同人动态</h1>
        <p id="heroSubtitle" class="settings-pending" data-i18n="updates.heroSubtitle">按时间记录作者公告、作品更新与社区投稿</p>
      </div>
      <div class="upd-head-stats">
        <div><b id="updateTotalCount">0</b><span>条动态</span></div>
        <div><b id="updateAuthorCount">0</b><span>位作者</span></div>
        <div><b id="updateLatestYear">—</b><span>最新年份</span></div>
      </div>
    </header>
    <span id="pageTitle" style="display:none"></span>
    <span id="pageSubtitle" style="display:none"></span>

    <div class="upd-toolbar">
      <div class="upd-filters" id="categoryFilters"></div>
      <span class="upd-sep" aria-hidden="true"></span>
      <button type="button" class="filter-btn" id="followFilterBtn" onclick="toggleFollowFilter()" data-i18n="common.follow">关注</button>
      <div class="upd-toolbar-spacer"></div>
      <select class="upd-select" id="sortSelect">
        <option value="date-desc" selected data-i18n="common.dateDesc">发布日期 ↓ 新→旧</option>
        <option value="date-asc" data-i18n="common.dateAsc">发布日期 ↑ 旧→新</option>
      </select>
      <input type="text" class="upd-search" placeholder="搜索动态、作者…" id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
      <span style="display:none;">显示 <b id="updateShowCount">0</b></span>
    </div>

    <div id="relationFilterBar" class="upd-rel-filter" style="display:none;"></div>

    <div id="updatesGrid" class="upd-timeline">
      <div id="updatesSkeleton">
        <div class="skeleton-card" style="height:170px;margin-bottom:12px;"></div>
        <div class="skeleton-card" style="height:170px;"></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js?v=20261027c"></script>
  <script src="/js/pull-to-refresh.js"></script>
  <script src="/js/i18n.js?v=20261027c"></script>
  <script src="/js/main.js?v=20261027c"></script>
  <script>
    initPage('updates');
    if (typeof mountAuthorCreateFab === 'function') mountAuthorCreateFab({ label: '发布动态', tab: 'my-updates' });

    let allUpdates = [];
    let circlesMap = {};
    let circleLogosMap = {};
    let circlesData = [];
    let currentUpdateCategory = 'all';
    let currentFollowFilter = false;
    const relationParams = new URLSearchParams(location.search);
    const relatedEventId = relationParams.get('event') || '';
    const relatedProjectId = relationParams.get('project') || '';
    const relatedName = relationParams.get('name') || '';

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      const btn = document.getElementById('followFilterBtn');
      btn.classList.toggle('active', currentFollowFilter);
      renderUpdates();
    }

    let updateCatLabels = {};
    let updateStLabels = {};

    function buildUpdateFilterButtons() {
      const cats = window._updateCategories || [];
      const status = window._updateStatus || [];
      updateCatLabels = {};
      updateStLabels = {};
      cats.forEach(c => updateCatLabels[c.id] = tCat(c));
      status.forEach(s => updateStLabels[s.id] = tCat(s));

      // Category filters
      const catContainer = document.getElementById('categoryFilters');
      catContainer.innerHTML = `<button type="button" class="filter-btn active" data-cat="all">${t('common.allCategories')}</button>` +
        cats.map(c => `<button type="button" class="filter-btn" data-cat="${c.id}">${escapeHtml(tCat(c))}</button>`).join('');
      catContainer.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          catContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentUpdateCategory = btn.dataset.cat;
          renderUpdates();
        });
      });
    }

    async function loadUpdates() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        const ps = getPageSettings('updates');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('updates');
        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');

        const [updates, circles, catsResp] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getCircles(),
          fetch('/api/categories').then(r => r.json())
        ]);
        allUpdates = updates;
        circlesData = circles;
        circles.forEach(c => {
          circlesMap[c.id] = c.name;
          circleLogosMap[c.id] = c.logo || '';
        });
        window._updateCategories = catsResp.updateCategories || [];
        window._updateStatus = catsResp.updateStatus || [];
        buildUpdateFilterButtons();

        renderUpdates();
        document.getElementById('searchInput').addEventListener('input', debounce(renderUpdates));
        document.getElementById('sortSelect').addEventListener('change', renderUpdates);
      } catch (e) {
        document.getElementById('updatesGrid').innerHTML =
          `<div class="empty-state"><div class="icon">⚠️</div><p>${t('common.loadFailed')}</p></div>`;
      }
    }

    function monthKeyOf(dateStr) {
      return String(dateStr || '').slice(0, 7);
    }
    function monthLabelOf(key) {
      const parts = key.split('-');
      if (parts.length < 2) return key || '未标日期';
      return parts[0] + ' 年 ' + Number(parts[1]) + ' 月';
    }

function updateDateParts(u) {
  const d = String(u.publishDate || '');
  const year = d.slice(0, 4);
  const month = Number(d.slice(5, 7)) || '';
  const day = d.slice(8, 10) || '';
  return { year, month, day };
}

function updateRowHtml(u) {
  const cover = u.coverImage || (u.images && u.images[0]) || '';
  const authorCid = (u.relatedCircles || [])[0];
  const authorName = authorCid ? (circlesMap[authorCid] || '未知作者') : 'f7goods';
  const authorLogo = authorCid ? (circleLogosMap[authorCid] || '') : '';
  const catLabel = updateCatLabels[u.category] || '';
  const stLabel = updateStLabels[u.status] || '';
  const d = updateDateParts(u);
  const content = String(u.content || '').replace(/\s+/g, ' ').trim();
  const readTime = content.length > 400 ? '阅读约 ' + Math.max(2, Math.round(content.length / 400)) + ' 分钟' : '短动态';
  return `<div class="upd-row">
    <div class="upd-row-date"><b>${d.day || '—'}</b><span>${d.month ? d.month + ' 月' : '日期待定'}</span></div>
    <a class="upd-card${cover ? '' : ' no-image'}" href="/update-detail.html?id=${encodeURIComponent(u.id)}">
      <div class="upd-card-body">
        <div class="upd-card-head">
          ${authorLogo ? `<img src="${escapeHtml(imgUrl(authorLogo, 80))}" alt="" loading="lazy">` : `<span class="upd-avatar-fallback">${escapeHtml(authorName.charAt(0))}</span>`}
          <b>${escapeHtml(authorName)}</b><small>${escapeHtml(u.publishDate || '')}</small>
          <div class="upd-tags">${catLabel ? `<span class="upd-tag cat">${escapeHtml(catLabel)}</span>` : ''}${stLabel ? `<span class="upd-tag">${escapeHtml(stLabel)}</span>` : ''}</div>
        </div>
        <h2>${escapeHtml(u.title)}</h2>
        ${content ? `<p class="upd-excerpt">${escapeHtml(content)}</p>` : ''}
        <div class="upd-card-foot"><span>${readTime}</span><span class="go">阅读全文 →</span></div>
      </div>
      ${cover ? `<div class="upd-cover"><img src="${escapeHtml(imgUrl(cover, 480))}" alt="${escapeHtml(u.title)}" loading="lazy"></div>` : ''}
    </a>
  </div>`;
}

function renderUpdates() {
  const grid = document.getElementById('updatesGrid');
  document.getElementById('updatesSkeleton')?.remove();
  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const sortVal = document.getElementById('sortSelect')?.value || 'date-desc';
  let filtered = [...allUpdates];

  if (currentUpdateCategory !== 'all') filtered = filtered.filter(u => u.category === currentUpdateCategory);
  if (currentFollowFilter) {
    const followedList = getFollowedCircles();
    filtered = filtered.filter(u => (u.relatedCircles || []).some(cid => followedList.includes(cid)));
  }
  if (relatedEventId) {
    filtered = filtered.filter(u => (u.relatedEvents || []).includes(relatedEventId));
  }
  if (relatedProjectId) {
    filtered = filtered.filter(u => (u.relatedProjects || []).includes(relatedProjectId));
  }
  if (search) {
    filtered = filtered.filter(u =>
      u.title.toLowerCase().includes(search) ||
      (u.content || '').toLowerCase().includes(search)
    );
  }
  if (sortVal === 'date-asc') filtered.sort((a, b) => new Date(a.publishDate) - new Date(b.publishDate));
  else filtered.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));

  const totalEl = document.getElementById('updateTotalCount');
  if (totalEl) totalEl.textContent = allUpdates.length;
  const showEl = document.getElementById('updateShowCount');
  if (showEl) showEl.textContent = filtered.length;
  const authorIds = new Set();
  allUpdates.forEach(u => (u.relatedCircles || []).forEach(cid => authorIds.add(cid)));
  if (document.getElementById('updateAuthorCount')) document.getElementById('updateAuthorCount').textContent = authorIds.size;
  const years = allUpdates.map(u => Number(String(u.publishDate || '').slice(0, 4))).filter(y => y > 1900);
  if (document.getElementById('updateLatestYear')) document.getElementById('updateLatestYear').textContent = years.length ? Math.max(...years) : '—';
  const relationBar = document.getElementById('relationFilterBar');
  if (relationBar && (relatedEventId || relatedProjectId)) {
    const label = relatedName ? escapeHtml(relatedName) : (relatedEventId ? '活动动态' : '企划动态');
    relationBar.style.display = 'flex';
    relationBar.innerHTML = `<span>仅显示：<b>${label}</b></span><a href="/updates.html">清除筛选</a>`;
  }

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">📰</div><p>${t('common.noUpdates')}</p></div>`;
    return;
  }

  let html = '';
  let lastMonth = null;
  filtered.forEach(u => {
    const mk = monthKeyOf(u.publishDate);
    if (mk !== lastMonth) {
      const label = monthLabelOf(mk);
      let en = '';
      const parts = mk.split('-');
      if (parts.length === 2) {
        const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
        if (!isNaN(dt.getTime())) en = dt.toLocaleString('en', { month: 'long' }).toUpperCase() + ' ' + parts[0];
      }
      html += `<div class="upd-month"><b>${escapeHtml(label)}</b><span>${escapeHtml(en)}</span><div class="rule"></div></div>`;
      lastMonth = mk;
    }
    html += updateRowHtml(u);
  });
  grid.innerHTML = html;
}
    loadUpdates();
    if (typeof onLangChange === 'function') onLangChange(() => { try { renderUpdates(); } catch {} });

    PullToRefresh.init({
      onRefresh: async () => {
        const [updates, circles] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getCircles()
        ]);
        allUpdates = updates;
        circlesData = circles;
        circles.forEach(c => {
          circlesMap[c.id] = c.name;
          circleLogosMap[c.id] = c.logo || '';
        });
        renderUpdates();
      }
    });
  </script>
</body>
</html>

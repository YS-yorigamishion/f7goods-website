<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人动态</title>
  <meta name="description" content="了解同人圈的最新动态和重要更新。查看作者发布的新作品、活动信息和企划进展。">
  <meta property="og:title" content="f7goods — 同人动态">
  <meta property="og:description" content="了解同人圈的最新动态和重要更新。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260911l">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero cl-list-hero">
    <div class="cl-list-mast">
      <div>
        <h1 id="heroTitle" class="settings-pending" data-i18n="updates.heroTitle">同人动态</h1>
        <p id="heroSubtitle" class="settings-pending" data-i18n="updates.heroSubtitle">了解同人圈的最新动态和重要更新</p>
      </div>
      <div class="cl-list-count">共 <b id="updateTotalCount">0</b> 条动态</div>
    </div>
    <div class="cl-list-sub">
      <strong id="pageTitle" class="settings-pending" data-i18n="updates.listTitle">动态列表</strong>
      <span id="pageSubtitle" class="settings-pending" data-i18n="updates.listSubtitle">按发布时间倒序排列</span>
    </div>
  </section>

  <main class="main-content">
    <div class="cl-toolbar-card">
      <div class="cl-toolbar-row">
        <div id="categoryFilters" style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;"></div>
      </div>
      <div class="cl-toolbar-row">
        <button type="button" class="pill" id="followFilterBtn" onclick="toggleFollowFilter()" data-i18n="common.follow">关注</button>
      </div>
      <div class="cl-toolbar-row">
        <span class="spacer"></span>
        <select class="form-input" id="sortSelect">
          <option value="date-desc" selected data-i18n="common.dateDesc">发布日期 ↓ 新→旧</option>
          <option value="date-asc" data-i18n="common.dateAsc">发布日期 ↑ 旧→新</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索动态..." id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
        <span class="cl-show-count">显示 <b id="updateShowCount">0</b></span>
      </div>
    </div>

    <div id="updatesGrid" class="cl-feed">
      <div id="updatesSkeleton">
        <div class="skeleton-card" style="margin-bottom:0.6rem;"><div style="display:flex;gap:0;"><div class="skeleton" style="width:168px;height:104px;flex-shrink:0;"></div><div style="padding:0.8rem;flex:1;"><div class="skeleton skeleton-text" style="width:60%;"></div><div class="skeleton skeleton-text short" style="width:80%;margin-top:0.5rem;"></div></div></div></div>
        <div class="skeleton-card" style="margin-bottom:0.6rem;"><div style="display:flex;gap:0;"><div class="skeleton" style="width:168px;height:104px;flex-shrink:0;"></div><div style="padding:0.8rem;flex:1;"><div class="skeleton skeleton-text" style="width:70%;"></div><div class="skeleton skeleton-text short" style="width:75%;margin-top:0.5rem;"></div></div></div></div>
        <div class="skeleton-card"><div style="display:flex;gap:0;"><div class="skeleton" style="width:168px;height:104px;flex-shrink:0;"></div><div style="padding:0.8rem;flex:1;"><div class="skeleton skeleton-text" style="width:50%;"></div><div class="skeleton skeleton-text short" style="width:85%;margin-top:0.5rem;"></div></div></div></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/pull-to-refresh.js"></script>
  <script src="/js/main.js?v=20260911f"></script>
  <script>
    initPage('updates');

    let allUpdates = [];
    let circlesMap = {};
    let circlesData = [];
    let currentUpdateCategory = 'all';
    let currentFollowFilter = false;

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      const btn = document.getElementById('followFilterBtn');
      btn.classList.toggle('on', currentFollowFilter);
      btn.classList.toggle('active', currentFollowFilter);
      renderUpdates();
    }

    let updateCatLabels = {};
    let updateStLabels = {};

    function buildUpdateFilterButtons() {
      const cats = window._updateCategories || [];
      const status = window._updateStatus || [];
      updateCatLabels = {};
      updateStLabels = {};
      cats.forEach(c => updateCatLabels[c.id] = tCat(c));
      status.forEach(s => updateStLabels[s.id] = tCat(s));

      // Category pills
      const catContainer = document.getElementById('categoryFilters');
      catContainer.innerHTML = `<button type="button" class="pill on" data-cat="all">${t('common.allCategories')}</button>` +
        cats.map(c => `<button type="button" class="pill" data-cat="${c.id}">${escapeHtml(tCat(c))}</button>`).join('');
      catContainer.querySelectorAll('.pill').forEach(btn => {
        btn.addEventListener('click', () => {
          catContainer.querySelectorAll('.pill').forEach(b => b.classList.remove('on'));
          btn.classList.add('on');
          currentUpdateCategory = btn.dataset.cat;
          renderUpdates();
        });
      });
    }

    async function loadUpdates() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        const ps = getPageSettings('updates');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('updates');
        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');

        const [updates, circles, catsResp] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getCircles(),
          fetch('/api/categories').then(r => r.json())
        ]);
        allUpdates = updates;
        circlesData = circles;
        circles.forEach(c => circlesMap[c.id] = c.name);
        window._updateCategories = catsResp.updateCategories || [];
        window._updateStatus = catsResp.updateStatus || [];
        buildUpdateFilterButtons();

        renderUpdates();
        document.getElementById('searchInput').addEventListener('input', debounce(renderUpdates));
        document.getElementById('sortSelect').addEventListener('change', renderUpdates);
      } catch (e) {
        document.getElementById('updatesGrid').innerHTML =
          `<div class="empty-state"><div class="icon">⚠️</div><p>${t('common.loadFailed')}</p></div>`;
      }
    }

    function monthKeyOf(dateStr) {
      return String(dateStr || '').slice(0, 7);
    }
    function monthLabelOf(key) {
      const parts = key.split('-');
      if (parts.length < 2) return key || '未标日期';
      return parts[0] + ' 年 ' + Number(parts[1]) + ' 月';
    }

    function updateRowHtml(u, isPinned) {
      const cover = u.coverImage || (u.images && u.images[0]) || '';
      const authorNames = (u.relatedCircles || []).map(cid => circlesMap[cid]).filter(Boolean).join('、');
      const catLabel = updateCatLabels[u.category] || '';
      const stLabel = updateStLabels[u.status] || '';
      const stDone = /结束|完成/.test(stLabel);
      const d = String(u.publishDate || '');
      const day = d.slice(8, 10) || '';
      const mon = d.slice(5, 7) ? Number(d.slice(5, 7)) + '月' : '';
      return `
        <div class="cl-upd-row${isPinned ? ' pinned' : ''}">
          <div class="cl-upd-date">${day ? `<b>${day}</b>${mon}` : ''}</div>
          <a class="cl-upd-card${isPinned ? ' pinned' : ''}" href="/update-detail.html?id=${encodeURIComponent(u.id)}">
            <div class="cl-upd-thumb">
              ${cover
                ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(u.title)}" loading="lazy">`
                : `<span style="position:relative;z-index:1;">${escapeHtml((u.title || '?').charAt(0))}</span>`}
            </div>
            <div class="cl-upd-main">
              <div class="cl-upd-meta">
                ${isPinned ? `<span class="cl-upd-chip pin">${t('updates.pinned') || '置顶'}</span>` : ''}
                ${catLabel ? `<span class="cl-upd-chip cat">${escapeHtml(catLabel)}</span>` : ''}
                ${stLabel ? `<span class="cl-upd-chip${stDone ? ' done' : ''}">${escapeHtml(stLabel)}</span>` : ''}
              </div>
              <div class="cl-upd-title">${escapeHtml(u.title)}</div>
              ${authorNames ? `<div class="cl-upd-author">${escapeHtml(authorNames)}</div>` : ''}
              <div class="cl-upd-excerpt">${escapeHtml(u.content || '')}</div>
            </div>
          </a>
        </div>`;
    }

    function renderUpdates() {
      const grid = document.getElementById('updatesGrid');
      // Remove skeleton
      document.getElementById('updatesSkeleton')?.remove();
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sortVal = document.getElementById('sortSelect')?.value || 'date-desc';
      let filtered = [...allUpdates];

      // Category filter
      if (currentUpdateCategory !== 'all') {
        filtered = filtered.filter(u => u.category === currentUpdateCategory);
      }

      // Follow filter
      if (currentFollowFilter) {
        const followedList = getFollowedCircles();
        filtered = filtered.filter(u => (u.relatedCircles || []).some(cid => followedList.includes(cid)));
      }

      if (search) {
        filtered = filtered.filter(u =>
          u.title.toLowerCase().includes(search) ||
          (u.content || '').toLowerCase().includes(search)
        );
      }
      // Apply sorting
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => new Date(a.publishDate) - new Date(b.publishDate));
      } else {
        filtered.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
      }

      const totalEl = document.getElementById('updateTotalCount');
      if (totalEl) totalEl.textContent = allUpdates.length;
      const showEl = document.getElementById('updateShowCount');
      if (showEl) showEl.textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="icon">📰</div><p>${t('common.noUpdates')}</p></div>`;
        return;
      }

      // Pinned first, then month-grouped timeline
      const pinned = filtered.filter(u => u.pinned);
      const rest = filtered.filter(u => !u.pinned);

      let html = '';
      if (pinned.length) {
        html += `<div class="cl-pin-label">${t('updates.pinned') || '置顶'}动态</div>`;
        html += pinned.map(u => updateRowHtml(u, true)).join('');
      }

      let lastMonth = null;
      rest.forEach(u => {
        const mk = monthKeyOf(u.publishDate);
        if (mk !== lastMonth) {
          html += `<div class="cl-month-sep"><span>${escapeHtml(monthLabelOf(mk))}</span></div>`;
          lastMonth = mk;
        }
        html += updateRowHtml(u, false);
      });

      grid.innerHTML = html;
    }

    loadUpdates();

    PullToRefresh.init({
      onRefresh: async () => {
        const [updates, circles] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getCircles()
        ]);
        allUpdates = updates;
        circlesData = circles;
        circles.forEach(c => circlesMap[c.id] = c.name);
        renderUpdates();
      }
    });
  </script>
</body>
</html>

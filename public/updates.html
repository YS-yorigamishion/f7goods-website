<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人动态</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .update-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }
    .update-card:hover {
      box-shadow: var(--shadow-md);
    }
    .update-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
      gap: 1rem;
    }
    .update-title {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
    }
    .update-date {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: white;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .update-preview {
      font-size: 0.9rem;
      color: var(--haze);
      line-height: 1.6;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .update-content {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.8;
      display: none;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
    }
    .update-card.expanded .update-preview {
      display: none;
    }
    .update-card.expanded .update-content {
      display: block;
    }
    .update-card.expanded .update-header {
      margin-bottom: 0.8rem;
    }
    .update-expand-hint {
      font-size: 0.75rem;
      color: var(--haze);
      margin-top: 0.5rem;
    }
    .update-card.expanded .update-expand-hint {
      display: none;
    }
    .update-related {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      display: none;
    }
    .update-card.expanded .update-related {
      display: block;
    }
    .update-related a {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      background: rgba(233, 69, 96, 0.06);
      color: var(--accent);
      border-radius: 100px;
      font-size: 0.8rem;
      text-decoration: none;
      margin: 0.2rem 0.2rem;
      transition: var(--transition);
    }
    .update-related a:hover {
      background: rgba(233, 69, 96, 0.12);
    }
    @media (max-width: 768px) {
      .update-card {
        padding: 1rem 1.2rem;
      }
      .update-header {
        flex-direction: column;
      }
      .update-title {
        font-size: 1.1rem;
      }
      .update-preview {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle">📰 同人动态</h1>
    <p id="heroSubtitle">了解同人圈的最新动态和重要更新</p>
  </section>

  <main class="main-content">
    <div class="page-header">
      <h2 id="pageTitle">动态列表</h2>
      <p id="pageSubtitle">按发布时间倒序排列</p>
    </div>

    <div id="updatesContainer">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('updates');

    async function loadUpdates() {
      try {
        const [updates, allEvents, allProjects] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getEvents(),
          F7API.getProjects()
        ]);

        const container = document.getElementById('updatesContainer');

        if (!updates || updates.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">📰</div><p>暂无动态</p></div>';
          return;
        }

        const eventsMap = {};
        allEvents.forEach(e => eventsMap[e.id] = e.title);
        const projectsMap = {};
        allProjects.forEach(p => projectsMap[p.id] = p.title);

        container.innerHTML = updates.map(u => {
          const preview = u.content.length > 80 ? u.content.substring(0, 80) + '...' : u.content;
          const relatedLinks = [];
          (u.relatedEvents || []).forEach(eid => {
            if (eventsMap[eid]) relatedLinks.push('<a href="/event-detail.html?id=' + eid + '">📅 ' + escapeHtml(eventsMap[eid]) + '</a>');
          });
          (u.relatedProjects || []).forEach(pid => {
            if (projectsMap[pid]) relatedLinks.push('<a href="/project-detail.html?id=' + pid + '">📋 ' + escapeHtml(projectsMap[pid]) + '</a>');
          });
          return `
          <div class="update-card" ${u.pinned ? 'style="border-left:3px solid var(--accent);"' : ''} onclick="this.classList.toggle('expanded')">
            <div class="update-header">
              <h3 class="update-title">${u.pinned ? '📌 ' : ''}${escapeHtml(u.title)}</h3>
              <span class="update-date">${formatDate(u.publishDate)}</span>
            </div>
            <div class="update-preview">${escapeHtml(preview)}</div>
            <div class="update-content">${nl2br(u.content)}</div>
            ${relatedLinks.length > 0 ? '<div class="update-related">' + relatedLinks.join('') + '</div>' : ''}
            <div class="update-expand-hint">点击查看详情 ›</div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('updatesContainer').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请稍后重试</p></div>';
      }
    }

    loadUpdates();
  </script>
</body>
</html>

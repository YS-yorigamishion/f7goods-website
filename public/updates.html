<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人动态</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle" class="settings-pending">📰 同人动态</h1>
    <p id="heroSubtitle" class="settings-pending">了解同人圈的最新动态和重要更新</p>
  </section>

  <main class="main-content">
    <div class="page-header">
      <h2 id="pageTitle" class="settings-pending">动态列表</h2>
      <p id="pageSubtitle" class="settings-pending">按发布时间倒序排列</p>
    </div>

    <div class="filter-bar">
      <div id="updateCategoryFilters" style="display:flex;gap:0.4rem;flex-wrap:wrap;">
        <button class="filter-btn active" data-cat="all">全部</button>
        <button class="filter-btn" data-cat="geren">个人</button>
        <button class="filter-btn" data-cat="shetuan">社团</button>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;">
        <select class="form-input" id="sortSelect" style="padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;">
          <option value="date-desc">发布日期 ↓ 新→旧</option>
          <option value="date-asc">发布日期 ↑ 旧→新</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索动态..." id="searchInput">
      </div>
    </div>

    <div class="cards-grid" id="updatesGrid">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('updates');

    let allUpdates = [];
    let circlesMap = {};
    let circlesData = [];
    let currentUpdateCategory = 'all';

    async function loadUpdates() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        const ps = getPageSettings('updates');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('updates');
        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));

        const [updates, circles] = await Promise.all([
          fetch('/api/updates').then(r => r.json()),
          F7API.getCircles()
        ]);
        allUpdates = updates;
        circlesData = circles;
        circles.forEach(c => circlesMap[c.id] = c.name);

        // Bind category filter events
        document.querySelectorAll('#updateCategoryFilters .filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#updateCategoryFilters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentUpdateCategory = btn.dataset.cat;
            renderUpdates();
          });
        });

        renderUpdates();
        document.getElementById('searchInput').addEventListener('input', debounce(renderUpdates));
        document.getElementById('sortSelect').addEventListener('change', renderUpdates);
      } catch (e) {
        document.getElementById('updatesGrid').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请稍后重试</p></div>';
      }
    }

    function renderUpdates() {
      const grid = document.getElementById('updatesGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sortVal = document.getElementById('sortSelect')?.value || 'date-desc';
      let filtered = [...allUpdates];

      // Category filter
      if (currentUpdateCategory !== 'all') {
        filtered = filtered.filter(u => {
          return (u.relatedCircles || []).some(cid => {
            const circle = circlesData.find(c => c.id === cid);
            return circle && circle.category === currentUpdateCategory;
          });
        });
      }

      if (search) {
        filtered = filtered.filter(u =>
          u.title.toLowerCase().includes(search) ||
          (u.content || '').toLowerCase().includes(search)
        );
      }
      // Apply sorting
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => new Date(a.publishDate) - new Date(b.publishDate));
      } else {
        filtered.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">📰</div><p>暂无动态</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(u => {
        const preview = u.content.length > 60 ? u.content.substring(0, 60) + '...' : u.content;
        const authorNames = (u.relatedCircles || []).map(cid => circlesMap[cid]).filter(Boolean).join('、');
        return `
        <div class="card" onclick="location.href='/update-detail.html?id=${u.id}'">
          <div class="card-image" style="${(u.coverImage || (u.images && u.images.length > 0)) ? '' : 'background:linear-gradient(135deg,#9b59b6,#8e44ad);'}">
            ${u.coverImage
              ? `<img src="${u.coverImage}" alt="${u.title}">`
              : (u.images && u.images.length > 0
                ? `<img src="${u.images[0]}" alt="${u.title}">`
                : '<span class="placeholder-icon" style="color:white;">📰</span>')}
          </div>
          <div class="card-body">
            ${u.pinned ? '<span class="card-tag" style="background:var(--accent);color:white;">置顶</span>' : ''}
            <h3 class="card-title">${escapeHtml(u.title)}</h3>
            ${authorNames ? `<p style="font-size:0.75rem;color:var(--accent);margin-top:0.2rem;">${escapeHtml(authorNames)}</p>` : ''}
            <p class="card-subtitle" style="color:var(--haze);font-size:0.8rem;">${escapeHtml(preview)}</p>
          </div>
          <div class="card-footer">
            <span class="card-date">${formatDate(u.publishDate)}</span>
          </div>
        </div>`;
      }).join('');
    }

    loadUpdates();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人企划</title>
  <meta name="description" content="发现正在进行的同人企划，加入创作团队。浏览招募中、进行中和已完成的企划。">
  <meta property="og:title" content="f7goods — 同人企划">
  <meta property="og:description" content="发现正在进行的同人企划，加入创作团队。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260912c">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero cl-list-hero">
    <div class="cl-list-mast">
      <div>
        <h1 id="heroTitle" class="settings-pending" data-i18n="projects.heroTitle">同人企划</h1>
        <p id="heroSubtitle" class="settings-pending" data-i18n="projects.heroSubtitle">发现正在进行的同人企划，加入创作团队</p>
      </div>
      <div class="cl-list-count">共 <b id="projectTotalCount">0</b> 个企划</div>
    </div>
    <div class="cl-list-sub">
      <strong id="pageTitle" class="settings-pending" data-i18n="projects.listTitle">企划列表</strong>
      <span id="pageSubtitle" class="settings-pending" data-i18n="projects.listSubtitle">正在进行或招募中的同人企划项目</span>
    </div>
  </section>

  <main class="main-content">
    <div class="cl-toolbar-card">
      <div class="cl-toolbar-row">
        <div id="statusFilters" style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;"></div>
        <span class="cl-toolbar-sep" aria-hidden="true"></span>
        <div id="categoryFilters" style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;"></div>
      </div>
      <div class="cl-toolbar-row">
        <button type="button" class="filter-btn" id="followFilterBtn" onclick="toggleFollowFilter()" data-i18n="common.follow">关注</button>
        <select class="form-input" id="sortSelect">
          <option value="date-desc" selected data-i18n="common.dateDesc">创建日期 ↓ 新→旧</option>
          <option value="date-asc" data-i18n="common.dateAsc">创建日期 ↑ 旧→新</option>
          <option value="name-asc" data-i18n="common.nameAsc">名称 A→Z</option>
          <option value="progress-desc">进度 ↓</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索企划..." id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
        <span class="cl-show-count">显示 <b id="projectShowCount">0</b></span>
      </div>
    </div>

    <div class="cards-grid cl-proj-grid" id="projectsGrid">
      <div id="projectsSkeleton" class="skeleton-grid">
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/pull-to-refresh.js"></script>
  <script src="/js/main.js?v=20260912e"></script>
  <script>
    initPage('projects');
    if (typeof mountAuthorCreateFab === 'function') mountAuthorCreateFab({ label: '发布企划', tab: 'my-projects' });

    let allProjects = [];
    let currentStatus = 'all';
    let currentCategory = 'all';
    let currentFollowFilter = false;

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      const btn = document.getElementById('followFilterBtn');
      btn.classList.toggle('active', currentFollowFilter);
      renderProjects();
    }

    async function loadProjects() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        allProjects = await F7API.getProjects();

        // Apply settings
        const ps = getPageSettings('projects');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('projects');

        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');
        // Generate filter buttons dynamically
        buildProjectFilterButtons();
        renderProjects();
      } catch (e) {
        document.getElementById('projectsGrid').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.loadFailed')}</p></div>`;
      }
    }

    // 企划时间轴进度：startDate → endDate
    function projectProgress(p) {
      const s = new Date(p.startDate || p.createdAt || 0);
      const e = new Date(p.endDate || 0);
      if (isNaN(s.getTime()) || isNaN(e.getTime()) || e <= s) return null;
      const now = new Date();
      const total = e - s;
      const pct = Math.max(0, Math.min(100, Math.round((now - s) / total * 100)));
      let label;
      if (now < s) label = '尚未开始';
      else if (now > e) label = '已结束';
      else label = '剩余 ' + Math.max(0, Math.ceil((e - now) / 86400000)) + ' 天';
      return { pct, label };
    }

    function statusClassOf(statusId, label) {
      const name = String(label || '');
      if (/完成/.test(name)) return 'done';
      if (/停止|取消|暂停/.test(name)) return 'stopped';
      if (/招募/.test(name)) return '';
      return 'open';
    }

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      // Remove skeleton
      document.getElementById('projectsSkeleton')?.remove();
      let filtered = allProjects;
      if (currentStatus !== 'all') {
        filtered = filtered.filter(p => p.status === currentStatus);
      }
      if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }
      // Follow filter
      if (currentFollowFilter) {
        const followedList = getFollowedCircles();
        filtered = filtered.filter(p => (p.circles || []).some(cid => followedList.includes(cid)));
      }

      const search = document.getElementById('searchInput').value.toLowerCase();
      if (search) {
        filtered = filtered.filter(p =>
          p.title.toLowerCase().includes(search) ||
          (p.description || '').toLowerCase().includes(search) ||
          (p.tags || []).some(t => t.toLowerCase().includes(search))
        );
      }

      // Sorting（置顶始终在最前）
      filtered = filtered.slice();
      const sortVal = document.getElementById('sortSelect')?.value || 'date-desc';
      let cmp;
      if (sortVal === 'date-asc') {
        cmp = (a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
      } else if (sortVal === 'name-asc') {
        cmp = (a, b) => (a.title || '').localeCompare(b.title || '');
      } else if (sortVal === 'progress-desc') {
        cmp = (a, b) => (projectProgress(b)?.pct || 0) - (projectProgress(a)?.pct || 0);
      } else {
        cmp = (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      }
      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return cmp(a, b);
      });

      const totalEl = document.getElementById('projectTotalCount');
      if (totalEl) totalEl.textContent = allProjects.length;
      const showEl = document.getElementById('projectShowCount');
      if (showEl) showEl.textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔍</div><p>${t('common.noMatchingProjects')}</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(project => {
        const cover = project.coverImage || (project.images && project.images[0]) || '';
        const statusLabel = PROJECT_STATUS_LABELS[project.status] || '';
        const catLabel = PROJECT_CATEGORIES[project.category] || '';
        const authorN = (project.circles || []).length;
        const prog = projectProgress(project);
        const fillCls = statusClassOf(project.status, statusLabel);
        const tags = (project.tags || []).slice(0, 3);
        return `
        <a class="cl-proj-card${project.pinned ? ' pinned' : ''}" href="/project-detail.html?id=${encodeURIComponent(project.id)}">
          <div class="cl-proj-cover">
            ${statusLabel ? `<span class="cl-proj-status ${fillCls === 'open' ? 'open' : fillCls}">${escapeHtml(statusLabel)}</span>` : ''}
            ${project.pinned ? '<span class="cl-proj-pin">置顶</span>' : ''}
            ${cover
              ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(project.title)}" loading="lazy">`
              : `<span style="position:relative;z-index:1;">${escapeHtml((project.title || '?').charAt(0))}</span>`}
          </div>
          <div class="cl-proj-body">
            <div class="cl-proj-title">${escapeHtml(project.title)}</div>
            <div class="cl-proj-sub">${escapeHtml(catLabel)}${authorN ? ' · 参与作者 ' + authorN + ' 人' : ''}</div>
            <div class="cl-proj-desc">${escapeHtml(project.description || '')}</div>
            ${tags.length ? `<div class="cl-proj-tags">${tags.map(tg => `<span class="cl-proj-tag">#${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
          </div>
          ${prog ? `
          <div class="cl-proj-timeline">
            <div class="cl-tl-head">
              <span>${formatDate(project.startDate)} → ${formatDate(project.endDate)}</span>
              <span class="now">${prog.label}</span>
            </div>
            <div class="cl-tl-bar"><div class="cl-tl-fill ${fillCls}" style="width:${prog.pct}%"></div></div>
          </div>` : ''}
          <div class="cl-proj-foot">
            <span>${formatDate(project.startDate)}</span>
            <span class="go">查看 →</span>
          </div>
        </a>
      `;
      }).join('');
    }

    function buildProjectFilterButtons() {
      // Status filters
      const statusContainer = document.getElementById('statusFilters');
      statusContainer.innerHTML = `<button type="button" class="filter-btn active" data-status="all">${t('common.allStatus')}</button>` +
        PROJECT_STATUS_ORDERED.map(s => `<button type="button" class="filter-btn" data-status="${s.id}">${tCat(s)}</button>`).join('');

      // Category filters
      const catContainer = document.getElementById('categoryFilters');
      catContainer.innerHTML = `<button type="button" class="filter-btn active" data-cat="all">${t('common.allCategories')}</button>` +
        PROJECT_CATEGORIES_ORDERED.map(c => `<button type="button" class="filter-btn" data-cat="${c.id}">${tCat(c)}</button>`).join('');

      document.querySelectorAll('[data-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentStatus = btn.dataset.status;
          renderProjects();
        });
      });
      document.querySelectorAll('[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          renderProjects();
        });
      });
      document.getElementById('searchInput').addEventListener('input', debounce(renderProjects));
      document.getElementById('sortSelect').addEventListener('change', renderProjects);
    }

    loadProjects();

    PullToRefresh.init({
      onRefresh: async () => {
        allProjects = await F7API.getProjects();
        renderProjects();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人企划</title>
  <meta name="description" content="发现正在进行的同人企划，加入创作团队。浏览招募中、进行中和已完成的企划。">
  <meta property="og:title" content="f7goods — 同人企划">
  <meta property="og:description" content="发现正在进行的同人企划，加入创作团队。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="https://f7goods.com/uploads/og-image.png">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20261020ek">
<link rel="canonical" href="https://f7goods.com/projects.html">
<meta property="og:url" content="https://f7goods.com/projects.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="zh-CN" href="https://f7goods.com/projects.html">
<link rel="alternate" hreflang="x-default" href="https://f7goods.com/projects.html">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

<main class="main-content projects-page">
    <header class="prj-head">
      <div>
        <div class="prj-kicker">PROJECT INDEX</div>
        <h1 id="heroTitle" class="settings-pending" data-i18n="projects.heroTitle">同人企划</h1>
        <p id="heroSubtitle" class="settings-pending" data-i18n="projects.heroSubtitle">企划、合作项目与作品系列的集中入口</p>
      </div>
      <div class="prj-head-stats">
        <div><b id="projectTotalCount">0</b><span>企划与系列</span></div>
        <div><b id="projectRecruitingCount">0</b><span>招募中</span></div>
        <div><b id="projectPinnedCount">0</b><span>置顶</span></div>
        <div><b id="projectWorksCount">0</b><span>关联周边</span></div>
      </div>
    </header>
    <span id="pageTitle" style="display:none"></span>
    <span id="pageSubtitle" style="display:none"></span>

    <div class="prj-toolbar">
      <div class="prj-filters" id="statusFilters"></div>
      <span class="prj-sep" aria-hidden="true"></span>
      <div class="prj-filters" id="categoryFilters"></div>
      <div class="prj-toolbar-spacer"></div>
      <button type="button" class="filter-btn" id="followFilterBtn" onclick="toggleFollowFilter()" data-i18n="common.follow">关注</button>
      <select class="prj-select" id="sortSelect">
        <option value="order" selected>综合排序</option>
        <option value="date-desc">开始日期 ↓ 新→旧</option>
        <option value="date-asc">开始日期 ↑ 旧→新</option>
        <option value="name-asc" data-i18n="common.nameAsc">名称 A→Z</option>
        <option value="progress-desc">进度 ↓</option>
      </select>
      <input type="text" class="prj-search" placeholder="搜索企划、作者…" id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
    </div>

    <div id="pinnedProjectMount"></div>

    <div class="prj-section-head"><h2>全部企划与系列</h2><span>按综合排序 · 共 <b id="projectShowCount">0</b> 个</span></div>
    <div class="prj-grid" id="projectsGrid">
      <div id="projectsSkeleton" class="skeleton-grid">
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js?v=20261020ek"></script>
  <script src="/js/pull-to-refresh.js"></script>
  <script src="/js/i18n.js?v=20261020ek"></script>
  <script src="/js/main.js?v=20261020ek"></script>
  <script>
    initPage('projects');
    if (typeof mountAuthorCreateFab === 'function') mountAuthorCreateFab({ label: '创建企划', tab: 'my-projects' });

    let allProjects = [];
    let allSeries = [];
    let allCircles = [];
    let currentStatus = 'all';
    const initialCategory = new URLSearchParams(location.search).get('category');
    let currentCategory = initialCategory || 'all';
    let currentFollowFilter = false;

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      const btn = document.getElementById('followFilterBtn');
      btn.classList.toggle('active', currentFollowFilter);
      renderProjects();
    }

    async function loadProjects() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        allProjects = await F7API.getProjects();
        try {
          const [seriesRes, circlesRes] = await Promise.all([
            fetch('/api/series').then(r => r.json()),
            F7API.getCircles()
          ]);
          allSeries = Array.isArray(seriesRes) ? seriesRes : [];
          allCircles = Array.isArray(circlesRes) ? circlesRes : [];
        } catch {
          allSeries = [];
          allCircles = [];
        }

        // Apply settings
        const ps = getPageSettings('projects');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('projects');

        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');
        // Generate filter buttons dynamically
        buildProjectFilterButtons();
        renderProjects();
      } catch (e) {
        document.getElementById('projectsGrid').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.loadFailed')}</p></div>`;
      }
    }

    // 企划时间轴进度：startDate → endDate
    function projectProgress(p) {
      const s = new Date(p.startDate || p.createdAt || 0);
      const e = new Date(p.endDate || 0);
      if (isNaN(s.getTime()) || isNaN(e.getTime()) || e <= s) return null;
      const now = new Date();
      const total = e - s;
      const pct = Math.max(0, Math.min(100, Math.round((now - s) / total * 100)));
      let label;
      if (now < s) label = '尚未开始';
      else if (now > e) label = '已结束';
      else label = '剩余 ' + Math.max(0, Math.ceil((e - now) / 86400000)) + ' 天';
      return { pct, label };
    }

    function statusClassOf(statusId, label) {
      const name = String(label || '');
      if (/完成/.test(name)) return 'done';
      if (/停止|取消|暂停/.test(name)) return 'stopped';
      if (/招募/.test(name)) return '';
      return 'open';
    }

function projectCircleNames(project) {
  return (project.circles || []).map(cid => allCircles.find(c => c.id === cid)?.name).filter(Boolean);
}

function projectCardHtml(item) {
  if (item._isSeries) {
    const owner = allCircles.find(c => c.id === item.circleId);
    const cover = item.cover || item.works?.[0]?.images?.[0] || '';
    const statusLabel = PROJECT_STATUS_LABELS[item.status] || '招募中';
    const tags = [...new Set([...(item.tags || []), ...(item.works || []).flatMap(w => w.tags || [])])].slice(0, 3);
    return `<a class="prj-card series" href="/series-detail.html?id=${encodeURIComponent(item.id)}">
      <div class="prj-cover">
        <span class="prj-status">${escapeHtml(statusLabel)}</span>
        ${cover ? `<img src="${escapeHtml(imgUrl(cover, 640))}" alt="${escapeHtml(item.name)}" loading="lazy">` : `<span class="prj-initial">${escapeHtml((item.name || '?').charAt(0))}</span>`}
      </div>
      <div class="prj-body">
        <h3>${escapeHtml(item.name)}</h3>
        <div class="prj-meta">系列周边 · ${owner ? escapeHtml(owner.name) : '未知作者'} · ${(item.works || []).length} 件</div>
        <p class="prj-desc">${(item.works || []).slice(0, 3).map(w => escapeHtml(workTitle(w))).join(' · ') || '作品系列'}</p>
        ${tags.length ? `<div class="prj-tags">${tags.map(tg => `<span class="prj-tag">#${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
        <div class="prj-foot"><span>${(item.works || []).length} 件作品</span><span class="go">查看系列 →</span></div>
      </div>
    </a>`;
  }
  const p = item;
  const cover = p.coverImage || (p.images && p.images[0]) || '';
  const statusLabel = PROJECT_STATUS_LABELS[p.status] || '';
  const catLabel = PROJECT_CATEGORIES[p.category] || '';
  const authorN = (p.circles || []).length;
  const prog = projectProgress(p);
  const tags = (p.tags || []).slice(0, 3);
  return `<a class="prj-card" href="/project-detail.html?id=${encodeURIComponent(p.id)}">
    <div class="prj-cover">
      ${statusLabel ? `<span class="prj-status">${escapeHtml(statusLabel)}</span>` : ''}
      ${cover ? `<img src="${escapeHtml(imgUrl(cover, 640))}" alt="${escapeHtml(p.title)}" loading="lazy">` : `<span class="prj-initial">${escapeHtml((p.title || '?').charAt(0))}</span>`}
    </div>
    <div class="prj-body">
      <h3>${escapeHtml(p.title)}</h3>
      <div class="prj-meta">${escapeHtml(catLabel)}${authorN ? ' · 参与作者 ' + authorN + ' 人' : ''}</div>
      <p class="prj-desc">${escapeHtml(p.description || '')}</p>
      ${tags.length ? `<div class="prj-tags">${tags.map(tg => `<span class="prj-tag">#${escapeHtml(tg)}</span>`).join('')}</div>` : ''}
      ${prog ? `<div class="prj-time"><div class="prj-time-head"><span>${formatDate(p.startDate)} → ${formatDate(p.endDate)}</span><span>${prog.label}</span></div><div class="prj-time-bar"><i style="width:${prog.pct}%"></i></div></div>` : ''}
      <div class="prj-foot"><span>${p.startDate ? formatDate(p.startDate) : '时间待定'}</span><span class="go">查看 →</span></div>
    </div>
  </a>`;
}

function renderPinnedProject(p) {
  const mount = document.getElementById('pinnedProjectMount');
  if (!mount) return;
  if (!p) { mount.innerHTML = ''; return; }
  const cover = p.coverImage || (p.images && p.images[0]) || '';
  const statusLabel = PROJECT_STATUS_LABELS[p.status] || '';
  const catLabel = PROJECT_CATEGORIES[p.category] || '';
  const prog = projectProgress(p);
  const names = projectCircleNames(p).slice(0, 2);
  mount.innerHTML = `<a class="prj-hero" href="/project-detail.html?id=${encodeURIComponent(p.id)}">
    <div class="prj-hero-cover">
      ${cover ? `<img src="${escapeHtml(imgUrl(cover, 1200))}" alt="${escapeHtml(p.title)}" loading="eager">` : ''}
      <span class="prj-hero-badge">置顶企划</span>
    </div>
    <div class="prj-hero-body">
      <div class="prj-hero-kicker">PINNED PROJECT</div>
      <h2>${escapeHtml(p.title)}</h2>
      <div class="prj-hero-meta">${statusLabel ? `<span>${escapeHtml(statusLabel)}</span>` : ''}${catLabel ? `<span>${escapeHtml(catLabel)}</span>` : ''}${names.length || (p.circles || []).length ? `<span>${(p.circles || []).length} 位参与作者</span>` : ''}</div>
      ${p.description ? `<p class="prj-hero-desc">${escapeHtml(p.description)}</p>` : ''}
      <div class="prj-hero-progress">
        <div class="prj-hero-progress-head"><span>${p.startDate ? formatDate(p.startDate) : '待定'} → ${p.endDate ? formatDate(p.endDate) : '待定'}</span><span>${prog ? prog.label : ''}</span></div>
        <div class="prj-hero-bar"><i style="width:${prog ? prog.pct : 0}%"></i></div>
        <div class="prj-hero-foot"><span>${names.length ? '参与作者：' + names.join(' · ') : ''}</span><span class="prj-hero-cta">查看企划 →</span></div>
      </div>
    </div>
  </a>`;
}

function renderProjects() {
  const grid = document.getElementById('projectsGrid');
  document.getElementById('projectsSkeleton')?.remove();
  let filtered = allProjects;
  if (currentStatus !== 'all') filtered = filtered.filter(p => p.status === currentStatus);
  if (currentCategory !== 'all') filtered = filtered.filter(p => p.category === currentCategory);
  if (currentFollowFilter) {
    const followedList = getFollowedCircles();
    filtered = filtered.filter(p => (p.circles || []).some(cid => followedList.includes(cid)));
  }

  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  if (search) {
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(search) ||
      (p.description || '').toLowerCase().includes(search) ||
      (p.tags || []).some(t => t.toLowerCase().includes(search))
    );
  }

  let filteredSeries = [];
  if (currentCategory === 'all' || currentCategory === 'zhoubian') {
    const followedList = getFollowedCircles();
    filteredSeries = allSeries.filter(s => {
      if (currentStatus !== 'all' && (s.status || 'zhaomuzhong') !== currentStatus) return false;
      if (currentFollowFilter && !followedList.includes(s.circleId)) return false;
      if (!search) return true;
      const owner = allCircles.find(c => c.id === s.circleId);
      return [s.name, owner?.name, ...(s.works || []).map(w => workTitle(w)), ...(s.tags || []), ...(s.works || []).flatMap(w => w.tags || [])]
        .join(' ').toLowerCase().includes(search);
    });
  }

  const projectSortTime = (p) => {
    const raw = p?.startDate || p?.endDate || p?.createdAt || 0;
    const t = new Date(raw).getTime();
    return Number.isFinite(t) ? t : 0;
  };
  filtered = filtered.slice();
  const sortVal = document.getElementById('sortSelect')?.value || 'order';
  let cmp;
  const orderValue = (item) => Number.isFinite(Number(item.order)) ? Number(item.order) : 9999;
  if (sortVal === 'order') cmp = (a, b) => orderValue(a) - orderValue(b);
  else if (sortVal === 'date-asc') cmp = (a, b) => projectSortTime(a) - projectSortTime(b);
  else if (sortVal === 'name-asc') cmp = (a, b) => (a.title || '').localeCompare(b.title || '');
  else if (sortVal === 'progress-desc') cmp = (a, b) => (projectProgress(b)?.pct || 0) - (projectProgress(a)?.pct || 0);
  else cmp = (a, b) => projectSortTime(b) - projectSortTime(a);
  filtered.sort((a, b) => (a.pinned && !b.pinned) ? -1 : (!a.pinned && b.pinned) ? 1 : cmp(a, b));

  const combined = [
    ...filtered.map(p => ({ ...p, _isSeries: false })),
    ...filteredSeries.map(s => ({ ...s, _isSeries: true, pinned: false, title: s.name }))
  ].sort((a, b) => (a.pinned && !b.pinned) ? -1 : (!a.pinned && b.pinned) ? 1 : cmp(a, b));

  const allItems = [...allProjects, ...allSeries];
  const recruiting = allItems.filter(x => (x.status || 'zhaomuzhong') === 'zhaomuzhong').length;
  const relatedWorks = allSeries.reduce((n, s) => n + (s.works || []).length, 0) + allProjects.reduce((n, p) => n + (p.works || []).length, 0);
  const totalEl = document.getElementById('projectTotalCount');
  if (totalEl) totalEl.textContent = allItems.length;
  if (document.getElementById('projectRecruitingCount')) document.getElementById('projectRecruitingCount').textContent = recruiting;
  if (document.getElementById('projectPinnedCount')) document.getElementById('projectPinnedCount').textContent = allProjects.filter(p => p.pinned).length;
  if (document.getElementById('projectWorksCount')) document.getElementById('projectWorksCount').textContent = relatedWorks;

  const pinned = filtered.find(p => p.pinned) || null;
  const items = combined.filter(item => !(pinned && !item._isSeries && item.id === pinned.id));
  if (document.getElementById('projectShowCount')) document.getElementById('projectShowCount').textContent = items.length;

  renderPinnedProject(pinned);
  if (items.length === 0 && !pinned) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔍</div><p>${t('common.noMatchingProjects')}</p></div>`;
    return;
  }
  grid.innerHTML = items.map(projectCardHtml).join('');
}

    function buildProjectFilterButtons() {
      // Status filters
      const statusContainer = document.getElementById('statusFilters');
      statusContainer.innerHTML = `<button type="button" class="filter-btn active" data-status="all">${t('common.allStatus')}</button>` +
        PROJECT_STATUS_ORDERED.map(s => `<button type="button" class="filter-btn" data-status="${s.id}">${tCat(s)}</button>`).join('');

      // Category filters
      const catContainer = document.getElementById('categoryFilters');
      catContainer.innerHTML = `<button type="button" class="filter-btn active" data-cat="all">${t('common.allCategories')}</button>` +
        PROJECT_CATEGORIES_ORDERED.map(c => `<button type="button" class="filter-btn" data-cat="${c.id}">${tCat(c)}</button>`).join('');
      if (currentCategory !== 'all') {
        catContainer.querySelector('[data-cat="all"]')?.classList.remove('active');
        catContainer.querySelector(`[data-cat="${currentCategory}"]`)?.classList.add('active');
      }

      document.querySelectorAll('[data-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentStatus = btn.dataset.status;
          renderProjects();
        });
      });
      document.querySelectorAll('[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          
          document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          renderProjects();
        });
      });
      document.getElementById('searchInput').addEventListener('input', debounce(renderProjects));
      document.getElementById('sortSelect').addEventListener('change', renderProjects);
    }

    loadProjects();
    if (typeof onLangChange === 'function') onLangChange(() => { try { renderProjects(); } catch {} });

    PullToRefresh.init({
      onRefresh: async () => {
        allProjects = await F7API.getProjects();
        renderProjects();
      }
    });
  </script>
</body>
</html>

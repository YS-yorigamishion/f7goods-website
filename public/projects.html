<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人企划</title>
  <meta name="description" content="发现正在进行的同人企划，加入创作团队。浏览招募中、进行中和已完成的企划。">
  <meta property="og:title" content="f7goods — 同人企划">
  <meta property="og:description" content="发现正在进行的同人企划，加入创作团队。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.jpg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle" class="settings-pending" data-i18n="projects.heroTitle">同人企划</h1>
    <p id="heroSubtitle" class="settings-pending" data-i18n="projects.heroSubtitle">发现正在进行的同人企划，加入创作团队</p>
  </section>

  <main class="main-content">
    <div class="page-header">
      <h2 id="pageTitle" class="settings-pending" data-i18n="projects.listTitle">企划列表</h2>
      <p id="pageSubtitle" class="settings-pending" data-i18n="projects.listSubtitle">正在进行或招募中的同人企划项目</p>
    </div>

    <div class="filter-bar" id="statusFilters">
      <button class="filter-btn active" data-status="all" data-i18n="common.allStatus">全部状态</button>
    </div>
    <div class="filter-bar" id="categoryFilters">
      <button class="filter-btn active" data-cat="all" data-i18n="common.allCategories">全部分类</button>
      <div style="margin-left:auto;display:flex;align-items:center;gap:0.5rem;">
        <select class="form-input" id="sortSelect" style="padding:0.35rem 0.6rem;font-size:0.85rem;border-radius:100px;min-width:140px;">
          <option value="date-desc" data-i18n="common.dateDesc">创建日期 ↓ 新→旧</option>
          <option value="date-asc" data-i18n="common.dateAsc">创建日期 ↑ 旧→新</option>
          <option value="name-asc" data-i18n="common.nameAsc">名称 A→Z</option>
        </select>
        <input type="text" class="search-input" placeholder="搜索企划..." id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
      </div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn" onclick="toggleFollowFilter()" id="followFilterBtn" data-i18n="common.follow">⭐ 关注</button>
    </div>

    <div class="cards-grid" id="projectsGrid">
      <div id="projectsSkeleton" class="skeleton-grid">
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('projects');

    let allProjects = [];
    let currentStatus = 'all';
    let currentCategory = 'all';
    let currentFollowFilter = false;

    function toggleFollowFilter() {
      currentFollowFilter = !currentFollowFilter;
      document.getElementById('followFilterBtn').classList.toggle('active', currentFollowFilter);
      renderProjects();
    }

    async function loadProjects() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        allProjects = await F7API.getProjects();

        // Apply settings
        const ps = getPageSettings('projects');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('projects');

        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');
        // Generate filter buttons dynamically
        buildProjectFilterButtons();
        renderProjects();
      } catch (e) {
        document.getElementById('projectsGrid').innerHTML =
          '<div class="empty-state"><div class="icon">!</div><p>加载失败，请稍后重试</p></div>';
      }
    }

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      // Remove skeleton
      document.getElementById('projectsSkeleton')?.remove();
      let filtered = allProjects;
      if (currentStatus !== 'all') {
        filtered = filtered.filter(p => p.status === currentStatus);
      }
      if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }
      // Follow filter
      if (currentFollowFilter) {
        const followedList = getFollowedCircles();
        filtered = filtered.filter(p => (p.circles || []).some(cid => followedList.includes(cid)));
      }

      const search = document.getElementById('searchInput').value.toLowerCase();
      if (search) {
        filtered = filtered.filter(p =>
          p.title.toLowerCase().includes(search) ||
          (p.description || '').toLowerCase().includes(search) ||
          (p.tags || []).some(t => t.toLowerCase().includes(search))
        );
      }

      // Sorting
      const sortVal = document.getElementById('sortSelect')?.value || 'date-desc';
      if (sortVal === 'date-asc') {
        filtered.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
      } else if (sortVal === 'name-asc') {
        filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
      } else {
        filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>暂无符合条件的企划</p></div>';
        return;
      }

      grid.innerHTML = filtered.map(project => `
        <div class="card" onclick="location.href='/project-detail.html?id=${project.id}'">
          <div class="card-image" style="${(project.coverImage || (project.images && project.images.length > 0)) ? '' : 'background:linear-gradient(135deg,var(--accent-alt),var(--ink));'}">
            ${project.coverImage
              ? `<img src="${project.coverImage}" alt="${escapeHtml(project.title)}" loading="lazy">`
              : (project.images && project.images.length > 0
                ? `<img src="${project.images[0]}" alt="${escapeHtml(project.title)}" loading="lazy">`
                : '<span class="placeholder-icon" style="color:white;">📋</span>')}
          </div>
          <div class="card-body">
            <span class="card-tag ${project.status}">${PROJECT_STATUS_LABELS[project.status] || escapeHtml(project.status)}</span>
            <h3 class="card-title">${escapeHtml(project.title)}</h3>
            <p class="card-subtitle">${PROJECT_CATEGORIES[project.category] || escapeHtml(project.category)}</p>
          </div>
          <div class="card-footer">
            <div class="tag-list" style="flex:1;">
              ${(project.tags || []).slice(0, 3).map(t => `<a href="/?tag=${encodeURIComponent(t)}" class="tag" style="text-decoration:none;">${escapeHtml(t)}</a>`).join('')}
            </div>
            <span class="card-date">${formatDate(project.startDate)}</span>
          </div>
        </div>
      `).join('');
    }

    function buildProjectFilterButtons() {
      // Status filters
      const statusContainer = document.getElementById('statusFilters');
      statusContainer.innerHTML = `<button class="filter-btn active" data-status="all">${t('common.allStatus')}</button>` +
        PROJECT_STATUS_ORDERED.map(s => `<button class="filter-btn" data-status="${s.id}">${tCat(s)}</button>`).join('');

      // Category filters
      const catContainer = document.getElementById('categoryFilters');
      const rightSide = catContainer.querySelector('div[style*="margin-left:auto"]');
      catContainer.innerHTML = `<button class="filter-btn active" data-cat="all">${t('common.allCategories')}</button>` +
        PROJECT_CATEGORIES_ORDERED.map(c => `<button class="filter-btn" data-cat="${c.id}">${tCat(c)}</button>`).join('');
      if (rightSide) catContainer.appendChild(rightSide);

      // Re-bind events
      document.querySelectorAll('.filter-btn[data-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn[data-status]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentStatus = btn.dataset.status;
          renderProjects();
        });
      });
      document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.cat;
          renderProjects();
        });
      });
      document.getElementById('searchInput').addEventListener('input', debounce(renderProjects));
      document.getElementById('sortSelect').addEventListener('change', renderProjects);
    }

    loadProjects();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 公告</title>
  <meta name="description" content="了解 f7goods 的最新公告和重要通知，掌握同人活动资讯。">
  <meta property="og:title" content="f7goods — 公告">
  <meta property="og:description" content="了解 f7goods 的最新公告和重要通知，掌握同人活动资讯。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260912f">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero cl-list-hero">
    <div class="cl-list-mast">
      <div>
        <h1 id="heroTitle" data-i18n="announcements.heroTitle">公告</h1>
        <p id="heroSubtitle" data-i18n="announcements.heroSubtitle">了解 f7goods 的最新动态和重要通知</p>
      </div>
      <div class="cl-list-count">共 <b id="annTotalCount">0</b> 条公告</div>
    </div>
    <div class="cl-list-sub">
      <strong id="pageTitle" data-i18n="announcements.listTitle">公告列表</strong>
      <span id="pageSubtitle" data-i18n="announcements.listSubtitle">按发布时间倒序排列</span>
    </div>
  </section>

  <main class="main-content">
    <div class="cl-toolbar-card">
      <div class="cl-toolbar-row">
        <div id="annFilters" style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;">
          <button type="button" class="pill on" data-f="all">全部</button>
          <button type="button" class="pill" data-f="pinned">置顶</button>
          <button type="button" class="pill" data-f="popup">弹窗公告</button>
        </div>
        <span class="spacer"></span>
        <input type="search" class="search-input" id="annSearch" placeholder="搜索公告标题、内容...">
        <span class="cl-show-count">显示 <b id="annShowCount">0</b></span>
      </div>
    </div>

    <div id="announcementsContainer" class="cl-an-list">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <div class="cl-an-ov" id="annOverlay" onclick="if(event.target===this)closeAnnouncement()">
    <div class="cl-an-sheet" id="annSheet"></div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260912f"></script>
  <script>
    initPage('announcements');

    let _anns = [];
    let _annFilter = 'all';
    let _annQuery = '';

    function annPreview(text) {
      const s = String(text || '').replace(/\s+/g, ' ').trim();
      return s.length > 78 ? s.slice(0, 78) + '…' : s;
    }
    function monOf(d) { return d && d.slice(5, 7) ? Number(d.slice(5, 7)) + ' 月' : ''; }
    function dayOf(d) { return d && d.slice(8, 10) ? d.slice(8, 10) : '—'; }
    function monthKeyOf(d) { return String(d || '').slice(0, 7); }
    function monthLabelOf(k) {
      const p = k.split('-');
      if (p.length < 2) return k || '未标日期';
      return p[0] + ' 年 ' + Number(p[1]) + ' 月';
    }

    function filteredAnns() {
      const q = _annQuery.trim().toLowerCase();
      return _anns.filter(a =>
        (_annFilter === 'all'
          || (_annFilter === 'pinned' && a.pinned)
          || (_annFilter === 'popup' && a.popup))
        && (!q
          || String(a.title || '').toLowerCase().includes(q)
          || String(a.content || '').toLowerCase().includes(q))
      );
    }

    function annCardHtml(a, isPinned) {
      const idx = _anns.indexOf(a);
      const chips = [];
      if (isPinned) chips.push('<span class="cl-an-chip pin">置顶</span>');
      if (a.popup) chips.push('<span class="cl-an-chip pop">弹窗公告</span>');
      const imgN = (a.images || []).length;
      if (imgN) chips.push(`<span class="cl-an-chip">${imgN} 张图</span>`);
      return `
        <button type="button" class="cl-an-note${isPinned ? ' pinned' : ''}" data-i="${idx}">
          <span class="cl-an-date"><span class="m">${monOf(a.publishDate)}</span><span class="d">${dayOf(a.publishDate)}</span></span>
          <span class="cl-an-main">
            <span class="cl-an-chips">${chips.join('')}</span>
            <span class="cl-an-title">${escapeHtml(a.title)}</span>
            <span class="cl-an-exc">${escapeHtml(annPreview(a.content))}</span>
            <span class="cl-an-more">点击查看详情 ›</span>
          </span>
          <span class="cl-an-chev">›</span>
        </button>`;
    }

    function renderAnnouncements() {
      const container = document.getElementById('announcementsContainer');
      const list = filteredAnns();

      const totalEl = document.getElementById('annTotalCount');
      if (totalEl) totalEl.textContent = _anns.length;
      const showEl = document.getElementById('annShowCount');
      if (showEl) showEl.textContent = list.length;

      if (!list.length) {
        container.innerHTML = `<div class="empty-state"><p data-i18n="announcements.noAnnouncements">暂无公告</p></div>`;
        return;
      }

      const pinned = list.filter(a => a.pinned);
      const rest = list.filter(a => !a.pinned);

      let html = '';
      if (pinned.length) {
        html += '<div class="cl-an-month">置顶公告</div>';
        html += pinned.map(a => annCardHtml(a, true)).join('');
      }
      let lastMonth = null;
      rest.forEach(a => {
        const mk = monthKeyOf(a.publishDate);
        if (mk !== lastMonth) {
          html += `<div class="cl-an-month">${escapeHtml(monthLabelOf(mk))}</div>`;
          lastMonth = mk;
        }
        html += annCardHtml(a, false);
      });

      container.innerHTML = html;
      container.querySelectorAll('.cl-an-note').forEach(btn => {
        btn.addEventListener('click', () => showAnnouncement(Number(btn.dataset.i)));
      });
    }

    function showAnnouncement(index) {
      const a = _anns[index];
      if (!a) return;
      const sheet = document.getElementById('annSheet');
      const images = (a.images || []).filter(Boolean);
      const chips = [];
      if (a.pinned) chips.push('<span class="cl-an-chip pin">置顶</span>');
      if (a.popup) chips.push('<span class="cl-an-chip pop">弹窗公告</span>');

      sheet.innerHTML = `
        <button type="button" class="x" onclick="closeAnnouncement()" aria-label="关闭">&times;</button>
        <h2>${escapeHtml(a.title)}</h2>
        <div class="cl-an-meta">
          <span>${formatDate(a.publishDate)}</span>
          ${chips.length ? chips.join('') : ''}
        </div>
        <div class="cl-an-body">${escapeHtml(a.content || '')}</div>
        ${images.length ? `
          <div class="cl-an-imgs">
            ${images.map((url, i) => `<button type="button" data-img="${i}"><img src="${escapeHtml(url)}" alt="" loading="lazy"></button>`).join('')}
          </div>` : ''}
        <div class="cl-an-foot"><button type="button" onclick="closeAnnouncement()">知道了</button></div>`;

      sheet.querySelectorAll('.cl-an-imgs button').forEach(btn => {
        btn.addEventListener('click', () => {
          if (typeof openLightbox === 'function') openLightbox(images, Number(btn.dataset.img));
        });
      });
      document.getElementById('annOverlay').classList.add('open');
    }

    function closeAnnouncement() {
      document.getElementById('annOverlay').classList.remove('open');
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAnnouncement();
    });

    // 筛选与搜索
    document.getElementById('annFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('.pill[data-f]');
      if (!btn) return;
      _annFilter = btn.dataset.f;
      document.querySelectorAll('#annFilters .pill').forEach(b => b.classList.toggle('on', b === btn));
      renderAnnouncements();
    });
    document.getElementById('annSearch').addEventListener('input', (e) => {
      _annQuery = e.target.value;
      renderAnnouncements();
    });

    async function loadAnnouncements() {
      try {
        await loadSettingsFromAPI();
        const ps = getPageSettings('announcements');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('announcements');

        const res = await fetch('/api/announcements');
        if (!res.ok) throw new Error('Failed to load');
        const announcements = await res.json();

        _anns = Array.isArray(announcements) ? announcements : [];
        renderAnnouncements();
      } catch (e) {
        document.getElementById('announcementsContainer').innerHTML =
          '<div class="empty-state"><p data-i18n="common.loadFailed">加载失败，请稍后重试</p></div>';
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>

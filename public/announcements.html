<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 公告</title>
  <meta name="description" content="了解 f7goods 的最新公告和重要通知，掌握同人活动资讯。">
  <meta property="og:title" content="f7goods — 公告">
  <meta property="og:description" content="了解 f7goods 的最新公告和重要通知，掌握同人活动资讯。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .announcement-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }
    .announcement-card:hover {
      box-shadow: var(--shadow-md);
    }
    .announcement-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
      gap: 1rem;
    }
    .announcement-title {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
    }
    .announcement-date {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: white;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .announcement-preview {
      font-size: 0.9rem;
      color: var(--haze);
      line-height: 1.6;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .announcement-expand-hint {
      font-size: 0.75rem;
      color: var(--haze);
      margin-top: 0.5rem;
    }
    @media (max-width: 768px) {
      .announcement-card {
        padding: 1rem 1.2rem;
      }
      .announcement-header {
        flex-direction: column;
      }
      .announcement-title {
        font-size: 1.1rem;
      }
      .announcement-preview {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle" data-i18n="announcements.heroTitle">📢 公告</h1>
    <p id="heroSubtitle" data-i18n="announcements.heroSubtitle">了解 f7goods 的最新动态和重要通知</p>
  </section>

  <main class="main-content">
    <div class="page-header">
      <h2 id="pageTitle" data-i18n="announcements.listTitle">公告列表</h2>
      <p id="pageSubtitle" data-i18n="announcements.listSubtitle">按发布时间倒序排列</p>
    </div>

    <div id="announcementsContainer">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('announcements');

    function showAnnouncement(index) {
      const a = window._announcements[index];
      if (!a) return;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;';
      overlay.innerHTML = `<div style="background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <h3 style="margin:0;flex:1;">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</h3>
          <button onclick="this.closest('div[style*=fixed]').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--haze);">&times;</button>
        </div>
        <div style="font-size:0.8rem;color:var(--haze);margin-bottom:1rem;">${formatDate(a.publishDate)}</div>
        <div style="line-height:1.8;color:var(--ink);white-space:pre-wrap;">${nl2br(a.content)}</div>
        ${(a.images && a.images.length > 0) ? '<div style="margin-top:1rem;display:flex;flex-direction:column;gap:0.5rem;">' + a.images.map(url => '<img src="' + url + '" style="width:100%;border-radius:8px;cursor:pointer;" onclick="window.open(this.src)">').join('') + '</div>' : ''}
      </div>`;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
    }

    async function loadAnnouncements() {
      try {
        await loadSettingsFromAPI();
        const ps = getPageSettings('announcements');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('announcements');

        const res = await fetch('/api/announcements');
        if (!res.ok) throw new Error('Failed to load');
        const announcements = await res.json();

        const container = document.getElementById('announcementsContainer');

        if (!announcements || announcements.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">📢</div><p data-i18n="announcements.noAnnouncements">暂无公告</p></div>';
          return;
        }

        // Store announcements data for popup
        window._announcements = announcements;

        container.innerHTML = announcements.map((a, i) => {
          const preview = a.content.length > 80 ? a.content.substring(0, 80) + '...' : a.content;
          return `
          <div class="announcement-card" ${a.pinned ? 'style="border-left:3px solid var(--accent);"' : ''} onclick="showAnnouncement(${i})">
            <div class="announcement-header">
              <h3 class="announcement-title">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</h3>
              <span class="announcement-date">${formatDate(a.publishDate)}</span>
            </div>
            <div class="announcement-preview">${escapeHtml(preview)}</div>
            <div class="announcement-expand-hint">点击查看详情 ›</div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('announcementsContainer').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请稍后重试</p></div>';
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>

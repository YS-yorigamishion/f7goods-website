<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 公告</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .announcement-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }
    .announcement-card:hover {
      box-shadow: var(--shadow-md);
    }
    .announcement-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
      gap: 1rem;
    }
    .announcement-title {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
    }
    .announcement-date {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      color: white;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .announcement-preview {
      font-size: 0.9rem;
      color: var(--haze);
      line-height: 1.6;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .announcement-content {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.8;
      display: none;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
    }
    .announcement-card.expanded .announcement-preview {
      display: none;
    }
    .announcement-card.expanded .announcement-content {
      display: block;
    }
    .announcement-card.expanded .announcement-header {
      margin-bottom: 0.8rem;
    }
    .announcement-expand-hint {
      font-size: 0.75rem;
      color: var(--haze);
      margin-top: 0.5rem;
    }
    .announcement-card.expanded .announcement-expand-hint {
      display: none;
    }
    @media (max-width: 768px) {
      .announcement-card {
        padding: 1rem 1.2rem;
      }
      .announcement-header {
        flex-direction: column;
      }
      .announcement-title {
        font-size: 1.1rem;
      }
      .announcement-preview {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <section class="hero">
    <h1 id="heroTitle">📢 公告</h1>
    <p id="heroSubtitle">了解 f7goods 的最新动态和重要通知</p>
  </section>

  <main class="main-content">
    <div class="page-header">
      <h2 id="pageTitle">公告列表</h2>
      <p id="pageSubtitle">按发布时间倒序排列</p>
    </div>

    <div id="announcementsContainer">
      <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    initPage('announcements');

    async function loadAnnouncements() {
      try {
        const res = await fetch('/api/announcements');
        if (!res.ok) throw new Error('Failed to load');
        const announcements = await res.json();

        const container = document.getElementById('announcementsContainer');

        if (!announcements || announcements.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">📢</div><p>暂无公告</p></div>';
          return;
        }

        container.innerHTML = announcements.map(a => {
          const preview = a.content.length > 80 ? a.content.substring(0, 80) + '...' : a.content;
          return `
          <div class="announcement-card" ${a.pinned ? 'style="border-left:3px solid var(--accent);"' : ''} onclick="this.classList.toggle('expanded')">
            <div class="announcement-header">
              <h3 class="announcement-title">${a.pinned ? '📌 ' : ''}${escapeHtml(a.title)}</h3>
              <span class="announcement-date">${formatDate(a.publishDate)}</span>
            </div>
            <div class="announcement-preview">${escapeHtml(preview)}</div>
            <div class="announcement-content">${nl2br(a.content)}</div>
            <div class="announcement-expand-hint">点击查看详情 ›</div>
          </div>`;
        }).join('');
      } catch (e) {
        document.getElementById('announcementsContainer').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请稍后重试</p></div>';
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>

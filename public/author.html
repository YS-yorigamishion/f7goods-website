<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 作者管理</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:linear-gradient(135deg,var(--ink),var(--accent-alt)); }
    .auth-card { background:var(--card-bg);border-radius:var(--radius);padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow-lg); }
    .auth-card h1 { font-family:'Noto Serif SC',serif;font-size:1.4rem;margin-bottom:0.3rem;text-align:center; }
    .auth-card .subtitle { color:var(--haze);font-size:0.85rem;text-align:center;margin-bottom:1.5rem; }
    .auth-tabs { display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid var(--border); }
    .auth-tab { flex:1;padding:0.6rem;text-align:center;cursor:pointer;font-size:0.9rem;color:var(--haze);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--transition); }
    .auth-tab.active { color:var(--accent);border-bottom-color:var(--accent); }
    .auth-error { background:rgba(233,69,96,0.08);color:var(--accent);padding:0.5rem 0.8rem;border-radius:var(--radius-sm);font-size:0.85rem;margin-bottom:1rem;display:none; }
    .auth-success { background:rgba(46,204,113,0.08);color:#2ecc71;padding:0.5rem 0.8rem;border-radius:var(--radius-sm);font-size:0.85rem;margin-bottom:1rem;display:none; }

    /* Management page */
    .mgmt-page { display:none;min-height:100vh;background:#f0ede8; }
    .mgmt-header { background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:50; }
    .mgmt-header h2 { font-size:1.1rem;font-weight:600;flex:1; }
    .mgmt-content { max-width:900px;margin:0 auto;padding:1.5rem 2rem; }
    .mgmt-tabs { display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid var(--border); }
    .mgmt-tab { padding:0.6rem 1.2rem;cursor:pointer;font-size:0.9rem;color:var(--haze);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--transition); }
    .mgmt-tab.active { color:var(--accent);border-bottom-color:var(--accent); }
    .mgmt-section { display:none; }
    .mgmt-section.active { display:block; }
    .mgmt-card { background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:1.5rem; }
    .work-item { display:flex;align-items:center;gap:1rem;padding:0.8rem 0;border-bottom:1px solid var(--border); }
    .work-item:last-child { border-bottom:none; }
    .work-item img { width:50px;height:50px;border-radius:6px;object-fit:cover; }
    .work-item-info { flex:1; }
    .work-item-title { font-weight:600;font-size:0.9rem; }
    .work-item-meta { font-size:0.75rem;color:var(--haze);margin-top:0.2rem; }
    .event-item { display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid var(--border); }
    .event-item:last-child { border-bottom:none; }
    .works-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem; }
    .works-grid .card { cursor:pointer; }
    .work-modal-overlay { display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto; }
    .work-modal-overlay.open { display:flex; }
    .work-modal { background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:700px;box-shadow:var(--shadow-lg);margin:auto; }
    /* Filter buttons */
    .filter-btn { padding:0.35rem 0.8rem;border:1px solid var(--border);border-radius:100px;background:var(--card-bg);color:var(--haze);font-size:0.8rem;cursor:pointer;transition:var(--transition);white-space:nowrap; }
    .filter-btn:hover { border-color:var(--accent);color:var(--accent); }
    .filter-btn.active { background:var(--accent);border-color:var(--accent);color:white; }
    /* Author work card checkbox */
    .works-grid .card { position:relative; }
    .author-work-cb { position:absolute;top:8px;left:8px;z-index:2;width:18px;height:18px;accent-color:var(--accent);cursor:pointer; }
    .work-stats { display:flex;gap:0.8rem;margin-top:0.4rem;font-size:0.75rem;color:var(--haze); }
    @media (max-width:768px) {
      .mgmt-content { padding:1rem; }
      .mgmt-header { padding:0 1rem; }
      .mgmt-header h2 { font-size:0.95rem; }
      .mgmt-tabs { overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch; }
      .mgmt-tab { padding:0.5rem 0.8rem;font-size:0.8rem;white-space:nowrap; }
      .works-grid { grid-template-columns:repeat(2,1fr) !important;gap:0.6rem; }
      .work-modal-overlay { padding:0.5rem; }
      .work-modal { padding:1rem; }
      .form-row { flex-direction:column; }
      .auth-card { padding:1.5rem;margin:0 0.5rem; }
      #tab-images > .mgmt-card > div:nth-child(3) { flex-wrap:wrap; }
      #batchUploadInput { font-size:0.75rem; max-width:60%; }
    }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen" class="auth-page">
    <div class="auth-card">
      <h1>f7goods</h1>
      <p class="subtitle">作者管理</p>
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchAuthTab('login')">登录</div>
        <div class="auth-tab" onclick="switchAuthTab('register')">注册</div>
      </div>
      <div id="authError" class="auth-error"></div>
      <div id="authSuccess" class="auth-success"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" class="form-input" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" name="password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>选择作者 <span style="color:var(--accent)">*</span></label>
          <div style="position:relative;">
            <input type="text" class="form-input" id="regCircleSearch" placeholder="搜索作者名称..." oninput="filterCircleOptions()" onfocus="showCircleDropdown()" autocomplete="off" required>
            <input type="hidden" name="circleId" id="regCircleId">
            <div id="circleDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:10;margin-top:2px;box-shadow:var(--shadow);"></div>
          </div>
        </div>
        <div class="form-group">
          <label>用户名 <span style="color:var(--accent)">*</span></label>
          <input type="text" class="form-input" name="username" id="regUsername" required placeholder="设置登录用户名">
        </div>
        <div class="form-group">
          <label>密码 <span style="color:var(--accent)">*</span></label>
          <input type="password" class="form-input" name="password" required placeholder="至少6位" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">注册</button>
      </form>
    </div>
  </div>

  <!-- Management Screen -->
  <div id="mgmtScreen" class="mgmt-page">
    <header class="mgmt-header">
      <h2 id="mgmtTitle">作者管理</h2>
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <span id="mgmtAuthorName" style="font-size:0.85rem;color:var(--haze);"></span>
        <button class="btn" style="background:var(--border);color:var(--ink);font-size:0.8rem;padding:0.3rem 0.8rem;" onclick="authorLogout()">退出</button>
      </div>
    </header>
    <div class="mgmt-content">
      <div class="mgmt-tabs">
        <div class="mgmt-tab active" onclick="switchMgmtTab('profile')">作者资料</div>
        <div class="mgmt-tab" onclick="switchMgmtTab('works')">我的作品</div>
        <div class="mgmt-tab" onclick="switchMgmtTab('events')">活动关联</div>
        <div class="mgmt-tab" onclick="switchMgmtTab('projects')">企划关联</div>
        <div class="mgmt-tab" onclick="switchMgmtTab('images')">图片管理</div>
        <div class="mgmt-tab" onclick="switchMgmtTab('password')">修改密码</div>
        <div class="mgmt-tab" onclick="switchMgmtTab('history')">操作日志</div>
      </div>

      <!-- Stats Overview -->
      <div id="statsOverview" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.8rem;margin-bottom:1.5rem;">
        <div class="mgmt-card" style="padding:1rem;text-align:center;">
          <div style="font-size:1.5rem;font-weight:700;color:var(--accent);" id="statTotalWorks">0</div>
          <div style="font-size:0.8rem;color:var(--haze);margin-top:0.2rem;">作品总数</div>
        </div>
        <div class="mgmt-card" style="padding:1rem;text-align:center;">
          <div style="font-size:1.5rem;font-weight:700;color:#e74c3c;" id="statTotalLikes">0</div>
          <div style="font-size:0.8rem;color:var(--haze);margin-top:0.2rem;">总喜爱数</div>
        </div>
        <div class="mgmt-card" style="padding:1rem;text-align:center;">
          <div style="font-size:1.5rem;font-weight:700;color:#3498db;" id="statTotalWants">0</div>
          <div style="font-size:0.8rem;color:var(--haze);margin-top:0.2rem;">总想要数</div>
        </div>
        <div class="mgmt-card" style="padding:1rem;text-align:center;cursor:pointer;" onclick="window.open('/circle-detail.html?id='+authorCircleId,'_blank')">
          <div style="font-size:1.5rem;">👁</div>
          <div style="font-size:0.8rem;color:var(--haze);margin-top:0.2rem;">预览主页</div>
        </div>
      </div>

      <!-- Profile Tab -->
      <div id="tab-profile" class="mgmt-section active">
        <div class="mgmt-card">
          <h3 style="margin-bottom:1rem;">作者资料</h3>
          <div class="form-group">
            <label>作者名称</label>
            <input class="form-input" id="pName">
          </div>
          <div class="form-group">
            <label>分类</label>
            <select class="form-input" id="pCategory">
              <option value="">未分类</option>
            </select>
          </div>
          <div class="form-group">
            <label>简介</label>
            <textarea class="form-input" id="pDesc" style="min-height:100px;"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>联系方式类型</label>
              <select class="form-input" id="pContactType">
                <option value="qq">QQ</option>
                <option value="qqGroup">QQ群</option>
              </select>
            </div>
            <div class="form-group">
              <label>联系方式</label>
              <input class="form-input" id="pContactValue" placeholder="QQ号或QQ群号">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>联系显示名</label>
              <input class="form-input" id="pContactLabel" placeholder="如：QQ联系">
            </div>
            <div class="form-group">
              <label>网站链接</label>
              <input class="form-input" id="pWebsite" placeholder="https://...">
            </div>
          </div>
          <div class="form-group">
            <label>网站显示名</label>
            <input class="form-input" id="pWebsiteLabel" placeholder="如：访问官网">
          </div>
          <div class="form-group">
            <label>头像</label>
            <div id="pLogoPreview" style="margin-bottom:0.5rem;"></div>
            <button type="button" class="btn-sm btn-edit" onclick="openAuthorImageLib('pLogoPreview', true)">从图片库选择</button>
          </div>
          <div class="form-group">
            <label>作者图片</label>
            <div id="pImagesPreview" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.5rem;"></div>
            <button type="button" class="btn-sm btn-edit" onclick="openAuthorImageLib('pImagesPreview')">从图片库选择</button>
          </div>
          <button class="btn btn-primary" onclick="saveProfile()">保存资料</button>
        </div>
      </div>

      <!-- Works Tab -->
      <div id="tab-works" class="mgmt-section">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <h3 style="margin:0;">我的作品</h3>
          <div style="display:flex;gap:0.5rem;">
            <button id="authorBatchEditBtn" class="btn" style="background:var(--accent-alt);color:white;display:none;font-size:0.8rem;padding:0.3rem 0.8rem;" onclick="openAuthorBatchEdit()">批量编辑</button>
            <button id="authorBatchDeleteBtn" class="btn" style="background:var(--accent);color:white;display:none;font-size:0.8rem;padding:0.3rem 0.8rem;" onclick="batchDeleteWorks()">批量删除</button>
            <button class="btn" style="background:var(--border);color:var(--ink);font-size:0.8rem;padding:0.3rem 0.8rem;" onclick="exportWorksToExcel()">📥 导出</button>
            <button class="btn btn-primary" onclick="openAuthorWorkForm()">+ 新增作品</button>
          </div>
        </div>
        <!-- 分类筛选 -->
        <div id="authorCategoryFilters" style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem;"></div>
        <!-- 状态筛选 -->
        <div id="authorStatusFilters" style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.8rem;"></div>
        <!-- 搜索、排序、全选 -->
        <div style="display:flex;gap:0.8rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center;">
          <input type="text" class="form-input" id="authorWorksSearch" placeholder="搜索标题、标签、描述..." oninput="filterAuthorWorks()" style="flex:1;min-width:180px;font-size:0.85rem;padding:0.35rem 0.6rem;">
          <select class="form-input" id="authorWorksSort" onchange="sortAuthorWorks()" style="width:auto;font-size:0.85rem;padding:0.35rem 0.6rem;min-width:120px;">
            <option value="default">默认排序</option>
            <option value="date-desc">发售时间 ↓</option>
            <option value="date-asc">发售时间 ↑</option>
            <option value="likes-desc">喜爱数 ↓</option>
            <option value="likes-asc">喜爱数 ↑</option>
            <option value="wants-desc">想要数 ↓</option>
            <option value="wants-asc">想要数 ↑</option>
          </select>
          <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer;white-space:nowrap;">
            <input type="checkbox" id="selectAllAuthorWorks" onchange="toggleSelectAllAuthorWorks()" style="width:16px;height:16px;accent-color:var(--accent);">
            全选
          </label>
        </div>
        <div id="worksGrid" class="works-grid"></div>
      </div>

      <!-- Batch Edit Modal -->
      <div id="batchEditOverlay" class="work-modal-overlay" onclick="if(event.target===this)closeBatchEdit()">
        <div class="work-modal">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h3 id="batchEditTitle" style="margin:0;">批量编辑</h3>
            <button onclick="closeBatchEdit()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--haze);">&times;</button>
          </div>
          <div id="batchEditBody">
            <div id="batchSelectedWorks" style="margin-bottom:1rem;font-size:0.85rem;color:var(--haze);"></div>
            <div class="form-group">
              <label>分类</label>
              <select class="form-input" id="batchCategory">
                <option value="">— 不修改 —</option>
              </select>
            </div>
            <div class="form-group">
              <label>状态</label>
              <select class="form-input" id="batchStatus">
                <option value="">— 不修改 —</option>
              </select>
            </div>
            <div class="form-group">
              <label>价格</label>
              <input class="form-input" id="batchPrice" placeholder="留空不修改">
            </div>
            <div class="form-group">
              <label>发售日期</label>
              <input type="date" class="form-input" id="batchReleaseDate">
            </div>
            <div class="form-group">
              <label>关联活动</label>
              <div id="batchEventsList" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.5rem;font-size:0.85rem;">
                <p style="color:var(--haze);">加载中...</p>
              </div>
            </div>
            <div class="form-group">
              <label>关联企划</label>
              <div id="batchProjectsList" style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.5rem;font-size:0.85rem;">
                <p style="color:var(--haze);">加载中...</p>
              </div>
            </div>
            <div style="display:flex;gap:0.5rem;margin-top:1rem;">
              <button class="btn btn-primary" onclick="saveBatchEdit()">保存</button>
              <button class="btn" style="background:var(--border);color:var(--ink);" onclick="closeBatchEdit()">取消</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Work Edit Modal -->
      <div id="workModalOverlay" class="work-modal-overlay" onclick="if(event.target===this)closeWorkModal()">
        <div class="work-modal">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <h3 id="workModalTitle" style="margin:0;">编辑作品</h3>
            <button onclick="closeWorkModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--haze);">&times;</button>
          </div>
          <div id="workModalBody"></div>
        </div>
      </div>

      <!-- Events Tab -->
      <div id="tab-events" class="mgmt-section">
        <div class="mgmt-card">
          <h3 style="margin-bottom:1rem;">活动关联</h3>
          <p style="color:var(--haze);font-size:0.85rem;margin-bottom:1rem;">勾选要关联的活动，取消勾选可解除关联。</p>
          <div id="eventsList"></div>
        </div>
      </div>

      <!-- Projects Tab -->
      <div id="tab-projects" class="mgmt-section">
        <div class="mgmt-card">
          <h3 style="margin-bottom:1rem;">企划关联</h3>
          <p style="color:var(--haze);font-size:0.85rem;margin-bottom:1rem;">勾选要关联的企划，取消勾选可解除关联。</p>
          <div id="projectsList"></div>
        </div>
      </div>

      <!-- Images Tab -->
      <div id="tab-images" class="mgmt-section">
        <div class="mgmt-card">
          <h3 style="margin-bottom:1rem;">图片管理</h3>
          <p style="color:var(--haze);font-size:0.85rem;margin-bottom:1rem;">管理您上传的所有图片。点击图片可复制链接。</p>
          <div style="display:flex;gap:0.5rem;margin-bottom:1rem;align-items:center;">
            <input type="file" id="batchUploadInput" accept="image/*" multiple style="font-size:0.85rem;">
            <button class="btn btn-primary" onclick="batchUploadAuthorImages()">批量上传</button>
            <button class="btn" id="batchDeleteBtn" style="background:var(--accent);color:white;display:none;" onclick="batchDeleteAuthorImages()">批量删除</button>
            <span id="imageCount" style="font-size:0.85rem;color:var(--haze);margin-left:auto;"></span>
          </div>
          <div id="authorImageGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.8rem;"></div>
        </div>
      </div>

      <!-- Password Tab -->
      <div id="tab-password" class="mgmt-section">
        <div class="mgmt-card">
          <h3 style="margin-bottom:1rem;">修改密码</h3>
          <div id="pwError" class="auth-error"></div>
          <div id="pwSuccess" class="auth-success"></div>
          <div class="form-group">
            <label>旧密码</label>
            <input type="password" class="form-input" id="pwOld" required>
          </div>
          <div class="form-group">
            <label>新密码</label>
            <input type="password" class="form-input" id="pwNew" required minlength="6" placeholder="至少6位">
          </div>
          <div class="form-group">
            <label>确认新密码</label>
            <input type="password" class="form-input" id="pwConfirm" required>
          </div>
          <button class="btn btn-primary" onclick="changeAuthorPassword()">修改密码</button>
        </div>
      </div>

      <!-- History Tab -->
      <div id="tab-history" class="mgmt-section">
        <div class="mgmt-card">
          <h3 style="margin-bottom:1rem;">操作日志</h3>
          <p style="color:var(--haze);font-size:0.85rem;margin-bottom:1rem;">查看您的最近操作记录。</p>
          <div id="authorHistoryContainer" style="max-height:500px;overflow-y:auto;">
            <p style="color:var(--haze);text-align:center;padding:2rem;">加载中...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260803"></script>
  <script>
    let authorToken = localStorage.getItem('f7author_token');
    let authorCircleId = localStorage.getItem('f7author_circleId');
    let authorProfile = null;

    // Auth tab switching
    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-tab')[tab === 'login' ? 0 : 1].classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('authError').style.display = 'none';
      document.getElementById('authSuccess').style.display = 'none';
    }

    // Load circles for registration
    let availableCircles = [];

    async function loadCirclesForRegister() {
      try {
        const circles = await F7API.getCircles();
        availableCircles = circles.filter(c => !c.username); // Only unregistered circles
        renderCircleDropdown(availableCircles);
      } catch (e) {}
    }

    function renderCircleDropdown(circles) {
      const dropdown = document.getElementById('circleDropdown');
      if (!circles.length) {
        dropdown.innerHTML = '<div style="padding:0.6rem 0.8rem;color:var(--haze);font-size:0.85rem;">没有找到匹配的作者</div>';
        return;
      }
      dropdown.innerHTML = circles.map(c =>
        `<div class="circle-option" data-id="${c.id}" data-name="${escapeHtml(c.name)}" onclick="selectCircle('${c.id}', '${escapeHtml(c.name)}')" style="padding:0.6rem 0.8rem;cursor:pointer;font-size:0.85rem;border-bottom:1px solid var(--border);transition:background 0.15s;" onmouseover="this.style.background='var(--paper)'" onmouseout="this.style.background=''">${escapeHtml(c.name)}</div>`

    function showCircleDropdown() {
      document.getElementById('circleDropdown').style.display = 'block';

    function hideCircleDropdown() {
      setTimeout(() => {
        document.getElementById('circleDropdown').style.display = 'none';
      }, 200);
    }

    function selectCircle(id, name) {
      document.getElementById('regCircleId').value = id;
      document.getElementById('regCircleSearch').value = name;
      document.getElementById('regUsername').value = name;
      document.getElementById('circleDropdown').style.display = 'none';

    document.addEventListener('click', function(e) {
      const search = document.getElementById('regCircleSearch');
      const dropdown = document.getElementById('circleDropdown');
      if (search && dropdown && !search.contains(e.target) && !dropdown.contains(e.target)) {

    // Login
    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      errEl.style.display = 'none';
      successEl.style.display = 'none';

      try {
        const res = await fetch('/api/author/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || '登录失败';
          errEl.style.display = 'block';
          return;
        }
        authorToken = data.token;
        authorCircleId = data.circleId;
        localStorage.setItem('f7author_token', authorToken);
        localStorage.setItem('f7author_circleId', authorCircleId);
        showMgmtPage();
      } catch (e) {
        errEl.textContent = '网络错误';
        errEl.style.display = 'block';
      }
    }

    // Register
    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      errEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!form.circleId.value) {
        errEl.textContent = '请先搜索并选择作者';
        errEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/author/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            circleId: form.circleId.value,
            username: form.username.value,
            password: form.password.value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || '注册失败';
          errEl.style.display = 'block';
          return;
        }
        successEl.textContent = data.message || '注册成功';
        successEl.style.display = 'block';
        form.reset();
        setTimeout(() => switchAuthTab('login'), 2000);
      } catch (e) {
        errEl.textContent = '网络错误';
        errEl.style.display = 'block';
      }
    }

    // Show management page
    async function showMgmtPage() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mgmtScreen').style.display = 'block';
      await loadAuthorProfile();
      await loadAuthorWorks();
      await loadAuthorEvents();
      loadAuthorProjects();
      loadAuthorImages();
    }

    // Author API helper
    async function authorAPI(method, path, body) {
      const opts = {
        method,
        headers: { 'Authorization': 'Bearer ' + authorToken, 'Content-Type': 'application/json' }
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (res.status === 401) {
        authorLogout();
        return null;
      }
      return res.json();
    }

    // Load profile
    async function loadAuthorProfile() {
      authorProfile = await authorAPI('GET', '/api/author/profile');
      if (!authorProfile) return;

      document.getElementById('mgmtTitle').textContent = authorProfile.name + ' — 作者管理';
      document.getElementById('mgmtAuthorName').textContent = authorProfile.name;

      document.getElementById('pName').value = authorProfile.name || '';
      document.getElementById('pDesc').value = authorProfile.description || '';

      // Load categories
      await loadCategoriesFromAPI();
      const catSelect = document.getElementById('pCategory');
      catSelect.innerHTML = '<option value="">未分类</option>';
      Object.entries(CIRCLE_CATEGORIES).forEach(([k, v]) => {
        catSelect.innerHTML += '<option value="' + k + '"' + (authorProfile.category === k ? ' selected' : '') + '>' + v + '</option>';
      });

      const sl = authorProfile.socialLinks || {};
      document.getElementById('pContactType').value = sl.qqGroup ? 'qqGroup' : 'qq';
      document.getElementById('pContactValue').value = sl.qq || sl.qqGroup || '';
      document.getElementById('pContactLabel').value = sl.contactLabel || '';
      document.getElementById('pWebsite').value = sl.website || '';
      document.getElementById('pWebsiteLabel').value = sl.websiteLabel || '';

        : '';

      const imagesPreview = document.getElementById('pImagesPreview');
      imagesPreview.innerHTML = (authorProfile.images || []).map(img =>
        '<div style="position:relative;"><img src="' + img + '" style="width:80px;height:80px;object-fit:cover;border-radius:6px;"><button onclick="this.parentElement.remove()" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:10px;cursor:pointer;line-height:1;">&times;</button></div>'
      ).join('');

    // Upload logo
    async function uploadAuthorLogo() {
      const input = document.getElementById('pLogoInput');
      if (!input.files.length) { alert('请选择头像'); return; }
      const formData = new FormData();
      formData.append('image', input.files[0]);
      const res = await fetch('/api/author/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + authorToken },
        body: formData
      });
      const data = await res.json();
      if (data.url) {
        document.getElementById('pLogoPreview').innerHTML =
          '<div style="position:relative;display:inline-block;"><img src="' + data.url + '" style="width:80px;height:80px;object-fit:cover;border-radius:50%;"><button onclick="this.parentElement.remove()" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:10px;cursor:pointer;line-height:1;">&times;</button></div>';

    // Upload images
    async function uploadAuthorImages() {
      const input = document.getElementById('pImagesInput');
      if (!input.files.length) { alert('请选择图片'); return; }
      for (const file of input.files) {
        const formData = new FormData();
        formData.append('image', file);
        const res = await fetch('/api/author/upload', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + authorToken },
          body: formData
        });
        const data = await res.json();
        if (data.url) {
          const preview = document.getElementById('pImagesPreview');
          const div = document.createElement('div');
          div.style.position = 'relative';
          div.innerHTML = '<img src="' + data.url + '" style="width:80px;height:80px;object-fit:cover;border-radius:6px;"><button onclick="this.parentElement.remove()" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:10px;cursor:pointer;line-height:1;">&times;</button>';

    // Save profile
    async function saveProfile() {
      const contactType = document.getElementById('pContactType').value;
      const contactValue = document.getElementById('pContactValue').value;
      const socialLinks = {
        contactLabel: document.getElementById('pContactLabel').value,
        website: document.getElementById('pWebsite').value,
        websiteLabel: document.getElementById('pWebsiteLabel').value
      };
      if (contactType && contactValue) socialLinks[contactType] = contactValue;

      const data = {
        name: document.getElementById('pName').value,

        description: document.getElementById('pDesc').value,
        socialLinks,
        logo: document.querySelector('#pLogoPreview img')?.src || '',
        images: [...document.querySelectorAll('#pImagesPreview img')].map(img => img.src)
      };

      const result = await authorAPI('PUT', '/api/author/profile', data);
      if (result) {
        authorProfile = result;
        document.getElementById('mgmtTitle').textContent = result.name + ' — 作者管理';

    // Load works
    let authorWorksData = [];
    let currentAuthorCategory = 'all';
    let currentAuthorStatus = 'all';

    async function loadAuthorWorks() {
      const works = await authorAPI('GET', '/api/author/works');
      authorWorksData = works || [];
      buildAuthorCategoryFilters();
      buildAuthorStatusFilters();
      renderAuthorWorks(authorWorksData);
      updateStats();

    // Update stats overview
    function updateStats() {
      const totalWorks = authorWorksData.length;
      const totalLikes = authorWorksData.reduce((sum, w) => sum + (w.likes || 0), 0);
      const totalWants = authorWorksData.reduce((sum, w) => sum + (w.wants || 0), 0);
      document.getElementById('statTotalWorks').textContent = totalWorks;
      document.getElementById('statTotalLikes').textContent = totalLikes;
      document.getElementById('statTotalWants').textContent = totalWants;
    }

    function renderAuthorWorks(works) {
      const grid = document.getElementById('worksGrid');
      if (!works || works.length === 0) {
        grid.innerHTML = '<p style="color:var(--haze);text-align:center;padding:2rem;grid-column:1/-1;">暂无作品，点击上方按钮创建</p>';
        return;
      }
      grid.innerHTML = works.map((w, i) => {
        const hasImg = w.images && w.images.length > 0;
        return `
        <div class="card" data-id="${w.id}" data-category="${w.category || ''}" data-status="${w.status || ''}" data-date="${w.releaseDate || ''}" data-likes="${w.likes || 0}" data-wants="${w.wants || 0}" data-order="${w.order || i}" data-title="${escapeHtml(w.title)}" data-tags="${(w.tags||[]).join(',')}" data-desc="${escapeHtml(w.description || '')}">
          <input type="checkbox" class="author-work-cb" data-id="${w.id}" onchange="updateAuthorBatchBtn()" onclick="event.stopPropagation()">
          <div class="card-image" style="height:160px;${hasImg ? '' : 'background:linear-gradient(135deg,var(--accent),var(--accent-alt));'}" onclick="openWorkEditModal('${w.id}')">
            ${hasImg ? '<img src="'+w.images[0]+'" alt="'+escapeHtml(w.title)+'">' : '<span class="placeholder-icon" style="color:white;">🎨</span>'}
          </div>
          <div class="card-body" style="padding:0.8rem;" onclick="openWorkEditModal('${w.id}')">
            <div style="display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem;">
              <select class="form-input work-status-select" data-id="${w.id}" onchange="quickChangeStatus('${w.id}',this.value)" onclick="event.stopPropagation()" style="font-size:0.7rem;padding:0.15rem 0.3rem;width:auto;flex:1;">
                ${Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}"${w.status===k?' selected':''}>${v}</option>`).join('')}
              </select>
              <button class="btn-sm" onclick="event.stopPropagation();duplicateWork('${w.id}')" title="复制作品" style="font-size:0.7rem;padding:0.15rem 0.4rem;background:var(--border);color:var(--ink);">📋</button>
              <button class="btn-sm" onclick="event.stopPropagation();deleteAuthorWork('${w.id}')" title="删除作品" style="font-size:0.7rem;padding:0.15rem 0.4rem;background:var(--accent);color:white;">🗑</button>
            </div>
            <h3 class="card-title" style="font-size:0.9rem;margin-top:0.3rem;">${escapeHtml(w.title)}</h3>
            <p class="card-price" style="color:var(--accent);font-weight:700;margin-top:0.3rem;font-size:0.9rem;">${w.price || ''}</p>
            <div class="work-stats">
              <span title="喜爱数">❤️ ${w.likes || 0}</span>
              <span title="想要数">⭐ ${w.wants || 0}</span>
            </div>
          </div>
        </div>`;
      }).join('');
      updateAuthorBatchBtn();

    // Quick status change
    async function quickChangeStatus(workId, newStatus) {
      const result = await authorAPI('PUT', '/api/author/works/' + workId, { status: newStatus });
      if (result) {
        const work = authorWorksData.find(w => w.id === workId);
        if (work) work.status = newStatus;
        showToast('状态已更新', 'success');
      }
    }

    // Duplicate work
    async function duplicateWork(workId) {
      const work = authorWorksData.find(w => w.id === workId);
      if (!work) return;
      if (!confirm(`确定复制作品"${work.title}"？`)) return;

      const newWork = {
        ...work,
        id: undefined,
        title: work.title + ' (副本)',
        likes: 0,
        wants: 0,
        createdAt: undefined
      };
      delete newWork.id;
      delete newWork.createdAt;

      const result = await authorAPI('POST', '/api/author/works', newWork);
      if (result) {
        showToast('作品已复制', 'success');
        loadAuthorWorks();
      }
    }

    // Delete work
    async function deleteAuthorWork(workId) {
      const work = authorWorksData.find(w => w.id === workId);
      if (!work) return;
      if (!confirm(`确定删除作品"${work.title}"？此操作不可撤销。`)) return;

      const result = await authorAPI('DELETE', '/api/author/works/' + workId);
      if (result && result.success) {
        showToast('作品已删除', 'success');
        loadAuthorWorks();
      } else {
        alert(result?.error || '删除失败');
      }
    }

    // Export works to Excel
    function exportWorksToExcel() {
      if (authorWorksData.length === 0) { alert('没有作品可导出'); return; }
      const headers = ['作品名称', '分类', '状态', '价格', '发售日期', '标签', '喜爱数', '想要数', '描述'];
      const rows = authorWorksData.map(w => [
        w.title,
        CATEGORIES[w.category] || w.category || '',
        STATUS_LABELS[w.status] || w.status || '',
        w.price || '',
        w.releaseDate || '',
        (w.tags || []).join(', '),
        w.likes || 0,
        w.wants || 0,
        w.description || ''
      ]);

      let csv = '\uFEFF' + headers.join(',') + '\n';
      rows.forEach(row => {
        csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `作品列表_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
      showToast('导出成功', 'success');
    }

    async function loadAuthorHistory() {

        const log = await authorAPI('GET', '/api/author/history');
        if (!log || log.length === 0) {

            <span style="color:var(--accent-alt);font-weight:500;">${escapeHtml(entry.action)}</span>

    // Build category filter buttons
    function buildAuthorCategoryFilters() {
      const container = document.getElementById('authorCategoryFilters');
      const usedCategories = new Set(authorWorksData.map(w => w.category).filter(Boolean));
      const cats = CATEGORIES_ORDERED.filter(c => usedCategories.has(c.id));
      container.innerHTML = '<button class="filter-btn active" data-cat="all">全部</button>' +
        cats.map(c => `<button class="filter-btn" data-cat="${c.id}">${c.name}</button>`).join('');

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentAuthorCategory = btn.dataset.cat;
          applyAuthorWorksFilters();
        });
      });
    }

    // Build status filter buttons
    function buildAuthorStatusFilters() {
      const container = document.getElementById('authorStatusFilters');
      const usedStatuses = new Set(authorWorksData.map(w => w.status).filter(Boolean));
      const statuses = STATUS_ORDERED.filter(s => usedStatuses.has(s.id));
      container.innerHTML = '<button class="filter-btn active" data-status="all">全部状态</button>' +
        statuses.map(s => `<button class="filter-btn" data-status="${s.id}">${s.name}</button>`).join('');

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentAuthorStatus = btn.dataset.status;
          applyAuthorWorksFilters();
        });
      });
    }

    // Unified filter: category + status + search
    function applyAuthorWorksFilters() {
      const query = document.getElementById('authorWorksSearch').value.toLowerCase().trim();
      const cards = document.querySelectorAll('#worksGrid .card');
      cards.forEach(card => {
        const cat = card.dataset.category || '';
        const status = card.dataset.status || '';
        const matchCat = currentAuthorCategory === 'all' || cat === currentAuthorCategory;
        const matchStatus = currentAuthorStatus === 'all' || status === currentAuthorStatus;
        if (!query) {
          card.style.display = (matchCat && matchStatus) ? '' : 'none';
          return;
        }
        const title = (card.dataset.title || '').toLowerCase();
        const tags = (card.dataset.tags || '').toLowerCase();
        const desc = (card.dataset.desc || '').toLowerCase();
        const matchSearch = title.includes(query) || tags.includes(query) || desc.includes(query);
        card.style.display = (matchCat && matchStatus && matchSearch) ? '' : 'none';
      });
    }

    // Search filter
    function filterAuthorWorks() {
      applyAuthorWorksFilters();
    }

    // Sort works
    function sortAuthorWorks() {
      const sortBy = document.getElementById('authorWorksSort').value;
      const grid = document.getElementById('worksGrid');
      const cards = [...grid.querySelectorAll('.card')];
      cards.sort((a, b) => {
        switch(sortBy) {
          case 'date-desc': return (b.dataset.date || '').localeCompare(a.dataset.date || '');
          case 'date-asc': return (a.dataset.date || '').localeCompare(b.dataset.date || '');
          case 'likes-desc': return (parseInt(b.dataset.likes) || 0) - (parseInt(a.dataset.likes) || 0);
          case 'likes-asc': return (parseInt(a.dataset.likes) || 0) - (parseInt(b.dataset.likes) || 0);
          case 'wants-desc': return (parseInt(b.dataset.wants) || 0) - (parseInt(a.dataset.wants) || 0);
          case 'wants-asc': return (parseInt(a.dataset.wants) || 0) - (parseInt(b.dataset.wants) || 0);
          default: return (parseInt(a.dataset.order) || 0) - (parseInt(b.dataset.order) || 0);
        }
      });
      cards.forEach(card => grid.appendChild(card));
    }

    // Select all
    function toggleSelectAllAuthorWorks() {
      const checked = document.getElementById('selectAllAuthorWorks').checked;
      document.querySelectorAll('.author-work-cb').forEach(cb => {
        const card = cb.closest('.card');
        if (card && card.style.display !== 'none') cb.checked = checked;
      });
      updateAuthorBatchBtn();
    }

    // Update batch button
    function updateAuthorBatchBtn() {
      const checked = document.querySelectorAll('.author-work-cb:checked');
      const editBtn = document.getElementById('authorBatchEditBtn');
      const deleteBtn = document.getElementById('authorBatchDeleteBtn');
      if (editBtn) {
        editBtn.style.display = checked.length > 1 ? 'inline-flex' : 'none';
        editBtn.textContent = `批量编辑 (${checked.length})`;
      }
      if (deleteBtn) {
        deleteBtn.style.display = checked.length > 0 ? 'inline-flex' : 'none';

    // Batch delete works
    async function batchDeleteWorks() {
      const checked = document.querySelectorAll('.author-work-cb:checked');
      if (checked.length === 0) { alert('请至少选择1个作品'); return; }

      const workIds = [...checked].map(cb => cb.dataset.id);
      const selectedWorks = authorWorksData.filter(w => workIds.includes(w.id));
      const titles = selectedWorks.map(w => w.title).join('、');

      if (!confirm(`确定删除以下 ${selectedWorks.length} 个作品？\n${titles}\n\n此操作不可撤销。`)) return;

      let success = 0;
      for (const id of workIds) {
        const result = await authorAPI('DELETE', '/api/author/works/' + id);
        if (result && result.success) success++;
      }

      showToast(`已删除 ${success} 个作品`, 'success');
      loadAuthorWorks();
    }

    // Open batch edit
    async function openAuthorBatchEdit() {
      const checked = document.querySelectorAll('.author-work-cb:checked');
      if (checked.length < 2) { alert('请至少选择2个作品'); return; }

      const workIds = [...checked].map(cb => cb.dataset.id);
      const selectedWorks = authorWorksData.filter(w => workIds.includes(w.id));

      document.getElementById('batchSelectedWorks').innerHTML =
        `已选择 ${selectedWorks.length} 个作品：` + selectedWorks.map(w => escapeHtml(w.title)).join('、');

      // Populate category dropdown
      const catSelect = document.getElementById('batchCategory');
      catSelect.innerHTML = '<option value="">— 不修改 —</option>' +
        CATEGORIES_ORDERED.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

      // Populate status dropdown
      const statusSelect = document.getElementById('batchStatus');
      statusSelect.innerHTML = '<option value="">— 不修改 —</option>' +
        Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');

      document.getElementById('batchPrice').value = '';
      document.getElementById('batchReleaseDate').value = '';

      // Load events and projects
      const [allEvents, allProjects] = await Promise.all([
        authorAPI('GET', '/api/author/events'),
        authorAPI('GET', '/api/author/projects')
      ]);

      // Render events checkboxes
      const eventsContainer = document.getElementById('batchEventsList');
      if (allEvents && allEvents.length > 0) {
        const authorEvents = allEvents.filter(e => (e.relatedCircles || []).includes(authorCircleId));
        eventsContainer.innerHTML = authorEvents.length > 0
          ? authorEvents.map(e => `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem;cursor:pointer;"><input type="checkbox" class="batch-event-cb" value="${e.id}" style="width:14px;height:14px;accent-color:var(--accent);">${escapeHtml(e.title)}</label>`).join('')
          : '<p style="color:var(--haze);margin:0;">暂无关联的活动</p>';
      } else {
        eventsContainer.innerHTML = '<p style="color:var(--haze);margin:0;">暂无活动</p>';
      }

      // Render projects checkboxes
      const projectsContainer = document.getElementById('batchProjectsList');
      if (allProjects && allProjects.length > 0) {
        projectsContainer.innerHTML = allProjects.map(p => `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem;cursor:pointer;"><input type="checkbox" class="batch-project-cb" value="${p.id}" style="width:14px;height:14px;accent-color:var(--accent);">${escapeHtml(p.title)}</label>`).join('');
      } else {
        projectsContainer.innerHTML = '<p style="color:var(--haze);margin:0;">暂无企划</p>';
      }

      document.getElementById('batchEditOverlay').classList.add('open');
    }

    // Save batch edit
    async function saveBatchEdit() {
      const checked = document.querySelectorAll('.author-work-cb:checked');
      const workIds = [...checked].map(cb => cb.dataset.id);

      const data = {};
      const category = document.getElementById('batchCategory').value;
      const status = document.getElementById('batchStatus').value;
      const price = document.getElementById('batchPrice').value;
      const releaseDate = document.getElementById('batchReleaseDate').value;

      if (category) data.category = category;
      if (status) data.status = status;
      if (price) data.price = price;
      if (releaseDate) data.releaseDate = releaseDate;

      // Get selected events and projects
      const selectedEventIds = [...document.querySelectorAll('.batch-event-cb:checked')].map(cb => cb.value);
      const selectedProjectIds = [...document.querySelectorAll('.batch-project-cb:checked')].map(cb => cb.value);

      const hasBasicChanges = Object.keys(data).length > 0;
      const hasEventChanges = selectedEventIds.length > 0;
      const hasProjectChanges = selectedProjectIds.length > 0;

      if (!hasBasicChanges && !hasEventChanges && !hasProjectChanges) { alert('请至少修改一个字段'); return; }

      let success = 0;
      for (const id of workIds) {
        // Update basic fields
        if (hasBasicChanges) {
          const result = await authorAPI('PUT', '/api/author/works/' + id, data);
          if (result) success++;
        }
        // Update project associations
        if (hasProjectChanges) {
          await authorAPI('PUT', '/api/author/works/' + id, { relatedProjects: selectedProjectIds });
        }
      }

      // Update event associations (events are associated to circles, not individual works)
      if (hasEventChanges) {
        const allEvents = await authorAPI('GET', '/api/author/events');
        for (const evt of (allEvents || [])) {
          const isRelated = (evt.relatedCircles || []).includes(authorCircleId);
          const shouldBeRelated = selectedEventIds.includes(evt.id);
          if (isRelated !== shouldBeRelated) {
            await authorAPI('PUT', '/api/author/events/' + evt.id + '/toggle');
          }
        }
      }

      if (!hasBasicChanges) success = workIds.length;
      showToast(`已更新 ${success} 个作品`, 'success');
      closeBatchEdit();
      loadAuthorWorks();
    }

      document.getElementById('batchEditOverlay').classList.remove('open');
    }

    async function wfUploadImages(inputId, previewId) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      if (!input.files.length) { alert('请选择图片'); return; }
      for (const file of input.files) {
        const formData = new FormData();
        formData.append('image', file);
        const res = await fetch('/api/author/upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authorToken }, body: formData });
        const data = await res.json();
        if (data.url) {
          const div = document.createElement('div');
          div.style.position = 'relative';
          div.innerHTML = '<img src="'+data.url+'" style="width:80px;height:80px;object-fit:cover;border-radius:6px;"><button onclick="this.parentElement.remove()" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:10px;cursor:pointer;line-height:1;">&times;</button>';
          preview.appendChild(div);
        }
      }
      input.value = '';
    }

    async function saveAuthorWorkForm(workId) {
      const contactType = document.getElementById('wfContactType').value;
      const contactValue = document.getElementById('wfContactValue').value;
      const socialLinks = {
        contactLabel: document.getElementById('wfContactLabel').value,
        website: document.getElementById('wfWebsite').value,
        websiteLabel: document.getElementById('wfWebsiteLabel').value
      };
      if (contactType && contactValue) socialLinks[contactType] = contactValue;

      const selectedEventIds = [...document.querySelectorAll('.wf-event-cb:checked')].map(cb => cb.value);
      const selectedProjectIds = [...document.querySelectorAll('.wf-project-cb:checked')].map(cb => cb.value);

      const data = {
        title: document.getElementById('wfTitle').value,
        category: document.getElementById('wfCategory').value,
        status: document.getElementById('wfStatus').value,
        price: document.getElementById('wfPrice').value,
        releaseDate: document.getElementById('wfReleaseDate').value,
        tags: document.getElementById('wfTags').value.split(',').map(t => t.trim()).filter(Boolean),
        description: document.getElementById('wfDesc').value,
        images: [...document.querySelectorAll('#wfImagesPreview img')].map(img => img.src),
        moreImages: [...document.querySelectorAll('#wfMoreImagesPreview img')].map(img => img.src),
        socialLinks,
        relatedProjects: selectedProjectIds
      };

      if (!data.title) { alert('请填写标题'); return; }

      let result;
      if (workId) {
        result = await authorAPI('PUT', '/api/author/works/' + workId, data);
        // Update event associations
        const allEvents = await authorAPI('GET', '/api/author/events');
        for (const evt of (allEvents || [])) {
          const isRelated = (evt.relatedCircles || []).includes(authorCircleId);
          const shouldBeRelated = selectedEventIds.includes(evt.id);
          if (isRelated !== shouldBeRelated) {
            await authorAPI('PUT', '/api/author/events/' + evt.id + '/toggle');
          }
        }
      } else {
        result = await authorAPI('POST', '/api/author/works', data);
        // For new works, add event associations
        for (const eventId of selectedEventIds) {
          const evt = (await authorAPI('GET', '/api/author/events')).find(e => e.id === eventId);
          if (evt && !(evt.relatedCircles || []).includes(authorCircleId)) {
            await authorAPI('PUT', '/api/author/events/' + eventId + '/toggle');
          }
        }
      }
      if (result) {
        showToast('作品已保存', 'success');
        closeWorkModal();
        loadAuthorWorks();
      }
    }

    async function batchDeleteAuthorImages() {
      const checked = document.querySelectorAll('.author-img-cb:checked');
      if (checked.length === 0) return;
      if (!confirm('确定删除选中的 ' + checked.length + ' 张图片？')) return;
      let deleted = 0;
      for (const cb of checked) {
        const result = await authorAPI('DELETE', '/api/author/images/' + cb.dataset.name);
        if (result && result.success) deleted++;
      }
      showToast('已删除 ' + deleted + ' 张图片', 'success');
      loadAuthorImages();
    }

    async function batchUploadAuthorImages() {
      const input = document.getElementById('batchUploadInput');
      if (!input.files.length) { alert('请选择图片'); return; }
      let uploaded = 0;
      for (const file of input.files) {
        const formData = new FormData();
        formData.append('image', file);
        const res = await fetch('/api/author/upload', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authorToken }, body: formData });
        if (res.ok) uploaded++;
      }
      input.value = '';
      showToast('成功上传 ' + uploaded + ' 张图片', 'success');
      loadAuthorImages();
    }

    async function deleteAuthorImage(filename) {
      if (!confirm('确定删除图片 ' + filename + '？')) return;
      const result = await authorAPI('DELETE', '/api/author/images/' + filename);
      if (result && result.success) {
        showToast('已删除', 'success');
        loadAuthorImages();
      } else {
        alert(result?.error || '删除失败');
      }
    }

    function copyAuthorImgUrl(url) {
      const fullUrl = location.origin + url;
      navigator.clipboard.writeText(fullUrl).then(() => showToast('链接已复制', 'success')).catch(() => prompt('复制此链接:', fullUrl));
    }

    // Change password
    async function changeAuthorPassword() {
      const oldPw = document.getElementById('pwOld').value;
      const newPw = document.getElementById('pwNew').value;
      const confirmPw = document.getElementById('pwConfirm').value;
      const errEl = document.getElementById('pwError');
      const successEl = document.getElementById('pwSuccess');
      errEl.style.display = 'none';
      successEl.style.display = 'none';

      if (newPw !== confirmPw) {
        errEl.textContent = '两次输入的密码不一致';
        errEl.style.display = 'block';
        return;
      }

      const result = await authorAPI('POST', '/api/author/change-password', { oldPassword: oldPw, newPassword: newPw });
      if (result && result.success) {
        successEl.textContent = '密码修改成功';
        successEl.style.display = 'block';
        document.getElementById('pwOld').value = '';
        document.getElementById('pwNew').value = '';
        document.getElementById('pwConfirm').value = '';
      } else if (result) {
        errEl.textContent = result.error || '修改失败';
        errEl.style.display = 'block';
      }
    }

    // Management tab switching
    function switchMgmtTab(tab) {
      document.querySelectorAll('.mgmt-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.mgmt-section').forEach(s => s.classList.remove('active'));
      document.querySelector('.mgmt-tab[onclick*="' + tab + '"]').classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'history') loadAuthorHistory();
    }

    // Logout
    function authorLogout() {
      authorToken = null;
      authorCircleId = null;
      localStorage.removeItem('f7author_token');
      localStorage.removeItem('f7author_circleId');
      document.getElementById('mgmtScreen').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
    }

    // Check existing token
    async function checkAuthorAuth() {
      if (authorToken) {
        try {
          const res = await fetch('/api/author/profile', {
            headers: { 'Authorization': 'Bearer ' + authorToken }
          });
          if (res.ok) {
            showMgmtPage();
            return;
          }
        } catch (e) {}
        authorLogout();
      }
      loadCirclesForRegister();
    }

    checkAuthorAuth();
  </script>
</body>
</html>

  <script>
    // Apply theme immediately
    if (typeof applyTheme === 'function') applyTheme();

    // Site logo in shell brand (same source as public navbar)
    async function applyMgmtBrandLogo() {
      try {
        if (typeof loadSettingsFromAPI === 'function') await loadSettingsFromAPI();
        const site = (typeof getSiteSettings === 'function') ? getSiteSettings() : {};
        const mark = document.getElementById('mgmtBrandMark');
        if (!mark) return;
        const brandName = site.brandName || 'f7goods';
        const logoText = site.logoText || 'f7';
        const favicon = site.favicon;
        mark.setAttribute('aria-label', brandName);
        if (favicon) {
          mark.innerHTML = '<img src="' + favicon.replace(/"/g, '&quot;') + '" alt="' + brandName.replace(/"/g, '&quot;') + '" onerror="this.replaceWith(document.createTextNode(\'' + logoText.replace(/'/g, '') + '\'))">';
        } else {
          mark.textContent = logoText;
        }
      } catch (e) {}
    }
    applyMgmtBrandLogo();

    // ===== 鏍囩鑺墖杈撳叆 =====
    const TAG_SEP_RE = /[,锛屻€?锛沒+/;

    function parseTagString(str) {
      return String(str || '').split(TAG_SEP_RE).map(t => t.trim()).filter(Boolean);
    }

    function getTagChipValues(hiddenId) {
      return parseTagString(document.getElementById(hiddenId)?.value || '');
    }

    function createTagChip(box, text) {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      const label = document.createElement('span');
      label.className = 'tag-chip-text';
      label.textContent = text;
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.setAttribute('aria-label', '鍒犻櫎鏍囩 ' + text);
      rm.innerHTML = '&times;';
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        chip.remove();
        syncTagChipHidden(box);
        box.querySelector('.tag-chip-input')?.focus();
      });
      chip.appendChild(label);
      chip.appendChild(rm);
      return chip;
    }

    function getTagChipValuesFromBox(box) {
      return [...box.querySelectorAll('.tag-chip .tag-chip-text')].map(el => el.textContent).filter(Boolean);
    }

    function syncTagChipHidden(box) {
      const hidId = box.dataset.for;
      const hid = hidId ? document.getElementById(hidId) : null;
      const tags = getTagChipValuesFromBox(box);
      if (hid) {
        hid.value = tags.join(', ');
        hid.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return tags;
    }

    function addTagChip(box, text) {
      const t = String(text || '').trim();
      if (!t) return false;
      const existing = getTagChipValuesFromBox(box);
      if (existing.includes(t)) return false;
      const input = box.querySelector('.tag-chip-input');
      box.insertBefore(createTagChip(box, t), input || null);
      syncTagChipHidden(box);
      return true;
    }

    function setTagChipValues(box, value) {
      const tags = Array.isArray(value) ? value.map(s => String(s).trim()).filter(Boolean) : parseTagString(value);
      const input = box.querySelector('.tag-chip-input');
      box.querySelectorAll('.tag-chip').forEach(c => c.remove());
      tags.forEach(t => box.insertBefore(createTagChip(box, t), input || null));
      syncTagChipHidden(box);
    }

    function commitPendingTag(box, force) {
      const input = box.querySelector('.tag-chip-input');
      if (!input) return;
      const raw = input.value;
      const parts = raw.split(TAG_SEP_RE);
      let added = false;
      parts.forEach((p, i) => {
        const t = p.trim();
        if (!t) return;
        if (i < parts.length - 1 || TAG_SEP_RE.test(raw)) {
          if (addTagChip(box, t)) added = true;
        } else if (force) {
          if (addTagChip(box, t)) added = true;
          input.value = '';
        }
      });
      if (TAG_SEP_RE.test(raw) || force) input.value = '';
      else if (parts.length > 1) input.value = parts[parts.length - 1];
      if (added) input.focus();
    }

    function initTagChipBox(box) {
      if (!box || box.dataset.tagChipReady === '1') return;
      box.dataset.tagChipReady = '1';

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tag-chip-input';
      input.placeholder = '杈撳叆鏍囩鍚庡洖杞?;
      input.autocomplete = 'off';
      box.appendChild(input);

      const hidId = box.dataset.for;
      const hid = hidId ? document.getElementById(hidId) : null;
      if (hid) setTagChipValues(box, hid.value);

      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          commitPendingTag(box, true);
        } else if (e.key === 'Backspace' && input.value === '') {
          const chips = box.querySelectorAll('.tag-chip');
          if (chips.length) {
            chips[chips.length - 1].remove();
            syncTagChipHidden(box);
          }
        }
      });

      input.addEventListener('input', (e) => {
        if (e.isComposing) return;
        if (TAG_SEP_RE.test(input.value)) commitPendingTag(box, false);
      });

      input.addEventListener('blur', () => {
        if (input.value.trim()) commitPendingTag(box, true);
      });

      box.addEventListener('click', (e) => {
        if (e.target === box || e.target.closest('.tag-chip')) input.focus();
      });
    }

    function initTagChipBoxes(root) {
      (root || document).querySelectorAll('.tag-chip-box[data-for]').forEach(initTagChipBox);
    }

    function getCommonAuthorTags(works, minCount = 3) {
      const count = new Map();
      (works || []).forEach(w => {
        (w?.tags || []).forEach(t => {
          const tag = String(t).trim();
          if (!tag) return;
          count.set(tag, (count.get(tag) || 0) + 1);
        });
      });
      return [...count.entries()]
        .filter(([, c]) => c >= minCount)
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'))
        .map(([tag]) => tag);
    }

    function renderCommonTagsHtml(works, boxId) {
      const tags = getCommonAuthorTags(works);
      if (!tags.length) return '';
      return `<div class="common-tags" data-for-box="${boxId}">
        <div class="common-tags-label">甯哥敤鏍囩</div>
        <div style="display:flex;flex-wrap:wrap;gap:0.35rem;">
          ${tags.map(t => `<button type="button" class="common-tag-btn" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
        </div>
      </div>`;
    }

    function bindCommonTagClicks(root) {
      (root || document).querySelectorAll('.common-tag-btn').forEach(btn => {
        if (btn.dataset.bound === '1') return;
        btn.dataset.bound = '1';
        btn.addEventListener('click', () => {
          const wrap = btn.closest('.common-tags');
          const box = wrap ? document.getElementById(wrap.dataset.forBox) : null;
          if (!box) return;
          initTagChipBox(box);
          const tag = btn.dataset.tag || btn.textContent.trim();
          if (addTagChip(box, tag) || getTagChipValuesFromBox(box).includes(tag)) {
            btn.classList.add('is-added');
          }
        });
      });
    }

    function markAddedCommonTags(root) {
      const scope = root || document;
      const selected = new Set(
        [...scope.querySelectorAll('.tag-chip-box[data-for]')].flatMap(box =>
          getTagChipValuesFromBox(box)
        )
      );
      scope.querySelectorAll('.common-tag-btn').forEach(btn => {
        const tag = btn.dataset.tag || btn.textContent.trim();
        btn.classList.toggle('is-added', selected.has(tag));
      });
      bindCommonTagClicks(scope);
    }

    let authorToken = localStorage.getItem('f7author_token');
    let authorCircleId = localStorage.getItem('f7author_circleId');
    let authorProfile = null;

    // Auth tab switching
    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-tab')[tab === 'login' ? 0 : 1].classList.add('active');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('authError').style.display = 'none';
      document.getElementById('authSuccess').style.display = 'none';
    }

    // Registration notice
    async function showRegistrationNotice() {
      let content = '鏆傛棤娉ㄥ唽椤荤煡';
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        if (settings.authorRegistrationNotice) {
          content = settings.authorRegistrationNotice;
        }
      } catch (e) {}

      const overlay = document.createElement('div');
      overlay.id = 'regNoticeOverlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;';
      overlay.innerHTML = `<div style="background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <h3 style="margin:0;">馃搵 娉ㄥ唽椤荤煡</h3>
          <button onclick="document.getElementById('regNoticeOverlay').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--haze);">&times;</button>
        </div>
        <div style="line-height:1.8;color:var(--ink);white-space:pre-wrap;">${escapeHtml(content)}</div>
        <button class="btn btn-primary" style="width:100%;margin-top:1rem;" onclick="document.getElementById('regNoticeOverlay').remove()">鎴戠煡閬撲簡</button>
      </div>`;
      document.body.appendChild(overlay);
    }

    // Login
    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      errEl.style.display = 'none';
      successEl.style.display = 'none';

      try {
        const res = await fetch('/api/author/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.username.value, password: form.password.value })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || '鐧诲綍澶辫触';
          errEl.style.display = 'block';
          return;
        }
        authorToken = data.token;
        authorCircleId = data.circleId;
        localStorage.setItem('f7author_token', authorToken);
        localStorage.setItem('f7author_circleId', authorCircleId);
        showMgmtPage();
      } catch (e) {
        errEl.textContent = '缃戠粶閿欒';
        errEl.style.display = 'block';
      }
    }

    // Register
    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const errEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      errEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!form.authorName.value.trim()) {
        errEl.textContent = '璇疯緭鍏ヤ綔鑰呭悕绉?;
        errEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/author/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            authorName: form.authorName.value.trim(),
            username: form.username.value,
            password: form.password.value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || '娉ㄥ唽澶辫触';
          errEl.style.display = 'block';
          return;
        }
        successEl.textContent = data.message || '娉ㄥ唽鎴愬姛锛岀幇鍦ㄥ嵆鍙櫥褰曘€備笂浼犵殑浣滃搧闇€绠＄悊鍛樺鏍稿悗鎵嶄細灞曠ず銆?;
        successEl.style.display = 'block';
        form.reset();
        setTimeout(() => switchAuthTab('login'), 1200);
      } catch (e) {
        errEl.textContent = '缃戠粶閿欒';
        errEl.style.display = 'block';
      }
    }

    // Show management page
    // Account switching
    let accessibleAccounts = [];
    let mgmtSidebarOpen = false;

    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function setAvatarHtml(el, name, logo) {
      if (!el) return;
      const letter = escapeHtml((name || '浣?).slice(0, 1));
      if (logo) {
        el.innerHTML = '<img src="' + escapeHtml(logo) + '" alt="" onerror="this.replaceWith(document.createTextNode(\'' + letter.replace(/'/g, '') + '\'))">';
      } else {
        el.textContent = (name || '浣?).slice(0, 1);
      }
    }

    function renderAccountChrome() {
      const actAs = localStorage.getItem('f7author_actAs');
      const currentId = actAs || authorCircleId;
      const cur = accessibleAccounts.find(a => a.id === currentId) || accessibleAccounts[0];
      const avatarEl = document.getElementById('acctAvatar');
      const nameEl = document.getElementById('mgmtAuthorName');
      const subEl = document.getElementById('acctSub');
      const banner = document.getElementById('actasBanner');
      const actasName = document.getElementById('actasName');
      const menuHead = document.getElementById('acctMenuHead');

      // Prefer account list logo; fall back to loaded profile for active account
      const activeLogo = (cur && cur.logo) || (authorProfile && authorProfile.logo) || '';

      if (!cur) {
        if (nameEl) nameEl.textContent = authorProfile?.name || '浣滆€?;
        setAvatarHtml(avatarEl, authorProfile?.name, authorProfile?.logo || '');
        return;
      }
      setAvatarHtml(avatarEl, cur.name || authorProfile?.name, activeLogo);
      if (nameEl) nameEl.textContent = cur.name || '';
      if (menuHead) {
        menuHead.style.display = accessibleAccounts.length > 1 ? 'block' : 'none';
      }
      if (subEl) {
        if (actAs && authorCircleId && actAs !== authorCircleId) {
          subEl.textContent = '浠ｇ涓?;
          subEl.classList.add('actas');
        } else {
          subEl.textContent = cur.isOwner ? '鏈处鍙? : '鍙紪杈?;
          subEl.classList.remove('actas');
        }
      }
      if (banner && actasName) {
        if (actAs && authorCircleId && actAs !== authorCircleId) {
          banner.classList.add('show');
          actasName.textContent = cur.name || '';
        } else {
          banner.classList.remove('show');
        }
      }

      const list = document.getElementById('acctList');
      if (list) {
        list.innerHTML = accessibleAccounts.map(a => {
          const isActive = a.id === currentId;
          const logo = a.logo || (isActive ? activeLogo : '');
          const letter = escapeHtml((a.name || '浣?).slice(0, 1));
          const av = logo
            ? '<span class="mgmt-avatar"><img src="' + escapeHtml(logo) + '" alt="" onerror="this.replaceWith(document.createTextNode(\'' + letter.replace(/'/g, '') + '\'))"></span>'
            : '<span class="mgmt-avatar">' + letter + '</span>';
          return `<button type="button" class="acct-item${isActive ? ' current' : ''}" onclick="switchAuthorAccount('${escapeAttr(a.id)}');toggleMgmtDropdown('acctMenu')">
            ${av}

    // Author API helper
    async function authorAPI(method, path, body) {
      const actAs = localStorage.getItem('f7author_actAs');
      const headers = {
        'Authorization': 'Bearer ' + authorToken,
        'Content-Type': 'application/json'
      };
      if (actAs) headers['X-Act-As'] = actAs;

      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      let res = await fetch(path, opts);

      // Token杩囨湡鏃跺皾璇曞埛鏂?
      if (res.status === 401) {
        const refreshRes = await fetch('/api/author/refresh-token', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + authorToken, 'Content-Type': 'application/json' }
        });
        if (refreshRes.ok) {
          const data = await refreshRes.json();
          authorToken = data.token;
          localStorage.setItem('f7author_token', authorToken);
          headers['Authorization'] = 'Bearer ' + authorToken;
          res = await fetch(path, opts);
        } else {
          authorLogout();
          return null;
        }
      }

      if (res.status === 403) {
        const data = await res.json();
        if (data.needReapply) {
          alert('鎮ㄧ殑浣滆€呰处鍙峰凡琚鐞嗗憳鍒犻櫎锛岃閲嶆柊鐢宠銆?);
          authorLogout();
          return null;
        }
      }
      return res.json();
    }

    // Drag and drop sorting
    let draggedCard = null;

    function handleDragStart(e) {
      draggedCard = e.target.closest('.card');
      draggedCard.style.opacity = '0.5';
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const card = e.target.closest('.card');
      if (card && card !== draggedCard) {
        card.style.borderTop = '2px solid var(--accent)';
      }
    }

    function handleDrop(e) {
      e.preventDefault();
      const card = e.target.closest('.card');
      if (card && card !== draggedCard) {
        card.style.borderTop = '';
        const grid = document.getElementById('worksGrid');
        const cards = [...grid.querySelectorAll('.card')];
        const fromIndex = cards.indexOf(draggedCard);
        const toIndex = cards.indexOf(card);
        if (fromIndex < toIndex) {
          card.after(draggedCard);
        } else {
          card.before(draggedCard);
        }
        // Save new order
        saveWorksOrder();
      }
    }

    function handleDragEnd(e) {
      if (draggedCard) {
        draggedCard.style.opacity = '1';
        draggedCard = null;
      }
      // Reset all borders
      document.querySelectorAll('#worksGrid .card').forEach(c => c.style.borderTop = '');
    }

      if (!await showConfirm(`纭畾澶嶅埗浣滃搧"${work.title}"锛焋)) return;

      const newWork = {
        ...work,
        id: undefined,
        title: work.title + ' (鍓湰)',
        likes: 0,
        wants: 0,
        createdAt: undefined
      };
      delete newWork.id;
      delete newWork.createdAt;

      const result = await authorAPI('POST', '/api/author/works', newWork);

        showToast('浣滃搧宸插鍒?, 'success');

          headers: { 'Authorization': 'Bearer ' + authorToken }
        });
        if (!res.ok) throw new Error('瀵煎嚭澶辫触');
        const blob = await res.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `浣滃搧鍒楄〃_${new Date().toISOString().slice(0,10)}.xlsx`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast('瀵煎嚭鎴愬姛', 'success');

    async function submitBatchCreate() {
      const prefix = document.getElementById('batchCreatePrefix').value.trim() || '浣滃搧';
      const category = document.getElementById('batchCreateCategory').value;
      const status = document.getElementById('batchCreateStatus').value;
      const btn = document.getElementById('batchCreateSubmitBtn');
      btn.disabled = true;
      btn.textContent = '鍒涘缓涓?..';

      // 鏋勫缓鎵€鏈変綔鍝佹暟鎹?
      const worksToCreate = _batchCreateSelectedImages.map((imgUrl, i) => {
        const body = {
          title: prefix + ' ' + (i + 1),
          images: [imgUrl],
          category: category,
          status: status
        };
        // 鍚堝苟妯℃澘瀛楁 (璺宠繃琛ㄥ崟宸叉湁鐨?title/category/status)
        if (_useFormatTemplateFields) {
          for (const [k, v] of Object.entries(_useFormatTemplateFields)) {
            if (k === 'title' || k === 'category' || k === 'status') continue;
            if (v !== undefined && v !== null) body[k] = v;
          }
        }
        return body;
      });

      try {
        // 鍗曟璇锋眰鎵归噺鍒涘缓鎵€鏈変綔鍝?
        const result = await authorAPI('POST', '/api/author/works/batch-create', { works: worksToCreate });
        const createdWorkIds = (result?.works || []).map(w => w.id);

        // 鍚屾娲诲姩鍏宠仈
        if (_useFormatTemplateEvents && createdWorkIds.length > 0) {
          try {
            const allEvents = await authorAPI('GET', '/api/author/events');
            if (allEvents) {
              const eventsToToggle = allEvents.filter(evt => {
                const isRelated = (evt.relatedCircles || []).includes(authorCircleId);
                const shouldBeRelated = _useFormatTemplateEvents.includes(evt.id);
                return isRelated !== shouldBeRelated;
              }).map(evt => evt.id);
              if (eventsToToggle.length > 0) {
                await authorAPI('PUT', '/api/author/events/batch-toggle', { eventIds: eventsToToggle });
              }
            }
          } catch (e) { console.error('Failed to sync events:', e); }
        }

        // 鍚屾浼佸垝鍏宠仈
        if (_useFormatTemplateProjects && createdWorkIds.length > 0) {
          try {
            await authorAPI('PUT', '/api/author/works/batch', { ids: createdWorkIds, data: { relatedProjects: _useFormatTemplateProjects } });
          } catch (e) { console.error('Failed to sync projects:', e); }
        }

        document.getElementById('batchCreateConfigOverlay').remove();
        showToast('鎴愬姛鍒涘缓 ' + (result?.created || 0) + ' 涓綔鍝?, 'success');
      } catch (e) {
        document.getElementById('batchCreateConfigOverlay').remove();
        showToast('鎵归噺鍒涘缓澶辫触: ' + e.message, 'error');
      }

      _useFormatTemplateFields = null;
      _useFormatTemplateEvents = null;
      _useFormatTemplateProjects = null;
      loadAuthorWorks();
    }

    // Notification functions
    let notifications = [];

    async function loadNotifications() {
      try {
        const works = await authorAPI('GET', '/api/author/works');
        if (!works) return;

        // Get previous stats from localStorage
        let prevStats = {};
        try {
          prevStats = JSON.parse(localStorage.getItem('f7author_worksStats') || '{}');
        } catch { prevStats = {}; }

        // Check for new likes and wants (only if counts increased)
        notifications = [];
        works.forEach(w => {
          const prev = prevStats[w.id] || { likes: 0, wants: 0 };
          const currentLikes = w.likes || 0;
          const currentWants = w.wants || 0;

          if (currentLikes > prev.likes) {
            notifications.push({
              type: 'like',
              workTitle: w.title,
              count: currentLikes,
              increase: currentLikes - prev.likes,
              time: Date.now()
            });
          }
          if (currentWants > prev.wants) {
            notifications.push({
              type: 'want',
              workTitle: w.title,
              count: currentWants,
              increase: currentWants - prev.wants,
              time: Date.now()
            });
          }
        });

        // Update like/want badge only 鈥?瀹℃牳閫氱煡瑙掓爣鐢?loadAuthorNotifications 鍗曠嫭缁存姢
        const badge = document.getElementById('notifBadge');
        const unreadCount = notifications.length;
        if (badge) {
          badge.textContent = unreadCount;
          badge.style.display = unreadCount > 0 ? 'block' : 'none';
        }

        // Save current stats for next comparison
        const currentStats = {};
        works.forEach(w => {
          currentStats[w.id] = { likes: w.likes || 0, wants: w.wants || 0 };
        });
        localStorage.setItem('f7author_worksStats', JSON.stringify(currentStats));
      } catch (e) {}
    }

    // Check for popup announcements on page load
    async function checkAaPopup() {
      const scope = localStorage.getItem('f7author_actAs') || authorCircleId || 'me';
      const storeKey = 'f7aaShown:' + scope;
      let shown = [];
      try { shown = JSON.parse(localStorage.getItem(storeKey) || '[]') || []; } catch { shown = []; }
      if (!Array.isArray(shown)) shown = [];

      try {
        const announcements = await authorAPI('GET', '/api/author/announcements/popup');
        if (!announcements || announcements.length === 0) return;
        const fresh = announcements.filter(a => a && a.id && !shown.includes(a.id));
        if (fresh.length === 0) return;
        openAaPopup(fresh[0].title, fresh[0].content);
        for (const a of fresh) {
          if (!shown.includes(a.id)) shown.push(a.id);
          try { await authorAPI('PUT', `/api/author/announcements/${a.id}/read`); } catch (e) {}
        }
        localStorage.setItem(storeKey, JSON.stringify(shown.slice(-100)));
      } catch (e) {}
    }

    // Unified filter: category + status + search
    function applyAuthorWorksFilters() {
      const query = document.getElementById('authorWorksSearch').value.toLowerCase().trim();
      const cards = document.querySelectorAll('#worksGrid .card');
      cards.forEach(card => {
        const cat = card.dataset.category || '';
        const status = card.dataset.status || '';
        const approval = card.dataset.approval || 'approved';
        const matchCat = currentAuthorCategory === 'all' || cat === currentAuthorCategory;
        const matchStatus = currentAuthorStatus === 'all' || status === currentAuthorStatus;
        const matchApproval = currentAuthorApproval === 'all' || approval === currentAuthorApproval;
        if (!query) {
          card.style.display = (matchCat && matchStatus && matchApproval) ? '' : 'none';
          return;
        }
        const title = (card.dataset.title || '').toLowerCase();
        const tags = (card.dataset.tags || '').toLowerCase();
        const desc = (card.dataset.desc || '').toLowerCase();
        const matchSearch = title.includes(query) || tags.includes(query) || desc.includes(query);
        card.style.display = (matchCat && matchStatus && matchApproval && matchSearch) ? '' : 'none';
      });
    }

      currentAuthorApproval = value || 'all';

    // Sort works
    function sortAuthorWorks() {
      const sortBy = document.getElementById('authorWorksSort').value;
      const grid = document.getElementById('worksGrid');
      const cards = [...grid.querySelectorAll('.card')];
      cards.sort((a, b) => {
        switch(sortBy) {
          case 'date-desc': return (b.dataset.date || '').localeCompare(a.dataset.date || '');
          case 'date-asc': return (a.dataset.date || '').localeCompare(b.dataset.date || '');
          case 'likes-desc': return (parseInt(b.dataset.likes) || 0) - (parseInt(a.dataset.likes) || 0);
          case 'likes-asc': return (parseInt(a.dataset.likes) || 0) - (parseInt(b.dataset.likes) || 0);
          case 'wants-desc': return (parseInt(b.dataset.wants) || 0) - (parseInt(a.dataset.wants) || 0);
          case 'wants-asc': return (parseInt(a.dataset.wants) || 0) - (parseInt(b.dataset.wants) || 0);
          default: return (parseInt(a.dataset.order) || 0) - (parseInt(b.dataset.order) || 0);
        }
      });
      cards.forEach(card => grid.appendChild(card));
    }

    async function confirmUseFormat(templateWorkId, source) {
      const templateWork = authorWorksData.find(w => w.id === templateWorkId);
      if (!templateWork) { showToast('妯℃澘浣滃搧涓嶅瓨鍦?, 'error'); return; }
      const selectedKeys = [...document.querySelectorAll('.ufield-cb:checked')].map(cb => cb.dataset.key);
      if (selectedKeys.length === 0) { showToast('璇疯嚦灏戦€夋嫨涓€涓瓧娈?, 'error'); return; }
      document.getElementById('useFormatFieldOverlay').remove();

      if (source === 'batchEdit') {
        await applyFormatToSelectedWorks(selectedKeys, templateWork);
      } else if (source === 'batchCreate') {
        await applyFormatToBatchCreate(selectedKeys, templateWork);
      }
    }

    async function applyFormatToSelectedWorks(selectedKeys, templateWork) {
      const checked = document.querySelectorAll('.author-work-cb:checked');
      const workIds = [...checked].map(cb => cb.dataset.id);

      const updateData = {};
      for (const key of selectedKeys) {
        switch (key) {
          case 'title': updateData.title = templateWork.title; break;
          case 'category': updateData.category = templateWork.category; break;
          case 'status': updateData.status = templateWork.status; break;
          case 'price': updateData.price = templateWork.price; break;
          case 'releaseDate': updateData.releaseDate = templateWork.releaseDate; break;
          case 'endDate': updateData.endDate = templateWork.endDate; break;
          case 'tags': updateData.tags = templateWork.tags; break;
          case 'description': updateData.description = templateWork.description; break;
          case 'commissioned':
            updateData.isCommissioned = templateWork.isCommissioned;
            updateData.commissionedBy = templateWork.commissionedBy;
            break;
          case 'socialLinks': updateData.socialLinks = JSON.parse(JSON.stringify(templateWork.socialLinks || {})); break;
        }
      }

      const hasBasicChanges = Object.keys(updateData).length > 0;
      const hasEventSync = selectedKeys.includes('relatedEvents');
      const hasProjectSync = selectedKeys.includes('relatedProjects');

      showLoading('搴旂敤鏍煎紡涓?..');
      try {
        // 鎵归噺鏇存柊浣滃搧鍩烘湰瀛楁 + 浼佸垝鍏宠仈 (鍗曟璇锋眰)
        if (hasBasicChanges || hasProjectSync) {
          const batchData = { ...updateData };
          if (hasProjectSync) {
            batchData.relatedProjects = templateWork._relatedProjects || [];
          }
          await authorAPI('PUT', '/api/author/works/batch', { ids: workIds, data: batchData });
        }

        // 鎵归噺鍒囨崲娲诲姩鍏宠仈 (鍗曟璇锋眰)
        if (hasEventSync) {
          const allEvents = await authorAPI('GET', '/api/author/events');
          if (allEvents) {
            // 鑾峰彇妯℃澘浣滃搧鍏宠仈鐨勬墍鏈夋椿鍔紙閫氳繃鎵€鏈夊湀瀛愶級
            const templateCircleIds = new Set(templateWork.circles || []);
            const templateEventIds = allEvents.filter(e =>
              (e.relatedCircles || []).some(cid => templateCircleIds.has(cid))
            ).map(e => e.id);

            // 闇€瑕佹坊鍔犲叧鑱旂殑娲诲姩锛氭ā鏉垮叧鑱斾絾褰撳墠浣滆€呮湭鍏宠仈
            const eventsToAdd = templateEventIds.filter(eventId => {
              const evt = allEvents.find(e => e.id === eventId);
              return evt && !(evt.relatedCircles || []).includes(authorCircleId);
            });

            // 闇€瑕佺Щ闄ゅ叧鑱旂殑娲诲姩锛氭ā鏉挎湭鍏宠仈浣嗗綋鍓嶄綔鑰呭凡鍏宠仈
            const eventsToRemove = allEvents
              .filter(evt => !templateEventIds.includes(evt.id) && (evt.relatedCircles || []).includes(authorCircleId))
              .map(e => e.id);

            // 鍚堝苟闇€瑕?toggle 鐨勬椿鍔?
            const eventsToToggle = [...new Set([...eventsToAdd, ...eventsToRemove])];

            if (eventsToToggle.length > 0) {
              await authorAPI('PUT', '/api/author/events/batch-toggle', { eventIds: eventsToToggle });
            }
          }
        }

        showToast(`宸插皢鏍煎紡搴旂敤鍒?${workIds.length} 涓綔鍝乣, 'success');
        loadAuthorWorks();
      } catch (e) {
        showToast('搴旂敤鏍煎紡澶辫触: ' + e.message, 'error');
      } finally {
        hideLoading();
      }
    }

    async function applyFormatToBatchCreate(selectedKeys, templateWork) {
      _useFormatTemplateFields = {};
      _useFormatTemplateEvents = null;
      _useFormatTemplateProjects = null;

      for (const key of selectedKeys) {
        switch (key) {
          case 'title': _useFormatTemplateFields.title = templateWork.title; break;
          case 'category': _useFormatTemplateFields.category = templateWork.category; break;
          case 'status': _useFormatTemplateFields.status = templateWork.status; break;
          case 'price': _useFormatTemplateFields.price = templateWork.price; break;
          case 'releaseDate': _useFormatTemplateFields.releaseDate = templateWork.releaseDate; break;
          case 'endDate': _useFormatTemplateFields.endDate = templateWork.endDate; break;
          case 'tags': _useFormatTemplateFields.tags = templateWork.tags; break;
          case 'description': _useFormatTemplateFields.description = templateWork.description; break;
          case 'commissioned':
            _useFormatTemplateFields.isCommissioned = templateWork.isCommissioned;
            _useFormatTemplateFields.commissionedBy = templateWork.commissionedBy;
            break;
          case 'socialLinks': _useFormatTemplateFields.socialLinks = JSON.parse(JSON.stringify(templateWork.socialLinks || {})); break;
          case 'relatedEvents':
            const allEvents = await authorAPI('GET', '/api/author/events');
            if (allEvents) {
              const templateCircleId = templateWork.circles?.[0];

    // Save batch edit
    async function saveBatchEdit() {
      const checked = document.querySelectorAll('.author-work-cb:checked');
      const workIds = [...checked].map(cb => cb.dataset.id);

      const data = {};
      const category = document.getElementById('batchCategory').value;
      const status = document.getElementById('batchStatus').value;
      const price = document.getElementById('batchPrice').value;
      const releaseDate = document.getElementById('batchReleaseDate').value;
      const endDate = document.getElementById('batchEndDate').value;
      const tagsVal = document.getElementById('batchTags')?.value || '';
      const tags = tagsVal.trim() ? tagsVal : '';
      const description = document.getElementById('batchDescription').value;
      const contactType = document.getElementById('batchContactType').value;
      const contactValue = document.getElementById('batchContactValue').value;
      const isCommissioned = document.getElementById('batchIsCommissioned').checked;
      const commissionedBy = document.getElementById('batchCommissionedBy').value;

      if (category) data.category = category;
      if (status) data.status = status;
      if (price) data.price = price;
      if (releaseDate) data.releaseDate = releaseDate;
      if (endDate) data.endDate = endDate;
      if (tags) data.tags = parseTagString(tags);
      if (description) data.description = description;

      // Handle contact info
      if (contactType && contactValue) {
        data.socialLinks = {};
        data.socialLinks[contactType] = contactValue;
      }

      // Handle commissioned work
      if (isCommissioned) {
        data.isCommissioned = true;
        data.commissionedBy = commissionedBy || '';
      }

      // Get selected events and projects
      const selectedEventIds = [...document.querySelectorAll('.batch-event-cb:checked')].map(cb => cb.value);
      const selectedProjectIds = [...document.querySelectorAll('.batch-project-cb:checked')].map(cb => cb.value);

      const hasBasicChanges = Object.keys(data).length > 0;
      const hasProjectChanges = selectedProjectIds.length > 0;
      // 鎵归噺鍕鹃€夋椿鍔?= 鍐欏叆杩欎簺浣滃搧鐨?relatedEvents锛堜笉鏄綔鑰呭悗鍙扮殑娲诲姩鍏宠仈锛?
      const hasEventChanges = selectedEventIds.length > 0;

      if (!hasBasicChanges && !hasProjectChanges && !hasEventChanges) {
        alert('璇疯嚦灏戜慨鏀逛竴涓瓧娈?);
        return;
      }

      showLoading('淇濆瓨涓?..');
      try {
        // 鎵归噺鏇存柊浣滃搧 (鍗曟璇锋眰)
        if (hasBasicChanges || hasProjectChanges || hasEventChanges) {
          const batchData = { ...data };
          if (hasProjectChanges) batchData.relatedProjects = selectedProjectIds;
          if (hasEventChanges) batchData.relatedEvents = selectedEventIds;
          await authorAPI('PUT', '/api/author/works/batch', { ids: workIds, data: batchData });
        }

        showToast(`宸叉洿鏂?${workIds.length} 涓綔鍝乣, 'success');
        closeBatchEdit();
        loadAuthorWorks();
      } finally {
        hideLoading();
      }
    }

      const selected = [...document.querySelectorAll('.aimg-pick.selected')].map(el => el.dataset.url);

      if (singleSelect) {
        preview.innerHTML = '<div style="position:relative;display:inline-block;"><img src="'+selected[0]+'" style="width:80px;height:80px;object-fit:cover;border-radius:6px;"><button onclick="this.parentElement.remove()" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;border:none;font-size:10px;cursor:pointer;line-height:1;">&times;</button></div>';
      } else {
        selected.forEach(url => {

    function drawUploadWmCanvas(canvas, img, item) {
      const W = 160, H = 120;
      canvas.width = W * 2; canvas.height = H * 2;
      canvas.style.width = '100%';
      canvas.style.height = 'auto';
      canvas.style.display = 'block';
      canvas.style.borderRadius = '6px';
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.clearRect(0, 0, W, H);
      // cover fit
      const s = Math.max(W / img.width, H / img.height);
      const dw = img.width * s, dh = img.height * s;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      if (!item.wm) return;
      const author = (typeof authorProfile !== 'undefined' && authorProfile?.name) || '浣滆€?;
      const site = 'f7goods.com';
      function strokeText(text, x, y, size, align, baseline) {
        ctx.font = '700 ' + size + 'px sans-serif';
        ctx.textAlign = align; ctx.textBaseline = baseline;
        ctx.lineWidth = Math.max(1.5, size / 7);
        ctx.strokeStyle = 'rgba(0,0,0,.45)';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = 'rgba(255,255,255,.72)';
        ctx.fillText(text, x, y);
      }
      const name = '@' + author;
      if (item.style === 'light') {
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.font = '700 16px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(name, W / 2, H / 2 + 8);
        ctx.font = '600 10px sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        ctx.fillText(name, W - 6, H - 6);
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(site, 6, 6);
      } else if (item.style === 'half') {
        strokeText(name, W - 6, H - 6, 11, 'right', 'bottom');
        strokeText(site, 6, 6, 9, 'left', 'top');
      } else {
        // full
        strokeText(name, W / 2, H / 2 + 8, 16, 'center', 'middle');
        strokeText(name, W - 6, H - 6, 11, 'right', 'bottom');
        strokeText(site, 6, 6, 9, 'left', 'top');
      }
    }

      const labels = { light: '娴呰壊', half: '鍗婅竟鎻忚竟', full: '鍏ㄩ儴鎻忚竟' };

                鍔犳按鍗?

                  style="font-size:0.68rem;padding:0.15rem 0.5rem;${item.wm && item.style===s ? '' : (item.wm ? 'background:var(--bg);color:var(--haze);' : 'opacity:.45;')}"
                  ${item.wm ? '' : 'disabled'}>${labels[s]}</button>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('');

      _uploadQueue.forEach((item, i) => {
        const host = document.getElementById('upPrev' + i);

      list.onchange = (e) => {

        renderUploadWmBulk();

        _uploadQueue[+btn.dataset.i].style = btn.dataset.style;
        renderUploadWmBulk();
        renderUploadWmList();
      };
    }

      if (compressed.length > 0) showToast(`宸插帇缂? ${compressed.join('銆?)}`, 'info', 8000);

      if (input) input.value = '';
      loadAuthorImages();
    }

    async function changeAuthorPassword() {
      const oldPw = document.getElementById('pwOld').value;
      const newPw = document.getElementById('pwNew').value;
      const confirmPw = document.getElementById('pwConfirm').value;
      const errEl = document.getElementById('pwError');
      const successEl = document.getElementById('pwSuccess');
      errEl.style.display = 'none';

      if (newPw !== confirmPw) {
        errEl.textContent = '涓ゆ杈撳叆鐨勫瘑鐮佷笉涓€鑷?;

        errEl.textContent = '鏂板瘑鐮佽嚦灏?浣?;
        errEl.style.display = 'block';
        return;
      }

      const result = await authorAPI('POST', '/api/author/change-password', { oldPassword: oldPw, newPassword: newPw });
      if (result && result.success) {
        successEl.textContent = '瀵嗙爜淇敼鎴愬姛';

    function moveAuthorGroupRow(btn, dir) {
      const row = btn.closest('.ab-group-row');
      if (!row) return;
      const list = row.parentElement;
      const rows = [...list.children].filter(el => el.classList.contains('ab-group-row'));
      const i = rows.indexOf(row);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= rows.length) return;
      if (dir < 0) list.insertBefore(row, rows[j]);
      else list.insertBefore(rows[j], row);
    }

    function assignUncategorizedToGroup(btn) {
      const row = btn.closest('.ab-group-row');
      if (!row) return;
      const selectedWorks = new Set([...(window._abSelectedWorkIds || [])].map(String));
      const groupedElsewhere = new Set();
      document.querySelectorAll('#abGroupList .ab-group-row').forEach(r => {
        if (r === row) return;
        r.querySelectorAll('.ab-group-work:checked').forEach(cb => groupedElsewhere.add(cb.value));
      });
      let n = 0;
      row.querySelectorAll('.ab-group-work').forEach(cb => {
        if (selectedWorks.has(cb.value) && !groupedElsewhere.has(cb.value) && !cb.checked) {
          cb.checked = true;
          n++;
        }
      });
      updateAbWorkGroupHint();
      if (typeof showToast === 'function') showToast(n ? `宸插皢 ${n} 浠舵湭褰掔被浣滃搧鍔犲叆鏈垎绫籤 : '娌℃湁鍙敹杩涚殑鏈綊绫讳綔鍝?, n ? 'success' : 'info');
    }

      if (!list) return;
      const cbs = [...list.querySelectorAll('.ab-work')].filter(cb => {
        const pick = cb.closest('.ab-work-pick');
        return (pick?.dataset.cat || '') === (cat || '');

      const allOn = cbs.every(cb => cb.checked);

    function authorBoothGoods(pack, booth) {
      const related = pack.works || [];
      const owners = new Set(booth.circleIds || []);
      let goods = related.filter(w => (w.circles || []).some(cid => owners.has(cid)));
      if (Array.isArray(booth.workIds) && booth.workIds.length) {
        const sel = new Set(booth.workIds);
        goods = related.filter(w => sel.has(w.id));
      }
      const order = Array.isArray(booth.goodsOrder) ? booth.goodsOrder : [];
      const rank = new Map(order.map((id, i) => [id, i]));
      return goods.slice().sort((a, z) => {
        const ra = rank.has(a.id) ? rank.get(a.id) : Number.MAX_SAFE_INTEGER;
        const rz = rank.has(z.id) ? rank.get(z.id) : Number.MAX_SAFE_INTEGER;
        if (ra !== rz) return ra - rz;
        return String(a.title || '').localeCompare(String(z.title || ''));
      });
    }

    function renderAuthorBoothGoods(pack, booth) {
      const el = document.getElementById(`authorGoods-${pack.event.id}-${booth.id}`);
      if (!el) return;
      const goods = authorBoothGoods(pack, booth);
      const claimMap = (booth.claimConditions && typeof booth.claimConditions === 'object' && !Array.isArray(booth.claimConditions)) ? booth.claimConditions : {};
      if (!goods.length) {
        el.innerHTML = '<div style="font-size:0.75rem;color:var(--haze);">璇ユ憡浣嶆殏鏃犲睍绀轰綔鍝侊紝鍙湪銆岀紪杈戙€嶄腑鍕鹃€?/div>';
        return;
      }
      const rankOf = new Map(goods.map((g, i) => [g.id, i]));
      const rowHtml = (g, isFirst, isLast) => {
        const gi = rankOf.get(g.id) ?? 0;
        return `
          <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.78rem;padding:0.25rem 0.35rem;border-radius:6px;background:var(--card-bg);">
            <span style="color:var(--haze);width:1.1rem;text-align:right;">${gi + 1}.</span>
            ${g.images && g.images[0]
              ? `<img src="${escapeHtml(g.images[0])}" alt="" style="width:24px;height:24px;border-radius:4px;object-fit:cover;flex-shrink:0;">`
              : `<div style="width:24px;height:24px;border-radius:4px;background:linear-gradient(145deg,#EDE6DA,#D9D0C2);flex-shrink:0;"></div>`}
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(g.title || '')}</span>
            ${claimMap[g.id] ? `<span title="鏉′欢棰嗗彇锛?{escapeHtml(claimMap[g.id])}" style="flex-shrink:0;font-size:0.66rem;font-weight:600;color:var(--warning);border:1px solid rgba(196,138,42,.4);background:rgba(196,138,42,.12);border-radius:999px;padding:0 6px;">鏉′欢棰嗗彇</span>` : ''}
            <button class="ab-pill" style="padding:0.1rem 0.4rem;font-size:0.68rem;${isFirst ? 'opacity:0.35;' : ''}" onclick="authorMoveGood('${pack.event.id}','${booth.id}','${g.id}',-1)" ${isFirst ? 'disabled' : ''}>鈫?/button>
            <button class="ab-pill" style="padding:0.1rem 0.4rem;font-size:0.68rem;${isLast ? 'opacity:0.35;' : ''}" onclick="authorMoveGood('${pack.event.id}','${booth.id}','${g.id}',1)" ${isLast ? 'disabled' : ''}>鈫?/button>
          </div>`;
      };

      const groups = Array.isArray(booth.goodsGroups)
        ? booth.goodsGroups.filter(g => g && (g.name || (g.workIds || []).length))
        : [];
      let bodyHtml;
      if (!groups.length) {
        bodyHtml = `
          <div style="display:flex;flex-direction:column;gap:0.25rem;">
            ${goods.map((g, gi) => rowHtml(g, gi === 0, gi === goods.length - 1)).join('')}
          </div>`;
      } else {
        const claimed = new Set();
        const sections = groups.map(g => {
          const ids = new Set(g.workIds || []);
          const works = goods.filter(w => ids.has(w.id));
          works.forEach(w => claimed.add(w.id));
          return { name: String(g.name || '鏈懡鍚?).trim() || '鏈懡鍚?, works };
        });
        const rest = goods.filter(w => !claimed.has(w.id));
        if (rest.length) sections.push({ name: '鍏朵粬', works: rest });
        bodyHtml = sections.map(s => {
          if (!s.works.length) return '';
          return `
            <div style="margin-bottom:0.45rem;">
              <div style="font-size:0.72rem;font-weight:700;color:var(--muted);margin-bottom:0.25rem;">${escapeHtml(s.name)} 路 ${s.works.length}</div>
              <div style="display:flex;flex-direction:column;gap:0.25rem;">
                ${s.works.map((g, si) => {
                  const gi = rankOf.get(g.id) ?? 0;
                  return rowHtml(g, gi === 0, gi === goods.length - 1);
                }).join('')}
              </div>
            </div>`;
        }).join('');
      }

      el.innerHTML = `
        <div style="font-size:0.72rem;color:var(--haze);margin-bottom:0.3rem;">浣滃搧椤哄簭锛堚啈鈫?{groups.length ? ' 路 鎸夊垎绫诲垎缁? : ''}锛?/div>
        ${bodyHtml}
      `;
    }

    async function authorMoveBooth(eventId, boothId, dir) {
      const pack = _onlyBoothData.find(p => p.event.id === eventId);
      if (!pack || !pack.canManageAll) return;
      const booths = pack.booths.slice();
      const i = booths.findIndex(b => b.id === boothId);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= booths.length) return;
      const tmp = booths[i]; booths[i] = booths[j]; booths[j] = tmp;
      const result = await authorAPI('POST', `/api/author/only-booths/${eventId}/reorder`, { order: booths.map(b => b.id) });
      if (result && result.success) {
        showToast('鎽婁綅椤哄簭宸蹭繚瀛?, 'success');
        loadAuthorOnlyBooths();
      }
    }

    async function authorDeleteBooth(eventId, boothId) {
      if (!confirm('纭畾鍒犻櫎璇ユ憡浣嶏紵')) return;
      const result = await authorAPI('DELETE', `/api/author/only-booths/${eventId}/${boothId}`);
      if (result && result.success) {
        showToast('宸插垹闄?, 'success');
        loadAuthorOnlyBooths();
      } else if (result && result.error) {
        showToast(result.error, 'error');
      }
    }

    async function authorMoveGood(eventId, boothId, workId, dir) {
      const pack = _onlyBoothData.find(p => p.event.id === eventId);
      if (!pack) return;
      const booth = pack.booths.find(b => b.id === boothId);
      if (!booth) return;
      const goods = authorBoothGoods(pack, booth);
      const i = goods.findIndex(g => g.id === workId);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= goods.length) return;
      const ids = goods.map(g => g.id);
      const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
      const result = await authorAPI('POST', `/api/author/only-booths/${eventId}/${boothId}/goods-order`, { goodsOrder: ids });
      if (result && result.success) {
        booth.goodsOrder = ids;
        renderAuthorBoothGoods(pack, booth);
        showToast('浣滃搧椤哄簭宸蹭繚瀛?, 'success');
      } else if (result && result.error) {
        showToast(result.error, 'error');
      }
    }

    function boothManageableWorks(pack, booth, canFullEdit) {
      if (!booth) {

      if (!owners.size) return ownEventWorks(pack);
      return (pack?.works || []).filter(w => (w.circles || []).some(cid => owners.has(cid)));

    async function saveAuthorBooth(eventId, boothId, canFullEdit) {
      const pack = _onlyBoothData.find(p => p.event.id === eventId);
      if (!pack) return;
      const promoTiers = [...document.querySelectorAll('#abTierList .ab-tier-row')].map(row => {
        const minRaw = row.querySelector('.ab-tier-min')?.value;
        const giftWorkIds = [...row.querySelectorAll('.ab-tier-gift:checked')].map(i => i.value);
        // 鏈～鏁板瓧鎴栨湭鍕捐禒鍝?鈫?鏈。涓嶇畻璧犲搧
        if (minRaw === '' || minRaw == null || !giftWorkIds.length) return null;
        const minAmount = Number(minRaw);
        if (!Number.isFinite(minAmount) || minAmount < 0) return null;
        return { minAmount, giftWorkId: giftWorkIds[0] || '', giftWorkIds, text: '' };
      }).filter(Boolean);

      const payload = {
        title: document.getElementById('abTitle')?.value.trim() || '',
        logo: document.querySelector('#abLogoPreview img')?.src || '',
        description: document.getElementById('abDescription')?.value || '',
        images: [...document.querySelectorAll('#abImagesPreview img')].map(img => img.src),
        promoTiers,
        workIds: [...(window._abSelectedWorkIds || [])].map(String),
        goodsGroups: [...document.querySelectorAll('#abGroupList .ab-group-row')].map(row => {
          const name = row.querySelector('.ab-group-name')?.value.trim() || '';
          const workIds = [...row.querySelectorAll('.ab-group-work:checked')].map(i => i.value);
          if (!name && !workIds.length) return null;
          return { id: row.dataset.id || ('c' + Date.now()), name, workIds };
        }).filter(Boolean)
      };
      // 鍕鹃€夌殑浣滃搧鎻愪氦鏉′欢锛堝彇娑堝嬀閫夋彁浜ょ┖涓蹭互娓呴櫎锛?
      if (document.getElementById('abClaimToggles')) {
        const claimConditions = {};
        document.querySelectorAll('#abClaimToggles .ab-claim-on').forEach(cb => {
          const workId = cb.value;
          if (cb.checked) {
            const ta = document.querySelector('#abClaimList .ab-claim[data-work="' + CSS.escape(workId) + '"]');
            claimConditions[workId] = ta?.value.trim() || '';
          } else {
            claimConditions[workId] = '';
          }
        });
        payload.claimConditions = claimConditions;
      }
      if (canFullEdit) {
        payload.code = document.getElementById('abCode')?.value.trim() || '';
        payload.circleIds = [...document.querySelectorAll('.ab-circle:checked')].map(i => i.value);
        if (!boothId && !payload.code) {
          showToast('璇峰～鍐欐憡浣嶅彿', 'error');
          return;
        }
      }

      let result;
      if (boothId) {
        result = await authorAPI('PUT', `/api/author/only-booths/${eventId}/${boothId}`, payload);
      } else {
        result = await authorAPI('POST', `/api/author/only-booths/${eventId}`, payload);
      }
      if (result && !result.error) {
        showToast('鎽婁綅宸蹭繚瀛?, 'success');
        closeWorkModal();
        loadAuthorOnlyBooths();
      } else if (result && result.error) {
        showToast(result.error, 'error');
      }
    }

    async function submitMyEvent(eventId = '') {
      const title = document.getElementById('myEventTitle').value;
      if (!title) { showToast('璇峰～鍐欐椿鍔ㄥ悕绉?, 'error'); return; }
      const coverImg = document.querySelector('#myEventCoverPreview img');
      const relatedWorks = [...(window._myEventSelectedWorkIds || [])].map(String);
      const relatedCircles = [...document.querySelectorAll('.my-event-circle-cb:checked')].map(cb => cb.value);
      const images = [...document.querySelectorAll('#myEventImagesPreview img')].map(img => img.src);
      const contactType = document.getElementById('myEventContactType').value;
      const contactValue = document.getElementById('myEventContactValue').value;
      const socialLinks = {
        contactLabel: document.getElementById('myEventContactLabel').value,
        website: document.getElementById('myEventWebsite').value,
        websiteLabel: document.getElementById('myEventWebsiteLabel').value
      };
      if (contactType && contactValue) socialLinks[contactType] = contactValue;
      const data = {
        title,
        date: document.getElementById('myEventDate').value,
        endDate: document.getElementById('myEventEndDate').value,
        location: document.getElementById('myEventLocation').value,
        booth: document.getElementById('myEventBooth').value,
        description: document.getElementById('myEventDesc').value,
        status: document.getElementById('myEventStatus').value,
        coverImage: coverImg ? coverImg.src : '',
        images,
        relatedWorks,
        relatedCircles,
        socialLinks
      };
      let result;
      if (eventId) {
        result = await authorAPI('PUT', '/api/author/my-events/' + eventId, data);
        if (result) showToast('宸蹭繚瀛橈紝闇€閲嶆柊瀹℃牳', 'success');
      } else {
        result = await authorAPI('POST', '/api/author/my-events', data);
        if (result) showToast('娲诲姩宸叉彁浜わ紝绛夊緟瀹℃牳', 'success');
      }
      if (result) {
        FormDraft.clear('event');
        closeWorkModal();
        loadMyEvents();
      }
    }

    async function submitMyProject(projectId = '') {
      const title = document.getElementById('myProjectTitle').value;
      if (!title) { showToast('璇峰～鍐欎紒鍒掑悕绉?, 'error'); return; }
      const coverImg = document.querySelector('#myProjectCoverPreview img');
      const relatedWorks = [...(window._myProjectSelectedWorkIds || [])].map(String);
      const circles = [...document.querySelectorAll('.my-project-circle-cb:checked')].map(cb => cb.value);
      const images = [...document.querySelectorAll('#myProjectImagesPreview img')].map(img => img.src);
      const contactType = document.getElementById('myProjectContactType').value;
      const contactValue = document.getElementById('myProjectContactValue').value;
      const socialLinks = {
        contactLabel: document.getElementById('myProjectContactLabel').value,
        website: document.getElementById('myProjectWebsite').value,
        websiteLabel: document.getElementById('myProjectWebsiteLabel').value
      };
      if (contactType && contactValue) socialLinks[contactType] = contactValue;
      const recruitOn = !!document.getElementById('myProjectRecruitOn')?.checked;
      const data = {
        title,
        category: document.getElementById('myProjectCategory').value,
        status: document.getElementById('myProjectStatus').value,
        description: document.getElementById('myProjectDesc').value,
        tags: getTagChipValues('myProjectTags'),
        coverImage: coverImg ? coverImg.src : '',
        images,
        works: relatedWorks,
        circles,
        recruiting: recruitOn,
        recruitNote: recruitOn ? (document.getElementById('myProjectRecruitNote')?.value.trim() || '') : '',
        recruitJobs: recruitOn ? collectMyProjectRecruitJobs() : [],
        socialLinks
      };
      let result;
      if (projectId) {
        result = await authorAPI('PUT', '/api/author/my-projects/' + projectId, data);
        if (result) showToast('宸蹭繚瀛橈紝闇€閲嶆柊瀹℃牳', 'success');
      } else {
        result = await authorAPI('POST', '/api/author/my-projects', data);
        if (result) showToast('浼佸垝宸叉彁浜わ紝绛夊緟瀹℃牳', 'success');
      }
      if (result) {
        closeWorkModal();
        loadMyProjects();
      }
    }

    async function uploadAuthorSeriesCover(input) {
      const file = input.files?.[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('image', file);
      try {
        const headers = { Authorization: 'Bearer ' + authorToken };
        const actAs = localStorage.getItem('f7author_actAs');
        if (actAs) headers['X-Act-As'] = actAs;
        const res = await fetch('/api/author/upload', { method: 'POST', headers, body: fd });
        const data = await res.json();
        if (!data.url) throw new Error(data.error || '涓婁紶澶辫触');
        document.getElementById('authorSeriesCover').value = data.url;
        document.getElementById('authorSeriesCoverPreview').innerHTML = `<img src="${escapeHtml(imgUrl(data.url, 240))}" alt="">`;
        showToast('灏侀潰涓婁紶鎴愬姛', 'success');
      } catch (e) {
        showToast('灏侀潰涓婁紶澶辫触锛岃閲嶈瘯', 'error');
      }
    }

    function renderAuthorWorkPickerGrid() {
      const grid = document.getElementById('awpGrid');
      if (!grid) return;
      const q = (document.getElementById('awpSearch')?.value || '').trim().toLowerCase();
      const works = _awpWorks.filter(w => {
        if (!q) return true;
        const cat = (typeof CATEGORIES !== 'undefined' && CATEGORIES[w.category]) || w.category || '';
        return [w.title, ...(w.tags || []), cat, w.id].join(' ').toLowerCase().includes(q);
      });
      if (!works.length) {
        grid.innerHTML = '<div class="awp-empty">娌℃湁鍖归厤鐨勪綔鍝?/div>';
        return;
      }
      grid.innerHTML = works.map(w => {
        const chosen = _awpChosen.has(String(w.id));
        const cat = (typeof CATEGORIES !== 'undefined' && CATEGORIES[w.category]) || w.category || '';
        return `<button type="button" class="awp-item${chosen ? ' selected' : ''}" data-work-id="${w.id}" onclick="toggleAuthorWorkPick('${w.id}')">
          <div class="awp-cover">${w.images?.[0] ? `<img src="${escapeHtml(imgUrl(w.images[0], 240))}" alt="">` : '<span>浣滃搧</span>'}<i>鉁?/i></div>

        </button>`;
      }).join('');
    }

    function toggleAuthorWorkPick(id) {
      id = String(id);
      if (_awpSingle) {
        const wasSelected = _awpChosen.has(id);
        _awpChosen.clear();
        if (!wasSelected) _awpChosen.add(id);
      } else if (_awpChosen.has(id)) {
        _awpChosen.delete(id);
      } else {
        _awpChosen.add(id);
      }
      const count = document.getElementById('awpCount');
      if (count) count.textContent = _awpChosen.size;
      renderAuthorWorkPickerGrid();
    }

    async function saveAuthorSeries(id) {
      const name = document.getElementById('authorSeriesName')?.value.trim() || '';
      if (!name) { showToast('璇峰～鍐欑郴鍒楀悕绉?, 'error'); return; }
      const previewImg = document.querySelector('#authorSeriesCoverPreview img');
      const cover = previewImg?.getAttribute('src') || document.getElementById('authorSeriesCover')?.value || '';
      const visible = document.getElementById('authorSeriesVisible')?.checked !== false;
      const status = document.getElementById('authorSeriesStatus')?.value || 'zhaomuzhong';
      const category = document.getElementById('authorSeriesCategory')?.value || '';
      const startDate = document.getElementById('authorSeriesStart')?.value || '';
      const endDate = document.getElementById('authorSeriesEnd')?.value || '';
      const tags = getTagChipValues('authorSeriesTags');
      const description = document.getElementById('authorSeriesDesc')?.value || '';
      const contactInfo = document.getElementById('authorSeriesContact')?.value || '';
      const workIds = [...(window._authorSeriesSelectedWorkIds || [])].map(String);
      const body = { name, cover, visible, status, category, startDate, endDate, tags, description, contactInfo, workIds };
      try {
        const result = id
          ? await authorAPI('PUT', `/api/author/series/${id}`, body)
          : await authorAPI('POST', '/api/author/series', body);
        if (result) {
          showToast('绯诲垪宸蹭繚瀛?, 'success');
          document.getElementById('authorSeriesEditor').innerHTML = '';
          loadAuthorSeries();
        }
      } catch (e) {
        showToast('淇濆瓨澶辫触锛岃閲嶈瘯', 'error');
      }
    }

    function renderAuthorFeaturedPicker(works, selectedIds, showFeatured = true) {
      const picker = document.getElementById('authorFeaturedPicker');
      if (!picker) return;
      const publicWorks = works.filter(w => !w.approvalStatus || w.approvalStatus === 'approved');
      const toggleHtml = `<label class="author-featured-toggle"><input type="checkbox" id="authorFeaturedShow" ${showFeatured ? 'checked' : ''}><span>鍦ㄩ椤垫樉绀恒€屽睍绀轰綔鍝併€?/span><small>鍏抽棴鍚庝綔鑰呬富椤典笉鍐嶅嚭鐜拌繖涓ā鍧楋紝浣滃搧浠嶄繚鐣欍€?/small></label>`;
      if (!publicWorks.length) {
        picker.innerHTML = `<h3>浣滆€呬富椤?路 灞曠ず浣滃搧</h3>${toggleHtml}<p class="author-featured-hint">鏈夐€氳繃瀹℃牳鐨勪綔鍝佸悗锛屽彲浠ュ湪杩欓噷閫夋嫨瑕佸睍绀虹殑 3 涓綔鍝併€?/p>`;
        return;
      }
      window._authorFeaturedWorks = publicWorks;
      const slots = [0, 1, 2].map(i => String((Array.isArray(selectedIds) ? selectedIds[i] : '') || ''));
      window._authorFeaturedSlots = slots;
      const explicitWorks = slots.map(id => publicWorks.find(w => String(w.id) === id)).filter(Boolean);
      const defaultLiked = publicWorks.slice().sort((a, b) => (b.likes || 0) - (a.likes || 0));
      const effective = [...explicitWorks];
      defaultLiked.forEach(w => { if (effective.length < 3 && !effective.some(x => x.id === w.id)) effective.push(w); });
      const slotHtml = [0, 1, 2].map(i => {
        const explicit = slots[i] ? publicWorks.find(w => String(w.id) === slots[i]) : null;
        const work = effective[i];
        return `<div class="awb-feature-slot${explicit ? ' is-set' : ''}">
          <div class="awb-feature-slot-head"><span>绗?${i + 1} 涓?/span><small>${explicit ? '宸查€夋嫨' : '鑷姩'}</small></div>
          <div class="awb-feature-slot-cover">${work?.images?.[0] ? `<img src="${escapeHtml(imgUrl(work.images[0], 240))}" alt="">` : '<span>鏈€夋嫨</span>'}</div>
          <b>${work ? escapeHtml(work.title || '鏈懡鍚?) : '鑷姩琛ヤ綅'}</b>
          <small>${work ? `${escapeHtml(STATUS_LABELS?.[work.status] || '')}${(!work.approvalStatus || work.approvalStatus === 'approved') ? '' : ' 路 寰呭鏍?}` : '鎸夊枩鐖辨暟鑷姩琛ラ綈'}</small>
          <div class="awb-feature-slot-actions">
            <button type="button" onclick="openFeaturedWorkPicker(${i})">閫夋嫨浣滃搧</button>
            ${explicit ? `<button type="button" class="ghost" onclick="clearFeaturedWorkSlot(${i})">鑷姩</button>` : ''}
          </div>
        </div>`;
      }).join('');
      picker.innerHTML = `
        <div class="author-featured-head">
          <div><h3>浣滆€呬富椤?路 灞曠ず浣滃搧</h3><p class="author-featured-hint">鏈€澶氬睍绀?3 涓綔鍝侊紱鏈墜鍔ㄩ€夋嫨鐨勭敱鍠滅埍鏁拌嚜鍔ㄨˉ榻愩€備粎褰卞搷涓汉涓婚〉銆?/p></div>
          <div class="author-featured-actions">
            ${slots.some(Boolean) ? '<button type="button" class="btn-sm" onclick="clearAuthorFeaturedWorks()">鎭㈠榛樿</button>' : ''}

          </div>
        </div>
        ${toggleHtml}
        <div class="awb-feature-slots">${slotHtml}</div>`;
    }

    function openFeaturedWorkPicker(index) {
      const current = window._authorFeaturedSlots?.[index] || '';
      openAuthorWorkPicker({
        works: window._authorFeaturedWorks || [],
        selected: current ? new Set([String(current)]) : new Set(),
        multiple: false,
        onConfirm: function (ids) {
          const chosen = ids[0] ? String(ids[0]) : '';
          const slots = [...(window._authorFeaturedSlots || ['', '', ''])];
          for (let i = 0; i < slots.length; i++) if (i !== index && String(slots[i]) === chosen) slots[i] = '';
          slots[index] = chosen;
          window._authorFeaturedSlots = slots;
          renderAuthorFeaturedPicker(window._authorFeaturedWorks || [], slots, document.getElementById('authorFeaturedShow')?.checked !== false);
        }
      });
    }

    function clearFeaturedWorkSlot(index) {
      const slots = [...(window._authorFeaturedSlots || ['', '', ''])];

        'my-updates': '鎴戠殑鍔ㄦ€?,
        images: '鍥剧墖绠＄悊',
        notifications: '瀹℃牳閫氱煡',
        'author-announcements': '绠＄悊鍏憡',
        profile: '浣滆€呰祫鏂?,
        password: '淇敼瀵嗙爜',
        history: '鎿嶄綔鏃ュ織'
      };
      const titleEl = document.getElementById('mgmtTitle');
      if (titleEl) titleEl.textContent = titles[tab] || '浣滆€呯鐞?;
      const content = document.querySelector('.mgmt-content');
      if (content) content.scrollTop = 0;
      toggleMgmtSidebar(false);
      if (tab === 'todo') loadAuthorWorkbench();
      if (tab === 'history') loadAuthorHistory();
      if (tab === 'notifications') loadAuthorNotifications();
      if (tab === 'author-announcements') loadAuthorAnnouncementsList();
      if (tab === 'my-events') loadMyEvents();
      if (tab === 'my-series') loadAuthorSeries();
      if (tab === 'only-booths') loadAuthorOnlyBooths();
      if (tab === 'my-projects') loadMyProjects();
      if (tab === 'my-updates') loadMyUpdates();
    }

    // Logout
    function authorLogout() {
      authorToken = null;
      authorCircleId = null;
      localStorage.removeItem('f7author_token');
      localStorage.removeItem('f7author_circleId');
      localStorage.removeItem('f7author_actAs');
      const screen = document.getElementById('mgmtScreen');
      screen.classList.remove('is-on');
      screen.style.display = 'none';
      toggleMgmtSidebar(false);
      document.querySelectorAll('.mgmt-dropdown.open').forEach(d => d.classList.remove('open'));
      document.getElementById('authScreen').style.display = 'flex';
    }

    // Check existing token
    async function checkAuthorAuth() {
      if (authorToken) {
        try {
          const res = await fetch('/api/author/profile', {
            headers: { 'Authorization': 'Bearer ' + authorToken }
          });
          if (res.ok) {
            showMgmtPage();
            return;
          }
          // Check if account was deleted
          if (res.status === 403) {
            const data = await res.json();
            if (data.needReapply) {
              alert('鎮ㄧ殑浣滆€呰处鍙峰凡琚鐞嗗憳鍒犻櫎锛岃閲嶆柊鐢宠銆?);
              authorLogout();
              switchAuthTab('register');
              return;
            }
          }
        } catch (e) {}
        authorLogout();
      }
    }

    // ===== Form Draft System =====
    const FormDraft = {
      _currentType: null,
      _hasChanges: false,
      _saveTimer: null,

      // Start tracking a form type
      startTracking(formType) {
        this._currentType = formType;
        this._hasChanges = false;
        // Listen for changes on all form inputs
        const body = document.getElementById('workModalBody');
        if (!body) return;
        body.addEventListener('input', this._onInput.bind(this));
        body.addEventListener('change', this._onInput.bind(this));
      },

      _onInput() {
        this._hasChanges = true;
        clearTimeout(this._saveTimer);
        this._saveTimer = setTimeout(() => this.save(), 800);
      },

      // Save current form state to sessionStorage
      save() {
        if (!this._currentType) return;
        const body = document.getElementById('workModalBody');
        if (!body) return;
        const data = {};
        body.querySelectorAll('input, textarea, select').forEach(el => {
          if (!el.id || el.type === 'file') return;
          if (el.type === 'checkbox') data[el.id] = el.checked;
          else if (el.type === 'radio') { if (el.checked) data[el.name] = el.value; }
          else data[el.id] = el.value;
        });
        try {
          sessionStorage.setItem(`f7draft_${this._currentType}`, JSON.stringify(data));
        } catch (e) {}
      },

      // Load draft from sessionStorage
      load(formType) {
        try {
          const saved = sessionStorage.getItem(`f7draft_${formType}`);
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      },

      // Apply draft data to form fields
      apply(data) {
        if (!data) return;
        const body = document.getElementById('workModalBody');
        if (!body) return;
        Object.entries(data).forEach(([id, value]) => {
          const el = body.querySelector(`#${CSS.escape(id)}`) || body.querySelector(`[name="${id}"]`);
          if (!el) return;
          if (el.type === 'checkbox') el.checked = value;
          else if (el.type === 'radio') { /* handled by name selector */ }
          else el.value = value;
          const chipBox = body.querySelector(`.tag-chip-box[data-for="${id}"]`);
          if (chipBox) {
            initTagChipBox(chipBox);
            setTagChipValues(chipBox, el.value);
          }
        });
        this._hasChanges = true;
      },

      // Clear draft for a form type
      clear(formType) {
        sessionStorage.removeItem(`f7draft_${formType || this._currentType}`);
        this._hasChanges = false;
      },

      // Stop tracking
      stopTracking() {
        this._currentType = null;
        this._hasChanges = false;
        clearTimeout(this._saveTimer);
        const body = document.getElementById('workModalBody');
        if (body) {
          body.removeEventListener('input', this._onInput);
          body.removeEventListener('change', this._onInput);
        }
      },

      hasChanges() { return this._hasChanges; }
    };

    // Override closeWorkModal to check for unsaved changes
    const _originalCloseWorkModal = closeWorkModal;
    closeWorkModal = async function() {
      try {
        if (typeof FormDraft !== 'undefined' && FormDraft.hasChanges()) {
          let confirmed = false;
          if (typeof showConfirm === 'function') {
            confirmed = await showConfirm('鏈夋湭淇濆瓨鐨勪慨鏀癸紝纭畾鍏抽棴鍚楋紵');
          } else {
            confirmed = window.confirm('鏈夋湭淇濆瓨鐨勪慨鏀癸紝纭畾鍏抽棴鍚楋紵');
          }
          if (!confirmed) return;
        }
      } catch (e) {}
      if (typeof FormDraft !== 'undefined' && FormDraft.stopTracking) FormDraft.stopTracking();
      const overlay = document.getElementById('workModalOverlay');
      if (overlay) {
        overlay.classList.remove('open');
        overlay.style.display = '';
      }
    };

    initTagChipBoxes(document);
    loadLang(_lang, true).finally(() => checkAuthorAuth());
  </script>
</body>

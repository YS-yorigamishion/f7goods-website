<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 同人作者</title>
  <meta name="description" content="发现优秀的同人创作者与作者，支持独立创作。浏览作者的作品、活动和联系方式。">
  <meta property="og:title" content="f7goods — 同人作者">
  <meta property="og:description" content="发现优秀的同人创作者与作者，支持独立创作。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="https://f7goods.com/uploads/og-image.png">
  <link rel="alternate" type="application/rss+xml" title="f7goods RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20261020de">
<link rel="canonical" href="https://f7goods.com/circles.html">
<meta property="og:url" content="https://f7goods.com/circles.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="zh-CN" href="https://f7goods.com/circles.html">
<link rel="alternate" hreflang="x-default" href="https://f7goods.com/circles.html">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content cir-page">
    <header class="cir-head">
      <div>
        <div class="cir-kicker">AUTHOR DIRECTORY</div>
        <h1 id="heroTitle" class="settings-pending" data-i18n="circles.heroTitle">同人作者</h1>
        <p id="heroSubtitle" class="settings-pending" data-i18n="circles.heroSubtitle">最新更新的作者，以及全部同人创作者</p>
      </div>
      <div class="cir-head-stats">
        <div><b id="circleTotalCount">0</b><span>位作者</span></div>
        <div><b id="circleOfficialCount">0</b><span>官方</span></div>
        <div><b id="circleGroupCount">0</b><span>社团</span></div>
        <div><b id="circleIndividualCount">0</b><span>个人</span></div>
      </div>
    </header>
    <span id="pageTitle" style="display:none"></span>
    <span id="pageSubtitle" style="display:none"></span>

    <div class="cir-toolbar">
      <div class="cir-filters" id="categoryFiltersRow">
        <div id="categoryFilters" style="display:contents;"></div>
      </div>
      <span class="cir-sep" aria-hidden="true"></span>
      <div class="cir-filters">
        <button type="button" class="filter-btn" data-circle-filter="followed" onclick="toggleCircleFilter('followed')" data-i18n="common.follow">关注</button>
      </div>
      <div class="cir-toolbar-spacer"></div>
      <select class="cir-select" id="sortSelect">
        <option value="random" selected data-i18n="common.sortRandom">随机排序</option>
        <option value="new">最新注册</option>
        <option value="order" data-i18n="common.sortDefault">默认排序</option>
        <option value="name-asc" data-i18n="common.nameAsc">名称 A→Z</option>
      </select>
      <input type="text" class="cir-search" placeholder="搜索作者、简介…" id="searchInput" data-i18n-placeholder="common.searchPlaceholder">
    </div>

    <section class="cir-section cir-latest" id="latestCirclesSection">
      <div class="cir-section-head">
        <h2>最新更新的作者 <small>RECENTLY UPDATED</small></h2>
        <p>最近有新作品发布的作者</p>
      </div>
      <div class="cl-author-grid" id="latestCirclesGrid"></div>
    </section>

    <section class="cir-section cir-all">
      <div class="cir-section-head">
        <h2>全部作者 <small>ALL AUTHORS</small></h2>
        <p>显示 <b id="circleShowCount">0</b> 位作者</p>
      </div>
      <div class="cards-grid cl-author-grid" id="circlesGrid">
        <div id="circlesSkeleton" class="skeleton-grid">
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
          <div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js?v=20261020de"></script>
  <script src="/js/pull-to-refresh.js"></script>
  <script src="/js/i18n.js?v=20261020de"></script>
  <script src="/js/main.js?v=20261020de"></script>
  <script>
    initPage('circles');
    if (typeof isAuthorLoggedIn === 'function' && isAuthorLoggedIn() && typeof mountAuthorCreateFab === 'function') {
      const myCid = typeof authorHomeCircleId === 'function' ? authorHomeCircleId() : '';
      if (myCid) mountAuthorCreateFab({ label: '我的主页', href: '/circle-detail.html?id=' + encodeURIComponent(myCid) });
    }

    let allCircles = [];
    let circleTagsMap = {};
    let circleWorksCountMap = {};
    let circleLatestWorkTimeMap = {};
    let currentCategory = 'all';
    let currentCircleFilter = 'none'; // 'none', 'followed'

    function getFollowedIds() {
      try { return JSON.parse(localStorage.getItem('f7followed') || '[]') || []; }
      catch { return []; }
    }

    function shuffleCirclesForSession(list) {
      if (!Array.isArray(list)) return list;
      const n = list.length;
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = list[i];
        list[i] = list[j];
        list[j] = tmp;
      }
      list.forEach(function (c, idx) { c._randomRank = idx; });
      return list;
    }

    function buildWorksMaps(works) {
      circleTagsMap = {};
      circleWorksCountMap = {};
      circleLatestWorkTimeMap = {};
      (works || []).forEach(w => {
        (w.circles || []).forEach(cid => {
          if (!circleTagsMap[cid]) circleTagsMap[cid] = [];
          circleTagsMap[cid].push(...(w.tags || []));
          circleWorksCountMap[cid] = (circleWorksCountMap[cid] || 0) + 1;
          const stamp = new Date(w.createdAt || w.releaseDate || 0).getTime();
          if (Number.isFinite(stamp) && stamp > (circleLatestWorkTimeMap[cid] || 0)) {
            circleLatestWorkTimeMap[cid] = stamp;
          }
        });
      });
      Object.keys(circleTagsMap).forEach(k => {
        circleTagsMap[k] = [...new Set(circleTagsMap[k])];
      });
    }

    function toggleCircleFilter(type) {
      currentCircleFilter = currentCircleFilter === type ? 'none' : type;
      document.querySelectorAll('[data-circle-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.circleFilter === currentCircleFilter);
      });
      renderCircles();
    }

    async function loadCircles() {
      try {
        await Promise.all([loadCategoriesFromAPI(), loadSettingsFromAPI()]);
        const [circles, works] = await Promise.all([
          F7API.getCircles(),
          F7API.getWorks()
        ]);
        allCircles = shuffleCirclesForSession(circles || []);
        buildWorksMaps(works);

        // Apply settings
        const ps = getPageSettings('circles');
        if (ps.heroTitle) document.getElementById('heroTitle').textContent = ps.heroTitle;
        if (ps.heroSubtitle) document.getElementById('heroSubtitle').textContent = ps.heroSubtitle;
        if (ps.pageTitle) document.getElementById('pageTitle').textContent = ps.pageTitle;
        if (ps.pageSubtitle) document.getElementById('pageSubtitle').textContent = ps.pageSubtitle;
        applyHeroBg('circles');

        document.querySelectorAll('.settings-pending').forEach(el => el.classList.remove('settings-pending'));
        document.querySelectorAll('.hero, .page-header').forEach(el => el.style.visibility = '');

        // Build category filter buttons
        const catContainer = document.getElementById('categoryFilters');
        if (catContainer && CIRCLE_CATEGORIES_ORDERED.length > 0) {
          catContainer.innerHTML = `<button class="filter-btn active" data-cat="all">${t('common.all')}</button>` +
            CIRCLE_CATEGORIES_ORDERED.map(c => `<button class="filter-btn" data-cat="${c.id}">${tCat(c)}</button>`).join('');
          catContainer.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              catContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              currentCategory = btn.dataset.cat;
              renderCircles();
            });
          });
        }

        renderCircles();
      } catch (e) {
        document.getElementById('circlesGrid').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.loadFailed')}</p></div>`;
      }
    }

function circleTimeAgo(ts) {
  if (!ts) return '近期活跃';
  const diff = Date.now() - ts;
  const days = Math.floor(diff / 86400000);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 30) return days + ' 天前';
  if (days < 365) return Math.floor(days / 30) + ' 个月前';
  return Math.floor(days / 365) + ' 年前';
}

function circleCardHtml(circle, followedSet, isLatest) {
  const cover = circle.cardCover || circle.logo || '';
  const workCount = circleWorksCountMap[circle.id] || 0;
  const catLabel = circle.category ? (CIRCLE_CATEGORIES[circle.category] || '') : '';
  const isFollowed = followedSet.has(circle.id);
  const footText = isLatest
    ? '最近更新 ' + circleTimeAgo(circleLatestWorkTimeMap[circle.id])
    : (isFollowed ? '已关注' : '作者');
  return `
    <a class="cl-author-card" href="/circle-detail.html?id=${encodeURIComponent(circle.id)}">
      <div class="cl-author-cover">
        ${cover
          ? `<img src="${escapeHtml(imgUrl(cover, 640))}" alt="" loading="lazy">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#6b6560;font-family:'Noto Serif SC',Georgia,serif;font-size:1.4rem;">${escapeHtml((circle.name || '?').charAt(0))}</div>`}
      </div>
      <div class="cl-author-body">
        <div class="cl-author-avatar">
          ${circle.logo
            ? `<img src="${escapeHtml(imgUrl(circle.logo, 160))}" alt="${escapeHtml(circle.name)}" loading="lazy">`
            : escapeHtml((circle.name || '?').charAt(0))}
        </div>
        <div class="cl-author-name">${escapeHtml(circle.name)}</div>
        <div class="cl-author-meta">
          ${catLabel ? `<span class="cl-author-chip cat">${escapeHtml(catLabel)}</span>` : ''}
          <span class="cl-author-chip">${workCount} 件作品</span>
        </div>
        <div class="cl-author-desc">${escapeHtml(circle.description || '')}</div>
        <div class="cl-author-foot">
          <span>${footText}</span>
          <span class="go">查看 →</span>
        </div>
      </div>
    </a>`;
}

function renderCircles() {
  const grid = document.getElementById('circlesGrid');
  const latestGrid = document.getElementById('latestCirclesGrid');
  const latestSection = document.getElementById('latestCirclesSection');
  document.getElementById('circlesSkeleton')?.remove();
  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  let filtered = allCircles;
  if (currentCategory !== 'all') filtered = filtered.filter(c => c.category === currentCategory);

  const followedIds = getFollowedIds();
  if (currentCircleFilter === 'followed') filtered = filtered.filter(c => followedIds.includes(c.id));

  if (search) {
    filtered = filtered.filter(c =>
      c.name.toLowerCase().includes(search) ||
      (c.description || '').toLowerCase().includes(search) ||
      (circleTagsMap[c.id] || []).some(t => t.toLowerCase().includes(search))
    );
  }

  filtered = filtered.slice();
  const sortVal = document.getElementById('sortSelect')?.value || 'random';
  if (sortVal === 'name-asc') filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  else if (sortVal === 'order') filtered.sort((a, b) => (a.order || 0) - (b.order || 0));
  else if (sortVal === 'new') filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  else filtered.sort((a, b) => (a._randomRank || 0) - (b._randomRank || 0));

  const totalEl = document.getElementById('circleTotalCount');
  if (totalEl) totalEl.textContent = allCircles.length;
  const showEl = document.getElementById('circleShowCount');
  if (showEl) showEl.textContent = filtered.length;
  const official = allCircles.filter(c => c.category === 'guanfang').length;
  const groups = allCircles.filter(c => c.category === 'shetuan').length;
  const individuals = allCircles.filter(c => c.category === 'geren').length;
  if (document.getElementById('circleOfficialCount')) document.getElementById('circleOfficialCount').textContent = official;
  if (document.getElementById('circleGroupCount')) document.getElementById('circleGroupCount').textContent = groups;
  if (document.getElementById('circleIndividualCount')) document.getElementById('circleIndividualCount').textContent = individuals;

  if (filtered.length === 0) {
    if (latestSection) latestSection.style.display = 'none';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔍</div><p>${t('common.noMatchingAuthors')}</p></div>`;
    return;
  }

  const followedSet = new Set(followedIds);
  const latest = filtered.filter(c => (circleWorksCountMap[c.id] || 0) > 0).sort((a, b) =>
    (circleLatestWorkTimeMap[b.id] || 0) - (circleLatestWorkTimeMap[a.id] || 0)
  ).slice(0, 4);
  if (latestSection) latestSection.style.display = latest.length ? '' : 'none';
  if (latestGrid) latestGrid.innerHTML = latest.map(c => circleCardHtml(c, followedSet, true)).join('');
  grid.innerHTML = filtered.map(c => circleCardHtml(c, followedSet, false)).join('');
}

    document.getElementById('searchInput').addEventListener('input', debounce(renderCircles));
    document.getElementById('sortSelect').addEventListener('change', renderCircles);

    loadCircles();

    PullToRefresh.init({
      onRefresh: async () => {
        const [circles, works] = await Promise.all([
          F7API.getCircles(),
          F7API.getWorks()
        ]);
        allCircles = shuffleCirclesForSession(circles || []);
        buildWorksMaps(works);
        renderCircles();
      }
    });
  </script>
</body>
</html>

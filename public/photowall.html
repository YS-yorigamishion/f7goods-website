<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>照片墙 — f7goods</title>
  <meta name="description" content="f7goods 周边照片墙。我们的故事还没有结束。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/photowall.css?v=20260917d">
  <!-- 强制完整显示：覆盖可能被 nginx 长缓存住的旧 CSS -->
  <style id="pw-force-contain">
    .pw-shot .frame {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      background: #F0EBE3 !important;
      padding: 10px 10px 18px !important;
      box-sizing: border-box !important;
    }
    .pw-shot .frame img,
    .pw-shot img {
      display: block !important;
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
      object-position: center center !important;
      margin: 0 !important;
    }
  </style>
</head>
<body class="pw-body">
  <div class="pw-bg" aria-hidden="true"></div>

  <div class="pw-chrome">
    <a href="/">返回周边</a>
  </div>

  <main class="pw-wall" id="pwWall" aria-label="周边照片墙"></main>

  <p class="pw-slogan tl">我们的故事</p>
  <p class="pw-slogan br">还没有结束</p>

  <button type="button" class="pw-refresh" id="pwRefresh" aria-label="换一批周边">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 8a8 8 0 1 0 1.5 6"/>
      <path d="M20 4v5h-5"/>
    </svg>
    换一批

  <script src="/js/api.js?v=20260917d"></script>
  <script src="/js/photowall.js?v=20260917d"></script>

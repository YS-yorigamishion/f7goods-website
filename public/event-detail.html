<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — 活动详情</title>
  <meta name="description" content="查看同人活动详情，包括时间、地点、相关作品等。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="f7goods">
  <meta property="og:image" content="/uploads/og-image.svg">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20261020dv">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="main-content detail-page">
    <div id="eventDetail">
      <div id="detailSkeleton">
        <div class="detail-breadcrumb"><div class="skeleton skeleton-text" style="width:120px;height:12px;display:inline-block;vertical-align:middle;"></div></div>
        <div class="detail-header" style="margin-bottom:1.5rem;">
          <div class="skeleton skeleton-cover" style="margin-bottom:1rem;"></div>
          <div class="skeleton skeleton-text" style="width:50%;height:28px;margin-bottom:0.8rem;"></div>
          <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;"><div class="skeleton skeleton-pill"></div><div class="skeleton skeleton-pill" style="width:100px;"></div></div>
        </div>
        <div class="detail-content">
          <div class="detail-main">
            <div class="skeleton skeleton-text" style="width:30%;height:18px;margin-bottom:1rem;"></div>
            <div class="skeleton skeleton-text" style="width:100%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:85%;margin-bottom:0.6rem;"></div>
            <div class="skeleton skeleton-text" style="width:60%;margin-bottom:1.5rem;"></div>
          </div>
          <div class="detail-sidebar">
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:40%;height:14px;margin-bottom:0.8rem;"></div><div class="skeleton skeleton-text" style="width:80%;"></div><div class="skeleton skeleton-text short"></div></div>
            <div class="skeleton-sidebar-card"><div class="skeleton skeleton-text" style="width:30%;height:14px;margin-bottom:0.8rem;"></div><div style="display:flex;align-items:center;gap:0.5rem;"><div class="skeleton skeleton-avatar" style="width:36px;height:36px;"></div><div class="skeleton skeleton-text" style="width:60%;margin:0;"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/js/api.js?v=20261020dv"></script>
  <script src="/js/i18n.js?v=20261020dv"></script>
  <script src="/js/main.js?v=20261020dv"></script>
  <script>
    let eventRelatedWorks = [];
    let eventCirclesMap = {};
    let rwCategory = 'all';
    let rwSearchText = '';
    let rwExpanded = false;

    function renderRelatedWorks() {
      let filtered = eventRelatedWorks;
      if (rwCategory !== 'all') {
        filtered = filtered.filter(w => w.category === rwCategory);
      }
      if (rwSearchText) {
        const q = rwSearchText.toLowerCase();
        const matchCircleIds = Object.entries(eventCirclesMap)
          .filter(([, name]) => name.toLowerCase().includes(q))
          .map(([id]) => id);
        filtered = filtered.filter(w =>
          w.title.toLowerCase().includes(q) ||
          (w.tags || []).some(t => t.toLowerCase().includes(q)) ||
          matchCircleIds.some(cid => (w.circles || []).includes(cid))
        );
      }
      const grid = document.getElementById('relatedWorksGrid');
      const count = document.getElementById('relatedWorksCount');
      const toggle = document.getElementById('relatedWorksToggle');
      const rwLimit = window.matchMedia('(max-width: 600px)').matches ? 4 : 8;
      if (count) count.textContent = `(${filtered.length})`;
      if (toggle) {
        toggle.style.display = filtered.length > rwLimit ? '' : 'none';
        toggle.textContent = rwExpanded ? '收起 ↑' : '展开 ↓';
      }
      if (!grid) return;
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state" style="padding:2rem 0;"><p>${t('common.noResults')}</p></div>`;
        return;
      }
      const visible = rwExpanded ? filtered : filtered.slice(0, rwLimit);
      grid.innerHTML = visible.map(work => {
        const authorNames = (work.circles || []).map(cid => eventCirclesMap[cid]).filter(Boolean).join('、');
        return `
        <a class="card" href="/work-detail.html?id=${work.id}" style="text-decoration:none;color:inherit;">
          <div class="card-image" style="height:160px;">
            ${work.images && work.images.length > 0
              ? `<img src="${escapeHtml(imgUrl(work.images[0], 320))}" alt="${escapeHtml(workTitle(work))}">`
              : '<span class="placeholder-icon">🎨</span>'}
          </div>
          <div class="card-body" style="padding:0.8rem;">
            <span class="card-tag ${work.status}" style="font-size:0.7rem;padding:0.15rem 0.5rem;">${STATUS_LABELS[work.status] || ''}</span>
            <h3 class="card-title" style="font-size:0.9rem;margin-top:0.3rem;">${escapeHtml(workTitle(work))}</h3>
            ${authorNames ? `<p style="font-size:0.75rem;color:var(--haze);margin-top:0.2rem;">${escapeHtml(authorNames)}</p>` : ''}
          </div>
          <div class="card-footer" style="padding:0.5rem 0.8rem;">
            <span class="card-price" style="color:var(--accent);font-weight:700;font-size:0.9rem;">${escapeHtml(typeof formatPriceLabel === 'function' ? formatPriceLabel(work.price) : (work.price || ''))}</span>
            ${renderLikeButton(work.id, work.likes)}
          </div>
        </a>`;
      }).join('');
    }

    function toggleRelatedWorks() {
      rwExpanded = !rwExpanded;
      renderRelatedWorks();
    }

    function toggleEventImg(el) {
      if (el._clickTimer) {
        clearTimeout(el._clickTimer);
        el._clickTimer = null;
      } else {
        el._clickTimer = setTimeout(() => {
          el._clickTimer = null;
          if (el.classList.contains('collapsed')) {
            // 折叠状态 → 展开
            el.classList.remove('collapsed');
          } else {
            // 已展开 → 打开lightbox
            const images = JSON.parse(el.dataset.images || '[]');
            const index = parseInt(el.dataset.index || '0');
            openLightbox(images, index);
          }
        }, 250);
      }
    }

    async function loadEvent() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/events.html'; return; }
      initPage('events', id);
      // Detail pages are rendered once; reload keeps labels and meta in the selected language.
      if (typeof onLangChange === 'function') onLangChange(() => location.reload());

      try {
        await loadCategoriesFromAPI();
        const [event, relatedWorks, allCircles, allProjects, allUpdates] = await Promise.all([
          F7API.getEvent(id),
          F7API.getWorks({ eventId: id }),
          F7API.getCircles(),
          F7API.getProjects(),
          fetch('/api/updates').then(r => r.json())
        ]);
        eventRelatedWorks = relatedWorks;
        eventCirclesMap = Object.fromEntries(allCircles.map(c => [c.id, c.name]));
        const relatedProjects = allProjects.filter(p => (event.relatedProjects || []).includes(p.id));
        const allRelatedUpdates = (allUpdates || [])
          .filter(u => (u.relatedEvents || []).includes(event.id))
          .sort((a, b) => String(b.publishDate || '').localeCompare(String(a.publishDate || '')));
        const relatedUpdates = allRelatedUpdates.slice(0, 3);
        const relatedCircleIds = [...new Set([
          ...relatedWorks.flatMap(w => w.circles || []),
          ...(event.relatedCircles || [])
        ])];
        const relatedCircles = allCircles.filter(c => relatedCircleIds.includes(c.id));

        document.title = `${event.title} — f7goods`;
        document.querySelector('meta[property="og:title"]').content = event.title;
        document.querySelector('meta[property="og:description"]').content = (event.description || '').substring(0, 160);
        if (event.coverImage) document.querySelector('meta[property="og:image"]').content = new URL(event.coverImage, location.origin).href;

        // JSON-LD structured data
        const jsonLd = {
          '@context': 'https://schema.org',
          '@type': 'Event',
          'name': event.title,
          'description': event.description || event.title,
          'image': event.coverImage || '',
          'url': window.location.href,
          'startDate': event.date,
          'endDate': event.endDate || event.date,
          'location': event.location ? { '@type': 'Place', 'name': event.location } : undefined
        };
        let ldScript = document.getElementById('jsonLd');
        if (!ldScript) { ldScript = document.createElement('script'); ldScript.id = 'jsonLd'; ldScript.type = 'application/ld+json'; document.head.appendChild(ldScript); }
        ldScript.textContent = JSON.stringify(jsonLd);

        document.getElementById('detailSkeleton')?.remove();
        const container = document.getElementById('eventDetail');
        const dateText = formatDate(event.date) + (event.endDate && event.endDate !== event.date ? ' ~ ' + formatDate(event.endDate) : '');
        const statusLabel = event.status ? (EVENT_STATUS_LABELS[event.status] || '') : '';
        const cover = event.coverImage || '';
        const isOnly = event.type === 'only';
        const dObj = new Date(event.date + 'T00:00:00');
        const validDate = !isNaN(dObj.getTime());
        const monthDay = validDate ? String(dObj.getMonth() + 1).padStart(2, '0') + '.' + String(dObj.getDate()).padStart(2, '0') : formatDate(event.date);
        const yearLabel = validDate ? dObj.getFullYear() : '';
        const weekday = validDate ? '周' + '日一二三四五六'[dObj.getDay()] : '';
        const city = (event.location || '').split('·')[0].trim();
        const daysTo = validDate ? Math.ceil((new Date(event.date + 'T23:59:59') - new Date()) / 86400000) : null;
        const allTags = [...new Set(relatedWorks.flatMap(w => w.tags || []))];
        const contactEntries = event.socialLinks ? Object.entries(event.socialLinks).filter(([k, v]) => v && !['contactLabel', 'websiteLabel'].includes(k)) : [];

        container.innerHTML = `
          <div class="evd-crumb">
            <a href="/events.html">${t('nav.events')}</a><span>›</span><span>${escapeHtml(event.title)}</span>
          </div>

          <section class="evd-masthead">
            <div class="evd-poster">
              ${cover ? `<img src="${escapeHtml(imgUrl(cover, 1600))}" alt="${escapeHtml(event.title)}">` : ''}
              ${statusLabel ? `<span class="evd-poster-tag">当前活动 · ${escapeHtml(statusLabel)}</span>` : ''}
            </div>
            <div class="evd-identity">
              <div class="evd-kicker">EVENT DOSSIER</div>
              <div class="evd-date"><b>${escapeHtml(monthDay)}</b><div class="evd-ym"><strong>${escapeHtml(String(yearLabel))}${weekday ? ' / ' + weekday : ''}</strong><span>${escapeHtml(city || '地点待公布')}</span></div></div>
              <h1>${escapeHtml(event.title)}</h1>
              <div class="evd-chips">
                ${statusLabel ? `<span class="evd-chip">${escapeHtml(statusLabel)}</span>` : ''}
                ${isOnly ? `<span class="evd-chip pink">ONLY 专场</span>` : ''}
                ${relatedWorks.length ? `<span class="evd-chip">${relatedWorks.length} 件关联周边</span>` : ''}
              </div>
              ${event.description ? `<div class="evd-desc">${nl2br(event.description)}</div>` : ''}
              ${event.location ? `<div class="evd-loc">📍 ${escapeHtml(event.location)}</div>` : ''}
              <div class="evd-actions">
                ${isOnly ? `<a class="evd-btn evd-btn-pink" href="/only.html?id=${encodeURIComponent(event.id)}">进入 ONLY 专场 →</a>` : ''}
                <span class="evd-share">${renderShareButton(event.title, location.href)}</span>
                ${daysTo !== null && daysTo > 0 ? `<div class="evd-countdown"><b>${daysTo}</b> 天后开始</div>` : ''}
              </div>
            </div>
          </section>

          <div class="evd-layout">
            <main class="evd-main">
              <section class="evd-block">
                <div class="evd-block-head"><h2>${t('events.description')} <span>ABOUT</span></h2></div>
                <div class="evd-body">${event.description ? nl2br(event.description) : '暂无活动简介'}</div>
                ${event.booth ? `<div class="evd-booth">${t('events.booth')}：<b>${escapeHtml(event.booth)}</b></div>` : ''}
                ${event.images && event.images.length > 0 ? `
                  <div class="evd-imgs">
                    ${event.images.map((img, i) => `
                      <div class="event-img-wrap collapsed" data-images='${JSON.stringify(event.images).replace(/&/g, '&amp;').replace(/'/g, '&#39;')}' data-index="${i}" onclick="toggleEventImg(this)">
                        <img src="${escapeHtml(imgUrl(img, 800))}" alt="${escapeHtml(event.title)}">
                        <div class="event-img-expand-hint">&#8595;</div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </section>

              ${relatedUpdates.length ? `
              <section class="evd-block">
                <div class="evd-block-head"><h2>活动动态 <span>UPDATES</span></h2>${allRelatedUpdates.length ? `<a href="/event-updates.html?event=${encodeURIComponent(event.id)}">查看全部 →</a>` : ''}</div>
                <div class="rel-upd-grid">
                  ${relatedUpdates.map(u => {
                    const ucover = u.coverImage || (u.images && u.images[0]) || '';
                    const names = (u.relatedCircles || []).map(cid => allCircles.find(c => c.id === cid)?.name).filter(Boolean);
                    const catLabel = (typeof UPDATE_CATEGORIES !== 'undefined' && UPDATE_CATEGORIES[u.category]) || '动态';
                    const excerpt = String(u.content || '').replace(/\s+/g, ' ').trim();
                    return `<a class="card rel-upd-card" href="/update-detail.html?id=${encodeURIComponent(u.id)}">
                      <div class="card-image">${ucover ? `<img src="${escapeHtml(imgUrl(ucover, 360))}" alt="${escapeHtml(u.title)}" loading="lazy">` : '<span class="placeholder-icon">📰</span>'}<span class="rel-upd-tag">${escapeHtml(catLabel)}</span></div>
                      <div class="card-body">
                        <div class="rel-upd-meta">${formatDate(u.publishDate)}${names.length ? ' · ' + escapeHtml(names[0]) : ''}</div>
                        <h3 class="card-title">${escapeHtml(u.title)}</h3>
                        <p class="rel-upd-excerpt">${escapeHtml(excerpt)}</p>
                        <div class="rel-upd-foot"><span>${names.length ? '参与作者动态' : '动态'}</span><span class="go">阅读 →</span></div>
                      </div>
                    </a>`;
                  }).join('')}
                </div>
                <p class="rel-upd-note">仅展示关联到本活动的同人动态 · 按发布时间倒序</p>
              </section>` : ''}

              ${relatedWorks.length ? (() => {
                const usedCats = [...new Set(relatedWorks.map(w => w.category).filter(Boolean))];
                const catBtns = CATEGORIES_ORDERED.filter(c => usedCats.includes(c.id));
                return `<section class="evd-block">
                  <div class="evd-block-head"><h2>${t('events.relatedWorks')} <span id="relatedWorksCount">(${relatedWorks.length})</span></h2><button type="button" class="evd-expand" id="relatedWorksToggle" onclick="toggleRelatedWorks()" style="display:none;">展开 ↓</button></div>
                  <div class="evd-filter-row">
                    <button class="filter-btn active" data-rw-cat="all" onclick="rwCategory='all';this.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');renderRelatedWorks();">${t('common.all')}</button>
                    ${catBtns.map(c => `<button class="filter-btn" data-rw-cat="${c.id}" onclick="rwCategory='${c.id}';this.parentElement.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');renderRelatedWorks();">${tCat(c)}</button>`).join('')}
                    <input type="text" class="search-input" placeholder="${t('common.searchWorks')}" oninput="rwSearchText=this.value;renderRelatedWorks();">
                  </div>
                  <div class="cards-grid evd-works-grid" id="relatedWorksGrid"></div>
                </section>`;
              })() : ''}
            </main>

            <aside class="evd-side">
              <div class="evd-card">
                <h3>${t('events.eventInfo')}</h3>
                <div class="evd-side-row"><span>${t('events.startDate')}</span><b>${formatDate(event.date)}</b></div>
                ${event.endDate ? `<div class="evd-side-row"><span>${t('events.endDate')}</span><b>${formatDate(event.endDate)}</b></div>` : ''}
                ${event.location ? `<div class="evd-side-row"><span>${t('events.location')}</span><b>${escapeHtml(event.location)}</b></div>` : ''}
                ${event.booth ? `<div class="evd-side-row"><span>${t('events.booth')}</span><b style="color:var(--accent)">${escapeHtml(event.booth)}</b></div>` : ''}
              </div>

              ${contactEntries.length ? `<div class="evd-card"><h3>${t('events.contactInfo')}</h3>
                ${contactEntries.map(([key, url]) => {
                  const isUrl = String(url).startsWith('http');
                  const defaultLabel = key === 'qq' ? t('common.qqContact') : key === 'qqGroup' ? t('common.qqGroup') : key === 'website' ? t('common.visitWebsite') : key;
                  const label = key === 'website' ? (event.socialLinks.websiteLabel || defaultLabel) : (event.socialLinks.contactLabel || defaultLabel);
                  return `<div class="evd-contact-item"><span>${escapeHtml(label)}</span>${isUrl ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">访问 →</a>` : `<b>${escapeHtml(url)}</b>`}</div>`;
                }).join('')}
              </div>` : ''}

              ${relatedProjects.length ? `<div class="evd-card"><h3>${t('events.relatedProjects')}</h3>
                ${relatedProjects.map(p => `<a class="evd-mini-link" href="/project-detail.html?id=${encodeURIComponent(p.id)}">
                  ${p.coverImage ? `<img src="${escapeHtml(imgUrl(p.coverImage, 96))}" alt="">` : '<span class="evd-ph">企</span>'}
                  <div><b>${escapeHtml(p.title)}</b><small>${escapeHtml(PROJECT_STATUS_LABELS[p.status] || '')}</small></div>
                </a>`).join('')}
              </div>` : ''}

              ${relatedCircles.length ? `<div class="evd-card"><h3>${t('events.relatedAuthors')}</h3>
                ${relatedCircles.map(c => `<a class="evd-mini-link" href="/circle-detail.html?id=${encodeURIComponent(c.id)}">
                  ${c.logo ? `<img class="round" src="${escapeHtml(imgUrl(c.logo, 96))}" alt="">` : `<span class="evd-ph round">${escapeHtml(c.name.charAt(0))}</span>`}
                  <div><b>${escapeHtml(c.name)}</b><small>作者</small></div>
                </a>`).join('')}
              </div>` : ''}

              ${allTags.length ? `<div class="evd-card evd-tags-card"><h3>${t('works.tags')}</h3><div class="tag-list">${allTags.map(tg => `<a class="tag" href="/?tag=${encodeURIComponent(tg)}">${escapeHtml(tg)}</a>`).join('')}</div></div>` : ''}
            </aside>
          </div>
        `;
        renderRelatedWorks();
      } catch (e) {
        document.getElementById('eventDetail').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${t('common.notFound')}</p></div>`;
      }
    }

    loadEvent();
  </script>
</body>
</html>

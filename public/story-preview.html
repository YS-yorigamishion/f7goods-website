<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>断更之后 · f7goods 故事预览</title>
  <meta name="description" content="永远的7日之都没有停服，却永远断更。玩家仍在热爱，并写下续章。f7goods 故事页交互预览。">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <style>
    :root {
      --ink: #22201E;
      --paper: #F6F2EB;
      --card: #FFFCF7;
      --accent: #D94F5C;
      --accent-dark: #B83D49;
      --muted: #8A8078;
      --line: #E5DDD1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 50;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .stage {
      position: relative;
      height: 100%;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1.5rem 1.5rem;
    }
    .chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      padding-top: env(safe-area-inset-top, 0);
    }
    .brand {
      display: flex; align-items: center; gap: 0.5rem;
      font-family: 'Noto Serif SC', Georgia, serif;
      font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--ink); color: var(--paper);
      display: grid; place-items: center;
      font-size: 0.62rem; font-weight: 700;
      font-family: 'Noto Sans SC', system-ui, sans-serif;
    }
    .chrome-right {
      display: flex; align-items: center; gap: 0.65rem;
      font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em;
    }
    .preview-tag {
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .skip-btn {
      border: none; background: none; cursor: pointer;
      color: var(--muted); font-size: 0.78rem; font-family: inherit;
      padding: 0.25rem 0.4rem; border-radius: 6px;
      transition: color 0.15s ease;
    }
    .skip-btn:hover { color: var(--ink); }

    .meter {
      flex-shrink: 0;
      margin-top: 1.1rem;
      display: flex; align-items: center; gap: 0.55rem;
    }
    .meter-label {
      font-size: 0.68rem; color: var(--muted);
      letter-spacing: 0.12em; text-transform: uppercase;
      min-width: 3.2rem;
      font-variant-numeric: tabular-nums;
    }
    .meter-track {
      flex: 1; display: flex; gap: 4px; height: 3px;
    }
    .meter-seg {
      flex: 1; background: var(--line); border-radius: 99px;
      transition: background 0.35s ease, transform 0.35s ease;
      transform-origin: center;
    }
    .meter-seg.done { background: rgba(217, 79, 92, 0.35); }
    .meter-seg.now {
      background: var(--accent);
      transform: scaleY(1.6);
    }

    .scene {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 1.5rem 0 0.5rem;
      cursor: pointer;
      position: relative;
    }
    .chapter {
      display: none;
      flex-direction: column;
      animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
      z-index: 1;
    }
    .chapter.active { display: flex; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .day-kicker {
      display: inline-flex; align-items: center; gap: 0.55rem;
      font-size: 0.72rem; letter-spacing: 0.18em;
      color: var(--accent); font-weight: 600;
      margin-bottom: 1rem;
    }
    .day-kicker::before {
      content: ''; width: 18px; height: 2px;
      background: var(--accent); border-radius: 99px;
    }
    .chapter h1 {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.55rem, 5.2vw, 2.25rem);
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .chapter .lead {
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
      line-height: 1.9;
      color: var(--ink);
      opacity: 0.88;
      max-width: 34em;
    }
    .chapter .lead + .lead { margin-top: 1rem; }
    .chapter .aside {
      margin-top: 1.5rem;
      padding: 0.9rem 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 2px solid var(--accent);
      border-radius: 0 10px 10px 0;
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 34em;
    }
    .chapter .aside strong {
      color: var(--accent);
      font-weight: 600;
    }

    .glyph {
      position: absolute;
      right: 4%;
      top: 16%;
      width: min(180px, 32vw);
      height: min(180px, 32vw);
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }
    .glyph svg { width: 100%; height: 100%; }

    .hint {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .hint kbd {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--card);
      font-family: inherit; font-size: 0.7rem;
      margin: 0 0.1rem;
    }

    .end-row {
      margin-top: 1.75rem;
      display: flex; flex-wrap: wrap; gap: 0.65rem;
    }
    .btn-primary {
      appearance: none; border: none; cursor: pointer;
      background: var(--accent); color: #fff;
      font-family: inherit; font-size: 0.92rem; font-weight: 600;
      padding: 0.75rem 1.5rem; border-radius: 999px;
      transition: background 0.15s ease, transform 0.12s ease;
      box-shadow: 0 4px 14px rgba(217, 79, 92, 0.25);
      text-decoration: none;
      display: inline-flex; align-items: center;
    }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-ghost {
      appearance: none; cursor: pointer;
      background: transparent; color: var(--muted);
      border: 1px solid var(--line);
      font-family: inherit; font-size: 0.88rem; font-weight: 500;
      padding: 0.72rem 1.25rem; border-radius: 999px;
      text-decoration: none;
      transition: border-color 0.15s ease, color 0.15s ease;
      display: inline-flex; align-items: center;
    }
    .btn-ghost:hover { color: var(--ink); border-color: #D4C8B8; }

    .stat-row {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      max-width: 34em;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.85rem 0.7rem;
      text-align: center;
    }
    .stat b {
      display: block;
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.15rem; color: var(--accent);
      margin-bottom: 0.15rem;
    }
    .stat span { font-size: 0.7rem; color: var(--muted); }

    .foot {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.75rem;
      padding-bottom: env(safe-area-inset-bottom, 0);
      border-top: 1px solid var(--line);
    }
    .nav-btn {
      appearance: none; cursor: pointer;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: inherit; font-size: 0.85rem; font-weight: 500;
      padding: 0.6rem 1.1rem; border-radius: 999px;
      transition: border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
      min-width: 5.5rem;
    }
    .nav-btn:hover:not(:disabled) { border-color: #D4C8B8; }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .nav-btn.next {
      background: var(--accent); border-color: var(--accent); color: #fff;
      box-shadow: 0 3px 10px rgba(217, 79, 92, 0.2);
    }
    .nav-btn.next:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
    .foot-center {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.06em;
      text-align: center;
    }

    @media (max-width: 480px) {
      .stage { padding: 1rem 1.1rem 1.1rem; }
      .stat-row { grid-template-columns: 1fr 1fr 1fr; gap: 0.45rem; }
      .glyph { top: 10%; right: 2%; opacity: 0.055; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chapter { animation: none; }
      .meter-seg { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="app">
    <header class="chrome">
      <div class="brand">
        <span class="brand-mark">F7</span>
        <span>f7goods</span>
      </div>
      <div class="chrome-right">
        <span class="preview-tag">预览</span>
        <button type="button" class="skip-btn" id="skipBtn" hidden>跳过</button>
      </div>
    </header>

    <div class="meter" id="meter" hidden aria-hidden="true">
      <span class="meter-label" id="meterLabel">DAY 0</span>
      <div class="meter-track" id="meterTrack"></div>
    </div>

    <main class="scene" id="scene" role="main" aria-live="polite"></main>

    <footer class="foot">
      <button type="button" class="nav-btn" id="prevBtn" disabled>上一步</button>
      <div class="foot-center" id="footHint">点击画面或按钮继续</div>
      <button type="button" class="nav-btn next" id="nextBtn">开始</button>
    </footer>
  </div>

  <script>
    /**
     * 叙事核心（请按你们的真实史实微调年份与细节）：
     * 《永远的7日之都》服务器仍在运营，但内容更新已永久停止。
     * 玩家没有离开——同人创作、周边、企划与展会，成了这座城市真正的续章。
     * f7goods 是续章之一：让这些热爱被看见、被连接。
     */
    const CHAPTERS = [
      {
        id: 'cover',
        day: 'PROLOGUE',
        kicker: 'AFTER THE LAST PATCH',
        title: '服务器还在，\n故事却停在了那一天',
        paragraphs: [
          '《永远的7日之都》没有停服。城市仍亮着灯，你仍能登录，仍能走完那七日。',
          '只是——再也没有新的篇章了。官方更新永远停在了某一版。'
        ],
        aside: '预览稿 · 文案可替换。正式版可挂导航 /「关于我们」。',
        hint: '点击任意处开始',
        nextLabel: '翻开续章'
      },
      {
        id: 'd1',
        day: 'DAY 1',
        kicker: 'THE FREEZE',
        title: '断更，不是句号',
        paragraphs: [
          '停更那天，没有盛大的告别。公告像一页被轻轻合上的日志。',
          '对很多玩家来说，七都早已不只是游戏：它是角色、是回忆、是某段人生的背景音。城市没有关灯，只是不再写新的剧本。'
        ],
        aside: '情绪起点：不是哀悼停服，而是面对「永远断更」的沉默。',
        nextLabel: '第二日'
      },
      {
        id: 'd2',
        day: 'DAY 2',
        kicker: 'STILL HERE',
        title: '玩家没有离开',
        paragraphs: [
          '有人反复走完熟悉的剧情线，把语音存进收藏夹；有人在社交平台整理考据、翻译设定、剪辑混剪。',
          '热爱没有因为断更而蒸发。它只是换了一种活法——从「等待更新」，变成「自己接着写」。'
        ],
        aside: '玩家努力：考据、翻译、二创、音乐、手书、社群维护……',
        nextLabel: '第三日'
      },
      {
        id: 'd3',
        day: 'DAY 3',
        kicker: 'MADE BY HAND',
        title: '用双手，把角色留在人间',
        paragraphs: [
          '钥匙扣、徽章、立牌、同人志、曲绘、手书——创作者把自己喜欢的人，做成可以握在手里的东西。',
          '这些作品不来自官方版本号，却比任何补丁都更接近「活着的城市」。断更之后，更新由我们自己发布。'
        ],
        aside: '对应站点：周边作品 · 作者 / 社团',
        nextLabel: '第四日'
      },
      {
        id: 'd4',
        day: 'DAY 4',
        kicker: 'SCATTERED LIGHT',
        title: '热爱很亮，却散落各处',
        paragraphs: [
          '消息埋在群公告、会场传单和零散动态里。你想支持一位创作者，却常常找不到完整的作品列表。',
          '断更的城市不缺光，缺的是一张地图——告诉每一位指挥使：这里还有谁在创作，这里可以怎样被看见。'
        ],
        aside: '问题意识：发现成本高 · 信息碎片化 · 线下会场依赖口耳相传',
        nextLabel: '第五日'
      },
      {
        id: 'd5',
        day: 'DAY 5',
        kicker: 'F7GOODS',
        title: '于是有了 f7goods',
        paragraphs: [
          '我们做的不是卖场，是一份安静的场刊：把同人周边、社团、活动与企划，整理成可浏览、可筛选、可收藏的目录。',
          '心愿单帮你在开展前排好清单；ONLY 专场把摊位与商品串成动线。让认真的创作被找到，让热爱有处安放。'
        ],
        aside: '对应站点：首页市场 · 心愿单 · 活动 / 摊位 · 关注社团',
        nextLabel: '第六日'
      },
      {
        id: 'd6',
        day: 'DAY 6',
        kicker: 'THE CITY LIVES',
        title: '城市没有关灯',
        paragraphs: [
          '作者入驻、企划招募、会场见面——线上的目录，最终会变成线下的相逢。',
          '每一次「我想要」、每一次关注、每一次把清单导出塞进相册，都是在对这座城市说：我还在。'
        ],
        aside: '桥梁：创作者 ↔ 爱好者。f7goods 只是其中一座。',
        nextLabel: '第七日'
      },
      {
        id: 'd7',
        day: 'DAY 7',
        kicker: 'WE WRITE THE REST',
        title: '第七日之后，由我们续写',
        paragraphs: [
          '游戏里，七日之后是重置。这里，七日之后是继续。',
          '官方的故事停在了某一版；玩家的故事仍在每一次上架、每一次逛展、每一次转发里往下写。断更之后，我们就是续章。'
        ],
        end: true,
        nextLabel: '进入站内'
      }
    ];

    let index = 0;
    const scene = document.getElementById('scene');
    const meter = document.getElementById('meter');
    const meterTrack = document.getElementById('meterTrack');
    const meterLabel = document.getElementById('meterLabel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const skipBtn = document.getElementById('skipBtn');
    const footHint = document.getElementById('footHint');

    function glyphSvg(id) {
      const g = {
        cover: `<circle cx="50" cy="50" r="38" fill="none" stroke="#22201E" stroke-width="2"/><path d="M50 22v12" stroke="#D94F5C" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#D94F5C"/>`,
        d1: `<rect x="24" y="24" width="52" height="52" rx="4" fill="none" stroke="#22201E" stroke-width="2"/><path d="M34 50h32" stroke="#D94F5C" stroke-width="2" stroke-linecap="round"/>`,
        d2: `<circle cx="36" cy="42" r="10" fill="none" stroke="#22201E" stroke-width="2"/><circle cx="64" cy="42" r="10" fill="none" stroke="#22201E" stroke-width="2"/><path d="M22 74c6-12 18-18 28-18s22 6 28 18" fill="none" stroke="#D94F5C" stroke-width="2"/>`,
        d3: `<rect x="30" y="28" width="40" height="48" rx="4" fill="none" stroke="#22201E" stroke-width="2"/><path d="M40 42h20M40 52h20M40 62h12" stroke="#D94F5C" stroke-width="2" stroke-linecap="round"/>`,
        d4: `<circle cx="28" cy="36" r="4" fill="#22201E"/><circle cx="52" cy="28" r="4" fill="#22201E"/><circle cx="72" cy="44" r="4" fill="#22201E"/><circle cx="40" cy="58" r="4" fill="#D94F5C"/><circle cx="62" cy="68" r="4" fill="#22201E"/>`,
        d5: `<rect x="18" y="30" width="64" height="44" rx="4" fill="none" stroke="#22201E" stroke-width="2"/><path d="M18 42h64" stroke="#22201E" stroke-width="2"/><path d="M28 30v-6h44v6" stroke="#D94F5C" stroke-width="2"/>`,
        d6: `<path d="M20 70c10-24 50-24 60 0" fill="none" stroke="#22201E" stroke-width="2"/><circle cx="50" cy="38" r="10" fill="none" stroke="#D94F5C" stroke-width="2"/>`,
        d7: `<circle cx="50" cy="50" r="34" fill="none" stroke="#22201E" stroke-width="2" stroke-dasharray="5 9"/><circle cx="50" cy="50" r="7" fill="#D94F5C"/>`
      };
      return `<svg viewBox="0 0 100 100" aria-hidden="true">${g[id] || g.cover}</svg>`;
    }

    function buildMeter() {
      meterTrack.innerHTML = CHAPTERS.map((_, i) =>
        `<span class="meter-seg" data-i="${i}"></span>`
      ).join('');
    }

    function render(i) {
      const ch = CHAPTERS[i];
      const isCover = ch.id === 'cover';
      const isEnd = !!ch.end;
      const titleHtml = ch.title.replace(/\n/g, '<br>');

      scene.innerHTML = `
        <article class="chapter active" data-id="${ch.id}">
          <div class="glyph">${glyphSvg(ch.id)}</div>
          <div class="day-kicker">${ch.day} · ${ch.kicker}</div>
          <h1>${titleHtml}</h1>
          ${ch.paragraphs.map(p => `<p class="lead">${p}</p>`).join('')}
          ${ch.aside ? `<div class="aside">${ch.aside}</div>` : ''}
          ${isEnd ? `
            <div class="stat-row" aria-hidden="true">
              <div class="stat"><b>未停服</b><span>城市仍亮灯</span></div>
              <div class="stat"><b>永断更</b><span>官方不再更新</span></div>
              <div class="stat"><b>续章</b><span>由玩家书写</span></div>
            </div>
            <div class="end-row">
              <a class="btn-primary" href="/">逛逛同人周边</a>
              <a class="btn-ghost" href="/contact.html">了解 f7goods</a>
            </div>
          ` : ''}
          ${isCover ? `<p class="hint">点击任意处，或按 <kbd>空格</kbd> / <kbd>→</kbd> 推进</p>` : ''}
        </article>
      `;

      if (isCover) {
        meter.hidden = true;
        skipBtn.hidden = true;
      } else {
        meter.hidden = false;
        skipBtn.hidden = false;
        meterLabel.textContent = ch.day;
        [...meterTrack.children].forEach((seg, si) => {
          seg.classList.toggle('done', si + 1 < i);
          seg.classList.toggle('now', si + 1 === i);
        });
      }

      prevBtn.disabled = i === 0;
      nextBtn.textContent = ch.nextLabel || '下一步';
      if (isEnd) {
        nextBtn.onclick = () => { location.href = '/'; };
        footHint.textContent = '断更之后，故事仍在继续';
      } else {
        nextBtn.onclick = () => go(1);
        footHint.textContent = isCover ? '点击开始' : '点击画面或按钮继续';
      }
    }

    function go(delta) {
      const next = index + delta;
      if (next < 0 || next >= CHAPTERS.length) return;
      index = next;
      render(index);
    }

    buildMeter();
    render(0);

    document.getElementById('scene').addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return;
      if (index >= CHAPTERS.length - 1) return;
      go(1);
    });

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); go(-1); });
    skipBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      index = CHAPTERS.length - 1;
      render(index);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        if (e.target.closest('a, button, input, textarea')) return;
        e.preventDefault();
        if (index < CHAPTERS.length - 1) go(1);
        else location.href = '/';
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        go(-1);
      } else if (e.key === 'Escape') {
        location.href = '/';
      }
    });

    let touchX = null;
    window.addEventListener('touchstart', (e) => {
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) < 48) return;
      if (dx < 0 && index < CHAPTERS.length - 1) go(1);
      if (dx > 0) go(-1);
    }, { passive: true });
  </script>
</body>
</html>

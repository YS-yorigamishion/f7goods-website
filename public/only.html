      initPage('events', id);
      if (typeof mountAuthorCreateFab === 'function') mountAuthorCreateFab({ label: '我的摊位', tab: 'only-booths' });
      const root = document.getElementById('onlyRoot');
      try {
        await loadCategoriesFromAPI();
        const [event, works, circles] = await Promise.all([
          F7API.getEvent(id),
          F7API.getWorks(),
          F7API.getCircles()
        ]);
        if (event.type !== 'only') {
          root.innerHTML = `<div class="empty-state"><p>该活动不是 ONLY 专场</p><p style="margin-top:0.75rem;"><a href="/event-detail.html?id=${encodeURIComponent(id)}" class="detail-link">返回活动详情</a></p></div>`;
          return;
        }
        document.title = `${event.title} — ONLY | f7goods`;
        renderOnlyPage(event, works, circles);
      } catch (e) {
        console.error(e);
        root.innerHTML = `<div class="empty-state"><div class="icon">!</div><p>加载失败</p></div>`;
      }
    })();

    function parsePrice(p) {
      if (p == null) return 0;
      const s = String(p).replace(/[¥￥,，\s]/g, '');
      if (!s || /无料|免费|free/i.test(String(p))) return 0;
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }
    /** 未填/0 → 无料；有数字 → ¥xx */
    function formatPriceLabel(p) {
      if (p == null || String(p).trim() === '') return '无料';
      if (/无料|免费|free/i.test(String(p))) return '无料';
      const n = parsePrice(p);
      if (!n) return '无料';
      return money(n);
    }
    function money(n) {
      return (Number.isInteger(n) ? '¥' + n : '¥' + n.toFixed(2));
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function boothLabel(b) {
      return b.title ? `${b.code || ''} · ${b.title}` : (b.code || b.name || '摊位');
    }

    function tierGiftIds(t) {
      if (!t) return [];
      if (Array.isArray(t.giftWorkIds)) {
        const ids = t.giftWorkIds.filter(Boolean);
        if (ids.length) return ids;
      }
      return t.giftWorkId ? [t.giftWorkId] : [];
    }
    function tierHasGift(t) {
      return tierGiftIds(t).length > 0;
    }
    function tierGiftLabel(t) {
      const works = window._only?.relatedWorks || [];
      const names = tierGiftIds(t).map(id => works.find(w => w.id === id)?.title).filter(Boolean);
      return names.length ? names.join('、') : (t.text || '赠品');
    }

    function renderOnlyPage(event, works, circles) {
      const rootEl = document.getElementById('onlyRoot');
      const circleMap = {};
      circles.forEach(c => { circleMap[c.id] = c; });
      // Only works related to this event
      const relatedIds = new Set(event.relatedWorks || []);
      const relatedWorks = works.filter(w => relatedIds.has(w.id) && (!w.approvalStatus || w.approvalStatus === 'approved'));

      const boothsRaw = Array.isArray(event.booths) ? event.booths : [];
      const boothModels = boothsRaw.map((raw, idx) => {
        const code = raw.code || raw.name || '';
        const title = raw.title || '';
        const owners = (raw.circleIds || []).map(cid => circleMap[cid]).filter(Boolean);
        const ownerIds = new Set(owners.map(c => c.id));
        let goods = relatedWorks.filter(w => (w.circles || []).some(cid => ownerIds.has(cid)));
        // 摊位勾选了展示作品时，只展示勾选的
        if (Array.isArray(raw.workIds) && raw.workIds.length) {
          const sel = new Set(raw.workIds);
          goods = relatedWorks.filter(w => sel.has(w.id));
        }
        // Manual goods order from admin (goodsOrder)
        if (Array.isArray(raw.goodsOrder) && raw.goodsOrder.length) {
          const rank = new Map(raw.goodsOrder.map((id, i) => [id, i]));
          goods = goods.slice().sort((a, z) => {
            const ra = rank.has(a.id) ? rank.get(a.id) : Number.MAX_SAFE_INTEGER;
            const rz = rank.has(z.id) ? rank.get(z.id) : Number.MAX_SAFE_INTEGER;
            if (ra !== rz) return ra - rz;
            return String(a.title || '').localeCompare(String(z.title || ''));
          });
        }
        const promoTiers = Array.isArray(raw.promoTiers) ? raw.promoTiers.filter(t => t && (tierGiftIds(t).length || t.text)) : [];
        const logo = raw.logo || owners.find(o => o.logo)?.logo || '';
        const images = Array.isArray(raw.images) ? raw.images.filter(Boolean).map(String) : [];
        const description = String(raw.description || '');
        return {
          id: raw.id,
          code,
          title,
          logo,
          description,
          images,
          order: raw.order ?? idx,
          circleIds: raw.circleIds || [],
          owners,
          goods,
          goodsGroups: Array.isArray(raw.goodsGroups) ? raw.goodsGroups : [],
          claimConditions: (raw.claimConditions && typeof raw.claimConditions === 'object' && !Array.isArray(raw.claimConditions)) ? raw.claimConditions : {},
          promoTiers,
          promo: raw.promo || null
        };
      }).filter(b => b.code || b.title)
        .sort((a, z) => (a.order ?? 0) - (z.order ?? 0));

      // Unassigned: related works whose authors are not on any booth
      const assignedCircles = new Set();
      boothModels.forEach(b => (b.circleIds || []).forEach(id => assignedCircles.add(id)));
      const usedWorkIds = new Set();
      boothModels.forEach(b => b.goods.forEach(g => usedWorkIds.add(g.id)));
      const unassignedGoods = relatedWorks.filter(w => {
        if (usedWorkIds.has(w.id)) return false;
        const cs = w.circles || [];
        if (!cs.length) return true;
        return cs.some(cid => !assignedCircles.has(cid));
      });
      if (unassignedGoods.length) {
        boothModels.push({
          id: '_unassigned',
          code: '—',
          title: '未分摊',
          circleIds: [],
          owners: [],
          goods: unassignedGoods,
          promoTiers: [],
          promo: null
        });
      }

      const allGoodsN = relatedWorks.length;
      const ownerN = boothModels.reduce((s, b) => s + (b.owners?.length || 0), 0);

      rootEl.innerHTML = `
        <div class="only-hero">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
            <div>
              <div class="only-badge">ONLY · 专场</div>
              <h1>${esc(event.title)}</h1>
              <div class="only-meta">
                <span>📅 ${formatDate(event.date)}${event.endDate && event.endDate !== event.date ? ' ~ ' + formatDate(event.endDate) : ''}</span>
                <span>📍 ${esc(event.location || '')}</span>
              </div>
            </div>
            <a href="/event-detail.html?id=${encodeURIComponent(event.id)}" class="detail-link" style="font-size:12px;">活动详情 →</a>
          </div>
        </div>
        <div class="only-stats">
          <div class="only-stat"><b>${boothModels.length}</b><span>摊位</span></div>
          <div class="only-stat"><b>${ownerN}</b><span>参与摊主</span></div>
          <div class="only-stat"><b>${allGoodsN}</b><span>关联周边</span></div>
        </div>
        <div class="only-tabs" id="onlyTabs">
          <button type="button" class="on" data-t="all">全部摊位</button>
          <button type="button" data-t="goods">全部周边</button>
          <button type="button" data-t="owners">全部摊主</button>
          <button type="button" data-t="ov">活动概况</button>
        </div>
        <div id="onlyListPane"></div>
        <div id="onlyGoodsPane" style="display:none;"></div>
        <div id="onlyOwnersPane" style="display:none;"></div>
        <div id="onlyOvPane" style="display:none;">
          <div class="only-ov">
            <h4>整体情况</h4>
            ${esc(event.description || '暂无说明')}
            <div class="only-kv" style="margin-top:10px;">
              <div class="row"><span class="k">时间</span><span>${formatDate(event.date)}${event.endDate ? ' ~ ' + formatDate(event.endDate) : ''}</span></div>
              <div class="row"><span class="k">地点</span><span>${esc(event.location || '—')}</span></div>
              <div class="row"><span class="k">摊位数</span><span>${boothModels.length}</span></div>
              <div class="row"><span class="k">关联周边</span><span>${allGoodsN}</span></div>
            </div>
          </div>
        </div>
      `;

      window._only = { event, boothModels, relatedWorks, circleMap };
      window._onlyCart = loadOnlyCart(event.id);

      document.getElementById('onlyTabs').addEventListener('click', e => {
        const b = e.target.closest('button[data-t]');
        if (!b) return;
        document.querySelectorAll('#onlyTabs button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        renderOnlyBooths(b.dataset.t);
      });
      function bindOnlyPaneClicks(el) {
        if (!el) return;
        el.addEventListener('click', e => {
          const banner = e.target.closest('[data-banner]');
          if (banner) {
            e.preventDefault();
            e.stopPropagation();
            const boothId = banner.dataset.booth;
            const idx = Number(banner.dataset.banner) || 0;
            const booth = (window._only?.boothModels || []).find(b => b.id === boothId);
            if (booth && booth.images?.length && typeof openLightbox === 'function') {
              openLightbox(booth.images, idx);
            }
            return;
          }
          const bulk = e.target.closest('[data-bulk]');
          if (bulk) {
            e.preventDefault();
            e.stopPropagation();
            setOnlyBoothQty(bulk.dataset.booth, Number(bulk.dataset.bulk));
            return;
          }
          const claimBtn = e.target.closest('[data-claim]');
          if (claimBtn) {
            e.preventDefault();
            e.stopPropagation();
            openClaimDialog(claimBtn.dataset.claim);
            return;
          }
          const head = e.target.closest('[data-booth-toggle]');
          if (head && !e.target.closest('a,button,input,select,textarea')) {
            toggleOnlyBooth(head.dataset.boothToggle);
            return;
          }
          const add = e.target.closest('[data-add]');
          if (add) {
            e.preventDefault();
            e.stopPropagation();
            setOnlyQty(add.dataset.add, +1);
            return;
          }
          const dec = e.target.closest('[data-dec]');
          if (dec) {
            e.preventDefault();
            e.stopPropagation();
            setOnlyQty(dec.dataset.dec, -1);
            return;
          }
        });
      }
      bindOnlyPaneClicks(document.getElementById('onlyListPane'));
      bindOnlyPaneClicks(document.getElementById('onlyGoodsPane'));

      const claimOverlay = document.getElementById('claimOverlay');
      document.getElementById('claimClose').addEventListener('click', closeClaimDialog);
      claimOverlay.addEventListener('click', e => { if (e.target === claimOverlay) closeClaimDialog(); });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && claimOverlay.classList.contains('open')) closeClaimDialog();
      });

      renderOnlyBooths('all');
      renderOnlyCartUI();
      document.getElementById('onlyCartBar').style.display = 'flex';
      document.body.classList.add('has-only-cart');
      openOnlyBoothFromHash();
    }

    // 支持 #only-booth-<id> 直接展开并定位（作者后台「前台预览」用）
    function openOnlyBoothFromHash() {
      const hash = location.hash || '';
      if (!hash.startsWith('#only-booth-')) return;
      const boothId = decodeURIComponent(hash.slice('#only-booth-'.length));
      if (!boothId) return;
      if (!window._onlyOpenBooths) window._onlyOpenBooths = new Set();
      window._onlyOpenBooths.add(boothId);
      const el = document.getElementById('only-booth-' + boothId);
      if (el) {
        el.classList.add('open');
        setTimeout(() => {
          try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch { el.scrollIntoView(); }
        }, 80);
      }
    }

    function findClaimEntry(workId) {
      let hit = null;
      (window._only?.boothModels || []).forEach(b => {
        if (hit) return;
        const cond = String((b.claimConditions || {})[workId] || '').trim();
        if (!cond) return;
        hit = { cond, work: (b.goods || []).find(g => g.id === workId) };
      });
      return hit;
    }

    function openClaimDialog(workId) {
      const hit = findClaimEntry(workId);
      const overlay = document.getElementById('claimOverlay');
      if (!hit || !overlay) return;
      document.getElementById('claimWorkName').textContent = hit.work?.title || '';
      document.getElementById('claimText').textContent = hit.cond;
      overlay.classList.add('open');
    }

    function closeClaimDialog() {
      document.getElementById('claimOverlay')?.classList.remove('open');
    }

    function onlyGoodsIndex() {
      const idx = {};
      const booths = window._only?.boothModels || [];
      const related = window._only?.relatedWorks || [];
      related.forEach(g => {
        let booth = null;
        for (const b of booths) {
          if ((b.goods || []).some(x => x.id === g.id)) { booth = b; break; }
        }
        if (!booth) {
          booth = booths.find(b => b.id === '_unassigned') || {
            id: '_unassigned', code: '—', title: '未分摊',
            circleIds: [], owners: [], goods: [], claimConditions: {}, promoTiers: []
          };
        }
        idx[g.id] = { booth, work: g };
      });
      booths.forEach(b => {
        (b.goods || []).forEach(g => {
          if (!idx[g.id]) idx[g.id] = { booth: b, work: g };
        });
      });
      return idx;
    }

    function catLabel(catId) {
      const c = (typeof CATEGORIES_ORDERED !== 'undefined' ? CATEGORIES_ORDERED : []).find(x => x.id === catId);
      return c ? (c.name || c.id) : (catId || '');
    }

    function onlyFilteredGoods() {
      const f = window._onlyGoodsFilter || { cat: 'all', q: '' };
      let list = (window._only?.relatedWorks || []).slice();
      if (f.cat && f.cat !== 'all') list = list.filter(w => w.category === f.cat);
      const q = String(f.q || '').trim().toLowerCase();
      if (q) list = list.filter(w => String(w.title || '').toLowerCase().includes(q));
      return list;
    }

    function onlyGoodsCards(works, booth, cart) {
      if (!works.length) return `<div style="font-size:12px;color:var(--muted);padding:0.5rem 0;grid-column:1/-1;">暂无作品</div>`;
      return works.map(g => {
        const q = cart[g.id]?.qty || 0;
        const img = (g.images && g.images[0]) || '';
        const claim = String((booth?.claimConditions || {})[g.id] || '').trim();
        return `<a class="only-g${claim ? ' is-claim' : ''}" href="/work-detail.html?id=${esc(g.id)}" style="text-decoration:none;color:inherit;">
          <div class="img">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}</div>
          <div class="body">
            <div class="name">${esc(g.title)}</div>
            <div class="price">${esc(formatPriceLabel(g.price))}${claim ? `<button type="button" class="claim-chip" data-claim="${esc(g.id)}" aria-label="查看领取条件">条件领取<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg></button>` : ''}</div>
            <div class="only-qtyrow" data-work-qty="${esc(g.id)}">
              <button type="button" data-dec="${esc(g.id)}" ${q ? '' : 'disabled'}>−</button>
              <span class="q">${q}</span>
              <button type="button" data-add="${esc(g.id)}">+</button>
            </div>
          </div>
        </a>`;
      }).join('');
    }

    function boothGoodsSectionsHtml(booth, cart) {
      const groups = Array.isArray(booth.goodsGroups) ? booth.goodsGroups.filter(g => g && (g.name || (g.workIds || []).length)) : [];
      if (!groups.length) {
        return `<div class="only-sec">
          <div class="only-sec-label">周边</div>
          <div class="only-goods">${booth.goods.length ? onlyGoodsCards(booth.goods, booth, cart) : `<div style="font-size:12px;color:var(--muted);padding:0.5rem 0;grid-column:1/-1;">该摊位暂无关联本活动的周边</div>`}</div>
        </div>`;
      }
      const claimed = new Set();
      const sections = groups.map(g => {
        const ids = new Set(g.workIds || []);
        const works = booth.goods.filter(w => ids.has(w.id));
        works.forEach(w => claimed.add(w.id));
        return { name: String(g.name || '未命名').trim() || '未命名', works };
      });
      const rest = booth.goods.filter(w => !claimed.has(w.id));
      if (rest.length) sections.push({ name: '其他', works: rest });
      return sections.map(s => `
        <div class="only-sec">
          <div class="only-sec-label">${esc(s.name)}${s.works.length ? ` · ${s.works.length}` : ''}</div>
          <div class="only-goods">${s.works.length ? onlyGoodsCards(s.works, booth, cart) : `<div style="font-size:12px;color:var(--muted);padding:0.5rem 0;grid-column:1/-1;">本分类暂无作品</div>`}</div>
        </div>
      `).join('');
    }

    function renderOnlyGoodsGrid() {
      const grid = document.getElementById('onlyGoodsGrid');
      const countEl = document.getElementById('onlyGoodsCount');
      if (!grid) return;
      const cart = window._onlyCart || {};
      const list = onlyFilteredGoods();
      if (countEl) countEl.textContent = String(list.length);
      if (!list.length) {
        grid.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:1rem 0;grid-column:1/-1;text-align:center;">没有匹配的周边</div>`;
        return;
      }
      const idx = onlyGoodsIndex();
      grid.innerHTML = list.map(g => {
        const q = cart[g.id]?.qty || 0;
        const img = (g.images && g.images[0]) || '';
        const pack = idx[g.id];
        const claim = String((pack?.booth?.claimConditions || {})[g.id] || '').trim();
        const boothName = pack?.booth?.id === '_unassigned' ? '未分摊' : boothLabel(pack?.booth || { code: '—', title: '' });
        return `<a class="only-g${claim ? ' is-claim' : ''}" href="/work-detail.html?id=${esc(g.id)}" style="text-decoration:none;color:inherit;">
          <div class="img">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}</div>
          <div class="body">
            <div class="name">${esc(g.title)}</div>
            <div class="price">${esc(formatPriceLabel(g.price))}${claim ? `<button type="button" class="claim-chip" data-claim="${esc(g.id)}" aria-label="查看领取条件">条件领取<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg></button>` : ''}</div>
            <div class="only-g-booth">${esc(boothName)}</div>
            <div class="only-qtyrow" data-work-qty="${esc(g.id)}">
              <button type="button" data-dec="${esc(g.id)}" ${q ? '' : 'disabled'}>−</button>
              <span class="q">${q}</span>
              <button type="button" data-add="${esc(g.id)}">+</button>
            </div>
          </div>
        </a>`;
      }).join('');
    }

    function renderOnlyGoodsPane() {
      const pane = document.getElementById('onlyGoodsPane');
      if (!pane) return;
      if (!window._onlyGoodsFilter) window._onlyGoodsFilter = { cat: 'all', q: '' };
      const related = window._only?.relatedWorks || [];
      const cats = [];
      const seen = new Set();
      related.forEach(w => {
        if (w.category && !seen.has(w.category)) {
          seen.add(w.category);
          cats.push(w.category);
        }
      });
      cats.sort((a, z) => catLabel(a).localeCompare(catLabel(z), 'zh'));
      const f = window._onlyGoodsFilter;
      pane.innerHTML = `
        <div class="only-allgoods-bar">
          <div class="only-allgoods-cats">
            <button type="button" class="only-cat${f.cat === 'all' ? ' on' : ''}" data-cat="all">全部</button>
            ${cats.map(c => `<button type="button" class="only-cat${f.cat === c ? ' on' : ''}" data-cat="${esc(c)}">${esc(catLabel(c))}</button>`).join('')}
          </div>
          <input type="search" id="onlyGoodsSearch" class="only-allgoods-search" placeholder="搜索本活动周边…" value="${esc(f.q || '')}">
        </div>
        <div class="only-allgoods-meta">共 <b id="onlyGoodsCount">0</b> 件关联周边</div>
        <div class="only-goods" id="onlyGoodsGrid"></div>
      `;
      renderOnlyGoodsGrid();
      pane.querySelector('.only-allgoods-cats')?.addEventListener('click', e => {
        const btn = e.target.closest('[data-cat]');
        if (!btn) return;
        window._onlyGoodsFilter.cat = btn.dataset.cat;
        pane.querySelectorAll('.only-cat').forEach(x => x.classList.toggle('on', x.dataset.cat === btn.dataset.cat));
        renderOnlyGoodsGrid();
      });
      const search = document.getElementById('onlyGoodsSearch');
      search?.addEventListener('input', () => {
        window._onlyGoodsFilter.q = search.value;
        renderOnlyGoodsGrid();
      });
    }

    function onlyEventOwners() {
      const map = window._only?.circleMap || {};
      const related = window._only?.relatedWorks || [];
      const booths = window._only?.boothModels || [];
      const event = window._only?.event || {};
      const ids = new Set();
      booths.forEach(b => (b.circleIds || []).forEach(id => ids.add(id)));
      (event.relatedCircles || []).forEach(id => ids.add(id));
      const worksByCircle = {};
      related.forEach(w => {
        (w.circles || []).forEach(cid => {
          worksByCircle[cid] = (worksByCircle[cid] || 0) + 1;
        });
      });
      const boothNamesByCircle = {};
      booths.forEach(b => {
        if (b.id === '_unassigned') return;
        (b.circleIds || []).forEach(cid => {
          if (!boothNamesByCircle[cid]) boothNamesByCircle[cid] = [];
          boothNamesByCircle[cid].push(boothLabel(b));
        });
      });
      return [...ids]
        .map(id => map[id])
        .filter(Boolean)
        .map(c => ({
          ...c,
          workCount: worksByCircle[c.id] || 0,
          booths: boothNamesByCircle[c.id] || []
        }))
        .sort((a, z) => String(a.name || '').localeCompare(String(z.name || ''), 'zh'));
    }

    function renderOnlyOwnersPane() {
      const pane = document.getElementById('onlyOwnersPane');
      if (!pane) return;
      const owners = onlyEventOwners();
      if (!owners.length) {
        pane.innerHTML = `<div class="only-booth" style="color:var(--muted);font-size:13px;text-align:center;">暂无关联摊主</div>`;
        return;
      }
      pane.innerHTML = `
        <div class="only-allgoods-meta" style="margin-bottom:0.65rem;">共 <b>${owners.length}</b> 位关联摊主</div>
        <div class="only-owners-grid">
          ${owners.map(c => {
            const cover = c.cardCover || c.logo || '';
            return `
            <a class="only-owner-card" href="/circle-detail.html?id=${encodeURIComponent(c.id)}">
              <div class="only-owner-avatar">
                ${c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy">` : esc((c.name || '?').charAt(0))}
              </div>
              <div class="only-owner-body">

    function toggleOnlyBooth(boothId) {
      if (!window._onlyOpenBooths) window._onlyOpenBooths = new Set();

      else window._onlyOpenBooths.add(boothId);

    function loadOnlyCart(eventId) {
      try { return JSON.parse(localStorage.getItem('f7onlyCart:' + eventId) || '{}') || {}; }
      catch { return {}; }

    function saveOnlyCart(eventId, cart) {
      localStorage.setItem('f7onlyCart:' + eventId, JSON.stringify(cart));

    function setOnlyBoothQty(boothId, delta) {
      const booth = (window._only?.boothModels || []).find(b => b.id === boothId);
      if (!booth || !booth.goods?.length) return;
      const eventId = window._only.event.id;
      const cart = window._onlyCart || (window._onlyCart = {});
      const idx = onlyGoodsIndex();
      booth.goods.forEach(g => {
        const pack = idx[g.id];
        if (!pack) return;
        const cur = cart[g.id]?.qty || 0;
        const next = cur + delta;
        if (next <= 0) {
          delete cart[g.id];
        } else {
          cart[g.id] = {
            id: g.id,
            boothId: booth.id,
            boothName: boothLabel(booth),
            title: g.title,
            price: parsePrice(g.price),
            priceLabel: g.price,
            img: (g.images && g.images[0]) || '',
            qty: next,
            isGift: false,
            claim: String((booth.claimConditions || {})[g.id] || '').replace(/\s+/g, ' ').trim()
          };
        }
      });
      applyOnlyGifts();
      saveOnlyCart(eventId, cart);
      patchOnlyQtyUI(booth.goods.map(g => g.id));
      renderOnlyCartUI();
    }

    function setOnlyQty(workId, delta, skipRender) {
      const idx = onlyGoodsIndex();
      const pack = idx[workId];
      if (!pack || !window._only) return;
      const eventId = window._only.event.id;
      const cart = window._onlyCart || (window._onlyCart = {});
      const cur = cart[workId]?.qty || 0;
      const next = cur + delta;
      if (next <= 0) {
        delete cart[workId];
      } else {
        cart[workId] = {
          id: workId,
          boothId: pack.booth.id,
          boothName: boothLabel(pack.booth),
          title: pack.work.title,
          price: parsePrice(pack.work.price),
          priceLabel: pack.work.price,
          img: (pack.work.images && pack.work.images[0]) || '',
          qty: next,
          isGift: false,
          claim: String((pack.booth.claimConditions || {})[pack.work.id] || '').replace(/\s+/g, ' ').trim()
        };
      }
      applyOnlyGifts();
      saveOnlyCart(eventId, cart);
      if (skipRender) return;
      patchOnlyQtyUI([workId]);

    // Patch qty display in-place to avoid full list re-render flicker
    function patchOnlyQtyUI(workIds) {
      const cart = window._onlyCart || {};
      (workIds || []).forEach(workId => {
        const q = cart[workId]?.qty || 0;
        document.querySelectorAll('[data-work-qty="' + String(workId).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"]').forEach(row => {
          const qEl = row.querySelector('.q');
          const dec = row.querySelector('[data-dec]');
          if (qEl) qEl.textContent = q;
          if (dec) dec.disabled = !q;
        });
      });
    }

    // Auto attach gift items from multi-tier booth promos
    function applyOnlyGifts() {
      const cart = window._onlyCart || (window._onlyCart = {});
      // remove old gifts (dedicated keys)
      Object.keys(cart).forEach(k => {
        if (cart[k] && cart[k].isGift) delete cart[k];
      });
      const byBooth = {};
      const boothTouched = {};
      Object.values(cart).forEach(e => {
        if (e.isGift) return;
        // 该摊位有任意勾选（含条件领取）才算“逛过本摊”
        boothTouched[e.boothId] = true;
        // 条件领取的周边不计入满赠累计
        if (e.claim) return;
        byBooth[e.boothId] = (byBooth[e.boothId] || 0) + (e.price || 0) * e.qty;
      });
      (window._only?.boothModels || []).forEach(b => {
        // 未选购本摊任何周边时，不计入该摊赠品
        if (!boothTouched[b.id]) return;
        const tiers = (b.promoTiers || []).slice().sort((a, z) => (a.minAmount || 0) - (z.minAmount || 0));
        const spend = byBooth[b.id] || 0;
        const hit = tiers.filter(t => spend >= (t.minAmount || 0)).slice(-1)[0];
        if (!hit) return;
        const giftIds = tierGiftIds(hit);
        if (!giftIds.length) return;
        // One hit tier can unlock multiple gifts
        giftIds.forEach(giftWorkId => {
          const giftWork = (window._only?.relatedWorks || []).find(w => w.id === giftWorkId);
          if (!giftWork) return;
          const giftKey = 'gift:' + giftWorkId;
          cart[giftKey] = {
            id: giftKey,
            boothId: b.id,
            boothName: boothLabel(b),
            title: giftWork.title,
            price: 0,
            priceLabel: '赠品',
            img: (giftWork.images && giftWork.images[0]) || '',
            qty: 1,
            isGift: true
          };
        });
      });
    }

    function onlyCartStats() {
      const cart = window._onlyCart || {};
      let count = 0, total = 0, giftCount = 0;
      const byBooth = {};
      Object.values(cart).forEach(e => {
        count += e.qty;
        if (e.isGift) { giftCount += e.qty; return; }
        total += (e.price || 0) * e.qty;
        // 条件领取的周边计入合计，但不计入满赠累计
        if (e.claim) return;
        byBooth[e.boothId] = (byBooth[e.boothId] || 0) + (e.price || 0) * e.qty;
      });
      const gifts = Object.values(cart).filter(e => e.isGift);
      return { count, total, gifts, byBooth, giftCount };
    }

    function renderOnlyCartUI() {
      const { count, total, gifts } = onlyCartStats();
      const cEl = document.getElementById('ocCount');

      if (cEl) cEl.textContent = count;

          hint.textContent = '把要买的周边加进现场清单';
          hint.classList.remove('ok');

          hint.textContent = '已得赠品：' + gifts.map(g => g.title).join('、');
          hint.classList.add('ok');
        } else {
          const stats = onlyCartStats();
          const next = (window._only?.boothModels || []).find(b => {
            const tiers = (b.promoTiers || []).filter(t => tierHasGift(t));
            if (!tiers.length) return false;
            const need = tiers.find(t => (stats.byBooth[b.id] || 0) < (t.minAmount || 0));
            return !!need;
          });
          if (next) {
            const tiers = next.promoTiers.filter(t => tierHasGift(t)).sort((a,z)=>(a.minAmount||0)-(z.minAmount||0));
            const need = tiers.find(t => (stats.byBooth[next.id] || 0) < (t.minAmount || 0));
            if (need) {
              hint.textContent = `「${boothLabel(next)}」再买 ${money((need.minAmount||0) - (stats.byBooth[next.id]||0))} 可得赠品「${tierGiftLabel(need)}」`;
            } else {
              hint.textContent = '继续挑选';
            }
          } else {
            hint.textContent = '继续挑选';
          }
          hint.classList.remove('ok');
        }
      }
      renderOnlyCartDrawer();
    }

        ${gifts.map(g => `<div class="only-sumrow gift"><span>赠品 · ${esc(g.boothName)}</span><span>${esc(g.title)}</span></div>`).join('')}
        ${claims.map(c => `<div class="only-sumrow claim"><span>条件领取 · ${esc(c.boothName)}</span><span>${esc(c.title)}</span></div>`).join('')}
        <div class="only-sumrow total"><span>预估合计</span><span class="v">${money(total)}</span></div>

    // --- Receipt-style PNG export ---
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        const rr = Math.min(typeof r === 'number' ? r : (Array.isArray(r) ? r[0] : 0) || 0, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + rr, y);
        this.arcTo(x + w, y, x + w, y + h, rr);
        this.arcTo(x + w, y + h, x, y + h, rr);
        this.arcTo(x, y + h, x, y, rr);
        this.arcTo(x, y, x + w, y, rr);
        this.closePath();
        return this;
      };
    }
    function loadImg(src) {
      return new Promise(resolve => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }
    function resolveEntryImg(e) {
      if (e.img) return e.img;
      if (!e.isGift) {
        const pack = onlyGoodsIndex()[e.id];
        if (pack?.work?.images?.[0]) return pack.work.images[0];
      } else {
        const giftWork = (window._only?.relatedWorks || []).find(w => e.id === ('gift:' + w.id) || e.title === w.title);
        if (giftWork?.images?.[0]) return giftWork.images[0];
      }
      return '';
    }
    function dashLine(ctx, x1, x2, y, color = '#C9C2B6') {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.restore();
    }
    // receipt zigzag edge
    function zigzag(ctx, x, y, w, tooth = 8, flip = false) {
      ctx.save();
      ctx.fillStyle = '#FFFCF7';
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let i = 0; i < w / tooth; i++) {
        const px = x + i * tooth;
        const py = flip ? y - tooth * 0.55 : y + tooth * 0.55;
        ctx.lineTo(px + tooth / 2, py);
        ctx.lineTo(px + tooth, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    async function drawOnlyListPng() {
      const { count, total, gifts } = onlyCartStats();
      const event = window._only.event;
      const entries = Object.values(window._onlyCart || {});
      const claims = entries.filter(e => !e.isGift && e.claim);
      // 按摊位归并：右侧列出该摊位里条件领取的作品名（不打印条件文案）
      const claimLines = [];
      claims.forEach(e => {
        const row = claimLines.find(r => r.booth === e.boothName);
        if (row) {
          if (!row.titles.includes(e.title)) row.titles.push(e.title);
        } else {
          claimLines.push({ booth: e.boothName, titles: [e.title] });
        }
      });
      const imgs = await Promise.all(entries.map(e => loadImg(resolveEntryImg(e))));

      // receipt proportions — logical size, rendered at 2x for crisp export
      const LOGICAL_W = 480;
      const SCALE = 2;
      const padX = 28;
      const thumb = 44;
      const rowH = 58;
      const headerH = 118;
      const giftH = gifts.length * 24;
      const claimH = claimLines.length * 18;
      const footerH = 78;
      const bodyH = entries.length * rowH;
      const totalH = 64;
      const LOGICAL_H = Math.max(360, headerH + bodyH + totalH + giftH + claimH + footerH + 24);
      const W = LOGICAL_W;
      const H = LOGICAL_H;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(LOGICAL_W * SCALE);
      canvas.height = Math.round(LOGICAL_H * SCALE);
      const ctx = canvas.getContext('2d');
      ctx.scale(SCALE, SCALE);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // page backdrop (behind the paper)
      ctx.fillStyle = '#E8E2D6';
      ctx.fillRect(0, 0, W, H);
      // paper
      const paperX = 18, paperW = W - 36, paperY = 14, paperH = H - 28;
      ctx.fillStyle = '#FFFCF7';
      ctx.fillRect(paperX, paperY, paperW, paperH);
      // soft paper shadow edge
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.strokeRect(paperX + 0.5, paperY + 0.5, paperW - 1, paperH - 1);
      // torn edges
      zigzag(ctx, paperX, paperY, paperW, 7, false);
      zigzag(ctx, paperX, paperY + paperH, paperW, 7, true);

      const cx = paperX + paperW / 2;
      // accent hairline
      ctx.fillStyle = '#D94F5C';
      ctx.fillRect(paperX + 24, paperY + 18, paperW - 48, 2);

      // header
      ctx.textAlign = 'center';
      ctx.fillStyle = '#22201E';
      ctx.font = '700 18px "Noto Serif SC", Georgia, serif';
      ctx.fillText(event.title, cx, paperY + 48);
      ctx.font = '600 11px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#D94F5C';
      ctx.fillText('ONLY · 现场购物清单', cx, paperY + 68);
      ctx.font = '11px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#8A8078';
      const meta = `${formatDate(event.date)}${event.location ? ' · ' + event.location : ''}`;
      ctx.fillText(meta, cx, paperY + 86);
      ctx.fillText('————————  SHOPPING LIST  ————————', cx, paperY + 104);

      // items
      ctx.textAlign = 'left';
      let y = paperY + headerH;
      entries.forEach((e, i) => {
        const img = imgs[i];
        const rowTop = y;
        const thumbY = rowTop + 6;
        const textX = padX + thumb + 12;

        // thumbnail
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(paperX + padX, thumbY, thumb, thumb, 6);
        ctx.clip();
        if (img) {
          // cover-fit
          const s = Math.max(thumb / img.width, thumb / img.height);
          const dw = img.width * s, dh = img.height * s;
          ctx.drawImage(img, paperX + padX + (thumb - dw) / 2, thumbY + (thumb - dh) / 2, dw, dh);
        } else {
          ctx.fillStyle = '#EDE6DA';
          ctx.fillRect(paperX + padX, thumbY, thumb, thumb);
          ctx.fillStyle = '#B0A89C';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('—', paperX + padX + thumb / 2, thumbY + thumb / 2 + 4);
          ctx.textAlign = 'left';
        }
        ctx.restore();
        // thumb border
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(paperX + padX + 0.5, thumbY + 0.5, thumb - 1, thumb - 1, 6);
        ctx.stroke();

        // title (truncate)
        const title = e.title.length > 16 ? e.title.slice(0, 15) + '…' : e.title;
        ctx.fillStyle = '#22201E';
        ctx.font = '600 13px "Noto Sans SC", sans-serif';
        ctx.fillText(title, paperX + textX, rowTop + 22);

        // booth + qty
        ctx.font = '11px "Noto Sans SC", sans-serif';
        ctx.fillStyle = '#8A8078';
        const booth = e.boothName.length > 14 ? e.boothName.slice(0, 13) + '…' : e.boothName;
        ctx.fillText(`${booth}${e.isGift ? ' · 赠品' : ''}${(!e.isGift && e.claim) ? ' · 条件领取' : ''} ×${e.qty}`, paperX + textX, rowTop + 40);

        // amount
        const right = (e.isGift || e.price === 0) ? '—' : money(e.price * e.qty);
        ctx.textAlign = 'right';
        ctx.font = e.isGift ? '12px "Noto Sans SC", sans-serif' : '600 13px "Noto Sans SC", sans-serif';
        ctx.fillStyle = e.isGift ? '#3D8B6E' : '#22201E';
        ctx.fillText(right, paperX + paperW - padX, rowTop + 28);
        ctx.textAlign = 'left';

        // dashed separator
        dashLine(ctx, paperX + padX, paperX + paperW - padX, rowTop + rowH - 2);
        y += rowH;
      });

      // totals
      y += 10;
      ctx.font = '12px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#8A8078';
      ctx.fillText(`件数  ${count}`, paperX + padX, y);
      ctx.textAlign = 'right';
      ctx.fillText('不含赠品', paperX + paperW - padX, y);
      ctx.textAlign = 'left';
      y += 22;
      ctx.font = '700 16px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#22201E';
      ctx.fillText('合计', paperX + padX, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#D94F5C';
      ctx.fillText(money(total), paperX + paperW - padX, y);
      ctx.textAlign = 'left';

      // gifts
      if (gifts.length) {
        y += 18;
        dashLine(ctx, paperX + padX, paperX + paperW - padX, y);
        y += 18;
        gifts.forEach(g => {
          ctx.fillStyle = '#3D8B6E';
          ctx.font = '11px "Noto Sans SC", sans-serif';
          const gTitle = g.title.length > 18 ? g.title.slice(0, 17) + '…' : g.title;
          ctx.fillText(`★ 赠品 ${g.boothName}`, paperX + padX, y);
          ctx.textAlign = 'right';
          ctx.fillText(gTitle, paperX + paperW - padX, y);
          ctx.textAlign = 'left';
          y += 18;
        });
      }

      // 条件领取备注（同一摊位一行：左侧摊位，右侧作品名；不打印条件文案）
      if (claimLines.length) {
        y += 18;
        dashLine(ctx, paperX + padX, paperX + paperW - padX, y);
        y += 18;
        const usable = paperW - padX * 2;
        ctx.font = '11px "Noto Sans SC", sans-serif';
        const fit = (txt, maxW) => {
          if (ctx.measureText(txt).width <= maxW) return txt;
          let s = txt;
          while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
          return s + '…';
        };
        claimLines.forEach(row => {
          ctx.fillStyle = '#C48A2A';
          const leftTxt = fit(`※ 条件领取(不计入满赠) ${row.booth}`, usable * 0.68);
          ctx.fillText(leftTxt, paperX + padX, y);
          const rightX = paperX + paperW - padX;
          const avail = rightX - (paperX + padX + ctx.measureText(leftTxt).width) - 14;
          if (avail > 28) {
            ctx.textAlign = 'right';
            ctx.fillText(fit(row.titles.join('、'), avail), rightX, y);
            ctx.textAlign = 'left';
          }
          y += 18;
        });
      }

      // footer
      const footY = paperY + paperH - 36;
      dashLine(ctx, paperX + padX, paperX + paperW - padX, footY - 14);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#8A8078';
      ctx.font = '11px "Noto Sans SC", sans-serif';
      ctx.fillText('谢谢惠顾 · f7goods.com', cx, footY);
      ctx.font = '10px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#B0A89C';
      ctx.fillText('仅供现场对单，非支付凭证', cx, footY + 16);
      return canvas;
    }

    document.getElementById('ocShot').addEventListener('click', async () => {
      const { count } = onlyCartStats();
      if (!count) { showToast('清单是空的', 'error'); return; }
      try {
        const canvas = await drawOnlyListPng();
        const event = window._only.event;
        canvas.toBlob(blob => {
          if (!blob) { showToast('导出失败', 'error'); return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `only-list-${event.id}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
          showToast('已导出图片清单');
        }, 'image/png');
      } catch (e) {
        console.error(e);
        showToast('导出失败，已改为复制文本', 'error');
        try { navigator.clipboard.writeText(onlyListText()); } catch {}
      }
    });
  </script>
</body>
</html>

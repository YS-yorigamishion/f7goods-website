<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>f7goods — ONLY 专场</title>
  <meta name="description" content="同人 ONLY 专场：摊位参与情况、周边清单、现场购物清单与赠品优惠。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css?v=20260910o">
  <style>
    .only-wrap { max-width: 960px; margin: 0 auto; }
    .only-hero {
      background:
        radial-gradient(700px 200px at 8% 0, rgba(217,79,92,.07), transparent 55%),
        var(--card);
      border: 1px solid var(--line);
      border-top: 2px solid var(--accent);
      border-radius: 16px;
      padding: 1.15rem 1.15rem 1rem;
      margin-bottom: 1rem;
    }
    .only-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; letter-spacing: .1em;
      background: rgba(217,79,92,.1); color: var(--accent);
      padding: 2px 10px; border-radius: 999px; margin-bottom: 8px;
    }
    .only-hero h1 {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: clamp(1.35rem, 3vw, 1.8rem); font-weight: 600;
      margin: 0 0 6px; line-height: 1.25;
    }
    .only-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; }
    .only-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem;
    }
    @media (max-width: 640px) { .only-stats { grid-template-columns: repeat(3, 1fr); } }
    .only-stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 8px; text-align: center;
    }
    .only-stat b { display: block; font-size: 1.3rem; color: var(--accent); font-weight: 700; line-height: 1.2; }
    .only-stat span { font-size: 11px; color: var(--muted); }
    .only-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 0.85rem; }
    .only-tabs button {
      border: 1px solid var(--line); background: var(--card); color: var(--muted);
      border-radius: 999px; padding: 7px 13px; font-size: 12px; cursor: pointer; font-family: inherit;
    }
    .only-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .only-booth {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 10px;
    }
    .only-booth-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .only-avatar {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(145deg,#EDE6DA,#D9D0C2);
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .only-booth-head .info { flex: 1; min-width: 0; }
    .only-booth-head h3 { margin: 0 0 2px; font-size: 0.95rem; font-weight: 600; }
    .only-booth-head .sub { font-size: 11px; color: var(--muted); }
    .only-goods { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
    .only-g {
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper);
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      transition: border-color 0.15s ease;
    }
    .only-g:hover { border-color: var(--accent); }
    .only-g .img {
      height: 72px; background: linear-gradient(160deg,#EDE6DA,#E2D9CB);
      display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted);
    }
    .only-g .img img { width: 100%; height: 100%; object-fit: cover; }
    .only-g .body { padding: 8px; display: flex; flex-direction: column; flex: 1; }
    .only-g .name {
      font-size: 12px; font-weight: 600; line-height: 1.35; margin-bottom: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .only-g .price { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .only-qtyrow { display: flex; align-items: center; gap: 6px; margin-top: auto; }
    .only-qtyrow button {
      width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); cursor: pointer; font-size: 14px; line-height: 1; color: var(--ink);
      font-family: inherit;
    }
    .only-qtyrow button:hover { border-color: var(--accent); color: var(--accent); }
    .only-qtyrow button:disabled { opacity: .35; cursor: default; }
    .only-qtyrow .q { min-width: 18px; text-align: center; font-size: 12px; font-weight: 600; }
    .only-qtyrow .add {
      margin-left: auto; border: 1px solid var(--accent); background: transparent;
      color: var(--accent); border-radius: 999px; padding: 5px 10px; font-size: 11px;
      cursor: pointer; font-family: inherit; width: auto; height: auto;
    }
    .only-qtyrow .add.in { background: var(--accent); color: #fff; }
    .only-promo-box {
      background: rgba(61,139,110,.06); border: 1px solid rgba(61,139,110,.2);
      border-radius: 10px; padding: 8px 10px; margin-top: 8px; font-size: 11.5px; color: #2f6b55;
      line-height: 1.55;
    }
    .only-promo-box b { color: var(--success); }
    .only-ov {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; font-size: 13px; line-height: 1.75; color: #4A453F; margin-bottom: 10px;
    }
    .only-ov h4 { font-size: 12px; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
    .only-kv .row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 3px 0; }
    .only-kv .k { color: var(--muted); }
    .only-cartbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1105;
      background: var(--card); border-top: 2px solid var(--accent);
      padding: 10px 14px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 -4px 16px rgba(0,0,0,.06);
    }
    .only-cartbar .l { flex: 1; min-width: 0; font-size: 12.5px; text-align: center; }
    .only-cartbar .l b { color: var(--accent); }
    .only-cartbar .hintline { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .only-cartbar .hintline.ok { color: var(--success); font-weight: 600; }
    .only-cartbar .barbtns { display: flex; gap: 8px; flex-shrink: 0; }
    .only-cartbar button {
      border: none; background: var(--accent); color: #fff; border-radius: 999px;
      padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .only-cartbar button.ghost {
      background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500;
    }
    .only-overlay {
      position: fixed; inset: 0; background: rgba(34,32,30,.4); z-index: 1200;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .only-overlay.open { display: flex; }
    .only-drawer {
      background: var(--card); width: min(480px, 100%); max-height: 82vh;
      border-radius: 16px; padding: 18px 16px 20px; overflow-y: auto;
      box-shadow: 0 18px 40px rgba(0,0,0,.14);
    }
    .only-drawer h3 {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.05rem; margin: 0 0 12px; text-align: center;
    }
    .only-drawer .closebtn {
      position: absolute; top: 10px; right: 12px; background: none; border: none;
      font-size: 18px; cursor: pointer; color: var(--muted); line-height: 1;
    }
    .only-drawer-wrap { position: relative; }
    .only-ci {
      display: flex; gap: 10px; align-items: center; padding: 10px 0;
      border-bottom: 1px solid var(--line); font-size: 13px;
    }
    .only-ci .n { flex: 1; min-width: 0; text-align: left; }
    .only-ci .n small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .only-ci .gift-tag {
      display: inline-block; font-size: 10px; background: rgba(61,139,110,.12);
      color: var(--success); border-radius: 999px; padding: 1px 6px; margin-left: 4px;
    }
    .only-qty { display: flex; align-items: center; gap: 6px; }
    .only-qty button {
      width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); cursor: pointer; font-size: 14px;
    }
    .only-empty { color: var(--muted); font-size: 12.5px; padding: 24px 0; text-align: center; }
    .only-sumrow { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; }
    .only-sumrow.total {
      font-weight: 700; font-size: 15px; border-top: 1px solid var(--line);
      margin-top: 6px; padding-top: 10px;
    }
    .only-sumrow.total .v { color: var(--accent); }
    .only-sumrow.gift { color: var(--success); font-size: 12px; }
    .only-drawer .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .only-drawer .go {
      width: 100%; border: none; background: var(--accent); color: #fff;
      border-radius: 999px; padding: 12px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .only-drawer .go.alt {
      background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500;
    }
    #onlyShotCanvasWrap { display: none; }
    .only-screenshot {
      width: 420px; background: #F6F2EB; color: #22201E; padding: 18px 16px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .only-screenshot h2 {
      font-family: 'Noto Serif SC', Georgia, serif; font-size: 1.1rem; margin: 0 0 4px;
      text-align: center;
    }
    .only-screenshot .sh-meta { font-size: 11px; color: #8A8078; margin-bottom: 10px; text-align: center; }
    .only-screenshot .sh-line {
      display: flex; justify-content: space-between; gap: 8px; font-size: 12px;
      padding: 4px 0; border-bottom: 1px solid #E5DDD1;
    }
    .only-screenshot .sh-total {
      display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px; font-size: 13px;
    }
    .only-screenshot .sh-gift { font-size: 11px; color: #3D8B6E; margin-top: 6px; }
    .only-screenshot .sh-foot { font-size: 10px; color: #8A8078; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <main class="main-content detail-page">
    <div class="only-wrap" id="onlyRoot">
      <div style="padding:2rem;color:var(--muted);font-size:13px;text-align:center;">加载中…</div>
    </div>
  </main>
  <footer class="footer" id="footer"></footer>

  <div class="only-cartbar" id="onlyCartBar" style="display:none;">
    <div class="l">
      <div>清单 <b id="ocCount">0</b> 件 · <b id="ocTotal">¥0</b></div>
      <div class="hintline" id="ocHint"></div>
    </div>
    <div class="barbtns">
      <button type="button" class="ghost" id="ocOpen">清单</button>
    </div>
  </div>
  <div class="only-overlay" id="onlyOverlay">
    <div class="only-drawer only-drawer-wrap">
      <button type="button" class="closebtn" id="ocClose">×</button>
      <h3>现场购物清单</h3>
      <div id="ocList"></div>
      <div id="ocSum"></div>
      <div class="actions">
        <button type="button" class="go" id="ocShot">导出图片清单</button>
        <button type="button" class="go alt" id="ocCopy">复制文本清单</button>
        <button type="button" class="go alt" id="ocClear">一键清空</button>
      </div>
    </div>
  </div>
  <div id="onlyShotCanvasWrap"></div>

  <script src="/js/api.js"></script>
  <script src="/js/main.js?v=20260910o"></script>
  <script>
    (async function bootOnly() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { location.href = '/events.html'; return; }
      initPage('events', id);
      const root = document.getElementById('onlyRoot');
      try {
        await loadCategoriesFromAPI();
        const [event, works, circles] = await Promise.all([
          F7API.getEvent(id),
          F7API.getWorks(),
          F7API.getCircles()
        ]);
        if (event.type !== 'only') {
          root.innerHTML = `<div class="empty-state"><p>该活动不是 ONLY 专场</p><p style="margin-top:0.75rem;"><a href="/event-detail.html?id=${encodeURIComponent(id)}" class="detail-link">返回活动详情</a></p></div>`;
          return;
        }
        document.title = `${event.title} — ONLY | f7goods`;
        renderOnlyPage(event, works, circles);
      } catch (e) {
        console.error(e);
        root.innerHTML = `<div class="empty-state"><div class="icon">!</div><p>加载失败</p></div>`;
      }
    })();

    function parsePrice(p) {
      if (p == null) return 0;
      const s = String(p).replace(/[¥￥,，\s]/g, '');
      if (!s || /无料|免费|free/i.test(String(p))) return 0;
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }
    function money(n) {
      return (Number.isInteger(n) ? '¥' + n : '¥' + n.toFixed(2));
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function boothLabel(b) {
      return b.title ? `${b.code || ''} · ${b.title}` : (b.code || b.name || '摊位');
    }

    function renderOnlyPage(event, works, circles) {
      const rootEl = document.getElementById('onlyRoot');
      const circleMap = {};
      circles.forEach(c => { circleMap[c.id] = c; });
      // Only works related to this event
      const relatedIds = new Set(event.relatedWorks || []);
      const relatedWorks = works.filter(w => relatedIds.has(w.id) && (!w.approvalStatus || w.approvalStatus === 'approved'));

      const boothsRaw = Array.isArray(event.booths) ? event.booths : [];
      const boothModels = boothsRaw.map((raw, idx) => {
        const code = raw.code || raw.name || '';
        const title = raw.title || '';
        const owners = (raw.circleIds || []).map(cid => circleMap[cid]).filter(Boolean);
        const ownerIds = new Set(owners.map(c => c.id));
        const goods = relatedWorks.filter(w => (w.circles || []).some(cid => ownerIds.has(cid)));
        const promoTiers = Array.isArray(raw.promoTiers) ? raw.promoTiers.filter(t => t && (t.giftWorkId || t.text)) : [];
        const logo = raw.logo || owners.find(o => o.logo)?.logo || '';
        return {
          id: raw.id,
          code,
          title,
          logo,
          order: raw.order ?? idx,
          circleIds: raw.circleIds || [],
          owners,
          goods,
          promoTiers,
          promo: raw.promo || null
        };
      }).filter(b => b.code || b.title)
        .sort((a, z) => (a.order ?? 0) - (z.order ?? 0));

      // Unassigned: related works whose authors are not on any booth
      const assignedCircles = new Set();
      boothModels.forEach(b => (b.circleIds || []).forEach(id => assignedCircles.add(id)));
      const usedWorkIds = new Set();
      boothModels.forEach(b => b.goods.forEach(g => usedWorkIds.add(g.id)));
      const unassignedGoods = relatedWorks.filter(w => {
        if (usedWorkIds.has(w.id)) return false;
        const cs = w.circles || [];
        if (!cs.length) return true;
        return cs.some(cid => !assignedCircles.has(cid));
      });
      if (unassignedGoods.length) {
        boothModels.push({
          id: '_unassigned',
          code: '—',
          title: '未分摊',
          circleIds: [],
          owners: [],
          goods: unassignedGoods,
          promoTiers: [],
          promo: null
        });
      }

      const allGoodsN = relatedWorks.length;
      const ownerN = boothModels.reduce((s, b) => s + (b.owners?.length || 0), 0);

      rootEl.innerHTML = `
        <div class="only-hero">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;">
            <div>
              <div class="only-badge">ONLY · 专场</div>
              <h1>${esc(event.title)}</h1>
              <div class="only-meta">
                <span>📅 ${formatDate(event.date)}${event.endDate && event.endDate !== event.date ? ' ~ ' + formatDate(event.endDate) : ''}</span>
                <span>📍 ${esc(event.location || '')}</span>
              </div>
            </div>
            <a href="/event-detail.html?id=${encodeURIComponent(event.id)}" class="detail-link" style="font-size:12px;">活动详情 →</a>
          </div>
        </div>
        <div class="only-stats">
          <div class="only-stat"><b>${boothModels.length}</b><span>摊位</span></div>
          <div class="only-stat"><b>${ownerN}</b><span>参与摊主</span></div>
          <div class="only-stat"><b>${allGoodsN}</b><span>关联周边</span></div>
        </div>
        <div class="only-tabs" id="onlyTabs">
          <button type="button" class="on" data-t="all">全部摊位</button>
          <button type="button" data-t="ov">活动概况</button>
        </div>
        <div id="onlyListPane"></div>
        <div id="onlyOvPane" style="display:none;">
          <div class="only-ov">
            <h4>整体情况</h4>
            ${esc(event.description || '暂无说明')}
            <div class="only-kv" style="margin-top:10px;">
              <div class="row"><span class="k">时间</span><span>${formatDate(event.date)}${event.endDate ? ' ~ ' + formatDate(event.endDate) : ''}</span></div>
              <div class="row"><span class="k">地点</span><span>${esc(event.location || '—')}</span></div>
              <div class="row"><span class="k">摊位数</span><span>${boothModels.length}</span></div>
              <div class="row"><span class="k">关联周边</span><span>${allGoodsN}</span></div>
            </div>
          </div>
        </div>
      `;

      window._only = { event, boothModels, relatedWorks };
      window._onlyCart = loadOnlyCart(event.id);

      document.getElementById('onlyTabs').addEventListener('click', e => {
        const b = e.target.closest('button[data-t]');
        if (!b) return;
        document.querySelectorAll('#onlyTabs button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        renderOnlyBooths(b.dataset.t);
      });
      document.getElementById('onlyListPane').addEventListener('click', e => {
        const add = e.target.closest('[data-add]');
        if (add) { setOnlyQty(add.dataset.add, +1); return; }
        const dec = e.target.closest('[data-dec]');
        if (dec) { setOnlyQty(dec.dataset.dec, -1); return; }
      });

      renderOnlyBooths('all');
      renderOnlyCartUI();
      document.getElementById('onlyCartBar').style.display = 'flex';
    }

    function onlyGoodsIndex() {
      const idx = {};
      (window._only?.boothModels || []).forEach(b => {
        b.goods.forEach(g => { idx[g.id] = { booth: b, work: g }; });
      });
      return idx;
    }

    function renderOnlyBooths(filter) {
      const listPane = document.getElementById('onlyListPane');
      const ovPane = document.getElementById('onlyOvPane');
      if (!listPane) return;
      if (filter === 'ov') {
        listPane.style.display = 'none';
        ovPane.style.display = 'block';
        return;
      }
      listPane.style.display = 'block';
      ovPane.style.display = 'none';
      const booths = window._only?.boothModels || [];
      if (!booths.length) {
        listPane.innerHTML = `<div class="only-booth" style="color:var(--muted);font-size:13px;text-align:center;">暂无摊位，请在后台「摊位管理」配置。</div>`;
        return;
      }
      const cart = window._onlyCart || {};
      listPane.innerHTML = booths.map(b => {
        const ownerNames = (b.owners || []).map(c => esc(c.name)).join('、');
        const tiers = b.promoTiers || [];
        return `
          <div class="only-booth">
            <div class="only-booth-head">
              <div class="only-avatar">${b.logo ? `<img src="${esc(b.logo)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">` : esc((b.code || ownerNames || '?').slice(0,1))}</div>
              <div class="info">
                <h3>${esc(boothLabel(b))}</h3>
                <div class="sub">${ownerNames || '未挂接作者'} · ${b.goods.length} 件关联周边</div>
              </div>
            </div>
            <div class="only-goods">
              ${b.goods.length ? b.goods.map(g => {
                const q = cart[g.id]?.qty || 0;
                const img = (g.images && g.images[0]) || '';
                return `<a class="only-g" href="/work-detail.html?id=${esc(g.id)}" style="text-decoration:none;color:inherit;">
                  <div class="img">${img ? `<img src="${esc(img)}" alt="">` : (parsePrice(g.price) === 0 ? '无料' : '周边')}</div>
                  <div class="body">
                    <div class="name">${esc(g.title)}</div>
                    <div class="price">${parsePrice(g.price) === 0 ? (g.price || '无料') : money(parsePrice(g.price))}</div>
                    <div class="only-qtyrow" onclick="event.preventDefault();event.stopPropagation();">
                      <button type="button" data-dec="${esc(g.id)}" ${q ? '' : 'disabled'}>−</button>
                      <span class="q">${q}</span>
                      <button type="button" data-add="${esc(g.id)}">+</button>
                    </div>
                  </div>
                </a>`;
              }).join('') : `<div style="font-size:12px;color:var(--muted);padding:0.5rem 0;">该摊位暂无关联本活动的周边</div>`}
            </div>
            ${tiers.length ? `<div class="only-promo-box">${tiers.map(t => {
              const gift = t.giftWorkId ? (window._only?.relatedWorks || []).find(w => w.id === t.giftWorkId) : null;
              const giftName = gift ? gift.title : (t.text || '赠品');
              return `满 <b>${money(t.minAmount || 0)}</b> 送「${esc(giftName)}」`;
            }).join('<br>')}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function loadOnlyCart(eventId) {
      try { return JSON.parse(localStorage.getItem('f7onlyCart:' + eventId) || '{}') || {}; }
      catch { return {}; }
    }
    function saveOnlyCart(eventId, cart) {
      localStorage.setItem('f7onlyCart:' + eventId, JSON.stringify(cart));
    }

    function setOnlyQty(workId, delta) {
      const idx = onlyGoodsIndex();
      const pack = idx[workId];
      if (!pack || !window._only) return;
      const eventId = window._only.event.id;
      const cart = window._onlyCart || (window._onlyCart = {});
      const cur = cart[workId]?.qty || 0;
      const next = cur + delta;
      if (next <= 0) {
        delete cart[workId];
      } else {
        cart[workId] = {
          id: workId,
          boothId: pack.booth.id,
          boothName: boothLabel(pack.booth),
          title: pack.work.title,
          price: parsePrice(pack.work.price),
          priceLabel: pack.work.price,
          qty: next,
          isGift: false
        };
      }
      saveOnlyCart(eventId, cart);
      applyOnlyGifts();
      saveOnlyCart(eventId, cart);
      const tab = document.querySelector('#onlyTabs button.on')?.dataset.t || 'all';
      renderOnlyBooths(tab);
      renderOnlyCartUI();
    }

    // Auto attach gift items from multi-tier booth promos
    function applyOnlyGifts() {
      const cart = window._onlyCart || (window._onlyCart = {});
      // remove old gifts
      Object.keys(cart).forEach(k => { if (cart[k] && cart[k].isGift) delete cart[k]; });
      const byBooth = {};
      Object.values(cart).forEach(e => {
        if (e.isGift) return;
        byBooth[e.boothId] = (byBooth[e.boothId] || 0) + (e.price || 0) * e.qty;
      });
      (window._only?.boothModels || []).forEach(b => {
        const tiers = (b.promoTiers || []).slice().sort((a, z) => (a.minAmount || 0) - (z.minAmount || 0));
        const spend = byBooth[b.id] || 0;
        const hit = tiers.filter(t => spend >= (t.minAmount || 0)).slice(-1)[0];
        if (!hit || !hit.giftWorkId) return;
        if (cart[hit.giftWorkId] && !cart[hit.giftWorkId].isGift) return; // already in cart as normal
        const giftWork = (window._only?.relatedWorks || []).find(w => w.id === hit.giftWorkId);
        if (!giftWork) return;
        cart[hit.giftWorkId] = {
          id: hit.giftWorkId,
          boothId: b.id,
          boothName: boothLabel(b),
          title: giftWork.title,
          price: 0,
          priceLabel: giftWork.price || '赠品',
          qty: 1,
          isGift: true
        };
      });
    }

    function onlyCartStats() {
      const cart = window._onlyCart || {};
      let count = 0, total = 0, giftCount = 0;
      const byBooth = {};
      Object.values(cart).forEach(e => {
        count += e.qty;
        if (e.isGift) { giftCount += e.qty; return; }
        total += (e.price || 0) * e.qty;
        byBooth[e.boothId] = (byBooth[e.boothId] || 0) + (e.price || 0) * e.qty;
      });
      const gifts = Object.values(cart).filter(e => e.isGift);
      return { count, total, gifts, byBooth, giftCount };
    }

    function renderOnlyCartUI() {
      const { count, total, gifts } = onlyCartStats();
      const cEl = document.getElementById('ocCount');
      const tEl = document.getElementById('ocTotal');
      const hint = document.getElementById('ocHint');
      if (cEl) cEl.textContent = count;
      if (tEl) tEl.textContent = money(total);
      if (hint) {
        if (!count) {
          hint.textContent = '把要买的周边加进现场清单';
          hint.classList.remove('ok');
        } else if (gifts.length) {
          hint.textContent = '已得赠品：' + gifts.map(g => g.title).join('、');
          hint.classList.add('ok');
        } else {
          const stats = onlyCartStats();
          const next = (window._only?.boothModels || []).find(b => {
            const tiers = (b.promoTiers || []).filter(t => t.giftWorkId);
            if (!tiers.length) return false;
            const need = tiers.find(t => (stats.byBooth[b.id] || 0) < (t.minAmount || 0));
            return !!need;
          });
          if (next) {
            const tiers = next.promoTiers.filter(t => t.giftWorkId).sort((a,z)=>(a.minAmount||0)-(z.minAmount||0));
            const need = tiers.find(t => (stats.byBooth[next.id] || 0) < (t.minAmount || 0));
            if (need) {
              const giftWork = (window._only?.relatedWorks || []).find(w => w.id === need.giftWorkId);
              hint.textContent = `「${boothLabel(next)}」再买 ${money((need.minAmount||0) - (stats.byBooth[next.id]||0))} 可得赠品「${giftWork ? giftWork.title : '赠品'}」`;
            } else {
              hint.textContent = '继续挑选';
            }
          } else {
            hint.textContent = '继续挑选';
          }
          hint.classList.remove('ok');
        }
      }
      renderOnlyCartDrawer();
    }

    function renderOnlyCartDrawer() {
      const list = document.getElementById('ocList');
      const sum = document.getElementById('ocSum');
      if (!list) return;
      const cart = window._onlyCart || {};
      const entries = Object.values(cart);
      if (!entries.length) {
        list.innerHTML = '<div class="only-empty">清单是空的</div>';
        sum.innerHTML = '';
        return;
      }
      list.innerHTML = entries.map(e => `
        <div class="only-ci">
          <div class="n">${esc(e.title)}${e.isGift ? '<span class="gift-tag">赠品</span>' : ''}<small>摊位 ${esc(e.boothName)} · ${e.isGift ? '赠品' : (e.price === 0 ? (e.priceLabel || '无料') : money(e.price))}</small></div>
          <div class="only-qty">
            <button type="button" data-q="${esc(e.id)}" data-d="-1">−</button>
            <span>${e.qty}</span>
            <button type="button" data-q="${esc(e.id)}" data-d="1" ${e.isGift ? 'disabled' : ''}>+</button>
          </div>
          <div style="width:52px;text-align:right;font-weight:600;">${e.price === 0 ? '—' : money(e.price * e.qty)}</div>
        </div>
      `).join('');
      const { total, gifts } = onlyCartStats();
      sum.innerHTML = `
        <div class="only-sumrow"><span style="color:var(--muted);">合计（不含赠品）</span><span>${money(total)}</span></div>
        ${gifts.map(g => `<div class="only-sumrow gift"><span>赠品 · ${esc(g.boothName)}</span><span>${esc(g.title)}</span></div>`).join('')}
        <div class="only-sumrow total"><span>预估合计</span><span class="v">${money(total)}</span></div>
      `;
    }

    document.getElementById('ocOpen').addEventListener('click', () => {
      applyOnlyGifts();
      saveOnlyCart(window._only.event.id, window._onlyCart);
      document.getElementById('onlyOverlay').classList.add('open');
      renderOnlyCartUI();
    });
    document.getElementById('ocClose').addEventListener('click', () => {
      document.getElementById('onlyOverlay').classList.remove('open');
    });
    document.getElementById('onlyOverlay').addEventListener('click', e => {
      if (e.target.id === 'onlyOverlay') e.currentTarget.classList.remove('open');
    });
    document.getElementById('ocList').addEventListener('click', e => {
      const btn = e.target.closest('[data-q]');
      if (!btn || btn.disabled) return;
      const id = btn.dataset.q;
      const d = Number(btn.dataset.d);
      const cart = window._onlyCart || {};
      if (!cart[id] || cart[id].isGift) return;
      cart[id].qty += d;
      if (cart[id].qty <= 0) delete cart[id];
      applyOnlyGifts();
      saveOnlyCart(window._only.event.id, cart);
      const tab = document.querySelector('#onlyTabs button.on')?.dataset.t || 'all';
      renderOnlyBooths(tab);
      renderOnlyCartUI();
    });

    function onlyListText() {
      const { count, total, gifts } = onlyCartStats();
      const event = window._only.event;
      const lines = [`【${event.title} · 现场清单】`];
      Object.values(window._onlyCart || {}).forEach(e => {
        lines.push(`· 摊位${e.boothName} | ${e.title} ×${e.qty}` + (e.isGift ? ' [赠品]' : (e.price ? ` = ${money(e.price * e.qty)}` : '')));
      });
      lines.push(`合计 ${count} 件 · ${money(total)}`);
      gifts.forEach(g => lines.push(`赠品[${g.boothName}] ${g.title}`));
      lines.push('f7goods 现场购物清单');
      return lines.join('\n');
    }

    document.getElementById('ocCopy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(onlyListText());
        showToast('已复制清单');
      } catch {
        prompt('复制清单：', onlyListText());
      }
    });

    document.getElementById('ocClear').addEventListener('click', () => {
      if (!window._only) return;
      if (!confirm('确定清空现场购物清单？')) return;
      window._onlyCart = {};
      saveOnlyCart(window._only.event.id, {});
      const tab = document.querySelector('#onlyTabs button.on')?.dataset.t || 'all';
      renderOnlyBooths(tab);
      renderOnlyCartUI();
      showToast('已清空清单');
    });

    // Canvas PNG export — no html2canvas, no CDN
    function drawOnlyListPng() {
      const { count, total, gifts } = onlyCartStats();
      const event = window._only.event;
      const entries = Object.values(window._onlyCart || {});
      const W = 720;
      const padX = 36;
      const lineH = 28;
      const headerH = 110;
      const footerH = 56;
      const H = headerH + entries.length * lineH + 90 + gifts.length * 22 + footerH;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = Math.max(280, H);
      const ctx = canvas.getContext('2d');
      // paper bg
      ctx.fillStyle = '#F6F2EB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // accent top bar
      ctx.fillStyle = '#D94F5C';
      ctx.fillRect(0, 0, canvas.width, 4);
      // title
      ctx.fillStyle = '#22201E';
      ctx.font = '600 22px "Noto Serif SC", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(event.title, W / 2, 48);
      ctx.font = '12px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#8A8078';
      const meta = `ONLY 现场购物清单 · ${formatDate(event.date)}${event.location ? ' · ' + event.location : ''}`;
      ctx.fillText(meta, W / 2, 72);
      // lines
      ctx.textAlign = 'left';
      let y = headerH;
      ctx.strokeStyle = '#E5DDD1';
      entries.forEach(e => {
        ctx.strokeStyle = '#E5DDD1';
        ctx.beginPath();
        ctx.moveTo(padX, y + 8);
        ctx.lineTo(W - padX, y + 8);
        ctx.stroke();
        ctx.fillStyle = '#22201E';
        ctx.font = '13px "Noto Sans SC", sans-serif';
        const left = `${e.boothName} · ${e.title}${e.isGift ? ' [赠品]' : ''} ×${e.qty}`;
        const right = (e.isGift || e.price === 0) ? '—' : money(e.price * e.qty);
        ctx.fillText(left, padX, y);
        ctx.textAlign = 'right';
        ctx.fillText(right, W - padX, y);
        ctx.textAlign = 'left';
        y += lineH;
      });
      // total
      y += 8;
      ctx.strokeStyle = '#E5DDD1';
      ctx.beginPath();
      ctx.moveTo(padX, y - 18);
      ctx.lineTo(W - padX, y - 18);
      ctx.stroke();
      ctx.font = '700 15px "Noto Sans SC", sans-serif';
      ctx.fillStyle = '#22201E';
      ctx.fillText(`合计 ${count} 件`, padX, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#D94F5C';
      ctx.fillText(money(total), W - padX, y);
      ctx.textAlign = 'left';
      y += 28;
      gifts.forEach(g => {
        ctx.fillStyle = '#3D8B6E';
        ctx.font = '12px "Noto Sans SC", sans-serif';
        ctx.fillText(`赠品[${g.boothName}] ${g.title}`, padX, y);
        y += 22;
      });
      // footer
      ctx.fillStyle = '#8A8078';
      ctx.font = '11px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('f7goods.com · 仅供现场对单，非支付凭证', W / 2, canvas.height - 20);
      return canvas;
    }

    document.getElementById('ocShot').addEventListener('click', () => {
      const { count } = onlyCartStats();
      if (!count) { showToast('清单是空的', 'error'); return; }
      try {
        const canvas = drawOnlyListPng();
        const event = window._only.event;
        canvas.toBlob(blob => {
          if (!blob) { showToast('导出失败', 'error'); return; }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `only-list-${event.id}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 3000);
          showToast('已导出图片清单');
        }, 'image/png');
      } catch (e) {
        console.error(e);
        showToast('导出失败，已改为复制文本', 'error');
        try { navigator.clipboard.writeText(onlyListText()); } catch {}
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入驻作者 — 重设计预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <style>
    :root {
      --ink: #22201E;
      --paper: #F6F2EB;
      --card: #FFFCF7;
      --accent: #D94F5C;
      --accent-dark: #B83D49;
      --muted: #8A8078;
      --line: #E5DDD1;
      --info: #4A7BA7;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(34,32,30,.04);
      --max: 1120px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', 'Segoe UI', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .preview-bar {
      height: 32px;
      background: #2C3340;
      color: #F6F2EB;
      display: flex; align-items: center; justify-content: center;
      gap: 0.75rem; font-size: 0.78rem; padding: 0 0.5rem;
    }
    .preview-bar strong { color: #fff; }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 1rem 1.25rem 3rem;
    }

    /* Compact paper masthead */
    .mast {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1.1rem 1.25rem 1rem;
      margin-bottom: 0.9rem;
    }
    .mast::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px; background: var(--accent);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .mast-top {
      display: flex; flex-wrap: wrap; align-items: flex-end;
      justify-content: space-between; gap: 0.75rem 1rem;
    }
    .mast h1 {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: clamp(1.35rem, 2.8vw, 1.65rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .mast p {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 0.25rem;
    }
    .count-chip {
      display: inline-flex; align-items: baseline; gap: 0.3rem;
      font-size: 0.78rem; color: var(--muted);
      white-space: nowrap;
    }
    .count-chip b {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.2rem; color: var(--ink); font-weight: 700;
    }

    /* Unified toolbar */
    .toolbar {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.7rem 0.85rem;
      margin-bottom: 1rem;
      display: flex; flex-direction: column; gap: 0.55rem;
    }
    .toolbar-row {
      display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
    }
    .toolbar-row + .toolbar-row {
      padding-top: 0.55rem;
      border-top: 1px solid var(--line);
    }
    .pill {
      height: 30px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--muted);
      font-size: 0.78rem; font-weight: 500;
      transition: .15s ease;
    }
    .pill:hover { border-color: #D4C8B8; color: var(--ink); }
    .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .toolbar .spacer { flex: 1; }
    .toolbar select,
    .toolbar input[type="search"] {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      font: inherit; font-size: 0.78rem;
      padding: 0 0.75rem;
      color: var(--ink);
    }
    .toolbar select { min-width: 120px; }
    .toolbar input[type="search"] {
      min-width: 160px; flex: 1; max-width: 240px;
    }
    .seg {
      display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
      background: var(--paper);
    }
    .seg button {
      height: 30px; padding: 0 12px;
      font-size: 0.78rem; color: var(--muted);
      border-right: 1px solid var(--line);
    }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--card); color: var(--accent); font-weight: 600; }

    /* Author grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.85rem;
    }
    .a-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: .18s ease;
      min-width: 0;
    }
    .a-card:hover {
      border-color: #D4C8B8;
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .a-cover {
      height: 88px;
      background: linear-gradient(145deg, #EDE6DA, #D5CBBB);
      position: relative;
      overflow: hidden;
    }
    .a-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .a-cover::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(34,30,28,.18));
      pointer-events: none;
    }
    .a-body {
      padding: 0 0.9rem 0.9rem;
      position: relative;
      margin-top: -28px;
      flex: 1;
      display: flex; flex-direction: column;
    }
    .a-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2.5px solid var(--card);
      background: linear-gradient(145deg,#EDE6DA,#D9D0C2);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 1.15rem; font-weight: 700;
      margin-bottom: 0.45rem;
      box-shadow: var(--shadow-sm);
    }
    .a-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .a-name {
      font-family: 'Noto Serif SC', Georgia, serif;
      font-size: 0.98rem; font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.2rem;
      word-break: break-word;
    }
    .a-meta {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.4rem;
    }
    .chip {
      display: inline-flex; align-items: center;
      font-size: 0.68rem; font-weight: 500;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
    }
    .chip.cat { color: var(--ink); border-color: #D4C8B8; }
    .a-desc {
      font-size: 0.78rem; color: var(--muted);
      line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
      min-height: 2.4em;
    }
    .a-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 0.55rem; padding-top: 0.5rem;
      border-top: 1px dashed var(--line);
      font-size: 0.72rem; color: var(--muted);
    }
    .a-foot .go {
      color: var(--accent); font-weight: 600; font-size: 0.75rem;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center; color: var(--muted);
      padding: 2.5rem 1rem; font-size: 0.88rem;
    }

    @media (max-width: 640px) {
      .wrap { padding: 0.75rem 0.75rem 2rem; }
      .mast { padding: 0.9rem 0.9rem 0.85rem; }
      .mast h1 { font-size: 1.25rem; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.55rem; }
      .a-cover { height: 68px; }
      .a-body { padding: 0 0.65rem 0.7rem; margin-top: -22px; }
      .a-avatar { width: 44px; height: 44px; font-size: 1rem; }
      .a-name { font-size: 0.88rem; }
      .a-desc { font-size: 0.72rem; -webkit-line-clamp: 2; }
      .toolbar input[type="search"] { max-width: none; width: 100%; }
      .toolbar select { flex: 1; min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <span><strong>预览</strong> · 入驻作者列表重设计（统一工具条 + 封面叠头像卡片）</span>
  </div>

  <div class="wrap">
    <header class="mast">
      <div class="mast-top">
        <div>
          <h1>同人作者</h1>
          <p>发现优秀的同人创作者与作者，支持独立创作</p>
        </div>
        <div class="count-chip">共 <b id="totalN">0</b> 位入驻作者</div>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-row" id="catRow">
        <button type="button" class="pill on" data-cat="all" onclick="setCat(this)">全部</button>
        <button type="button" class="pill" data-cat="geren" onclick="setCat(this)">个人</button>
        <button type="button" class="pill" data-cat="sheTuan" onclick="setCat(this)">社团</button>
        <button type="button" class="pill" data-cat="print" onclick="setCat(this)">印刷</button>
        <button type="button" class="pill" data-cat="craft" onclick="setCat(this)">手作</button>
        <span class="spacer"></span>
        <div class="seg" id="userSeg" style="display:none;">
          <button type="button" class="on" id="btnFollow" onclick="toggleFollowed()">关注</button>
        </div>
      </div>
      <div class="toolbar-row">
        <select id="sortSel" onchange="render()">
          <option value="random" selected>随机排序</option>
          <option value="order">默认排序</option>
          <option value="name-asc">名称 A→Z</option>
        </select>
        <input type="search" id="searchIn" placeholder="搜索作者名称、简介…" oninput="render()">
        <span class="count-chip" style="margin-left:auto;">显示 <b id="showN" style="font-size:0.95rem;">0</b></span>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const AUTHORS = [
      { id: 'c1', name: '春日手作社', cat: 'craft', desc: '专注永远的7日之都同人周边，徽章与纸品，摊位常见于 ONLY 专场。', works: 12, hue: 18 },
      { id: 'c2', name: '夜巡工作室', cat: 'sheTuan', desc: '亚克力立牌与挂件，夜色主题系列持续更新。', works: 8, hue: 210 },
      { id: 'c3', name: '都市档案组', cat: 'geren', desc: '城市印象帆布袋与档案夹，记录七日之城的日常切片。', works: 5, hue: 160 },
      { id: 'c4', name: '纸间印社', cat: 'print', desc: '同人志印刷与特种纸周边，支持小批量定制。', works: 21, hue: 40 },
      { id: 'c5', name: '铃音社', cat: 'sheTuan', desc: '音乐同人与角色歌相关视觉周边。', works: 9, hue: 300 },
      { id: 'c6', name: '晨光线稿', cat: 'geren', desc: '插画向同人，立牌与色纸为主。', works: 14, hue: 50 },
      { id: 'c7', name: '布偶小筑', cat: 'craft', desc: '手工布偶与刺绣挂饰，每场现场限量。', works: 6, hue: 340 },
      { id: 'c8', name: '七日邮局', cat: 'print', desc: '明信片与邮票风周边，寄出属于这座城的信。', works: 11, hue: 200 }
    ];
    const CAT = { geren: '个人', sheTuan: '社团', print: '印刷', craft: '手作' };

    let curCat = 'all';
    let followedOnly = false;

    // Session shuffle
    (function shuffle() {
      const n = AUTHORS.length;
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = AUTHORS[i]; AUTHORS[i] = AUTHORS[j]; AUTHORS[j] = t;
      }
      AUTHORS.forEach((a, i) => { a._randomRank = i; });
    })();

    // Pretend some are followed
    const followed = new Set(['c1', 'c4']);

    function setCat(btn) {
      curCat = btn.dataset.cat;
      document.querySelectorAll('#catRow .pill').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      render();
    }

    function toggleFollowed() {
      followedOnly = !followedOnly;
      document.getElementById('btnFollow').classList.toggle('on', followedOnly);
      render();
    }

    function render() {
      document.getElementById('totalN').textContent = AUTHORS.length;
      const q = (document.getElementById('searchIn').value || '').trim().toLowerCase();
      const sort = document.getElementById('sortSel').value;
      let list = AUTHORS.filter(a => curCat === 'all' || a.cat === curCat);
      if (followedOnly) list = list.filter(a => followed.has(a.id));
      if (q) list = list.filter(a => a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));
      list = list.slice();
      if (sort === 'name-asc') list.sort((a, b) => a.name.localeCompare(b.name));
      else if (sort === 'order') list.sort((a, b) => a.id.localeCompare(b.id));
      else list.sort((a, b) => (a._randomRank || 0) - (b._randomRank || 0));

      document.getElementById('showN').textContent = list.length;
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">没有匹配的作者</div>';
        return;
      }
      grid.innerHTML = list.map(a => `
        <a class="a-card" href="#" onclick="event.preventDefault()">
          <div class="a-cover">
            <div style="width:100%;height:100%;background:linear-gradient(145deg,hsl(${a.hue} 28% 88%),hsl(${a.hue} 22% 76%))"></div>
          </div>
          <div class="a-body">
            <div class="a-avatar">${a.name.charAt(0)}</div>
            <div class="a-name">${a.name}</div>
            <div class="a-meta">
              <span class="chip cat">${CAT[a.cat] || a.cat}</span>
              <span class="chip">${a.works} 件作品</span>
            </div>
            <div class="a-desc">${a.desc}</div>
            <div class="a-foot">
              <span>${followed.has(a.id) ? '已关注' : '作者'}</span>
              <span class="go">查看 →</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // Show follow seg only if "has follows"
    if (followed.size) document.getElementById('userSeg').style.display = 'inline-flex';
    render();
  </script>
</body>
</html>
